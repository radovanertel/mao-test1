nimálne náklady, ktorá dvojica podmienok je správna?<\/p>", "explanationHtml": "<p>Ponuka je <code>22<\/code>, celkový dopyt <code>27<\/code> (<code>22 &lt; 27<\/code>). Preto sa musí odoslať všetkých <code>10 + 12 = 22<\/code> áut (<code>=<\/code>) a žiadna cieľová pobočka nedostane viac než potrebuje (<code>&lt;=<\/code>).<\/p>", "trapHtml": "<p>Možnosť <code>D<\/code> s minimalizáciou nákladov pošle <code>0<\/code> áut; možnosť <code>B<\/code> a <code>C<\/code> sú neprípustné (<code>XPRS_INF<\/code>), lebo <code>22 &lt; 27<\/code>.<\/p>", "answer": "A", "options": [{"key": "A", "html": "Zdroje (NY, CHI) <code>= 10, = 12<\/code>; ciele (PITT, LA, MIA) <code>&lt;= 6, &lt;= 14, &lt;= 7<\/code>."}, {"key": "B", "html": "Zdroje <code>&lt;= 10, &lt;= 12<\/code>; ciele <code>= 6, = 14, = 7<\/code>."}, {"key": "C", "html": "Zdroje <code>= 10, = 12<\/code>; ciele <code>= 6, = 14, = 7<\/code>."}, {"key": "D", "html": "Zdroje <code>&lt;= 10, &lt;= 12<\/code>; ciele <code>&lt;= 6, &lt;= 14, &lt;= 7<\/code>."}], "multi": false, "shuffleOptions": true}, {"id": "Q35", "area": "DUS", "areaName": "4. Dopravná úloha so stratami", "origin": "exercise_theory", "originLabel": "Z cvičenia / prednášky", "tier": "A", "tierLabel": "Režim A (TEST 1)", "isMain": false, "optional": false, "archived": false, "type": "MCQ", "title": "Štandardná formulácia DÚ so stratami (naložené množstvo)", "source": "cv05 / MaO_05_DopravnaUlohaSoStratami.pdf, MO_05", "promptHtml": "<p>V dopravnej úlohe so stratami (<code>alpha(i, j)<\/code> predstavuje podiel straty na trase <code>(i, j)<\/code> z naloženého množstva) zvolíme premennú <code>x(i, j)<\/code> ako množstvo <strong>naložené<\/strong> v sklade <code>i<\/code>. Prepravné náklady <code>c(i, j)<\/code> sa platia za každú naloženú jednotku. Ktorá formulácia modelu je správna?<\/p>", "explanationHtml": "<p>V sklade nakladáme <code>x(i, j)<\/code>, preto kapacitu skladu aj dopravné náklady viažeme priamo na <code>x(i, j)<\/code>. K odberateľovi však po strate <code>alpha(i, j)<\/code> dorazí iba <code>(1 - alpha(i, j))*x(i, j)<\/code>, ktorých súčet musí pokryť <code>b(j)<\/code>.<\/p>", "trapHtml": "<p>Najčastejšia chyba (<code>B<\/code>) je násobiť zmenšením u dodávateľa alebo (<code>C<\/code>) dávať znamienko <code>+ alpha<\/code> u odberateľa, čo tovar počas prepravy „vytvára“ namiesto straty.<\/p>", "answer": "A", "options": [{"key": "A", "html": "Zdroj <code>sum(j) x(i,j) &lt;= a(i)<\/code>; odberateľ <code>sum(i) (1 - alpha(i,j))*x(i,j) = b(j)<\/code>; cieľ <code>min sum c(i,j)*x(i,j)<\/code>."}, {"key": "B", "html": "Zdroj <code>sum(j) (1 - alpha(i,j))*x(i,j) &lt;= a(i)<\/code>; odberateľ <code>sum(i) x(i,j) = b(j)<\/code>; cieľ <code>min sum c(i,j)*x(i,j)<\/code>."}, {"key": "C", "html": "Zdroj <code>sum(j) x(i,j) &lt;= a(i)<\/code>; odberateľ <code>sum(i) (1 + alpha(i,j))*x(i,j) = b(j)<\/code>; cieľ <code>min sum c(i,j)*x(i,j)<\/code>."}, {"key": "D", "html": "Zdroj <code>sum(j) x(i,j) &lt;= a(i)<\/code>; odberateľ <code>sum(i) x(i,j) = (1 - alpha(i,j))*b(j)<\/code>; cieľ <code>min sum c(i,j)*x(i,j)<\/code>."}], "multi": false, "shuffleOptions": true}, {"id": "Q36", "area": "DUS", "areaName": "4. Dopravná úloha so stratami", "origin": "adapted_moodle", "originLabel": "Upravená Moodle", "tier": "A", "tierLabel": "Režim A (TEST 1)", "isMain": false, "optional": false, "archived": true, "type": "MCQ", "title": "Dvojaká definícia premennej: naložené vs. vyložené množstvo", "source": "Archív Moodle (test2.php.htm Q3, 2KiyvdC Q5)", "promptHtml": "<p>Na trase zo skladu <code>i<\/code> k odberateľovi <code>j<\/code> nastáva pevná <strong>5 %<\/strong> strata tovaru (doručí sa <code>0.95<\/code> naloženého množstva). Študent A definuje <code>x(i, j)<\/code> ako množstvo <strong>naložené<\/strong> v sklade, kým študent B definuje <code>y(i, j)<\/code> ako množstvo <strong>vyložené<\/strong> u odberateľa. Ako musí študent B správne upraviť kapacitu skladu <code>a(i)<\/code> a náklady <code>c(i, j)<\/code>?<\/p>", "explanationHtml": "<p>Keďže <code>y(i,j) = 0.95*x(i,j)<\/code>, naložené množstvo je <code>x(i,j) = y(i,j) / 0.95 = 1.05263*y(i,j)<\/code>. Oba modely dávajú identické minimum nákladov aj rovnaký tok.<\/p>", "trapHtml": "<p>Násobiť číslom <code>1.05<\/code> namiesto delenia <code>0.95<\/code> (<code>1/0.95 = 1.05263 != 1.05<\/code>). V starých testoch na to študenti strácali body presne ako pri munícii (<code>6780<\/code> vs <code>6789.47<\/code>).<\/p>", "answer": "B", "options": [{"key": "A", "html": "<code>sum(j) 1.05*y(i,j) &lt;= a(i)<\/code> a v cieli <code>sum(i,j) 1.05*c(i,j)*y(i,j)<\/code>"}, {"key": "B", "html": "<code>sum(j) y(i,j)/0.95 &lt;= a(i)<\/code> a v cieli <code>sum(i,j) (c(i,j)/0.95)*y(i,j)<\/code>"}, {"key": "C", "html": "<code>sum(j) 0.95*y(i,j) &lt;= a(i)<\/code> a v cieli <code>sum(i,j) c(i,j)*y(i,j)<\/code>"}, {"key": "D", "html": "Premenná <code>y(i, j)<\/code> sa v lineárnom modeli vôbec nesmie použiť."}], "multi": false, "shuffleOptions": true}, {"id": "Q37", "area": "DUS", "areaName": "4. Dopravná úloha so stratami", "origin": "exercise_theory", "originLabel": "Z cvičenia / prednášky", "tier": "A", "tierLabel": "Režim A (TEST 1)", "isMain": false, "optional": false, "archived": false, "type": "1-R", "title": "Munícia so 5 % stratou pri preprave zo Skladu 2", "source": "cv06 / MO_Zhrnutie_Cv1-Cv6.pdf (overené v Mosel)", "promptHtml": "<p>V nadväznosti na úlohu s muníciou (<code>Z1<\/code>: 600 ks, <code>5 €/ks<\/code>; <code>Z2<\/code>: 800 ks, <code>6 €/ks<\/code>; základne <code>[500, 300, 400]<\/code> ks; <code>x(1,3) &lt;= 200<\/code>): pri preprave zo <strong>Skladu 2<\/strong> dochádza ku <strong>5 % strate<\/strong> munície (zo Skladu 1 bez straty). Premenné <code>x(i, j)<\/code> sú <strong>naložené<\/strong> kusy. Zapíšte dopytovú podmienku pre <strong>3. základňu<\/strong> a vypočítajte nové minimálne náklady.<\/p>", "explanationHtml": "<p>Zo Skladu 1 (<code>5 €/ks<\/code>, bez straty) sa pošle plných <code>600 ks<\/code> (<code>3000 €<\/code>). Zvyšných <code>600 ks<\/code> musí doraziť zo Skladu 2. Preto treba v Sklade 2 naložiť <code>600 / 0.95 = 631.5789 ks<\/code> po <code>6 €<\/code> = <code>3789.47 €<\/code>. Celkom <code>3000 + 3789.47 = 6789.47 €<\/code>.<\/p>", "trapHtml": "<p>Vypočítať <code>3000 + 6*600*1.05 = 6780 €<\/code> namiesto <code>600 / 0.95<\/code>!<\/p>", "answer": "x(1,3) + 0.95*x(2,3) = 400; 6789.47", "formatHint": "1 riadok v tvare: `podmienka_Z3; naklady` (zaokrúhlené na 2 des. miesta s bodkou)", "equivalents": ["x(1,3) + 0.95*x(2,3) = 400; 6789.47", "x(1,3)+0.95*x(2,3)>=400; 6789.47", "x(1,3) + 0.95*x(2,3) = 400; 6789,47"]}, {"id": "Q38", "area": "DUS", "areaName": "4. Dopravná úloha so stratami", "origin": "exercise_theory", "originLabel": "Z cvičenia / prednášky", "tier": "A", "tierLabel": "Režim A (TEST 1)", "isMain": false, "optional": false, "archived": false, "type": "1-R", "title": "Dopytová podmienka pri rôznych stratách podľa trás", "source": "cv05 / MaO_05_DopravnaUlohaSoStratami.pdf (Pr. 1)", "promptHtml": "<p>Zdroje <code>Z1, Z2, Z3<\/code> zásobujú spotrebiteľa <code>S1<\/code>, ktorý požaduje <strong>80 ton<\/strong> tovaru. Percentuálne straty z naloženého množstva na trasách do <code>S1<\/code> sú: <code>Z1 -&gt; S1<\/code>: <strong>5 %<\/strong>, <code>Z2 -&gt; S1<\/code>: <strong>4 %<\/strong>, <code>Z3 -&gt; S1<\/code>: <strong>7 %<\/strong>. Premenné <code>x(1,1), x(2,1), x(3,1)<\/code> predstavujú <strong>naložené<\/strong> množstvo v tonách. Napíšte podmienku uspokojenia dopytu pre <code>S1<\/code>.<\/p>", "explanationHtml": "<p>K <code>S1<\/code> dorazí <code>(100 - 5)/100 = 0.95<\/code> zo zdroja 1, <code>0.96<\/code> zo zdroja 2 a <code>0.93<\/code> zo zdroja 3. Súčet doručených ton sa musí rovnať požiadavke <code>80<\/code>.<\/p>", "trapHtml": "<p>Použiť v rovnici priamo percentá strát (<code>0.05*x(1,1) + ... = 80<\/code>) namiesto podielu doručenia <code>0.95 = 1 - 0.05<\/code>!<\/p>", "answer": "0.95*x(1,1) + 0.96*x(2,1) + 0.93*x(3,1) = 80", "formatHint": "1 riadok (rovnica alebo nerovnica `>=` s desatinnými koeficientmi)", "equivalents": ["0.95*x(1,1) + 0.96*x(2,1) + 0.93*x(3,1) = 80", "0.95*x(1,1) + 0.96*x(2,1) + 0.93*x(3,1) >= 80", "(100-5)/100*x(1,1) + (100-4)/100*x(2,1) + (100-7)/100*x(3,1) = 80"]}, {"id": "Q39", "area": "DUS", "areaName": "4. Dopravná úloha so stratami", "origin": "exercise_theory", "originLabel": "Z cvičenia / prednášky", "tier": "B", "tierLabel": "Režim B (Rozšírené)", "isMain": false, "optional": false, "archived": false, "type": "MCQ", "title": "Interpretácia nevyčerpanej kapacity v DÚ so stratami", "source": "cv05 / MaO_05_DopravnaUlohaSoStratami.pdf (Pr. 1 — overené v Mosel)", "promptHtml": "<p>V úlohe zo zdrojov <code>Z1=100, Z2=150, Z3=200<\/code> a spotrebiteľov <code>S1..S4 = [80, 80, 140, 80]<\/code> s rozličnými stratami dosahuje optimum náklady <code>2154.82 €<\/code>, pričom v zdroji <code>Z3<\/code> je rozdiel <code>200 - sum(j=1..4) x(3,j) = 57.30 t<\/code>. Čo presne toto číslo <code>57.30 t<\/code> znamená?<\/p>", "explanationHtml": "<p><code>sum(j) x(3, j)<\/code> je celkové naložené množstvo z <code>Z3<\/code>, preto <code>a(3) - sum(j) x(3, j)<\/code> je nevyužitá kapacita skladu <code>Z3<\/code> (slack príslušného obmedzenia).<\/p>", "trapHtml": "<p>Straty počas cesty sú rozdiel medzi naloženým a doručeným množstvom <code>sum p(i,j)/100 * x(i,j)<\/code>, NIE zvyšok na sklade <code>a(i) - sum x(i,j)<\/code>.<\/p>", "answer": "B", "options": [{"key": "A", "html": "Hmotnosť tovaru strateného počas prepravy z <code>Z3<\/code>."}, {"key": "B", "html": "Hmotnosť tovaru, ktorý zostal fyzicky na sklade v zdroji <code>Z3<\/code> (nenaložený), lebo celkové kapacity prevýšili aj zvýšený náklad na krytie strát."}, {"key": "C", "html": "Množstvo nedodaného tovaru u spotrebiteľa <code>S3<\/code>."}, {"key": "D", "html": "Pokuta za neodoslanie tovaru zo skladu <code>Z3<\/code>."}], "multi": false, "shuffleOptions": true}, {"id": "Q40", "area": "DUS", "areaName": "4. Dopravná úloha so stratami", "origin": "exercise_theory", "originLabel": "Z cvičenia / prednášky", "tier": "A", "tierLabel": "Režim A (TEST 1)", "isMain": false, "optional": false, "archived": false, "type": "1-R", "title": "Hygroskopický odpad — kapacita likvidačného závodu pri náraste hmotnosti", "source": "cv05 / MaO_05_DopravnaUlohaSoStratami.pdf (Pr. 2)", "promptHtml": "<p>Dva zdroje produkujú hygroskopický (vodu pohlcujúci) odpad. Pri preprave do Závodu 1 (denná kapacita likvidácie <strong>10 t<\/strong> dovezeného materiálu) narastie hmotnosť zo Zdroja 1 o <strong>5 %<\/strong> a zo Zdroja 2 o <strong>10 %<\/strong>. Nech <code>x(1,1)<\/code> a <code>x(2,1)<\/code> sú množstvá odpadu <strong>naložené<\/strong> v zdrojoch 1 a 2 smerom do Závodu 1. Napíšte kapacitnú podmienku Závodu 1.<\/p>", "explanationHtml": "<p>Na rozdiel od úbytku tovaru tu hmotnosť rastie o <code>5 %<\/code> (<code>* 1.05<\/code>) a <code>10 %<\/code> (<code>* 1.10<\/code>). Závod 1 dokáže denne zlikvidovať najviac <code>10 t<\/code> už napučaného (dovezeného) odpadu.<\/p>", "trapHtml": "<p>Mechanicky odpísať vzorec zo strát <code>0.95*x(1,1) + 0.90*x(2,1) &lt;= 10<\/code> (opakovanie znamienka mínus bez prečítania kontextu zväčšenia hmotnosti).<\/p>", "answer": "1.05*x(1,1) + 1.10*x(2,1) <= 10", "formatHint": "1 riadok (nerovnica s x(1,1) a x(2,1))", "equivalents": ["1.05*x(1,1) + 1.10*x(2,1) <= 10", "1.05*x(1,1)+1.1*x(2,1)<=10"]}, {"id": "Q41", "area": "DUS", "areaName": "4. Dopravná úloha so stratami", "origin": "exercise_theory", "originLabel": "Z cvičenia / prednášky", "tier": "B", "tierLabel": "Režim B (Rozšírené)", "isMain": false, "optional": false, "archived": false, "type": "1-R", "title": "Hygroskopický odpad — čistý zisk z 1 t naloženého odpadu", "source": "cv05 / MaO_05_DopravnaUlohaSoStratami.pdf (Pr. 2 — overené v Mosel)", "promptHtml": "<p>Za odobratie <code>1 t<\/code> odpadu v Zdroji 2 dostaneme zaplatené <strong>1200 €<\/strong>. Dopravné náklady zo Zdroja 2 do Závodu 2 sú <strong>100 €<\/strong> za <code>1 t<\/code> <strong>naloženého<\/strong> odpadu. Počas tejto cesty hmotnosť narastie o <strong>15 %<\/strong>. Likvidácia v Závode 2 stojí <strong>600 €<\/strong> za <code>1 t<\/code> <strong>dovezeného<\/strong> materiálu. Aký je čistý zisk (v €) za <strong>1 t naloženého<\/strong> odpadu na trase <code>(2, 2)<\/code>?<\/p>", "explanationHtml": "<p>Príjem = <code>1200 €<\/code>. Doprava naloženej tony = <code>100 €<\/code>. Do Závodu 2 dorazí <code>1.15 t<\/code>, teda likvidácia stojí <code>600 * 1.15 = 690 €<\/code>. Čistý zisk = <code>1200 - 100 - 690 = 410 €<\/code>.<\/p>", "trapHtml": "<p>Odčítať len <code>600 €<\/code> namiesto <code>600 * 1.15 = 690 €<\/code> (zabudnúť, že likvidácia sa účtuje až za ťažší dovezený odpad).<\/p>", "answer": "410", "formatHint": "1 riadok (celé číslo v €)", "equivalents": ["410"]}, {"id": "Q42", "area": "DUS", "areaName": "4. Dopravná úloha so stratami", "origin": "exercise_theory", "originLabel": "Z cvičenia / prednášky", "tier": "A", "tierLabel": "Režim A (TEST 1)", "isMain": false, "optional": false, "archived": false, "type": "MCQ", "title": "Mení zavedenie strát počet premenných modelu?", "source": "MO_05 (s. 202–204), cv05", "promptHtml": "<p>Máme klasickú dopravnú úlohu pre 3 sklady a 4 spotrebiteľov a doplníme ju o maticu percentuálnych strát <code>p(i, j)<\/code> na všetkých trasách. Ako sa zmení počet rozhodovacích premenných <code>x(i, j)<\/code> a štrukturálnych podmienok?<\/p>", "explanationHtml": "<p>Straty sa vyjadria priamo koeficientmi <code>(1 - p(i, j)/100)<\/code> v podmienkach odberateľov, žiadne nové rozhodovacie premenné ani nové obmedzenia netreba pridávať.<\/p>", "trapHtml": "<p>Pridávať zbytočné pomocné premenné pre každú hranu na vyjadrenie strát.<\/p>", "answer": "B", "options": [{"key": "A", "html": "Počet premenných sa zdvojnásobí (pribudnú premenné strát)."}, {"key": "B", "html": "Počet premenných ostáva <code>12<\/code> (<code>3*4<\/code>) a počet podmienok ostáva <code>7<\/code> (<code>3+4<\/code>), menia sa len koeficienty pri spotrebiteľoch."}, {"key": "C", "html": "Pribudne 4. fiktívny sklad a počet podmienok sa zvýši na <code>8<\/code>."}, {"key": "D", "html": "Úloha prestane byť lineárnou."}], "multi": false, "shuffleOptions": true}, {"id": "Q43", "area": "ZM", "areaName": "5. Zmiešavacia úloha", "origin": "verbatim_moodle", "originLabel": "Doslovne z Moodle", "tier": "A", "tierLabel": "Režim A (TEST 1)", "isMain": true, "optional": false, "archived": true, "type": "1-R", "title": "Oceliarne — podmienka obsahu medi Cu (Moodle 1-R pasca!)", "source": "Archív Moodle (Zapocty_dokopy P84)", "promptHtml": "<p>Oceliarne získali objednávku na 500 ton ocele. Na jej výrobu môžu použiť tri rôzne zliatiny: železnú, medenú a hliníkovú. Obsahy vybraných chemických prvkov v jednotlivých surovinách udáva tabuľka. V tabuľke sú tiež dostupné množstvá zliatin a ich cena. Premenné <code>x(1)<\/code>, <code>x(2)<\/code> a <code>x(3)<\/code> vyjadrujú množstvo zliatin (v tonách) potrebné na výrobu 500 ton ocele. Napíšte podmienku, ktorá zaručí, že obsah medi (<code>Cu<\/code>) v oceli bude aspoň 0,4 %.<\/p>\n<div class=\"tbl-wrap\"><table class=\"data-table\"><thead><tr><th style=\"text-align:left\">Surovina<\/th><th style=\"text-align:right\">C [%]<\/th><th style=\"text-align:right\">Cu [%]<\/th><th style=\"text-align:right\">Mn [%]<\/th><th style=\"text-align:right\">Množstvo [t]<\/th><th style=\"text-align:right\">Cena [eur/t]<\/th><\/tr><\/thead><tbody><tr><td style=\"text-align:left\">Železná zliatina<\/td><td style=\"text-align:right\">2.5<\/td><td style=\"text-align:right\">0<\/td><td style=\"text-align:right\">1.3<\/td><td style=\"text-align:right\">400<\/td><td style=\"text-align:right\">200<\/td><\/tr><tr><td style=\"text-align:left\">Medená zliatina<\/td><td style=\"text-align:right\">0<\/td><td style=\"text-align:right\">90<\/td><td style=\"text-align:right\">0<\/td><td style=\"text-align:right\">500<\/td><td style=\"text-align:right\">220<\/td><\/tr><tr><td style=\"text-align:left\">Hliníková zliatina<\/td><td style=\"text-align:right\">0<\/td><td style=\"text-align:right\">0.4<\/td><td style=\"text-align:right\">1.2<\/td><td style=\"text-align:right\">300<\/td><td style=\"text-align:right\">200<\/td><\/tr><\/tbody><\/table><\/div>", "explanationHtml": "<p>Vážený priemer obsahu medi je <code>(0*x(1) + 90*x(2) + 0.4*x(3)) / 500 &gt;= 0.4<\/code>. Prenásobením celkovou hmotnosťou <code>500<\/code> dostaneme priamy Moodle vzor: <code>90*x(2) + 0.4*x(3) &gt;= 0.4*500<\/code>.<\/p>", "trapHtml": "<p><strong>POZOR NA ARCHÍVNU PASCU (P85, 0/1 b)!<\/strong> Študent napísal <code>0.9*x(2) + 0.4*x(3) &gt;= 0.4*500<\/code> — pomiešal desatinný podiel medi (<code>0.9<\/code> namiesto <code>90 %<\/code>) s percentuálnymi číslami (<code>0.4 %<\/code>)! Na oboch stranách musíte udržať rovnakú škálu (<code>90<\/code> aj <code>0.4<\/code>, alebo <code>0.9<\/code> aj <code>0.004<\/code>).<\/p>", "answer": "90*x(2)+0.4*x(3)>=0.4*500", "formatHint": "1 riadok (použite jednotný percentuálny zápis ako v tabuľke a premenné `x(2), x(3)`)", "equivalents": ["90*x(2) + 0.4*x(3) >= 0.4*500", "90*x(2)+0.4*x(3)>=200", "0.9*x(2)+0.004*x(3)>=2"]}, {"id": "Q44", "area": "ZM", "areaName": "5. Zmiešavacia úloha", "origin": "adapted_moodle", "originLabel": "Upravená Moodle", "tier": "A", "tierLabel": "Režim A (TEST 1)", "isMain": false, "optional": false, "archived": true, "type": "1-R", "title": "Oceliarne — podmienka max. mangánu a rozpočtu", "source": "Archív Moodle (Zapocty_dokopy P86, P87)", "promptHtml": "<p>Pre údaje oceliarní z <code>Q43<\/code> (<code>500 t<\/code> ocele; <code>Mn [%]<\/code>: <code>[1.3, 0, 1.2]<\/code>; <code>Cena [€/t]<\/code>: <code>[200, 220, 200]<\/code>) napíšte: 1) podmienku, aby obsah mangánu (<code>Mn<\/code>) bol <strong>najviac 1.6 %<\/strong>, 2) podmienku, aby náklady na nákup surovín neprekročili <strong>100 000 €<\/strong>.<\/p>", "explanationHtml": "<p>Mangán: <code>1.3*x(1) + 1.2*x(3) &lt;= 1.6*500<\/code> (t. j. <code>&lt;= 800<\/code>). Rozpočet: súčin jednotkových cien a hmotností <code>200*x(1) + 220*x(2) + 200*x(3) &lt;= 100000<\/code>.<\/p>", "trapHtml": "<p>Zabudnúť pri <code>Mn<\/code> násobiť pravú stranu celkovým množstvom <code>500<\/code> (<code>&lt;= 1.6<\/code> namiesto <code>&lt;= 1.6*500<\/code>).<\/p>", "answer": "1.3*x(1) + 1.2*x(3) <= 1.6*500; 200*x(1) + 220*x(2) + 200*x(3) <= 100000", "formatHint": "1 riadok (dve nerovnice oddelené `;` s `x(1), x(2), x(3)`)", "equivalents": ["1.3*x(1)+1.2*x(3)<=1.6*500; 200*x(1)+220*x(2)+200*x(3)<=100000", "1.3*x(1)+1.2*x(3)<=800; 200*x(1)+220*x(2)+200*x(3)<=100000", "1.3*x1+1.2*x3<=1.6*500; 200*x1+220*x2+200*x3<=100000"]}, {"id": "Q45", "area": "ZM", "areaName": "5. Zmiešavacia úloha", "origin": "adapted_moodle", "originLabel": "Upravená Moodle", "tier": "A", "tierLabel": "Režim A (TEST 1)", "isMain": false, "optional": false, "archived": true, "type": "MCQ", "title": "CowFood — identifikácia nesprávnej percentuálnej nerovnice", "source": "cv03 / Pr. 4 CowFood, 2009-04-07.pdf Q7", "promptHtml": "<p>CowFood vyrába <code>8 ton<\/code> krmiva z ovsa (<code>x1<\/code>), kukurice (<code>x2<\/code>) a melasy (<code>x3<\/code>). Tabuľka udáva obsah tukov v <code>%<\/code>: ovos <code>7.1 %<\/code>, kukurica <code>2.4 %<\/code>, melasa <code>0.3 %<\/code>. Obsah tuku má byť <strong>najmenej 2 %<\/strong>. Ktorý zápis je <strong>NESPRÁVNY<\/strong>?<\/p>", "explanationHtml": "<p>Možnosti <code>A<\/code>, <code>B<\/code>, <code>C<\/code> sú algebraicky zhodné (pri <code>x1+x2+x3 = 8<\/code> je <code>2*8 = 16<\/code>, resp. <code>0.02*8 = 0.16 t<\/code> čistého tuku). Možnosť <code>D<\/code> mieša desatinné pomery na ľavej strane (<code>0.071<\/code> = t/t) s percentami na pravej (<code>2*8 = 16 t<\/code> namiesto <code>0.16 t<\/code>)!<\/p>", "trapHtml": "<p>Najtypickejšia Moodle chyba v <code>CowFood<\/code> a <code>Oceliarne<\/code>. Vždy si skontrolujte jednotky na pravej strane: <code>0.02 * 8 ton = 0.16 ton<\/code>, nie <code>16 ton<\/code>!<\/p>", "answer": "D", "options": [{"key": "A", "html": "<code>7.1*x1 + 2.4*x2 + 0.3*x3 &gt;= 16<\/code>"}, {"key": "B", "html": "<code>0.071*x1 + 0.024*x2 + 0.003*x3 &gt;= 0.16<\/code>"}, {"key": "C", "html": "<code>7.1*x1 + 2.4*x2 + 0.3*x3 &gt;= 2*(x1 + x2 + x3)<\/code>"}, {"key": "D", "html": "<code>0.071*x1 + 0.024*x2 + 0.003*x3 &gt;= 2*8<\/code>"}], "multi": false, "shuffleOptions": true}, {"id": "Q46", "area": "ZM", "areaName": "5. Zmiešavacia úloha", "origin": "adapted_moodle", "originLabel": "Upravená Moodle", "tier": "A", "tierLabel": "Režim A (TEST 1)", "isMain": false, "optional": false, "archived": true, "type": "MCQ", "title": "Význam rozhodovacích premenných v zmiešavacej úlohe", "source": "Archív Moodle (Zapocty_dokopy P78 CowFood, P79/P107 Liehovar)", "promptHtml": "<p>V zmiešavacej úlohe typu <code>CowFood<\/code> (<code>8 t<\/code> krmiva) alebo <code>Oceliarne<\/code> (<code>500 t<\/code> ocele) máme premenné <code>x(1), x(2), x(3)<\/code>. Čo tieto premenné reprezentujú?<\/p>", "explanationHtml": "<p>Rozhodujeme o tom, <strong>koľko ktorej suroviny<\/strong> (v tonách/litroch/kg) do zmesi nasypeme/nalejeme. Vlastnosti prvkov (tuky, bielkoviny, Cu) sú len technické koeficienty dané tabuľkou.<\/p>", "trapHtml": "<p>Pomýliť si suroviny (ovos, kukurica) s chemickými zložkami/vlastnosťami (bielkoviny, vláknina).<\/p>", "answer": "B", "options": [{"key": "A", "html": "Percentuálny podiel jednotlivých prvkov (napr. bielkovín, tukov, medi) v hotovom výrobku."}, {"key": "B", "html": "Hmotnostné množstvo použitých vstupných surovín (napr. ovsa, kukurice, melasy v tonách) na vytvorenie požadovanej zmesi."}, {"key": "C", "html": "Cenu jednej tony výslednej zmesi."}, {"key": "D", "html": "Binárne rozhodnutie, či surovinu použijeme alebo nie."}], "multi": false, "shuffleOptions": true}, {"id": "Q47", "area": "ZM", "areaName": "5. Zmiešavacia úloha", "origin": "exercise_theory", "originLabel": "Z cvičenia / prednášky", "tier": "B", "tierLabel": "Režim B (Rozšírené)", "isMain": false, "optional": false, "archived": false, "type": "1-R", "title": "Výpočet ceny 1 litra zmiešaného liehu a pomeru zložiek", "source": "cv06 / MO_Zhrnutie_Cv1-Cv6.pdf (overené v Mosel)", "promptHtml": "<p>Z 3 druhov liehu chceme čo najlacnejšie namiešať <strong>1 liter<\/strong> nového roztoku s obsahom čistého alkoholu min. <strong>60 %<\/strong> a výhrevnosťou aspoň <strong>12 MJ/l<\/strong>. Parametre surovín:<\/p>\n<div class=\"tbl-wrap\"><table class=\"data-table\"><thead><tr><th style=\"text-align:left\">Druh liehu<\/th><th style=\"text-align:right\">Alkohol [%]<\/th><th style=\"text-align:right\">Výhrevnosť [MJ/l]<\/th><th style=\"text-align:right\">Cena [€/l]<\/th><\/tr><\/thead><tbody><tr><td style=\"text-align:left\">1. druh (<code>x1<\/code>)<\/td><td style=\"text-align:right\">30<\/td><td style=\"text-align:right\">9<\/td><td style=\"text-align:right\">11<\/td><\/tr><tr><td style=\"text-align:left\">2. druh (<code>x2<\/code>)<\/td><td style=\"text-align:right\">50<\/td><td style=\"text-align:right\">11<\/td><td style=\"text-align:right\">18<\/td><\/tr><tr><td style=\"text-align:left\">3. druh (<code>x3<\/code>)<\/td><td style=\"text-align:right\">80<\/td><td style=\"text-align:right\">16<\/td><td style=\"text-align:right\">25<\/td><\/tr><\/tbody><\/table><\/div>\n<p>Vypočítajte optimálnu cenu za 1 liter zmesi <code>[€]<\/code> a presný pomer druhov <code>(x1, x2, x3)<\/code>.<\/p>", "explanationHtml": "<p>Cena na 1 % alkoholu je najlepšia pri miešaní najlacnejšieho (<code>30 %<\/code>) a najkoncentrovanejšieho (<code>80 %<\/code>) liehu: <code>0.3*x1 + 0.8*(1 - x1) = 0.6 =&gt; 0.5*x1 = 0.2 =&gt; x1 = 0.4<\/code>, <code>x3 = 0.6<\/code>, <code>x2 = 0<\/code>. Kontrola výhrevnosti: <code>0.4*9 + 0.6*16 = 3.6 + 9.6 = 13.2 &gt;= 12<\/code> (rezerva <code>1.2<\/code>). Cena: <code>0.4*11 + 0.6*25 = 4.4 + 15.0 = 19.4 €<\/code>.<\/p>", "trapHtml": "<p>Skúšať 2. druh <code>50 %<\/code> spolu s 3. druhom (dá <code>22.67 €<\/code> miesto <code>19.4 €<\/code>) alebo zabudnúť skontrolovať obe kvalitatívne podmienky.<\/p>", "answer": "19.4; (0.4, 0, 0.6)", "formatHint": "1 riadok v tvare: `cena; (x1, x2, x3)`", "equivalents": ["19.4; (0.4, 0, 0.6)", "19.40; (0.4, 0, 0.6)", "19,4; (0.4, 0, 0.6)"]}, {"id": "Q48", "area": "ZM", "areaName": "5. Zmiešavacia úloha", "origin": "exercise_theory", "originLabel": "Z cvičenia / prednášky", "tier": "A", "tierLabel": "Režim A (TEST 1)", "isMain": false, "optional": false, "archived": false, "type": "1-R", "title": "Obmedzenie podielu zložky p4 v úlohe Plyn", "source": "cv03 / MaO_03_Zmiešavacia úloha (Pr. 1 Plyn), ModaOp3_plyn.mos", "promptHtml": "<p>Miešame 4 druhy plynu (<code>p1, p2, p3, p4<\/code> v <code>m^3<\/code>), pričom cieľom je <code>1 m^3<\/code> výslednej zmesi (<code>p1+p2+p3+p4 = 1<\/code>). Zapíšte podmienku: <em>„Podiel plynu štvrtého druhu neprekročí 50 % celkového objemu“<\/em> v tvare platnom pre <strong>ľubovoľný<\/strong> objem aj v zjednodušenom tvare pre <code>1 m^3<\/code>.<\/p>", "explanationHtml": "<p>Všeobecne je podiel <code>p4 / (p1+p2+p3+p4) &lt;= 0.5<\/code>, po linearizácii <code>p4 &lt;= 0.5*(p1+p2+p3+p4)<\/code>. Keďže <code>p1+p2+p3+p4 = 1<\/code>, redukuje sa na jednoduché <code>p4 &lt;= 0.5<\/code>.<\/p>", "trapHtml": "<p>Písať v LP priamo zlomok <code>p4 / (p1+p2+p3+p4) &lt;= 0.5<\/code>, ktorý má premenné v menovateli.<\/p>", "answer": "p4 <= 0.5*(p1 + p2 + p3 + p4); p4 <= 0.5", "formatHint": "1 riadok v tvare: `vseobecne; pre_1m3`", "equivalents": ["p4 <= 0.5*(p1 + p2 + p3 + p4); p4 <= 0.5", "p4 <= 0.5*(p1+p2+p3+p4); p4<=0.5", "0.5*p4 - 0.5*p1 - 0.5*p2 - 0.5*p3 <= 0; p4 <= 0.5"]}, {"id": "Q49", "area": "ZM", "areaName": "5. Zmiešavacia úloha", "origin": "exercise_theory", "originLabel": "Z cvičenia / prednášky", "tier": "A", "tierLabel": "Režim A (TEST 1)", "isMain": false, "optional": false, "archived": false, "type": "MCQ", "title": "Linearizácia váženého priemeru s neznámym celkovým objemom (Benzín)", "source": "cv03 / MaO_03_Zmiešavacia úloha (Pr. 2 Benzín)", "promptHtml": "<p>Z 4 surovín (<code>i in 1..4<\/code>) s tlakmi pár <code>t(i)<\/code> miešame letecký benzín <code>Z1<\/code>. Premenná <code>x(i, 1)<\/code> znamená množstvo suroviny <code>i<\/code> použitej v zmesi <code>Z1<\/code> (celkové množstvo vyrobenej <code>Z1<\/code> nie je vopred zadané konštantou). Ktorý zápis podmienky, že tlak pár v <code>Z1<\/code> nesmie presiahnuť <code>0.49 bar<\/code>, je <strong>lineárny a správny<\/strong>?<\/p>", "explanationHtml": "<p>Celkový objem zmesi <code>Z1<\/code> je <code>sum(i) x(i,1)<\/code> (kladný alebo nulový). Vynásobením oboch strán definície váženého priemeru (<code>A<\/code>) týmto súčtom získame čistú lineárnu nerovnicu <code>sum t(i)*x(i,1) &lt;= 0.49 * sum x(i,1)<\/code>.<\/p>", "trapHtml": "<p>Možnosť <code>A<\/code> je nelineárna a v Moseli nespustiteľná; možnosť <code>C<\/code> predpokladá pevný objem 1 jednotky <code>Z1<\/code>, čo neplatí!<\/p>", "answer": "B", "options": [{"key": "A", "html": "<code>(sum(i in 1..4) t(i)*x(i,1)) / (sum(i in 1..4) x(i,1)) &lt;= 0.49<\/code>"}, {"key": "B", "html": "<code>sum(i in 1..4) t(i)*x(i,1) &lt;= 0.49 * sum(i in 1..4) x(i,1)<\/code>"}, {"key": "C", "html": "<code>sum(i in 1..4) t(i)*x(i,1) &lt;= 0.49<\/code>"}, {"key": "D", "html": "<code>sum(i in 1..4) t(i)*x(i,1) &lt;= 0.49 * 100<\/code>"}], "multi": false, "shuffleOptions": true}, {"id": "Q50", "area": "ZM", "areaName": "5. Zmiešavacia úloha", "origin": "exercise_theory", "originLabel": "Z cvičenia / prednášky", "tier": "B", "tierLabel": "Režim B (Rozšírené)", "isMain": false, "optional": false, "archived": false, "type": "MCQ", "title": "Prečo model Benzín bez limitov surovín zlyhá ako neohraničený", "source": "cv03 / MaO_03_Zmiešavacia úloha (Pr. 2) vs. chybný vzor ModaOp3_benzin.mos", "promptHtml": "<p>V úlohe <code>Benzín<\/code> miešame suroviny <code>P1..P4<\/code> (dostupné v množstvách <code>[38, 25, 40, 14]<\/code>) do zmesí <code>Z1, Z2, Z3<\/code> (predajné ceny <code>500, 600, 400 €<\/code>) s cieľom <strong>maximalizovať tržbu<\/strong>. Čo sa stane, ak v Moseli napíšeme technické podmienky oktánového čísla a tlaku pár pre <code>Z1, Z2<\/code>, ale zabudneme podmienku dostupnosti surovín <code>sum(j in 1..3) x(i,j) &lt;= p(i)<\/code>?<\/p>", "explanationHtml": "<p>Bez horného limitu surovín <code>p(i)<\/code> možno každé <code>x(i, j)<\/code> (najmä v <code>Z3<\/code>, ktoré nemá žiadne technické limity, prípadne proporcionálne aj <code>Z1, Z2<\/code>) zväčšovať do <code>+ nekonečna<\/code>, čím tržba rastie neobmedzene.<\/p>", "trapHtml": "<p>Deklarácia poľa <code>p::[38, 25, 40, 14]<\/code> v Moseli bez jeho skutočného použitia v nerovnici žiadne obmedzenie nevytvorí!<\/p>", "answer": "B", "options": [{"key": "A", "html": "Úloha ostane bez riešenia (<code>XPRS_INF<\/code>)."}, {"key": "B", "html": "Úloha bude neohraničená (<code>XPRS_UNB<\/code>), lebo možno miešať neobmedzené množstvo benzínu so ziskom do nekonečna."}, {"key": "C", "html": "Úloha vyrobí iba nulové množstvá <code>x(i, j) = 0<\/code>."}, {"key": "D", "html": "Mosel automaticky preberie kapacity zo súboru <code>p<\/code>."}], "multi": false, "shuffleOptions": true}, {"id": "Q51", "area": "ZM", "areaName": "5. Zmiešavacia úloha", "origin": "exercise_theory", "originLabel": "Z cvičenia / prednášky", "tier": "A", "tierLabel": "Režim A (TEST 1)", "isMain": false, "optional": false, "archived": false, "type": "1-R", "title": "Zmiešavanie smotany pri výrobe zmrzliny A", "source": "cv03 / Cv03_Zmrzlina.mos", "promptHtml": "<p>Na výrobu <code>1 kg<\/code> zmrzliny A potrebujeme <code>0.1 l<\/code> smotany s obsahom tuku <strong>aspoň 12 %<\/strong>. Miešame 3 druhy smotany s obsahom tuku <code>18 %<\/code>, <code>10 %<\/code> a <code>13 %<\/code>, pričom <code>sA(1), sA(2), sA(3)<\/code> sú použité litre smotany jednotlivých dodávateľov pre zmrzlinu A a <code>xA<\/code> je hmotnosť vyrobenej zmrzliny A (v kg). Zapíšte bilanciu množstva smotany a lineárnu podmienku tuku pre zmrzlinu A.<\/p>", "explanationHtml": "<p>Celkový objem použitej smotany musí presne pokryť receptúru <code>0.1 l/kg<\/code> (<code>sA(1)+sA(2)+sA(3) = 0.1*xA<\/code>). Obsah tuku sa dá zapísať priamo cez <code>sum sA<\/code> alebo po dosadení za <code>0.1*xA<\/code> ako <code>&gt;= 1.2*xA<\/code>.<\/p>", "trapHtml": "<p>Zapísať <code>&gt;= 12*xA<\/code> namiesto <code>&gt;= 12*(0.1*xA) = 1.2*xA<\/code> (12 % sa vzťahuje k 0.1 litru smotany, nie k 1 kg celej zmrzliny!).<\/p>", "answer": "sA(1) + sA(2) + sA(3) = 0.1*xA; 18*sA(1) + 10*sA(2) + 13*sA(3) >= 12*(sA(1) + sA(2) + sA(3))", "formatHint": "1 riadok v tvare: `bilancia_smotany; podmienka_tuku`", "equivalents": ["sA(1)+sA(2)+sA(3)=0.1*xA; 18*sA(1)+10*sA(2)+13*sA(3)>=12*(sA(1)+sA(2)+sA(3))", "sA(1)+sA(2)+sA(3)=0.1*xA; 18*sA(1)+10*sA(2)+13*sA(3)>=1.2*xA", "sA(1)+sA(2)+sA(3)=0.1*xA; 0.18*sA(1)+0.1*sA(2)+0.13*sA(3)>=0.12*(sA(1)+sA(2)+sA(3))"]}, {"id": "Q52", "area": "ZM", "areaName": "5. Zmiešavacia úloha", "origin": "exercise_theory", "originLabel": "Z cvičenia / prednášky", "tier": "A", "tierLabel": "Režim A (TEST 1)", "isMain": false, "optional": false, "archived": false, "type": "MCQ", "title": "Intervalové tolerancie v zmesi hnojív (N-P-K)", "source": "cv03 / MaO_03_Zmiešavacia úloha (Pr. 5 Hnojivo)", "promptHtml": "<p>Správca trávnika mieša hnojivá v množstvách <code>x(1)..x(5)<\/code> na získanie <strong>10 kg<\/strong> zmesi s cieľovým zložením <code>10-8-12<\/code> (napr. <code>10 %<\/code> dusíka N), pričom žiadna zložka nesmie byť prekročená o viac ako <code>0.5 %<\/code> (dusík v intervale <code>10 % až 10.5 %<\/code>). Ktoré obmedzenia potrebuje pre <strong>dusík<\/strong> (s obsahom <code>n(i)<\/code> v <code>%<\/code>), ak <code>sum x(i) = 10<\/code> [kg]?<\/p>", "explanationHtml": "<p>Uzavretý interval <code>10 % &lt;= obsah_N &lt;= 10.5 %<\/code> je vždy dvojica lineárnych nerovníc (dolná hranica <code>&gt;= 10*10<\/code> a horná hranica <code>&lt;= 10.5*10<\/code>). Všimnite si aj správne škálovanie na <code>10 kg<\/code> zmesi.<\/p>", "trapHtml": "<p>Skúšať zapísať dvojstrannú nerovnosť v jednom výraze <code>100 &lt;= ... &lt;= 105<\/code>, čo syntax Moselu ani štandardné LP neakceptuje v jednej podmienke.<\/p>", "answer": "B", "options": [{"key": "A", "html": "Iba jednu nerovnicu: <code>sum(i in 1..5) n(i)*x(i) = 10*10<\/code>."}, {"key": "B", "html": "Dve nerovnice: <code>sum(i in 1..5) n(i)*x(i) &gt;= 10*10<\/code> a <code>sum(i in 1..5) n(i)*x(i) &lt;= 10.5*10<\/code>."}, {"key": "C", "html": "Jednu nerovnicu: <code>sum(i in 1..5) n(i)*x(i) &gt;= 10.5*10<\/code>."}, {"key": "D", "html": "Rozdielovú podmienku <code>sum(i in 1..5) n(i)*x(i) &lt;= 0.5<\/code>."}], "multi": false, "shuffleOptions": true}, {"id": "Q53", "area": "REZ", "areaName": "6. Rezné úlohy", "origin": "verbatim_moodle", "originLabel": "Doslovne z Moodle", "tier": "A", "tierLabel": "Režim A (TEST 1)", "isMain": true, "optional": false, "archived": true, "type": "MCQ", "title": "SchoolDesk — význam rozhodovacích premenných x(i)", "source": "Archív Moodle (Zapocty_dokopy P10, test1.png Q2, test2.php Q9)", "promptHtml": "<p>Spoločnosť SchoolDesk vyrába stoly rôznych veľkostí pre materské, základné, stredné a vysoké školy. Nohy na stoly majú rovnaký priemer, ale rôznu dĺžku: 40 cm pre malé stoly, 60 cm pre stredné stoly a 70 cm pre veľké stoly. Nohy sa režú z oceľových tyčí dlhých 1,5 m. Spoločnosť získala objednávku na výrobu 108 malých, 125 stredných a 100 veľkých stolov. Ako má zabezpečiť túto zákazku, ak chce minimalizovať spotrebu tyčí?<\/p>\n<p>Premenné <code>x(i)<\/code> v tejto úlohe znamenajú:<\/p>", "explanationHtml": "<p>V reznej úlohe nerozhodujeme priamo o počte kusov hotových výrobkov, ale o tom, <strong>koľkokrát použijeme jednotlivý rezný plán <code>i<\/code><\/strong> (počet oceľových tyčí rozrezaných spôsobom <code>i<\/code>). Počet premenných sa preto rovná počtu uvažovaných schém rezania (<code>6<\/code>), nie počtu typov nôh (<code>3<\/code>).<\/p>", "trapHtml": "<p>Zameniť počet premenných s počtom rôznych požadovaných dĺžok výrobkov (<code>3<\/code> typy nôh určujú počet podmienok, nie počet premenných <code>6<\/code>!).<\/p>", "answer": "B", "options": [{"key": "A", "html": "počet tyčí potrebných na výrobu stolov typu <code>i<\/code>"}, {"key": "B", "html": "počet tyčí rozrezaných spôsobom <code>i<\/code>"}, {"key": "C", "html": "počet vyrobených stolov typu <code>i<\/code>"}, {"key": "D", "html": "počet vyrobených nôh dĺžky <code>i<\/code>"}], "multi": false, "shuffleOptions": true}, {"id": "Q54", "area": "REZ", "areaName": "6. Rezné úlohy", "origin": "verbatim_moodle", "originLabel": "Doslovne z Moodle", "tier": "A", "tierLabel": "Režim A (TEST 1)", "isMain": true, "optional": false, "archived": true, "type": "1-R", "title": "SchoolDesk — podmienka pokrytia dopytu pre stredné stoly", "source": "Archív Moodle (Zapocty_dokopy P11, 2009-04-07 Q2); cv05 SchoolDesk", "promptHtml": "<p>Spoločnosť SchoolDesk vyrába stoly rôznych veľkostí pre materské, základné, stredné a vysoké školy. Nohy na stoly majú rovnaký priemer (2 cm), ale rôznu dĺžku: 40 cm pre malé stoly, 60 cm pre stredné stoly a 70 cm pre veľké stoly. Nohy sa režú z oceľových tyčí dlhých 1,5 m. Spoločnosť získala objednávku na výrobu 108 malých, 125 stredných a 100 veľkých stolov. Tyč sa môže rozrezať 6-timi spôsobmi podľa nasledujúcej tabuľky.<\/p>\n<div class=\"tbl-wrap\"><table class=\"data-table\"><thead><tr><th style=\"text-align:left\">šablóna<\/th><th style=\"text-align:right\">1<\/th><th style=\"text-align:right\">2<\/th><th style=\"text-align:right\">3<\/th><th style=\"text-align:right\">4<\/th><th style=\"text-align:right\">5<\/th><th style=\"text-align:right\">6<\/th><\/tr><\/thead><tbody><tr><td style=\"text-align:left\">40 cm<\/td><td style=\"text-align:right\">3<\/td><td style=\"text-align:right\">2<\/td><td style=\"text-align:right\">2<\/td><td style=\"text-align:right\">0<\/td><td style=\"text-align:right\">0<\/td><td style=\"text-align:right\">0<\/td><\/tr><tr><td style=\"text-align:left\">60 cm<\/td><td style=\"text-align:right\">0<\/td><td style=\"text-align:right\">1<\/td><td style=\"text-align:right\">0<\/td><td style=\"text-align:right\">2<\/td><td style=\"text-align:right\">0<\/td><td style=\"text-align:right\">1<\/td><\/tr><tr><td style=\"text-align:left\">70 cm<\/td><td style=\"text-align:right\">0<\/td><td style=\"text-align:right\">0<\/td><td style=\"text-align:right\">1<\/td><td style=\"text-align:right\">0<\/td><td style=\"text-align:right\">2<\/td><td style=\"text-align:right\">1<\/td><\/tr><\/tbody><\/table><\/div>\n<p>Napíšte podmienku, ktorá zaručí, že sa vyrobí dosť nôh pre stredné stoly, ak premenná <code>x(i)<\/code> určuje počet tyčí rozrezaných spôsobom <code>i<\/code>.<\/p>", "explanationHtml": "<p>Stredných stolov je <code>125<\/code> a každý potrebuje <code>4<\/code> nohy dĺžky 60 cm, čiže dopyt je <code>125 * 4 = 500<\/code> nôh. Po jednej nohe (60 cm) dáva šablóna 2 a 6, po dve nohy šablóna 4 (<code>x(2) + 2*x(4) + x(6) &gt;= 125*4<\/code>). Poznámka k archívu Moodle: v <code>2009-04-07 Q2<\/code> prešla nerovnica <code>&gt;= 125*4<\/code>, kým na snímke <code>Zapocty_dokopy P11<\/code> bola ako vzor uvedená rovnosť <code>= 125*4<\/code> (preto sú tu akceptované oba tvary).<\/p>", "trapHtml": "<p><strong>Klasická Moodle pasca:<\/strong> napísať na pravú stranu iba <code>125<\/code> namiesto <code>125*4<\/code> (<code>500<\/code>) — v zadaní sú počty <strong>stolov<\/strong>, nie počty nôh!<\/p>", "answer": "x(2) + 2*x(4) + x(6) >= 125*4", "formatHint": "1 riadok (nerovnica s `x(2), x(4), x(6)`)", "equivalents": ["x(2) + 2*x(4) + x(6) >= 500", "x(2) + 2*x(4) + x(6) >= 4*125", "x(2)+2*x(4)+x(6)>=125*4", "x(2)+2*x(4)+x(6)=125*4", "x(2)+2*x(4)+x(6)=500"]}, {"id": "Q55", "area": "REZ", "areaName": "6. Rezné úlohy", "origin": "exercise_theory", "originLabel": "Z cvičenia / prednášky", "tier": "B", "tierLabel": "Režim B (Rozšírené)", "isMain": false, "optional": false, "archived": false, "type": "1-R", "title": "SchoolDesk — odpad reznej schémy a minimálna spotreba tyčí", "source": "cv05 / Cv05_ReznaUlohaPriklad4.mos, Tab4.JPG (overené v Mosel)", "promptHtml": "<p>Pri údajoch z <code>Q54<\/code> (tyč dlhá <strong>150 cm<\/strong>) vypočítajte: a) zvyškový odpad v <strong>cm<\/strong> z 1 tyče pre <strong>Plán 1<\/strong> <code>(3, 0, 0)<\/code> a pre <strong>Plán 4<\/strong> <code>(0, 2, 0)<\/code>; b) minimálny počet spotrebovaných tyčí v optimálnom riešení.<\/p>", "explanationHtml": "<p>a) Plán 1 spotrebuje <code>3 * 40 = 120 cm<\/code>, odpad = <code>150 - 120 = 30 cm<\/code>. Plán 4 spotrebuje <code>2 * 60 = 120 cm<\/code>, odpad = <code>150 - 120 = 30 cm<\/code>. b) Dopyt po nohách je <code>[432, 500, 400]<\/code>: optimálne nasadenie <code>x(2) = 216<\/code>, <code>x(4) = 142<\/code>, <code>x(5) = 200<\/code> (dá <code>432<\/code> ks 40 cm, <code>216 + 284 = 500<\/code> ks 60 cm, <code>400<\/code> ks 70 cm) vyžaduje <code>216 + 142 + 200 = 558<\/code> tyčí (a v spojitom LP aj v celočíselnom programe dáva presne <code>558<\/code>).<\/p>", "trapHtml": "<p>Použiť v účelovej funkcii ako váhy odpad <code>30*x(1) + 10*x(2) + ...<\/code> namiesto počtu tyčí <code>x(1)+x(2)+...+x(6)<\/code>, ak zároveň pripúšťame nadprodukciu nôh (<code>&gt;=<\/code>).<\/p>", "answer": "30; 30; 558", "formatHint": "1 riadok v tvare: `odpad_P1; odpad_P4; min_tyci` (celé čísla)", "equivalents": ["30; 30; 558", "30;30;558"]}, {"id": "Q56", "area": "REZ", "areaName": "6. Rezné úlohy", "origin": "exercise_theory", "originLabel": "Z cvičenia / prednášky", "tier": "A", "tierLabel": "Režim A (TEST 1)", "isMain": false, "optional": false, "archived": false, "type": "MCQ", "title": "Dielňa — rozmer modelu a optimum spojitej reznej úlohy", "source": "cv05 / MaO_05_ReznaUloha.pdf (Pr. 5), MO_Zhrnutie (overené v Mosel)", "promptHtml": "<p>Dielňa má vykrájať <code>400 ks<\/code> súčiastky A, <code>600 ks<\/code> súčiastky B a <code>2625 ks<\/code> súčiastky C zo štandardných kusov materiálu podľa <strong>5 schém<\/strong>: <code>A:[8,4,0,0,0]<\/code>, <code>B:[4,10,16,10,0]<\/code>, <code>C:[1,2,3,20,100]<\/code>. Ktoré tvrdenie je správne?<\/p>", "explanationHtml": "<p>Rozhodujeme o <code>5<\/code> schémach (<code>x1..x5<\/code>) pri <code>3<\/code> podmienkach pokrytia dopytu A, B, C. Kontrola pre <code>(50, 0, 25, 0, 25)<\/code>: A = <code>50*8 = 400<\/code>, B = <code>50*4 + 25*16 = 600<\/code>, C = <code>50*1 + 25*3 + 25*100 = 2625<\/code>; spolu <code>50 + 25 + 25 = 100<\/code> kusov základného materiálu.<\/p>", "trapHtml": "<p>Zamieňať počet schém (<code>5<\/code> stĺpcov -&gt; počet premenných) s počtom typov súčiastok (<code>3<\/code> riadky -&gt; počet podmienok).<\/p>", "answer": "B", "options": [{"key": "A", "html": "Model má <code>3<\/code> rozhodovacie premenné, <code>5<\/code> podmienok a optimum je <code>125<\/code> kusov."}, {"key": "B", "html": "Model má <code>5<\/code> rozhodovacích premenných, <code>3<\/code> štrukturálne podmienky dopytu a optimum (v LP aj celočíselne) je <code>100<\/code> kusov (<code>x1=50, x3=25, x5=25<\/code>)."}, {"key": "C", "html": "Model má <code>15<\/code> premenných (<code>3*5<\/code>) a <code>8<\/code> podmienok."}, {"key": "D", "html": "Úloha je v spojitom LP neprípustná (<code>XPRS_INF<\/code>)."}], "multi": false, "shuffleOptions": true}, {"id": "Q57", "area": "REZ", "areaName": "6. Rezné úlohy", "origin": "exercise_theory", "originLabel": "Z cvičenia / prednášky", "tier": "B", "tierLabel": "Režim B (Rozšírené)", "isMain": false, "optional": false, "archived": false, "type": "1-R", "title": "Diagnostika lokomotív ako 1D rezná úloha", "source": "cv05 / MaO_05_ReznaUloha.pdf (Pr. 3), ModaOp5_lokomotivy.mos (overené v Mosel)", "promptHtml": "<p>Diagnostická linka s dennou kapacitou <strong>20 hod<\/strong> má skontrolovať <code>200<\/code> elektrických (A: 6 hod), <code>150<\/code> dieselových (B: 7 hod) a <code>230<\/code> kombinovaných lokomotív (C: 11 hod), vždy po jednej, bez rozdelenia medzi dni. Maximálne denné schémy <code>(A, B, C)<\/code> sú <code>S1:(0,1,1)<\/code>, <code>S2:(1,0,1)<\/code>, <code>S3:(2,1,0)<\/code>, <code>S4:(1,2,0)<\/code>, <code>S5:(3,0,0)<\/code>, <code>S6:(0,2,0)<\/code>, <code>S7:(0,0,1)<\/code>. Napíšte podmienku pokrytia pre <strong>typ C<\/strong> a uveďte minimálny počet dní (<code>x(1)..x(7)<\/code>).<\/p>", "explanationHtml": "<p>Typ C sa zmestí len raz za deň do schém S1, S2 a S7 (<code>x(1)+x(2)+x(7) &gt;= 230<\/code>). Optimálny rozpis využije <code>x(1) = 150<\/code> dní (pokryje <code>150<\/code> B + <code>150<\/code> C), <code>x(2) = 80<\/code> dní (pokryje <code>80<\/code> A + <code>80<\/code> C -&gt; spolu <code>230<\/code> C) a zvyšných <code>200 - 80 = 120<\/code> lokomotív A pokryje <code>x(5) = 40<\/code> dní po 3 ks A. Spolu <code>150 + 80 + 40 = 270<\/code> dní!<\/p>", "trapHtml": "<p>Prečo túto úlohu nemožno riešiť len z celkového hodinového súčtu <code>(200*6+150*7+230*11)/20 = 239<\/code> dní? Lebo lokomotíva C (11 hod) sa nedá vtesnať po dve do 20-hodinovej zmeny a prestrihnúť cez polnoc!<\/p>", "answer": "x(1) + x(2) + x(7) >= 230; 270", "formatHint": "1 riadok v tvare: `podmienka_C; min_dni`", "equivalents": ["x(1) + x(2) + x(7) >= 230; 270", "x(1)+x(2)+x(7)>=230; 270"]}, {"id": "Q58", "area": "REZ", "areaName": "6. Rezné úlohy", "origin": "exercise_theory", "originLabel": "Z cvičenia / prednášky", "tier": "A", "tierLabel": "Režim A (TEST 1)", "isMain": false, "optional": false, "archived": false, "type": "MCQ", "title": "Minimalizácia počtu tyčí vs. minimalizácia zvyškového odpadu", "source": "MO_05, cv05 (MaO_05_ReznaUloha.pdf)", "promptHtml": "<p>V reznej úlohe máme pokryť dopyty nerovnicami <code>sum(j) a(i,j)*x(j) &gt;= b(i)<\/code>. Prečo je účelová funkcia <strong>minimalizácie spotrebovaných tyčí<\/strong> <code>min sum(j) x(j)<\/code> spoľahlivejšia ako naivný zápis <code>min sum(j) trim_odpad(j)*x(j)<\/code> (kde <code>trim_odpad(j)<\/code> je iba nezaplnený koniec tyče v schéme <code>j<\/code>)?<\/p>", "explanationHtml": "<p>Celková dĺžka dodaných tyčí je <code>L * sum x(j) = sum(i) l_i*b_i + (celkový odpad vrátane prebytočných kusov)<\/code>. Keďže <code>sum l_i*b_i<\/code> je konštanta, minimalizácia počtu tyčí <code>sum x(j)<\/code> minimalizuje presne celkový materiálový odpad.<\/p>", "trapHtml": "<p>Pri rovnosti <code>= b(i)<\/code> by boli obe funkcie ekvivalentné (okrem možnej neprípustnosti pri celočíselnosti), ale pri <code>&gt;= b(i)<\/code> môže mať schéma s 0 cm odrezkom obrovskú nadprodukciu.<\/p>", "answer": "A", "options": [{"key": "A", "html": "Lebo pri <code>&gt;= b(i)<\/code> môže naivná minimalizácia <code>trim_odpad<\/code> nadprodukovať zbytočné kusy bez odrezkov, hoci spotrebuje viac tyčí; minimalizácia <code>sum x(j)<\/code> automaticky minimalizuje aj <strong>celkový<\/strong> odpad (odrezky + nadprodukcia)."}, {"key": "B", "html": "Lebo <code>sum x(j)<\/code> nie je lineárna funkcia."}, {"key": "C", "html": "Lebo v Moseli sa odpad v cm nedá uložiť do poľa."}, {"key": "D", "html": "Obe funkcie sú úplne totožné vždy aj pri <code>&gt;= b(i)<\/code> s ľubovoľnou nadprodukciou."}], "multi": false, "shuffleOptions": true}, {"id": "Q59", "area": "REZ", "areaName": "6. Rezné úlohy", "origin": "exercise_theory", "originLabel": "Z cvičenia / prednášky", "tier": "A", "tierLabel": "Režim A (TEST 1)", "isMain": false, "optional": false, "archived": false, "type": "MCQ", "title": "Nedominované (efektívne) rezné plány pre 150 cm tyč", "source": "cv05 / MaO_05_ReznaUloha.pdf (Pr. 4)", "promptHtml": "<p>Tyč dĺžky <code>150 cm<\/code> režeme na dĺžky <code>40 cm<\/code>, <code>60 cm<\/code> a <code>70 cm<\/code>. Prečo do množiny efektívnych rezných plánov zvyčajne nezaradíme schému <code>(1 ks 40 cm, 1 ks 60 cm, 0 ks 70 cm)<\/code>?<\/p>", "explanationHtml": "<p>Maximálny (nedominovaný) rezný plán je taký, kde je zvyšok po rozrezaní <strong>menší ako najmenší požadovaný diel<\/strong> (tu <code>&lt; 40 cm<\/code>). Pri <code>(1, 1, 0)<\/code> je zvyšok <code>50 cm &gt;= 40 cm<\/code>, takže ho netreba uvažovať.<\/p>", "trapHtml": "<p>Pozor: ak pripustíme menej než maximum kusov, zväčšíme si len počet stĺpcov o zbytočné neefektívne kombinácie.<\/p>", "answer": "B", "options": [{"key": "A", "html": "Súčet dĺžok <code>40 + 60 = 100 cm<\/code> presahuje dĺžku tyče <code>150 cm<\/code>."}, {"key": "B", "html": "Zostáva nepoužitý zvyšok <code>50 cm &gt;= 40 cm<\/code>, z ktorého sa ešte dá vyrezať ďalšia 40 cm noha — teda plán <code>(2, 1, 0)<\/code> ho striktne dominuje."}, {"key": "C", "html": "Obsahuje nulu pri treťom rozmere, čo Mosel zakazuje."}, {"key": "D", "html": "Má nepárny počet kusov."}], "multi": false, "shuffleOptions": true}, {"id": "Q60", "area": "REZ", "areaName": "6. Rezné úlohy", "origin": "exercise_theory", "originLabel": "Z cvičenia / prednášky", "tier": "A", "tierLabel": "Režim A (TEST 1)", "isMain": false, "optional": false, "archived": false, "type": "1-R", "title": "Účelová funkcia a zvyškový odpad rezného plánu (200 cm tyč)", "source": "cv05 / MaO_05_ReznaUloha.pdf", "promptHtml": "<p>Tyče dĺžky <strong>200 cm<\/strong> režeme na diely dĺžky <strong>45 cm<\/strong> a <strong>70 cm<\/strong> tromi nedominovanými plánmi: <code>P1: (4, 0)<\/code>, <code>P2: (2, 1)<\/code>, <code>P3: (1, 2)<\/code> (premenné <code>x(1), x(2), x(3)<\/code>). Napíšte minimalizačnú účelovú funkciu (výraz pre počet tyčí) a zvyškový odpad v <strong>cm<\/strong> pre plán <code>P2<\/code>.<\/p>", "explanationHtml": "<p>Celkový počet tyčí je jednoducho <code>x(1) + x(2) + x(3)<\/code>. Pre plán <code>P2<\/code>: <code>2*45 + 1*70 = 90 + 70 = 160 cm<\/code>, zvyšok na 200 cm tyči je <code>200 - 160 = 40 cm<\/code> (menej ako najmenší diel <code>45 cm<\/code>, takže plán je efektívny).<\/p>", "trapHtml": "<p>Do účelovej funkcie zapísať <code>20*x(1) + 40*x(2) + 15*x(3)<\/code> bez podmienky rovnosti dopytov, alebo si zmýliť poradie dĺžok <code>(2*70 + 45)<\/code>.<\/p>", "answer": "x(1) + x(2) + x(3); 40", "formatHint": "1 riadok v tvare: `vyraz_ucelovej_funkcie; odpad_P2_cm`", "equivalents": ["x(1) + x(2) + x(3); 40", "x(1)+x(2)+x(3); 40"]}, {"id": "Q61", "area": "TOK", "areaName": "7. Tokové úlohy", "origin": "exercise_theory", "originLabel": "Z cvičenia / prednášky", "tier": "A", "tierLabel": "Režim A (TEST 1)", "isMain": false, "optional": false, "archived": false, "type": "MCQ", "title": "Rovnica zachovania toku v prechodných uzloch siete", "source": "cv05 / Cv05_Toky_a.mos, Cv05_Toky_b.mos, MO_05", "promptHtml": "<p>V orientovanom grafe <code>uzly = 1..9<\/code> hľadáme najlacnejší tok z uzla <code>1<\/code> do uzla <code>9<\/code>, pričom existence hrán je daná dynamickým poľom cien <code>c(i, j)<\/code>. Ktorá podmienka v Moseli správne zaručuje, že v <strong>prechodných uzloch<\/strong> sa tok nehromadí ani nevzniká?<\/p>", "explanationHtml": "<p>Pre každý vnútorný (prechodný) uzol <code>k in 2..8<\/code> platí Kirchhoffov zákon: celkový prítok do <code>k<\/code> sa rovná celkovému odtoku z <code>k<\/code>.<\/p>", "trapHtml": "<p>Možnosť <code>B<\/code> zahrnie do rovnosti prítok = odtok aj zdroj <code>1<\/code> a spotrebič <code>9<\/code>, čím zakáže, aby z <code>1<\/code> odišlo o <code>10<\/code> (resp. <code>1<\/code>) jednotiek viac, ako tam prišlo -&gt; <code>XPRS_INF<\/code>!<\/p>", "answer": "A", "options": [{"key": "A", "html": "<code>forall(k in 2..8) sum(i in 1..9 | exists(c(i,k))) x(i,k) = sum(j in 1..9 | exists(c(k,j))) x(k,j)<\/code>"}, {"key": "B", "html": "<code>forall(k in 1..9) sum(i in 1..9 | exists(c(i,k))) x(i,k) = sum(j in 1..9 | exists(c(k,j))) x(k,j)<\/code>"}, {"key": "C", "html": "<code>forall(k in 2..8) sum(i in 1..9) x(i,k) &lt;= 1<\/code>"}, {"key": "D", "html": "<code>forall(i in 1..9, j in 1..9 | exists(c(i,j))) x(i,j) &lt;= c(i,j)<\/code>"}], "multi": false, "shuffleOptions": true}, {"id": "Q62", "area": "TOK", "areaName": "7. Tokové úlohy", "origin": "exercise_theory", "originLabel": "Z cvičenia / prednášky", "tier": "A", "tierLabel": "Režim A (TEST 1)", "isMain": false, "optional": false, "archived": false, "type": "1-R", "title": "Bilancia zdrojového uzla pre presun 10 jednotiek tovaru", "source": "cv05 / Cv05_Toky_b.mos", "promptHtml": "<p>V orientovanej sieti <code>1..9<\/code> (<code>c(i, j)<\/code> existujúce hrany cez <code>exists<\/code>) chceme zo zdroja <strong>1<\/strong> odoslať do siete čisto <strong>10 jednotiek<\/strong> tovaru. Zapíšte všeobecnú podmienku pre zdrojový uzol <code>1<\/code> (aj pre prípad, že by do uzla <code>1<\/code> mohla smerovať nejaká prichádzajúca hrana) pomocou sumy s <code>exists(c(...))<\/code>.<\/p>", "explanationHtml": "<p>Čistý odtok zo zdroja <code>1<\/code> (<code>odtekajúci tok mínus pritekajúci tok<\/code>) musí byť práve <code>10<\/code> (ak žiadne hrany nevstupujú do <code>1<\/code>, druhá suma je prázdna <code>0<\/code>).<\/p>", "trapHtml": "<p>Pozor na poradie indexov <code>x(1, j)<\/code> (odtok z 1) mínus <code>x(i, 1)<\/code> (prítok do 1); otočenie znamienka vynúti prítok do zdroja!<\/p>", "answer": "sum(j in 1..9 | exists(c(1,j))) x(1,j) - sum(i in 1..9 | exists(c(i,1))) x(i,1) = 10", "formatHint": "1 riadok v Moseli (`odtok_z_1 - pritok_do_1 = 10`)", "equivalents": ["sum(j in 1..9 | exists(c(1,j))) x(1,j) - sum(i in 1..9 | exists(c(i,1))) x(i,1) = 10", "sum(j in 1..9 | exists(c(1,j))) x(1,j) = 10"]}, {"id": "Q63a", "area": "TOK", "areaName": "7. Tokové úlohy", "origin": "exercise_theory", "originLabel": "Z cvičenia / prednášky", "tier": "B", "tierLabel": "Režim B (Rozšírené)", "isMain": false, "optional": false, "archived": false, "type": "1-R", "title": "Maximálny tok v sieti jednosmerných ulíc (graf 1–6)", "source": "cv05 / MaO_05_TokoveUlohy.pdf (Pr. 1 — overené v Mosel)", "promptHtml": "<p>Je daná sieť jednosmerných ulíc s uzlami <code>1..6<\/code> a kapacitami hrán (áut / 10 min): <code>1-&gt;2: 110<\/code>, <code>1-&gt;4: 80<\/code>, <code>1-&gt;5: 120<\/code>, <code>2-&gt;3: 120<\/code>, <code>2-&gt;6: 120<\/code>, <code>3-&gt;6: 100<\/code>, <code>4-&gt;3: 130<\/code>, <code>4-&gt;5: 120<\/code>, <code>5-&gt;3: 140<\/code>, <code>5-&gt;6: 150<\/code>. Aký je <strong>maximálny tok<\/strong> áut z uzla <code>1<\/code> do uzla <code>6<\/code>?<\/p>", "explanationHtml": "<p>Z uzla <code>1<\/code> odchádzajú maximálne kapacity <code>110 + 80 + 120 = 310<\/code>. Všetkých 310 áut sa bezpečne dostane do <code>6<\/code>: <code>1-&gt;2-&gt;6<\/code> (<code>110<\/code>, zostane kapacita 10), <code>1-&gt;4-&gt;3-&gt;6<\/code> (<code>80<\/code>, kap. 130 a 100 stačí) a <code>1-&gt;5-&gt;6<\/code> (<code>120<\/code>, kap. 150 stačí) -&gt; max tok = <strong>310<\/strong>.<\/p>", "trapHtml": "<p>Pri max toku sčítať príchody do cieľa <code>120 + 100 + 150 = 370<\/code> bez ohľadu na úzke hrdlo na výstupe zo zdroja <code>110 + 80 + 120 = 310<\/code>!<\/p>", "answer": "310", "formatHint": "1 riadok (celé číslo)", "equivalents": ["310", "Tok = 310"]}, {"id": "Q63b", "area": "TOK", "areaName": "7. Tokové úlohy", "origin": "exercise_theory", "originLabel": "Z cvičenia / prednášky", "tier": "B", "tierLabel": "Režim B (Rozšírené)", "isMain": false, "optional": false, "archived": false, "type": "1-R", "title": "Najkratšia cesta v grafe 1–6", "source": "cv05 / MaO_05_TokoveUlohy.pdf (Pr. 2 — overené v Mosel)", "promptHtml": "<p>V tej istej sieti s uzlami <code>1..6<\/code> tentoraz ohodnotenia hrán udávajú <strong>dĺžku<\/strong> (v metroch): <code>1-&gt;2: 110<\/code>, <code>1-&gt;4: 80<\/code>, <code>1-&gt;5: 120<\/code>, <code>2-&gt;3: 120<\/code>, <code>2-&gt;6: 120<\/code>, <code>3-&gt;6: 100<\/code>, <code>4-&gt;3: 130<\/code>, <code>4-&gt;5: 120<\/code>, <code>5-&gt;3: 140<\/code>, <code>5-&gt;6: 150<\/code>. Aká je dĺžka <strong>najkratšej cesty<\/strong> z uzla <code>1<\/code> do uzla <code>6<\/code>?<\/p>", "explanationHtml": "<p>Priechodné cesty z <code>1<\/code> do <code>6<\/code> a ich dĺžky: <code>1-&gt;2-&gt;6 = 110 + 120 = 230<\/code>; <code>1-&gt;5-&gt;6 = 120 + 150 = 270<\/code>; <code>1-&gt;4-&gt;3-&gt;6 = 80 + 130 + 100 = 310<\/code>; najkratšia je <code>1 -&gt; 2 -&gt; 6<\/code> s dĺžkou <strong>230<\/strong>.<\/p>", "trapHtml": "<p>Vybrať lokálne najlacnejšiu prvú hranu <code>1-&gt;4<\/code> (<code>80<\/code>), ktorá však ďalej núti ísť cez drahé hrany (<code>80 + 130 + 100 = 310<\/code>).<\/p>", "answer": "230", "formatHint": "1 riadok (celé číslo)", "equivalents": ["230", "110 + 120 = 230"]}, {"id": "Q64", "area": "TOK", "areaName": "7. Tokové úlohy", "origin": "exercise_theory", "originLabel": "Z cvičenia / prednášky", "tier": "C", "tierLabel": "Režim C (Mimo TEST 1)", "isMain": false, "optional": true, "archived": false, "type": "MCQ", "title": "Najlacnejší spojitý tok (Toky_b) vs. fixné náklady rekonštrukcie (Toky_c)", "source": "cv05 / Cv05_Toky_b.mos, Cv05_Toky_c.mos (overené v Mosel)", "promptHtml": "<p>V sieti <code>1..9<\/code> posielame <code>10<\/code> jednotiek tovaru z <code>1<\/code> do <code>9<\/code>. V modeli <code>Toky_b<\/code> platíme iba variabilnú cenu <code>c(i, j)*x(i, j)<\/code> (optimum = <code>79<\/code>). V modeli <code>Toky_c<\/code> musíme navyše pre každú <strong>použitú<\/strong> hranu zaplatiť fixný poplatok rekonštrukcie <code>f(i, j)<\/code> pomocou binárnej premennej <code>y(i, j)<\/code> a väzby <code>x(i, j) &lt;= k(i, j)*y(i, j)<\/code>. Čo je správne?<\/p>", "explanationHtml": "<p><code>Toky_c<\/code> ukazuje hranicu medzi spojitým tokom (<code>Toky_b<\/code>) a diskrétnou voľbou siete: pre fixné náklady treba binárny spínač <code>y(i,j)<\/code> a hornú väzbu <code>x(i,j) &lt;= k(i,j)*y(i,j)<\/code>. Potom riešič radšej obíde lacné hrany s krátkou kapacitou (<code>8-&gt;7<\/code>), aby ušetril fixné rekonštrukcie, a pošle tok cez <code>1-&gt;3-&gt;6<\/code> (<code>5<\/code>) a <code>1-&gt;4-&gt;6<\/code> (<code>5<\/code>).<\/p>", "trapHtml": "<p>Pripočítať fixné náklady <code>f(i, j)<\/code> ako lineárny násobok <code>f(i, j)*x(i, j)<\/code> by spôsobilo, že poplatok platíte za každú tonu namiesto jednorazovo za otvorenie úseku!<\/p>", "answer": "A", "options": [{"key": "A", "html": "<code>Toky_b<\/code> je spojité LP, ktoré rozvetví tok aj na drahšie vetvy bez fixnej pokuty, kým <code>Toky_c<\/code> vyžaduje <code>is_binary<\/code> na <code>y(i, j)<\/code> a koncentruje tok do menšieho počtu ciest (preprava <code>87<\/code> + rekonštrukcia <code>127<\/code> = <code>214<\/code>)."}, {"key": "B", "html": "Oba modely dávajú rovnaký zoznam použitých hrán, mení sa iba konštanta ceny."}, {"key": "C", "html": "Pre fixné náklady <code>f(i, j)<\/code> stačí pripočítať <code>f(i, j)<\/code> priamo k <code>c(i, j)<\/code> bez binárnych premenných."}, {"key": "D", "html": "Väzba má byť <code>x(i, j) &gt;= k(i, j)*y(i, j)<\/code>."}], "multi": false, "shuffleOptions": true}, {"id": "Q65", "area": "TOK", "areaName": "7. Tokové úlohy", "origin": "exercise_theory", "originLabel": "Z cvičenia / prednášky", "tier": "B", "tierLabel": "Režim B (Rozšírené)", "isMain": false, "optional": false, "archived": false, "type": "1-R", "title": "Najkratšia cesta pre 1 jednotku vs. kapacita úzkeho hrdla (sieť 1–9)", "source": "cv05 / Cv05_Toky_a.mos, NajlacnejsiTok.txt (overené v Mosel)", "promptHtml": "<p>V sieti <code>1..9<\/code> máme dvojice hrán <code>(uzol1, uzol2): cena c / kapacita k<\/code>: <code>(1,3): 3/5<\/code>, <code>(1,4): 2/8<\/code>, <code>(3,6): 3/6<\/code>, <code>(4,3): 1/7<\/code>, <code>(4,5): 2/9<\/code>, <code>(4,6): 3/5<\/code>, <code>(5,7): 3/3<\/code>, <code>(5,8): 1/6<\/code>, <code>(6,5): 1/6<\/code>, <code>(6,7): 3/7<\/code>, <code>(6,9): 3/8<\/code>, <code>(7,9): 1/3<\/code>, <code>(8,7): 1/6<\/code>. Určite dĺžku <strong>najkratšej cesty<\/strong> (cena za <code>1<\/code> jednotku z <code>1<\/code> do <code>9<\/code>) a <strong>maximálnu priepustnosť<\/strong> tejto najkratšej cesty.<\/p>", "explanationHtml": "<p>Najlacnejšia trasa <code>1 -&gt; 4 -&gt; 5 -&gt; 8 -&gt; 7 -&gt; 9<\/code> má celkovú cenu <code>2 + 2 + 1 + 1 + 1 = 7<\/code> (pre porovnanie <code>1 -&gt; 4 -&gt; 6 -&gt; 9<\/code> stojí <code>2 + 3 + 3 = 8<\/code>). Jej kapacity sú <code>min(8, 9, 6, 6, 3) = 3<\/code>, takže pri 10 jednotkách sa môže po tejto najlacnejšej trase poslať najviac <code>3<\/code> jednotky a zvyšok musí ísť cez uzol <code>6<\/code>.<\/p>", "trapHtml": "<p>Prepočítať <code>10 * 7 = 70<\/code> ako cenu prepravy 10 jednotiek bez kontroly kapacít hrán <code>k(7,9) = 3<\/code> (skutočné optimum pre 10 j. je <code>79<\/code>!).<\/p>", "answer": "7; 3", "formatHint": "1 riadok v tvare: `cena_1_jednotky; max_kapacita_trasy`", "equivalents": ["7; 3", "7;3"]}, {"id": "Q66", "area": "TOK", "areaName": "7. Tokové úlohy", "origin": "exercise_theory", "originLabel": "Z cvičenia / prednášky", "tier": "B", "tierLabel": "Režim B (Rozšírené)", "isMain": false, "optional": false, "archived": false, "type": "MCQ", "title": "Programová kontrola riešiteľnosti po odobratí hrany", "source": "cv05 / MaO_05_TokoveUlohy.pdf (Pr. 3)", "promptHtml": "<p>V úlohe robustnosti grafu postupne odoberáme z grafu vždy po jednej hrane a opakovane voláme <code>minimize(dlzka)<\/code>. Prečo pred výpisom <code>getobjval<\/code> kontrolujeme <code>getprobstat = XPRS_OPT<\/code>?<\/p>", "explanationHtml": "<p>Odstránenie tzv. mosta alebo poslednej hrany zo zdroja/do cieľa rozpojí orientované prepojenie <code>1 -&gt; 6<\/code>, takže úloha nemá riešenie (<code>XPRS_INF<\/code>). Korektný program vtedy vypíše upozornenie namiesto skresleného čísla.<\/p>", "trapHtml": "<p>Spoľahnúť sa na výpis <code>getobjval<\/code> bez kontroly stavu <code>getprobstat<\/code> a brať nulu ako „nulovú dĺžku cesty“ namiesto neprípustného grafu.<\/p>", "answer": "A", "options": [{"key": "A", "html": "Lebo po odstránení kritickej hrany (napr. jedinej vstupnej alebo výstupnej cesty) môže prestať existovať cesta do cieľa (<code>XPRS_INF<\/code>) a <code>getobjval<\/code> bez kontroly nemá platný význam."}, {"key": "B", "html": "Lebo bez <code>getprobstat<\/code> Mosel nevie spočítať funkciu <code>sum<\/code>."}, {"key": "C", "html": "Lebo odoberaním hrán sa úloha automaticky zmení na maximalizačnú."}, {"key": "D", "html": "Lebo funkcia <code>getobjval<\/code> vracia vždy <code>0<\/code>, ak sa použila <code>exists(...)<\/code>."}], "multi": false, "shuffleOptions": true}, {"id": "Q67", "area": "CIT", "areaName": "8. Analýza citlivosti", "origin": "exercise_theory", "originLabel": "Z cvičenia / prednášky", "tier": "B", "tierLabel": "Režim B (Rozšírené)", "isMain": false, "optional": false, "archived": false, "type": "1-R", "title": "Cv06 Výrobky — prahová cena V3 pre vstup do optimálneho programu", "source": "cv06 / Cv06_Vyrobky_citlivost.mos (overené v Mosel)", "promptHtml": "<p>V modeli chemického závodu (<code>Cv06_Vyrobky_citlivost.mos<\/code>) sa pri odbytovej cene <code>V3 = 1000 €<\/code> výrobok <code>V3<\/code> vôbec nevyrába (<code>getsol(v3) = 0<\/code>), pretože surovina je plne obsadená výrobou <code>V4<\/code> (s polotovarmi <code>V1, V2<\/code>) za odbyt <code>600 000 €<\/code>. V cykle zvyšujeme celočíselnú cenu <code>cena3<\/code> od <code>1000<\/code> po <code>1 €<\/code>, až kým <code>getsol(v3) &gt; 0<\/code>. Od akej <strong>najmenšej celočíselnej<\/strong> ceny <code>cena3<\/code> [€] sa oplatí začať vyrábať <code>V3<\/code>?<\/p>", "explanationHtml": "<p>1 t výrobku <code>V4<\/code> vyžaduje <code>2 t<\/code> <code>V2<\/code> a celkovo <code>2 t<\/code> <code>V1<\/code> (1 t priamo a <code>0.5*2 = 1 t<\/code> do <code>V2<\/code>), teda <code>2*2 + 1.5*2 = 7 t<\/code> suroviny a prinesie <code>3000 €<\/code> -&gt; tieňová hodnota suroviny je <code>3000 / 7 = 428.571 €/t<\/code>. 1 t výrobku <code>V3<\/code> spotrebuje priamo <code>2 t<\/code> suroviny a potrebuje <code>0.5 t<\/code> <code>V2<\/code> (čo vyžaduje <code>0.25 t<\/code> <code>V1<\/code>), čiže spolu <code>2 + 1.5*0.5 + 2*0.25 = 3.25 t<\/code> suroviny. Prah vstupu do bázy je <code>3.25 * (3000 / 7) = 9750 / 7 = 1392.86 €<\/code>, takže pri celočíselnom krokovaní po 1 € vstúpi <code>V3<\/code> do výroby pri cene <strong>1393 €<\/strong> (<code>V3 = 430.77 t<\/code>).<\/p>", "trapHtml": "<p>Myslieť si, že stačí zvýšiť cenu <code>V3<\/code> o pár eur nad <code>1000 €<\/code> — treba prekonať výnosnosť <code>V4<\/code> cez zdieľanú surovinu a polotovar <code>V2<\/code>, teda až nad <code>1392.86 €<\/code>!<\/p>", "answer": "1393", "formatHint": "1 riadok (celé číslo v €)", "equivalents": ["1393"]}, {"id": "Q68", "area": "CIT", "areaName": "8. Analýza citlivosti", "origin": "exercise_theory", "originLabel": "Z cvičenia / prednášky", "tier": "A", "tierLabel": "Režim A (TEST 1)", "isMain": false, "optional": false, "archived": false, "type": "1-R", "title": "Výpočet getslack a getact v modeli chemického závodu", "source": "cv06 / Cv06_Vyrobky_citlivost.mos (overené v Mosel)", "promptHtml": "<p>V modeli chemického závodu znejú kapacitné podmienky: <code>zariadenie := 1.5*v1 + 2*v3 + 2.5*v4 &lt;= 1200<\/code> <code>surovina   := 2*v1 + 1.5*v2 + 2*v3 &lt;= 1400<\/code> V optimálnom riešení je <code>v1 = 400<\/code>, <code>v2 = 400<\/code>, <code>v3 = 0<\/code>, <code>v4 = 200<\/code>. Aké čísla vypíšu funkcie <code>getslack(zariadenie)<\/code> a <code>getslack(surovina)<\/code>?<\/p>", "explanationHtml": "<p><code>getact(zariadenie) = 1.5*400 + 2*0 + 2.5*200 = 600 + 500 = 1100<\/code>, teda <code>getslack(zariadenie) = 1200 - 1100 = 100 hod<\/code>. <code>getact(surovina) = 2*400 + 1.5*400 + 0 = 800 + 600 = 1400<\/code>, teda <code>getslack(surovina) = 1400 - 1400 = 0 t<\/code>.<\/p>", "trapHtml": "<p>Zameniť si <code>getact<\/code> (skutočne spotrebované množstvo <code>1100<\/code>) s <code>getslack<\/code> (nevyužitá rezerva <code>100<\/code>).<\/p>", "answer": "100; 0", "formatHint": "1 riadok v tvare: `getslack_zariadenie; getslack_surovina` (celé čísla)", "equivalents": ["100; 0", "100;0"]}, {"id": "Q69", "area": "CIT", "areaName": "8. Analýza citlivosti", "origin": "exercise_theory", "originLabel": "Z cvičenia / prednášky", "tier": "A", "tierLabel": "Režim A (TEST 1)", "isMain": false, "optional": false, "archived": false, "type": "MCQ", "title": "Ekonomický význam rezervy getslack > 0 vs. getslack = 0", "source": "cv06 / Cv06_Vyrobky_citlivost.mos, MO_05", "promptHtml": "<p>Pri výsledkoch z <code>Q68<\/code> (<code>getslack(zariadenie) = 100<\/code>, <code>getslack(surovina) = 0<\/code>) ponúkne externý dodávateľ závodu navýšiť hodinovú kapacitu <strong>zariadenia<\/strong> o ďalších <code>+200<\/code> hodín (z <code>1200<\/code> na <code>1400 hod<\/code>) za poplatok <code>5000 €<\/code>. Oplatí sa túto ponuku prijať a aký bude nový maximálny odbyt?<\/p>", "explanationHtml": "<p>Keďže <code>getslack(zariadenie) = 100 &gt; 0<\/code>, závod už teraz nevyužíva 100 hodín zariadenia (<code>tieňová cena = 0<\/code>). Výrobu brzdí jedine <code>surovina<\/code> (<code>getslack = 0<\/code>). Rozšírenie neaktívneho zdroja zisk nezvýši.<\/p>", "trapHtml": "<p>Zapamätať si mechanicky „viac zdrojov = väčší zisk“ bez kontroly, ktorý zdroj má <code>slack = 0<\/code>.<\/p>", "answer": "A", "options": [{"key": "A", "html": "Neoplatí sa; optimálny odbyt ostane nezmenený na <code>600 000 €<\/code>, lebo zariadenie nie je úzkym profilom."}, {"key": "B", "html": "Oplatí sa; každá hodina zariadenia pridá <code>500 €<\/code> odbytu."}, {"key": "C", "html": "Úloha sa tým zmení na neprípustnú."}, {"key": "D", "html": "Výroba <code>V4<\/code> sa zdvojnásobí."}], "multi": false, "shuffleOptions": true}, {"id": "Q70", "area": "CIT", "areaName": "8. Analýza citlivosti", "origin": "exercise_theory", "originLabel": "Z cvičenia / prednášky", "tier": "B", "tierLabel": "Režim B (Rozšírené)", "isMain": false, "optional": false, "archived": false, "type": "MCQ", "title": "Citlivosť na zmenu koeficienta účelovej funkcie (Chips & Frenchfries)", "source": "MO_05 (s. 209–216 Chips & Frenchfries — overené v Mosel)", "promptHtml": "<p>Firma maximalizuje zisk <code>TPro = c1*X1 + 50*X2<\/code> pri obmedzeniach zemiakov <code>2*X1 + 1.5*X2 &lt;= 100<\/code> a oleja <code>0.4*X1 + 0.2*X2 &lt;= 16<\/code>. Pri pôvodnej cene <code>c1 = 80<\/code> leží optimum v priesečníku oboch priamok <code>&lt;20, 40&gt;<\/code> (<code>TPro = 3600<\/code>). Pri postupnom znižovaní ceny <code>c1<\/code> (<code>80, 78, ..., 66<\/code>), pri akej hodnote zlomu sa zmení optimálny bod na <code>&lt;0, 66.67&gt;<\/code>?<\/p>", "explanationHtml": "<p>Sklon obmedzenia zemiakov je <code>-2/1.5 = -4/3<\/code>, sklon obmedzenia oleja <code>-0.4/0.2 = -2<\/code>. Aby ostal optimálnym priesečník <code>&lt;20, 40&gt;<\/code>, musí smernica zisku <code>-c1/50<\/code> ležať medzi <code>-2<\/code> a <code>-4/3<\/code>, teda <code>c1 in [50 * 4/3, 100] = [66.67, 100]<\/code>. Pri <code>c1 = 68<\/code> ostáva <code>&lt;20, 40&gt;<\/code> (<code>3360<\/code>), pri <code>c1 = 66<\/code> skočí na <code>&lt;0, 66.67&gt;<\/code> (<code>3333.33<\/code>).<\/p>", "trapHtml": "<p>Predpokladať, že zmena nastane pri rovnosti koeficientov <code>c1 = c2 = 50<\/code> (zabudnutie na rozdielne spotreby surovín <code>2<\/code> vs <code>1.5<\/code>!).<\/p>", "answer": "B", "options": [{"key": "A", "html": "Hneď pri poklese pod <code>79<\/code>, lebo obe obmedzenia sú aktívne."}, {"key": "B", "html": "Pri poklese pod <code>66.67<\/code> (<code>= 50 * 2 / 1.5<\/code>), kedy sa sklon priamky účelovej funkcie vyrovná so sklonom väzby zemiakov."}, {"key": "C", "html": "Až pri poklese na <code>50<\/code>, kedy sa <code>c1<\/code> vyrovná s <code>c2<\/code>."}, {"key": "D", "html": "Optimálny vrchol <code>&lt;20, 40&gt;<\/code> sa nikdy nezmení, mení sa iba výška zisku."}], "multi": false, "shuffleOptions": true}, {"id": "Q71", "area": "CIT", "areaName": "8. Analýza citlivosti", "origin": "exercise_theory", "originLabel": "Z cvičenia / prednášky", "tier": "B", "tierLabel": "Režim B (Rozšírené)", "isMain": false, "optional": false, "archived": false, "type": "1-R", "title": "Vplyv poklesu pravej strany zdroja mimo oblasť stability (Chips)", "source": "MO_05 (s. 217–223 Chips & Frenchfries — overené v Mosel)", "promptHtml": "<p>V úlohe z <code>Q70<\/code> (<code>max 80*X1 + 50*X2<\/code>; <code>2*X1 + 1.5*X2 &lt;= Pot<\/code>; <code>0.4*X1 + 0.2*X2 &lt;= 16<\/code>) postupne znižujeme dostupnosť zemiakov <code>Pot<\/code> zo <code>100 kg<\/code>: pri <code>Pot = 100<\/code> je optimum <code>&lt;20, 40&gt;<\/code> (<code>TPro = 3600<\/code>), pri <code>Pot = 80<\/code> sa práve zastaví výroba <code>X2<\/code>: <code>&lt;40, 0&gt;<\/code> (<code>TPro = 3200<\/code>). Ak <code>Pot<\/code> klesne ďalej na <strong>70 kg<\/strong>, aký bude nový optimálny zisk <code>TPro<\/code> a rezerva oleja (<code>getslack<\/code>)?<\/p>", "explanationHtml": "<p>Pre <code>Pot &lt; 80<\/code> sa úzky profil oleja stane neaktívnym (všetkých <code>70 kg<\/code> zemiakov sa vloží do ziskovejšieho <code>X1<\/code>: <code>X1 = 70 / 2 = 35<\/code>, <code>X2 = 0<\/code>). Nový zisk je <code>80 * 35 = 2800<\/code>. Spotreba oleja je <code>0.4 * 35 = 14 &lt;= 16<\/code>, takže ostane nevyužitá rezerva <code>slack = 16 - 14 = 2<\/code>.<\/p>", "trapHtml": "<p>Lineárne extrapolovať pokles zisku rovnakým sklonom <code>-20/kg<\/code> ako v intervale <code>[80, 100]<\/code> (<code>3600 - 30*20 = 3000<\/code> -&gt; nesprávne, lebo pri <code>Pot = 80<\/code> nastal zlom bázy a sklon skočil na <code>-40/kg<\/code>!).<\/p>", "answer": "2800; 2", "formatHint": "1 riadok v tvare: `zisk_70; slack_oleja_70`", "equivalents": ["2800; 2", "2800;2"]}, {"id": "Q72", "area": "CIT", "areaName": "8. Analýza citlivosti", "origin": "exercise_theory", "originLabel": "Z cvičenia / prednášky", "tier": "B", "tierLabel": "Režim B (Rozšírené)", "isMain": false, "optional": false, "archived": false, "type": "MCQ", "title": "Správne použitie pomenovaných podmienok v cykle analýzy citlivosti", "source": "ModaOp7_citlivost1.mos, cv06", "promptHtml": "<p>Pri písaní cyklu citlivosti v Moseli (<code>forall(k in 1..20) do ... end-do<\/code>), v ktorom meníme pravú stranu kapacity suroviny <code>b := 100 - 2*k<\/code>, prečo musíme zapísať <code>surovina := 2*v1 + 1.5*v2 &lt;= b<\/code> namiesto nepomenovaného <code>2*v1 + 1.5*v2 &lt;= b<\/code>?<\/p>", "explanationHtml": "<p>V Moseli identifikátor + <code>:=<\/code> prepisuje existujúci objekt <code>linctr<\/code>, takže model má vždy iba aktuálnu verziu obmedzenia. Anonymný riadok bez <code>:=<\/code> sa pridá natrvalo do matice problému (pri rastúcom <code>b<\/code> by novú voľnejšiu hranicu zablokovala staršia prísnejšia podmienka!).<\/p>", "trapHtml": "<p>Klasická chyba na cvičení: cyklus bez mena podmienky sa pri zväčšovaní <code>b<\/code> zasekne na hodnote z <code>k = 1<\/code>, pričom student nevie prečo.<\/p>", "answer": "A", "options": [{"key": "A", "html": "Nepomenovaná podmienka by v každej iterácii cyklu <strong>pridala novú dodatočnú podmienku<\/strong>, takže by platila vždy len najprísnejšia z predošlých; priradenie <code>:=<\/code> rovnakému názvu starú podmienku <strong>prepíše<\/strong>."}, {"key": "B", "html": "Nepomenovanú podmienku vôbec nemožno zapísať v jazyku Mosel."}, {"key": "C", "html": "Pomenovanie podmienky automaticky zmení <code>minimize<\/code> na <code>maximize<\/code>."}, {"key": "D", "html": "Funkcia <code>maximize<\/code> akceptuje iba podmienky s prefixom <code>s_<\/code>."}], "multi": false, "shuffleOptions": true}, {"id": "Q73", "area": "SIM", "areaName": "9. Simplex a teória lineárneho programovania", "origin": "exercise_theory", "originLabel": "Z cvičenia / prednášky", "tier": "A", "tierLabel": "Režim A (TEST 1)", "isMain": false, "optional": false, "archived": false, "type": "MCQ", "title": "Geometrická vlastnosť množiny prípustných riešení LP", "source": "MO_01, MO_03 (s. 99–115)", "promptHtml": "<p>Akú geometrickú vlastnosť má <strong>každá<\/strong> neprázdna množina prípustných riešení ľubovoľnej úlohy spojitého lineárneho programovania?<\/p>", "explanationHtml": "<p>Každá lineárna rovnica aj nerovnica definuje konvexnú polrovinu/nadrovinu a prienik ľubovoľného počtu konvexných množín je opäť konvexná množina.<\/p>", "trapHtml": "<p>Považovať množinu prípustných riešení vždy za <em>ohraničenú<\/em> — napr. <code>x &gt;= 0, y &gt;= 0, x + y &gt;= 5<\/code> je konvexná, no neohraničená.<\/p>", "answer": "B", "options": [{"key": "A", "html": "Je vždy ohraničená a tvorí kruh alebo elipsu."}, {"key": "B", "html": "Je vždy konvexná (prienik polrovín / nadrovín)."}, {"key": "C", "html": "Má vždy konečný počet bodov."}, {"key": "D", "html": "Je vždy neohraničená."}], "multi": false, "shuffleOptions": true}, {"id": "Q74", "area": "SIM", "areaName": "9. Simplex a teória lineárneho programovania", "origin": "exercise_theory", "originLabel": "Z cvičenia / prednášky", "tier": "A", "tierLabel": "Režim A (TEST 1)", "isMain": false, "optional": false, "archived": false, "type": "MCQ", "title": "Možný počet optimálnych riešení v úlohe LP", "source": "MO_03, Zapocty_dokopy (P90–P95)", "promptHtml": "<p>Koľko rôznych optimálnych riešení môže mať úloha spojitého lineárneho programovania?<\/p>", "explanationHtml": "<p>Ak majú dva rôzne vrcholy <code>x*<\/code> a <code>y*<\/code> rovnakú optimálnu hodnotu účelovej funkcie, každá ich konvexná kombinácia <code>t*x* + (1-t)*y*<\/code> pre <code>t in [0, 1]<\/code> je tiež prípustná a má rovnakú optimálnu hodnotu -&gt; vzniká nekonečne veľa riešení.<\/p>", "trapHtml": "<p>Odpovedať „najviac dve“ alebo „1“ — pri rovnomernosti účelovej funkcie s okrajovou stenou leží optimum na celej hrane (<code>∞<\/code> riešení).<\/p>", "answer": "B", "options": [{"key": "A", "html": "Iba <code>0<\/code> alebo <code>1<\/code>."}, {"key": "B", "html": "<code>0<\/code>, <code>1<\/code> alebo <code>nekonečne veľa<\/code> (nikdy však presne <code>2<\/code> alebo <code>3<\/code>)."}, {"key": "C", "html": "Toľko, koľko má premenných."}, {"key": "D", "html": "Vždy práve <code>1<\/code>."}], "multi": false, "shuffleOptions": true}, {"id": "Q75", "area": "SIM", "areaName": "9. Simplex a teória lineárneho programovania", "origin": "adapted_moodle", "originLabel": "Upravená Moodle", "tier": "A", "tierLabel": "Režim A (TEST 1)", "isMain": false, "optional": false, "archived": true, "type": "1-R", "title": "Grafické 2D LP s nekonečne veľa optimálnymi riešeniami", "source": "Archív Moodle (Model3.JPG)", "promptHtml": "<p>Je daná úloha spojitého LP: <code>max f(x, y) = x + y<\/code> za podmienok <code>x + y &lt;= 5<\/code>, <code>x &gt;= 0<\/code>, <code>y &gt;= 0<\/code>. Uveďte počet optimálnych riešení (<code>0<\/code>, <code>1<\/code> alebo <code>nekonečne veľa<\/code>) a optimálnu hodnotu účelovej funkcie <code>max f<\/code>.<\/p>", "explanationHtml": "<p>Hladiny účelovej funkcie <code>x + y = c<\/code> sú presne rovnobežné s obmedzujúcou priamkou <code>x + y = 5<\/code>. Maximum <code>5<\/code> dosahuje každý bod na celej úsečke spájajúcej vrcholy <code>(0, 5)<\/code> a <code>(5, 0)<\/code>.<\/p>", "trapHtml": "<p>Uvidieť rohy <code>(0, 5)<\/code> a <code>(5, 0)<\/code> a mylne napísať <code>2<\/code> optimálne riešenia namiesto <code>nekonečne veľa<\/code>!<\/p>", "answer": "nekonečne veľa; 5", "formatHint": "1 riadok v tvare: `pocet_rieseni; max_f`", "equivalents": ["nekonečne veľa; 5", "nekonecne vela; 5", "inf; 5"]}, {"id": "Q76", "area": "SIM", "areaName": "9. Simplex a teória lineárneho programovania", "origin": "verbatim_moodle", "originLabel": "Doslovne z Moodle", "tier": "A", "tierLabel": "Režim A (TEST 1)", "isMain": true, "optional": false, "archived": true, "type": "MCQ", "title": "Algoritmus simplexovej metódy pri svojej práci vždy", "source": "Archív Moodle (Zapocty_dokopy P5); porov. MO_03", "promptHtml": "<p>Algoritmus simplexovej metódy pri svojej práci vždy:<\/p>", "explanationHtml": "<p>Základná veta LP zaručuje, že ak existuje konečné optimálne riešenie, leží aspoň v jednom krajnom bode (vrchole) konvexného polyédra. Simplexová metóda postupuje od aktuálneho krajného bodu po hranách k susednému krajnému bodu, ktorý nezhoršuje účelovú funkciu.<\/p>", "trapHtml": "<p>Simplex neprehľadáva všetky krajné, hraničné ani vnútorné prípustné body (to by bolo exponenciálne alebo nekonečné).<\/p>", "answer": "B", "options": [{"key": "A", "html": "Prehľadáva všetky krajné body množiny prípustných riešení úlohy lineárneho programovania."}, {"key": "B", "html": "Prehľadáva krajné body susedné k aktuálnemu riešeniu a prechádza k jednému z týchto bodov, ktorý nemá účelovú funkciu horšiu než aktuálne riešenie."}, {"key": "C", "html": "Prehľadáva všetky prípustné riešenia úlohy lineárneho programovania."}, {"key": "D", "html": "Prehľadáva všetky hraničné body množiny prípustných riešení úlohy lineárneho programovania."}], "multi": false, "shuffleOptions": true}, {"id": "Q77", "area": "SIM", "areaName": "9. Simplex a teória lineárneho programovania", "origin": "exercise_theory", "originLabel": "Z cvičenia / prednášky", "tier": "A", "tierLabel": "Režim A (TEST 1)", "isMain": false, "optional": false, "archived": false, "type": "MCQ", "title": "Rozdiel medzi XPRS_INF (neprípustná) a XPRS_UNB (neohraničená)", "source": "cv02 / infeasibleProblem.mos, unboundedProblem.mos, MO_03", "promptHtml": "<p>Čo vyjadrujú stavy riešiča <code>XPRS_INF<\/code> a <code>XPRS_UNB<\/code>, ktoré môže vrátiť funkcia <code>getprobstat<\/code> po optimalizácii?<\/p>", "explanationHtml": "<p><code>INF<\/code> (<em>infeasible<\/em>) znamená protirečivé podmienky bez jediného prípustného bodu (<code>∅<\/code>). <code>UNB<\/code> (<em>unbounded<\/em>) znamená, že existuje lúč prípustných bodov, po ktorom sa dá účelová funkcia donekonečna zlepšovať.<\/p>", "trapHtml": "<p>Najčastejšia zámena na teoretických otázkach v Moodle: pri otázke „nemá riešenie, lebo zlyhali obmedzenia“ dať <code>XPRS_UNB<\/code> miesto <code>XPRS_INF<\/code>.<\/p>", "answer": "B", "options": [{"key": "A", "html": "<code>XPRS_INF<\/code> = úloha má nekonečne veľa optimálnych riešení; <code>XPRS_UNB<\/code> = úloha nemá riešenie."}, {"key": "B", "html": "<code>XPRS_INF<\/code> = množina prípustných riešení je prázdna (neprípustná); <code>XPRS_UNB<\/code> = množina prípustných riešení je neprázdna a účelová funkcia rastie/klesá do nekonečna (neohraničená)."}, {"key": "C", "html": "Oba stavy znamenajú chybu syntaxe v zdrojovom kóde Mosel."}, {"key": "D", "html": "<code>XPRS_UNB<\/code> nastáva vždy, keď sme zabudli zadať znamienko <code>=<\/code> namiesto <code>&lt;=<\/code>."}], "multi": false, "shuffleOptions": true}, {"id": "Q78", "area": "SIM", "areaName": "9. Simplex a teória lineárneho programovania", "origin": "exercise_theory", "originLabel": "Z cvičenia / prednášky", "tier": "A", "tierLabel": "Režim A (TEST 1)", "isMain": false, "optional": false, "archived": false, "type": "MCQ", "title": "Diagnostika konkrétneho 2D modelu ako neohraničeného (XPRS_UNB)", "source": "cv02 / Modely / Ukážky infeasible a unbounded / unboundedProblem.mos", "promptHtml": "<p>Majme 2D model: <code>max 2*x + 3*y<\/code> s podmienkami <code>-x + y &lt;= 4<\/code>, <code>x - 2*y &lt;= 6<\/code>, <code>x &gt;= 0<\/code>, <code>y &gt;= 0<\/code>. Aký stav vráti riešič Xpress a prečo?<\/p>", "explanationHtml": "<p>Nezápornosť ohraničuje priestor iba zdola (<code>0<\/code>), smerom doprava a hore tvoria priamky otvorený uhol. Preto možno obe premenné zvyšovať neobmedzene a zisk nemá konečné maximum (<code>XPRS_UNB<\/code>).<\/p>", "trapHtml": "<p>Predpokladať, že pre každú maximalizáciu stačí mať aspoň 2 nerovnice <code>&lt;=<\/code> na uzavretie mnohouholníka — záporné koeficienty (<code>-x<\/code>, <code>-2y<\/code>) menia orientáciu polrovín!<\/p>", "answer": "C", "options": [{"key": "A", "html": "<code>XPRS_OPT<\/code>, optimum je v bode <code>(10, 14)<\/code>."}, {"key": "B", "html": "<code>XPRS_INF<\/code>, lebo <code>-x + y &lt;= 4<\/code> a <code>x - 2*y &lt;= 6<\/code> sa nepretínajú."}, {"key": "C", "html": "<code>XPRS_UNB<\/code>, lebo po polpriamke <code>x = y = t<\/code> (<code>t -&gt; +∞<\/code>) sú obe podmienky sp
