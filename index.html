          if (Object.keys(right.v).length !== 0 || Math.abs(right.c) < 1e-12) return null;
          left = linScale(left, 1 / right.c);
        }
      }
      return left;
    }
    function parseF() {
      if (pos < s.length && (s[pos] === "+" || s[pos] === "-")) {
        const sign = s[pos++] === "-" ? -1 : 1;
        const inner = parseF();
        return inner ? linScale(inner, sign) : null;
      }
      if (s[pos] === "(") {
        pos++;
        const inner = parseE();
        if (!inner || s[pos] !== ")") return null;
        pos++;
        return inner;
      }
      const rem = s.slice(pos);
      const numM = /^\d+(?:\.\d+)?/.exec(rem);
      if (numM) {
        pos += numM[0].length;
        return { c: parseFloat(numM[0]), v: {} };
      }
      const idM = /^[a-z_][a-z0-9_]*(?:\([^()]+\))?/.exec(rem);
      if (idM) {
        const rawTok = idM[0];
        const base = rawTok.split("(")[0];
        if (MOSEL_RESERVED_WORDS.has(base)) return null;
        pos += rawTok.length;
        return { c: 0, v: { [canonicalVarName(rawTok)]: 1 } };
      }
      return null;
    }
    const res = parseE();
    return (res && pos === s.length) ? res : null;
  }

  function linearExprsExactMatch(uRaw, cRaw) {
    const uF = parseLinearForm(uRaw);
    const cF = parseLinearForm(cRaw);
    if (!uF || !cF) return false;
    const keys = [...new Set([...Object.keys(uF.v), ...Object.keys(cF.v)])];
    if (!keys.length) return false;
    if (Math.abs(uF.c - cF.c) > 1e-6) return false;
    return keys.every(k => Math.abs((uF.v[k] || 0) - (cF.v[k] || 0)) < 1e-6);
  }

  function linearRelationsMatch(uRel, cRel) {
    const uIsEq = uRel.op === "=";
    const cIsEq = cRel.op === "=";
    if (uIsEq !== cIsEq) return false;

    const uL = parseLinearForm(uRel.lhs), uR = parseLinearForm(uRel.rhs);
    const cL = parseLinearForm(cRel.lhs), cR = parseLinearForm(cRel.rhs);
    if (!uL || !uR || !cL || !cR) return false;

    const uF = uRel.op === ">=" ? linAdd(uR, uL, -1) : linAdd(uL, uR, -1);
    const cF = cRel.op === ">=" ? linAdd(cR, cL, -1) : linAdd(cL, cR, -1);

    const keys = [...new Set([...Object.keys(uF.v), ...Object.keys(cF.v)])].sort();
    if (!keys.length) return false;

    const uVec = [...keys.map(k => uF.v[k] || 0), uF.c];
    const cVec = [...keys.map(k => cF.v[k] || 0), cF.c];
    const uNorm = Math.hypot(...uVec);
    const cNorm = Math.hypot(...cVec);
    if (uNorm < 1e-12 || cNorm < 1e-12) return false;

    const normalizeUnit = (vec, norm, allowNegate) => {
      const unit = vec.map(x => x / norm);
      if (allowNegate) {
        const firstNz = unit.find(x => Math.abs(x) > 1e-9);
        if (firstNz && firstNz < 0) return unit.map(x => -x);
      }
      return unit;
    };
    const uUnit = normalizeUnit(uVec, uNorm, uIsEq);
    const cUnit = normalizeUnit(cVec, cNorm, cIsEq);
    return uUnit.every((val, i) => Math.abs(val - cUnit[i]) < 1e-6);
  }

  function unwrapBalancedCall(s, fnName) {
    const prefix = fnName + "(";
    if (!s.startsWith(prefix) || !s.endsWith(")")) return null;
    const inner = s.slice(fnName.length);
    return unwrapOuterParens(inner) !== inner ? inner.slice(1, -1) : null;
  }

  const OBJ_GROUPS = [
    ["min", "minimize"],
    ["max", "maximize"]
  ];

  function extractObjBody(s, fns) {
    for (const fn of fns) {
      const unwrapped = unwrapBalancedCall(s, fn);
      if (unwrapped !== null) return unwrapped;
      if (s.startsWith(fn + " ")) return s.slice(fn.length + 1).trim();
    }
    return null;
  }

  function expandForallSegments(rawStr) {
    const parts = String(rawStr || "").replace(/;+\s*$/g, "").split(";").map(s => s.trim()).filter(Boolean);
    const out = [];
    for (const p of parts) {
      const ns = unwrapOuterParens(normSeg(p));
      const fm = /^forall\(([a-z][a-z0-9_]*)\s+in\s+(-?\d+)\s*\.\.\s*(-?\d+)\)(.+)$/i.exec(ns);
      if (fm) {
        const idxName = fm[1];
        const lo = parseInt(fm[2], 10);
        const hi = parseInt(fm[3], 10);
        const body = unwrapOuterParens(fm[4].trim());
        if (Number.isFinite(lo) && Number.isFinite(hi) && hi >= lo && hi - lo <= 15 && body) {
          const idxRe = new RegExp(`\\b${idxName}\\b`, "g");
          for (let k = lo; k <= hi; k++) {
            out.push(body.replace(idxRe, String(k)));
          }
          continue;
        }
      }
      out.push(p);
    }
    return out;
  }

  function parseMultiSet(val) {
    return String(val || "")
      .split(",")
      .map(s => s.trim().toUpperCase())
      .filter(Boolean)
      .sort()
      .join(",");
  }

  function segmentsMatch(uRaw, cRaw) {
    const u = unwrapOuterParens(normSeg(uRaw));
    const c = unwrapOuterParens(normSeg(cRaw));
    if (!u || !c) return false;
    if (u === c) return true;

    const uNum = evalPureArithmetic(u);
    const cNum = evalPureArithmetic(c);
    if (uNum !== null && cNum !== null && Math.abs(uNum - cNum) < 1e-6) return true;

    if (linearExprsExactMatch(u, c)) return true;

    for (const grp of OBJ_GROUPS) {
      const uIn = extractObjBody(u, grp);
      const cIn = extractObjBody(c, grp);
      if (uIn && cIn && (uIn === cIn || linearExprsExactMatch(uIn, cIn))) return true;
    }

    const uRel = splitTopLevelRelation(u);
    const cRel = splitTopLevelRelation(c);
    if (uRel && cRel) {
      const flipOp = { "=": "=", "<=": ">=", ">=": "<=" };
      if (uRel.op === cRel.op) {
        if (segmentsMatch(uRel.lhs, cRel.lhs) && segmentsMatch(uRel.rhs, cRel.rhs)) return true;
      }
      if (flipOp[uRel.op] === cRel.op) {
        if (segmentsMatch(uRel.lhs, cRel.rhs) && segmentsMatch(uRel.rhs, cRel.lhs)) return true;
      }
      if (linearRelationsMatch(uRel, cRel)) return true;
    }
    return false;
  }

  function canMatchRelationBijection(uParts, cParts) {
    const n = uParts.length;
    const used = new Array(n).fill(false);
    function backtrack(i) {
      if (i === n) return true;
      for (let j = 0; j < n; j++) {
        if (!used[j] && segmentsMatch(uParts[i], cParts[j])) {
          used[j] = true;
          if (backtrack(i + 1)) return true;
          used[j] = false;
        }
      }
      return false;
    }
    return backtrack(0);
  }

  function checkShortAnswer(userInput, q) {
    const raw = String(userInput || "").trim();
    if (!raw) return false;
    const candidates = [q.answer, ...(q.equivalents || [])];
    // 1. Direct full-string match
    if (candidates.some(cand => segmentsMatch(raw, cand))) return true;

    // 2. Segment-by-segment check on `;`-separated multi-part answers (expanding simple forall loops)
    const uParts = expandForallSegments(raw);
    const splitCands = candidates.map(expandForallSegments);
    for (const cParts of splitCands) {
      if (uParts.length === cParts.length && uParts.length > 1) {
        const allPosOk = uParts.every((up, idx) =>
          splitCands.some(alt => alt.length === uParts.length && segmentsMatch(up, alt[idx]))
        );
        if (allPosOk) return true;
      }
    }

    // 3. Order-independent constraint-set match ONLY when every part is a relational constraint (=, <=, >=)
    const isRelSeg = p => splitTopLevelRelation(unwrapOuterParens(normSeg(p))) !== null;
    if (uParts.length > 1 && uParts.every(isRelSeg)) {
      for (const cParts of splitCands) {
        if (cParts.length === uParts.length && cParts.every(isRelSeg)) {
          if (canMatchRelationBijection(uParts, cParts)) return true;
        }
      }
    }
    return false;
  }

  function evaluateQuestion(item, userAnswer) {
    const q = qById[item.id];
    if (item.manualOverride === true) return true;
    if (item.manualOverride === false) return false;
    if (q.type === "MCQ") {
      if (q.multi) {
        const uSet = parseMultiSet(userAnswer);
        const cSet = parseMultiSet(q.answer);
        return Boolean(uSet) && uSet === cSet;
      }
      return Boolean(userAnswer) && userAnswer === q.answer;
    }
    return checkShortAnswer(userAnswer, q);
  }

  // ---------------- Question Selection ----------------
  function shuffleArr(arr) {
    const a = [...arr];
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  function rankPool(pool, orderMode) {
    if (orderMode === "id") return [...pool];
    if (orderMode === "random") return shuffleArr(pool);
    // smart: never tried -> previously wrong -> previously correct (shuffled within tier)
    const tier0 = [], tier1 = [], tier2 = [];
    for (const q of pool) {
      const st = state.stats.results[q.id];
      if (!st) tier0.push(q);
      else if (!st.lastOk) tier1.push(q);
      else tier2.push(q);
    }
    return [...shuffleArr(tier0), ...shuffleArr(tier1), ...shuffleArr(tier2)];
  }

  function buildQuestionList() {
    const cfg = state.config;
    const typeOk = q => cfg.typeFilter === "ALL" || q.type === cfg.typeFilter;

    if (cfg.mode === "main") {
      const mainAll = BANK.questions.filter(q => q.isMain && typeOk(q));
      if (cfg.count === 10) {
        const picked = [];
        for (const code of CORE_AREA_CODES) {
          const pool = mainAll.filter(q => q.area === code);
          if (pool.length) picked.push(rankPool(pool, cfg.order)[0]);
        }
        const pickedIds = new Set(picked.map(q => q.id));
        const rest = rankPool(mainAll.filter(q => !pickedIds.has(q.id)), cfg.order);
        while (picked.length < 10 && rest.length) picked.push(rest.shift());
        return cfg.order === "random" ? shuffleArr(picked) : picked;
      }
      const allMain = rankPool(mainAll, cfg.order);
      return cfg.count > 0 ? allMain.slice(0, cfg.count) : allMain;
    }

    if (cfg.mode === "modeA") {
      if (cfg.count === 10) {
        const picked = [];
        for (const code of CORE_AREA_CODES) {
          const pool = BANK.questions.filter(q => q.area === code && q.tier === "A" && typeOk(q));
          if (pool.length) picked.push(rankPool(pool, cfg.order)[0]);
        }
        return cfg.order === "random" ? shuffleArr(picked) : picked;
      }
      const allA = rankPool(BANK.questions.filter(q => q.tier === "A" && typeOk(q)), cfg.order);
      return cfg.count > 0 ? allA.slice(0, cfg.count) : allA;
    }

    let pool = [];
    if (cfg.mode === "modeB") {
      pool = BANK.questions.filter(q => q.tier === "B" && typeOk(q));
    } else if (cfg.mode === "modeC") {
      pool = BANK.questions.filter(q => q.tier === "C" && typeOk(q));
    } else if (cfg.mode === "moodle") {
      pool = BANK.questions.filter(q => (q.origin === "verbatim_moodle" || q.origin === "adapted_moodle") && typeOk(q));
    } else if (cfg.mode === "wrong") {
      pool = BANK.questions.filter(q => state.stats.results[q.id] && !state.stats.results[q.id].lastOk && typeOk(q));
    } else {
      const areaSet = new Set(cfg.selectedAreas);
      const tierSet = new Set(cfg.selectedTiers);
      pool = BANK.questions.filter(q => areaSet.has(q.area) && tierSet.has(q.tier) && typeOk(q));
    }
    const ordered = rankPool(pool, cfg.order);
    return cfg.count > 0 ? ordered.slice(0, cfg.count) : ordered;
  }

  function startAttemptWithQuestions(questionList, customTitle, timeMinutes) {
    if (!questionList.length) return;
    stopTimer();
    const items = questionList.map(q => {
      const optKeys = q.type === "MCQ" ? q.options.map(o => o.key) : null;
      const canShuffle = q.type === "MCQ" && state.config.shuffleOptions && q.shuffleOptions !== false;
      return {
        id: q.id,
        optionOrder: optKeys ? (canShuffle ? shuffleArr(optKeys) : optKeys) : null,
        answer: "",
        flagged: false,
        checked: false,
        manualOverride: null
      };
    });
    const now = Date.now();
    state.attempt = {
      title: customTitle,
      startedAt: now,
      finishedAt: null,
      timeLimitSec: timeMinutes > 0 ? timeMinutes * 60 : 0,
      remainingSec: timeMinutes > 0 ? timeMinutes * 60 : 0,
      instantCheck: state.config.instantCheck,
      layout: state.config.layout,
      currentIndex: 0,
      status: "in_progress", // in_progress | summary | review
      reviewFilterWrong: false,
      items
    };
    state.view = "attempt";
    saveActiveAttempt();
    startTimer();
    render();
  }

  function startTimer() {
    stopTimer();
    if (!state.attempt || state.attempt.status !== "in_progress") return;
    state.timerHandle = setInterval(() => {
      if (!state.attempt || state.attempt.status === "review") {
        stopTimer();
        return;
      }
      if (state.attempt.timeLimitSec > 0) {
        state.attempt.remainingSec = Math.max(0, state.attempt.remainingSec - 1);
        updateTimerDom();
        if (state.attempt.remainingSec <= 0) {
          stopTimer();
          finalizeAttempt(true);
        }
      } else {
        updateTimerDom();
      }
    }, 1000);
  }

  function stopTimer() {
    if (state.timerHandle) {
      clearInterval(state.timerHandle);
      state.timerHandle = null;
    }
  }

  function fmtSec(totalSec) {
    const s = Math.max(0, Math.floor(totalSec));
    const h = Math.floor(s / 3600);
    const m = Math.floor((s % 3600) / 60);
    const rem = s % 60;
    const mm = String(m).padStart(2, "0");
    const ss = String(rem).padStart(2, "0");
    return h > 0 ? `${h}:${mm}:${ss}` : `${mm}:${ss}`;
  }

  function updateTimerDom() {
    const box = document.getElementById("live-timer-box");
    const val = document.getElementById("live-timer-val");
    if (!box || !val || !state.attempt) return;
    if (state.attempt.timeLimitSec > 0) {
      const rem = state.attempt.remainingSec;
      val.textContent = fmtSec(rem);
      box.classList.remove("timer-warn", "timer-crit");
      if (rem <= 60) box.classList.add("timer-crit");
      else if (rem <= 300) box.classList.add("timer-warn");
    } else {
      const elapsed = Math.floor((Date.now() - state.attempt.startedAt) / 1000);
      val.textContent = fmtSec(elapsed);
    }
  }

  function finalizeAttempt(autoExpired = false) {
    if (!state.attempt) return;
    stopTimer();
    state.attempt.status = "review";
    state.attempt.finishedAt = Date.now();
    state.attempt.autoExpired = autoExpired;

    // Record stats cleanly
    state.stats.attempts = (state.stats.attempts || 0) + 1;
    for (const item of state.attempt.items) {
      const ok = evaluateQuestion(item, item.answer);
      const prev = state.stats.results[item.id] || { seen: 0, correct: 0, lastOk: false };
      state.stats.results[item.id] = {
        seen: prev.seen + 1,
        correct: prev.correct + (ok ? 1 : 0),
        lastOk: ok
      };
    }
    saveStats();
    saveActiveAttempt();
    state.view = "review";
    closeModal();
    render();
    window.scrollTo({ top: 0, behavior: "smooth" });
  }

  // ---------------- Modals ----------------
  function openModal(htmlStr) {
    const root = document.getElementById("modal-root");
    root.innerHTML = `<div class="modal-card">${htmlStr}</div>`;
    root.classList.remove("hidden");
  }
  function closeModal() {
    const root = document.getElementById("modal-root");
    root.classList.add("hidden");
    root.innerHTML = "";
  }

  // ---------------- HTML escaping helpers ----------------
  function esc(str) {
    return String(str)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }

  function formatDateTime(ts) {
    const d = new Date(ts);
    return d.toLocaleString("sk-SK", {
      day: "2-digit", month: "2-digit", year: "numeric",
      hour: "2-digit", minute: "2-digit", second: "2-digit"
    });
  }

  // ---------------- Render Topbar ----------------
  function syncTopTabs() {
    const tabQuiz = document.getElementById("tab-quiz");
    const tabMain = document.getElementById("tab-main");
    const tabGuides = document.getElementById("tab-guides");
    const tabBrowser = document.getElementById("tab-browser");
    tabMain.classList.toggle("active", state.view === "main");
    tabGuides.classList.toggle("active", state.view === "guides");
    tabBrowser.classList.toggle("active", state.view === "browser");
    tabQuiz.classList.toggle("active", state.view !== "main" && state.view !== "guides" && state.view !== "browser");
    const sub = document.getElementById("topbar-sub");
    if (state.attempt && (state.view === "attempt" || state.view === "summary")) {
      sub.textContent = `Aktívny pokus: ${state.attempt.title} (${state.attempt.items.length} otázok)`;
    } else {
      const cntMain = BANK.questions.filter(q => q.isMain).length;
      const cntA = BANK.questions.filter(q => q.tier === "A").length;
      const cntB = BANK.questions.filter(q => q.tier === "B").length;
      const cntC = BANK.questions.filter(q => q.tier === "C").length;
      sub.textContent = `Hlavné otázky: ${cntMain} · Spolu ${BANK.questions.length} otázok (Režim A: ${cntA} · B: ${cntB} · C: ${cntC})`;
    }
  }

  // ---------------- Render Setup ----------------
  function renderSetup() {
    const el = document.getElementById("view-setup");
    const mainCount = BANK.questions.filter(q => q.isMain).length;
    const wrongCount = BANK.questions.filter(q => state.stats.results[q.id] && !state.stats.results[q.id].lastOk).length;
    const cntA = BANK.questions.filter(q => q.tier === "A").length;
    const cntB = BANK.questions.filter(q => q.tier === "B").length;
    const cntC = BANK.questions.filter(q => q.tier === "C").length;
    const moodleCount = BANK.questions.filter(q => q.origin === "verbatim_moodle" || q.origin === "adapted_moodle").length;
    const verbCount = BANK.questions.filter(q => q.origin === "verbatim_moodle").length;
    const seenCount = Object.keys(state.stats.results).length;
    const masterCount = Object.values(state.stats.results).filter(r => r.lastOk).length;
    const saved = loadSavedAttempt();

    const poolPreview = buildQuestionList();
    const areaRows = BANK.areas.map(a => {
      const total = BANK.questions.filter(q => q.area === a.code).length;

      const checked = state.config.selectedAreas.includes(a.code) ? "checked" : "";
      return `
        <label class="area-chip">
          <span><input type="checkbox" class="area-cb" value="${a.code}" ${checked}>${esc(a.name)}${a.optional ? ' <em>(voliteľné)</em>' : ''}</span>
          <span class="area-stat-pill">${mastered}/${total}</span>
        </label>`;
    }).join("");

    const tierChoices = [
      { id: "A", label: `Režim A — Hlavný TEST 1 (${cntA})` },
      { id: "B", label: `Režim B — Rozšírené precvičovanie (${cntB})` },
      { id: "C", label: `Režim C — Archív mimo TEST 1 / diskrétne (${cntC})` }
    ].map(t => `
      <label class="check-row" style="margin:0;"><input type="checkbox" class="tier-cb" value="${t.id}" ${state.config.selectedTiers.includes(t.id) ? "checked" : ""}> ${esc(t.label)}</label>
    `).join("");

    el.innerHTML = `
      ${saved && saved.status === "in_progress" ? `
        <div class="card" style="border-color: var(--moodle-blue); background: var(--moodle-blue-soft);">
          <div style="display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:0.75rem;">
            <div>
              <strong>Máš rozpracovaný test:</strong> ${esc(saved.title)}
              <div class="muted">Začaté ${formatDateTime(saved.startedAt)} · zodpovedané ${saved.items.filter(i => String(i.answer||"").trim() !== "").length} z ${saved.items.length}</div>
            </div>
            <div style="display:flex;gap:0.5rem;">
              <button type="button" class="btn btn-primary btn-sm" id="btn-resume-saved">Pokračovať v teste</button>
              <button type="button" class="btn btn-danger btn-sm" id="btn-discard-saved">Zahodiť</button>
            </div>
          </div>
        </div>` : ""}

      <div class="card">
        <h2>Vyber režim testu (ako v Moodle)</h2>
        <div class="mode-grid">
          <div class="mode-card main-mode ${state.config.mode === "main" ? "selected" : ""}" data-mode="main">
            <div class="mode-title">★ Hlavné otázky — Alfa-omega TEST 1 (${mainCount})</div>
            <div class="mode-meta">Všetky doslovne overené otázky z autentických Moodle zadaní (vrátane Skladov, CowFood, Oceliarní, Plechov, SchoolDesku a Moselu). Odporúčaná hlavná príprava na TEST 1.</div>
          </div>
          <div class="mode-card ${state.config.mode === "modeA" ? "selected" : ""}" data-mode="modeA">
            <div class="mode-title">Režim A — Všetky otázky TEST 1 (${cntA})</div>
            <div class="mode-meta">Simulácia 10 otázok / 20:00 (1 z každej z 10 oblastí spojitého LP) alebo dril celej sady A (hlavné + cvičenia).</div>
          </div>
          <div class="mode-card ${state.config.mode === "modeB" ? "selected" : ""}" data-mode="modeB">
            <div class="mode-title">Režim B — Rozšírené precvičovanie (${cntB})</div>
            <div class="mode-meta">Dlhšie výpočty optima, detailná citlivosť, rozsiahlejšie toky a programový Mosel.</div>
          </div>
          <div class="mode-card ${state.config.mode === "moodle" ? "selected" : ""}" data-mode="moodle">
            <div class="mode-title">Archív Moodle otázok (${moodleCount})</div>
            <div class="mode-meta">Overené zo starších testov (${verbCount} doslovne overených + ${moodleCount - verbCount} upravených).</div>
          </div>
          <div class="mode-card ${state.config.mode === "areas" ? "selected" : ""}" data-mode="areas">
            <div class="mode-title">Vlastný tréning (oblasti a režimy)</div>
            <div class="mode-meta">Vyber si konkrétne cvičenia, úrovne A/B/C a počet otázok zo zbierky.</div>
          </div>
          <div class="mode-card ${state.config.mode === "modeC" ? "selected" : ""}" data-mode="modeC">
            <div class="mode-title">Režim C — Archív mimo TEST 1 (${cntC})</div>
            <div class="mode-meta">Diskrétne/priraďovacie úlohy (is_binary, fixné náklady, minimálny nenulový tok).</div>
          </div>
          <div class="mode-card ${state.config.mode === "wrong" ? "selected" : ""} ${wrongCount === 0 ? "disabled-card" : ""}" data-mode="wrong">
            <div class="mode-title">Oprava chybných otázok (${wrongCount})</div>
            <div class="mode-meta">${wrongCount ? "Znovu precvičí otázky, v ktorých si naposledy zaváhal/a." : "Zatiaľ nemáš žiadne nesprávne odpovedané otázky."}</div>
          </div>
        </div>

        ${state.config.mode === "areas" ? `
          <div class="areas-picker">
            <div style="display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:0.5rem;margin-bottom:0.55rem;padding-bottom:0.55rem;border-bottom:1px solid var(--border);">
              <strong>Úrovne (režimy):</strong>
              <div style="display:flex;flex-wrap:wrap;gap:0.9rem;">${tierChoices}</div>
            </div>
            <div style="display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:0.5rem;">
              <strong>Oblasti (${state.config.selectedAreas.length} vybraných):</strong>
              <div style="display:flex;gap:0.4rem;">
                <button type="button" class="btn btn-sm" id="btn-areas-core">Jadro (1–10)</button>
                <button type="button" class="btn btn-sm" id="btn-areas-all">Všetky (1–11)</button>
                <button type="button" class="btn btn-sm" id="btn-areas-none">Zrušiť</button>
              </div>
            </div>
            <div class="area-chips">${areaRows}</div>
          </div>` : ""}

        <div class="settings-grid">
          <div class="field">
            <label for="cfg-type">Typ otázok</label>
            <select id="cfg-type">
              <option value="ALL" ${state.config.typeFilter === "ALL" ? "selected" : ""}>Všetky ([MCQ] + [1-R])</option>
              <option value="MCQ" ${state.config.typeFilter === "MCQ" ? "selected" : ""}>Len výber možností ([MCQ])</option>
              <option value="1-R" ${state.config.typeFilter === "1-R" ? "selected" : ""}>Len 1-riadková odpoveď ([1-R])</option>
            </select>
          </div>
          <div class="field">
            <label for="cfg-count">Počet otázok</label>
            <select id="cfg-count">
              <option value="5" ${state.config.count === 5 ? "selected" : ""}>5 otázok</option>
              <option value="10" ${state.config.count === 10 ? "selected" : ""}>${(state.config.mode === "main" || state.config.mode === "modeA") ? "10 otázok (simulácia TEST 1 — 1 z oblasti)" : "10 otázok"}</option>
              <option value="15" ${state.config.count === 15 ? "selected" : ""}>15 otázok</option>
              <option value="25" ${state.config.count === 25 ? "selected" : ""}>25 otázok</option>
              <option value="0" ${state.config.count === 0 ? "selected" : ""}>Všetky vo výbere</option>
            </select>
          </div>
          <div class="field">
            <label for="cfg-order">Výber a poradie</label>
            <select id="cfg-order">
              <option value="smart" ${state.config.order === "smart" ? "selected" : ""}>Preferovať neprejdené a chybné</option>
              <option value="random" ${state.config.order === "random" ? "selected" : ""}>Čisto náhodne</option>
              <option value="id" ${state.config.order === "id" ? "selected" : ""}>Podľa poradia v zbierke (H01… / Q01…)</option>
            </select>
          </div>
          <div class="field">
            <label for="cfg-time">Časový limit</label>
            <select id="cfg-time">
              <option value="20" ${state.config.timeMinutes === 20 ? "selected" : ""}>20 minút (ako ostrý Moodle)</option>
              <option value="10" ${state.config.timeMinutes === 10 ? "selected" : ""}>10 minút (rýchly šprint)</option>
              <option value="30" ${state.config.timeMinutes === 30 ? "selected" : ""}>30 minút</option>
              <option value="0" ${state.config.timeMinutes === 0 ? "selected" : ""}>Bez časového limitu</option>
            </select>
          </div>
          <div class="field">
            <label for="cfg-layout">Stránkovanie v teste</label>
            <select id="cfg-layout">
              <option value="single" ${state.config.layout === "single" ? "selected" : ""}>1 otázka na stranu (ako Moodle)</option>
              <option value="all" ${state.config.layout === "all" ? "selected" : ""}>Všetky otázky na jednej stránke</option>
            </select>
          </div>
          <div class="field">
            <label>Správanie testu</label>
            <label class="check-row"><input type="checkbox" id="cfg-shuffle" ${state.config.shuffleOptions ? "checked" : ""}> Zamiešať možnosti výberu</label>
            <label class="check-row"><input type="checkbox" id="cfg-instant" ${state.config.instantCheck ? "checked" : ""}> Okamžitá kontrola po otázke</label>
          </div>
        </div>

        <div style="display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:0.75rem;">
          <div class="muted">
            Pripravených otázok pre tento štart: <strong>${poolPreview.length}</strong>
            · Celkový pokrok: <strong>${masterCount}/${BANK.questions.length}</strong> zvládnutých (${seenCount} videných, ${state.stats.attempts} pokusov)
          </div>
          <div style="display:flex;gap:0.5rem;align-items:center;">
            ${seenCount > 0 ? `<button type="button" class="btn btn-sm btn-danger" id="btn-reset-stats">Vynulovať pokrok</button>` : ""}
            <button type="button" class="btn btn-primary" id="btn-start-test" ${poolPreview.length === 0 ? "disabled" : ""}>Spustiť pokus</button>
          </div>
        </div>
      </div>
    `;

    // Bind events
    el.querySelectorAll(".mode-card").forEach(card => {
      card.addEventListener("click", () => {
        const m = card.dataset.mode;
        if (m === "wrong" && wrongCount === 0) return;
        state.config.mode = m;
        if (m === "main" || m === "modeA") { state.config.timeMinutes = 20; state.config.count = 10; }
        else if (m === "modeB" || m === "modeC" || m === "moodle" || m === "wrong") { state.config.count = 0; state.config.timeMinutes = 0; }
        renderSetup();
      });
    });

    const bindVal = (id, fn) => {
      const node = document.getElementById(id);
      if (node) node.addEventListener("change", () => { fn(node); renderSetup(); });
    };
    bindVal("cfg-type", n => { state.config.typeFilter = n.value; });
    bindVal("cfg-count", n => { state.config.count = parseInt(n.value, 10); });
    bindVal("cfg-order", n => { state.config.order = n.value; });
    bindVal("cfg-time", n => { state.config.timeMinutes = parseInt(n.value, 10); });
    bindVal("cfg-layout", n => { state.config.layout = n.value; });
    bindVal("cfg-shuffle", n => { state.config.shuffleOptions = n.checked; });
    bindVal("cfg-instant", n => { state.config.instantCheck = n.checked; });

    el.querySelectorAll(".tier-cb").forEach(cb => {
      cb.addEventListener("change", () => {
        state.config.selectedTiers = [...el.querySelectorAll(".tier-cb:checked")].map(x => x.value);
        renderSetup();
      });
    });
    el.querySelectorAll(".area-cb").forEach(cb => {
      cb.addEventListener("change", () => {
        state.config.selectedAreas = [...el.querySelectorAll(".area-cb:checked")].map(x => x.value);
        renderSetup();
      });
    });
    const setAreas = codes => { state.config.selectedAreas = codes; renderSetup(); };
    document.getElementById("btn-areas-core")?.addEventListener("click", () => setAreas([...CORE_AREA_CODES]));
    document.getElementById("btn-areas-all")?.addEventListener("click", () => setAreas(BANK.areas.map(a => a.code)));
    document.getElementById("btn-areas-none")?.addEventListener("click", () => setAreas([]));

    document.getElementById("btn-reset-stats")?.addEventListener("click", () => {
      openModal(`
        <h3>Vynulovať uložený pokrok?</h3>
        <p class="muted">Zmaže históriu úspešnosti a zoznam chybných otázok v prehliadači. Samotné otázky zostávajú nezmenené.</p>
        <div class="modal-actions">
          <button type="button" class="btn" id="m-cancel">Zrušiť</button>
          <button type="button" class="btn btn-danger" id="m-confirm">Vynulovať</button>
        </div>
      `);
      document.getElementById("m-cancel").onclick = closeModal;
      document.getElementById("m-confirm").onclick = () => {
        state.stats = { attempts: 0, results: {} };
        saveStats();
        closeModal();
        renderSetup();
      };
    });

    document.getElementById("btn-resume-saved")?.addEventListener("click", () => {
      state.attempt = saved;
      state.view = "attempt";
      startTimer();
      render();
    });
    document.getElementById("btn-discard-saved")?.addEventListener("click", () => {
      localStorage.removeItem(STORAGE_ACTIVE_KEY);
      renderSetup();
    });

    document.getElementById("btn-start-test")?.addEventListener("click", () => {
      const list = buildQuestionList();
      const modeNames = {
        main: "★ Hlavné otázky — Alfa-omega TEST 1",
        modeA: "Režim A — Všetky otázky TEST 1",
        modeB: "Režim B — Rozšírené precvičovanie",
        moodle: "Archív Moodle otázok",
        areas: "Vlastný tréning (oblasti a režimy)",
        modeC: "Režim C — Archív mimo TEST 1",
        wrong: "Oprava chybných otázok"
      };
      startAttemptWithQuestions(list, modeNames[state.config.mode], state.config.timeMinutes);
    });
  }

  // ---------------- Question Card Builder (Attempt / Review) ----------------
  const MCQ_LETTERS = "abcdefghij".split("");

  function renderFeedbackHtml(item, q, userOk, isReview) {
    const equivsHtml = q.type === "1-R" ? `
      <div style="margin-top:0.45rem;"><strong>Kanonická odpoveď:</strong> <code>${esc(q.answer)}</code></div>
      <div style="margin-top:0.35rem;"><strong>Akceptované ekvivalenty v Moodle:</strong>
        <div class="equiv-pills">${q.equivalents.map(e => `<span class="equiv-pill">${esc(e)}</span>`).join("")}</div>
      </div>` : "";
    const overrideBtn = (q.type === "1-R" && (!userOk || item.manualOverride === true)) ? `
      <div style="margin-top:0.45rem;">
        <button type="button" class="btn btn-sm btn-override" data-qid="${q.id}">
          ${item.manualOverride === true ? "Zrušiť manuálne uznanie bodu" : "Moja odpoveď je matematicky správna — uznať bod"}
        </button>
      </div>` : "";
    const mcqAnsLine = (() => {
      if (q.type !== "MCQ") return "";
      const defaultKeys = q.options.map(o => o.key);
      const order = item.optionOrder || defaultKeys;
      const origHint = order.join("") !== defaultKeys.join("") ? ` <span class="muted">(v zbierke ${esc(q.answer)})</span>` : "";
      if (q.multi) {
        const disp = parseMultiSet(q.answer).split(",").filter(Boolean).map(k => {
          const pos = order.indexOf(k);
          return pos >= 0 ? `${MCQ_LETTERS[pos]}.` : k;
        }).join(", ");
        return `<div style="margin-bottom:0.4rem;"><strong>Správne možnosti:</strong> <strong>${esc(disp)}</strong>${origHint}</div>`;
      }
      const pos = order.indexOf(q.answer);
      const disp = pos >= 0 ? `${MCQ_LETTERS[pos]}.` : q.answer;
      return `<div style="margin-bottom:0.4rem;"><strong>Správna odpoveď:</strong> <strong>${disp}</strong>${origHint}</div>`;
    })();
    return `
      <div class="feedback-box ${userOk ? "ok" : "bad"}">
        <div class="feedback-verdict ${userOk ? "ok" : "bad"}">
          ${userOk ? "✓ Vaša odpoveď je správna (1,00 b)." : "✕ Vaša odpoveď nie je správna (0,00 b)."}
          ${q.type === "1-R" ? `<span class="muted" style="font-weight:400;"> · Váš zápis: <code>${esc(item.answer || "— bez odpovede —")}</code></span>` : ""}
        </div>
        ${mcqAnsLine}
        ${equivsHtml}
        <div><strong>Postup / zdôvodnenie:</strong> ${q.explanationHtml}</div>
        <div class="trap-note"><strong>Pozor na pascu:</strong> ${q.trapHtml}</div>
        ${overrideBtn}
      </div>`;
  }

  function renderQuestionCard(item, idx, total, mode) {
    // mode: "attempt" | "review"
    const q = qById[item.id];
    const isReview = mode === "review";
    const showFb = isReview || (state.attempt.instantCheck && item.checked);
    const isOk = showFb ? evaluateQuestion(item, item.answer) : null;
    const hasAns = String(item.answer || "").trim() !== "";

    let stateLabel = hasAns ? "Odpoveď uložená" : "Ešte nezodpovedané";
    let stateClass = "";
    if (showFb) {
      stateLabel = isOk ? "Správne (1,00 / 1,00 b)" : "Nesprávne (0,00 / 1,00 b)";
      stateClass = isOk ? "ok" : "bad";
    }

    let inputHtml = "";
    if (q.type === "MCQ") {
      const order = item.optionOrder || q.options.map(o => o.key);
      const optMap = Object.fromEntries(q.options.map(o => [o.key, o.html]));
      const isMulti = Boolean(q.multi);
      const selectedSet = isMulti ? new Set(parseMultiSet(item.answer).split(",").filter(Boolean)) : null;
      const ansSet = isMulti ? new Set(parseMultiSet(q.answer).split(",").filter(Boolean)) : null;
      const inpType = isMulti ? "checkbox" : "radio";
      const hintMulti = isMulti ? `<div class="muted" style="margin-bottom:0.45rem;">Vyberte všetky správne možnosti (viacero správnych odpovedí).</div>` : "";
      inputHtml = `${hintMulti}<div class="mcq-list" role="${isMulti ? "group" : "radiogroup"}" aria-label="Možnosti">`;
      order.forEach((origKey, oi) => {
        const selected = isMulti ? selectedSet.has(origKey) : item.answer === origKey;
        let cls = selected ? "selected" : "";
        if (showFb) {
          const isRightKey = isMulti ? ansSet.has(origKey) : origKey === q.answer;
          if (isRightKey) cls = "rev-correct";
          else if (selected && !isRightKey) cls = "rev-wrong";
        }
        inputHtml += `
          <label class="mcq-opt ${cls}">
            <input type="${inpType}" class="mcq-inp" name="q_${item.id}" value="${origKey}" ${selected ? "checked" : ""} ${isReview ? "disabled" : ""} data-idx="${idx}" data-multi="${isMulti ? "1" : "0"}">
            <span class="mcq-letter">${MCQ_LETTERS[oi]}.</span>
            <span>${optMap[origKey]}</span>
          </label>`;
      });
      inputHtml += `</div>`;
      if (!isReview && hasAns) {
        inputHtml += `<div style="margin-top:0.45rem;"><button type="button" class="btn btn-sm btn-clear-choice" data-idx="${idx}">Vymazať moju voľbu</button></div>`;
      }
    } else {
      inputHtml = `
        <div class="short-answer-box">
          <label for="inp_${item.id}">Odpoveď (1 riadok do Moodle):</label>
          <input id="inp_${item.id}" type="text" class="mono-input short-inp" data-idx="${idx}"
                 value="${esc(item.answer)}" ${isReview ? "readonly" : ""}
                 autocomplete="off" spellcheck="false" placeholder="Napíšte výsledok alebo podmienku...">
          <div class="format-hint"><strong>Formát zápisu:</strong> ${esc(q.formatHint)}</div>
        </div>`;
    }

    const checkBtnHtml = (!isReview && state.attempt.instantCheck)
      ? `<div style="margin-top:0.75rem;"><button type="button" class="btn btn-sm btn-primary btn-instant-check" data-idx="${idx}">Skontrolovať túto otázku</button></div>`
      : "";

    const fbHtml = showFb ? renderFeedbackHtml(item, q, isOk, isReview) : "";

    return `
      <article class="que" id="qcard-${idx}">
        <div class="que-info">
          <div class="que-no">Otázka ${idx + 1}</div>
          <div class="que-state ${stateClass}">${stateLabel}</div>
          <div class="muted">Bodované z 1,00</div>
          <div class="muted" style="margin-top:0.35rem;">ID: <strong>${esc(q.id)}</strong> · [${q.type}]</div>
          ${!isReview ? `
            <button type="button" class="flag-btn ${item.flagged ? "flagged" : ""}" data-idx="${idx}">
              ${item.flagged ? "⚑ Označené vlajkou" : "⚐ Označiť otázku"}
            </button>` : ""}
        </div>
        <div class="que-content">
          <div class="que-header-meta">
            <span class="q-badge">${esc(q.areaName)} · ${esc(q.title)}</span>
            <div class="q-pills">
              ${q.isMain ? `<span class="pill-tag badge-main">★ Hlavná otázka</span>` : ""}
              <span class="pill-tag tier-${q.tier}">${esc(q.tierLabel)}</span>
              <span class="pill-tag orig-${q.origin}">${esc(q.originLabel)}</span>
              <span class="q-source">Zdroj: ${esc(q.source)}</span>
            </div>
          </div>
          <div class="qtext">${q.promptHtml}</div>
          ${inputHtml}
          ${checkBtnHtml}
          ${fbHtml}
        </div>
      </article>`;
  }

  function renderSidebar(mode) {
    const att = state.attempt;
    const isReview = mode === "review";
    const tiles = att.items.map((item, idx) => {
      const answered = String(item.answer || "").trim() !== "";
      const classes = ["qnav-tile"];
      if (!isReview && att.layout === "single" && idx === att.currentIndex) classes.push("current");
      if (item.flagged) classes.push("flagged");
      if (isReview || (att.instantCheck && item.checked)) {
        classes.push(evaluateQuestion(item, item.answer) ? "rev-ok" : "rev-bad");
      } else if (answered) {
        classes.push("answered");
      }
      return `<button type="button" class="${classes.join(" ")}" data-jump="${idx}" title="Otázka ${idx + 1} (${item.id})">${idx + 1}</button>`;
    }).join("");

    const timerText = att.timeLimitSec > 0 ? fmtSec(att.remainingSec) : fmtSec(Math.floor(((att.finishedAt || Date.now()) - att.startedAt) / 1000));
    const timerLabel = att.timeLimitSec > 0 ? (isReview ? "Zostalo času" : "Zostávajúci čas") : "Uplynulý čas";

    return `
      <aside class="quiz-sidebar">
        <div class="timer-box" id="live-timer-box">
          <span class="muted" style="font-weight:600;">${timerLabel}</span>
          <span class="timer-val" id="live-timer-val">${timerText}</span>
        </div>
        <div class="card">
          <h3>Navigácia testom</h3>
          <div class="nav-grid">${tiles}</div>
          ${isReview ? `
            <button type="button" class="btn btn-primary" style="width:100%;" id="btn-rev-back">Späť na výber režimu</button>
          ` : `
            <button type="button" class="btn btn-primary" style="width:100%;" id="btn-finish-attempt">Ukončiť pokus...</button>
          `}
        </div>
      </aside>`;
  }

  // ---------------- Render Active Attempt ----------------
  function renderAttempt() {
    const el = document.getElementById("view-attempt");
    const att = state.attempt;
    const total = att.items.length;

    let cardsHtml = "";
    let pagerHtml = "";
    if (att.layout === "single") {
      const idx = att.currentIndex;
      cardsHtml = renderQuestionCard(att.items[idx], idx, total, "attempt");
      pagerHtml = `
        <div class="pager">
          <button type="button" class="btn" id="btn-prev-q" ${idx === 0 ? "disabled" : ""}>← Predošlá strana</button>
          <span class="muted">Strana ${idx + 1} z ${total}</span>
          ${idx < total - 1
            ? `<button type="button" class="btn btn-primary" id="btn-next-q">Ďalšia strana →</button>`
            : `<button type="button" class="btn btn-primary" id="btn-last-finish">Ukončiť pokus...</button>`}
        </div>`;
    } else {
      cardsHtml = att.items.map((item, idx) => renderQuestionCard(item, idx, total, "attempt")).join("");
      pagerHtml = `
        <div class="pager" style="justify-content:flex-end;">
          <button type="button" class="btn btn-primary" id="btn-last-finish">Ukončiť pokus...</button>
        </div>`;
    }

    el.innerHTML = `
      <div class="quiz-layout">
        <div>
          ${cardsHtml}
          ${pagerHtml}
        </div>
        ${renderSidebar("attempt")}
      </div>`;

    updateTimerDom();
    bindAttemptHandlers(el, "attempt");
  }

  function bindAttemptHandlers(container, mode) {
    // Radio & checkbox MCQ options
    container.querySelectorAll(".mcq-inp").forEach(inp => {
      inp.addEventListener("change", () => {
        const idx = parseInt(inp.dataset.idx, 10);
        const item = state.attempt.items[idx];
        if (inp.dataset.multi === "1") {
          const vals = [...container.querySelectorAll(`.mcq-inp[data-idx="${idx}"]:checked`)]
            .map(el => el.value)
            .sort();
          item.answer = vals.join(", ");
        } else {
          item.answer = inp.value;
        }
        saveActiveAttempt();
        renderAttempt();
      });
    });
    // Clear choice
    container.querySelectorAll(".btn-clear-choice").forEach(btn => {
      btn.addEventListener("click", () => {
        const idx = parseInt(btn.dataset.idx, 10);
        state.attempt.items[idx].answer = "";
        state.attempt.items[idx].checked = false;
        saveActiveAttempt();
        renderAttempt();
      });
    });
    // 1-R input
    container.querySelectorAll(".short-inp").forEach(inp => {
      inp.addEventListener("input", () => {
        const idx = parseInt(inp.dataset.idx, 10);
        const item = state.attempt.items[idx];
        const wasChecked = item.checked;
        const caret = inp.selectionStart;
        item.answer = inp.value;
        item.manualOverride = null;
        if (wasChecked) {
          item.checked = false;
          saveActiveAttempt();
          renderAttempt();
          const again = document.getElementById(`inp_${item.id}`);
          if (again) { again.focus(); if (caret != null) again.setSelectionRange(caret, caret); }
          return;
        }
        saveActiveAttempt();
        // Update nav tile & state text cleanly without losing focus
        const tile = container.querySelector(`.qnav-tile[data-jump="${idx}"]`);
        const st = container.querySelector(`#qcard-${idx} .que-state`);
        const filled = inp.value.trim() !== "";
        if (tile) tile.classList.toggle("answered", filled);
        if (st) st.textContent = filled ? "Odpoveď uložená" : "Ešte nezodpovedané";
      });
      inp.addEventListener("keydown", e => {
        if (e.key === "Enter") {
          e.preventDefault();
          const idx = parseInt(inp.dataset.idx, 10);
          if (state.attempt.instantCheck) {
            state.attempt.items[idx].checked = true;
            saveActiveAttempt();
            renderAttempt();
          } else if (state.attempt.layout === "single" && idx < state.attempt.items.length - 1) {
            state.attempt.currentIndex = idx + 1;
            saveActiveAttempt();
            renderAttempt();
          }
        }
      });
    });
    // Instant check & manual override during attempt
    container.querySelectorAll(".btn-instant-check").forEach(btn => {
      btn.addEventListener("click", () => {
        const idx = parseInt(btn.dataset.idx, 10);
        state.attempt.items[idx].checked = true;
        saveActiveAttempt();
        renderAttempt();
      });
    });
    container.querySelectorAll(".btn-override").forEach(btn => {
      btn.addEventListener("click", () => {
        const qid = btn.dataset.qid;
        const item = state.attempt.items.find(it => it.id === qid);
        if (!item) return;
        item.manualOverride = item.manualOverride === true ? null : true;
        saveActiveAttempt();
        renderAttempt();
      });
    });
    // Flag buttons
    container.querySelectorAll(".flag-btn").forEach(btn => {
      btn.addEventListener("click", () => {
        const idx = parseInt(btn.dataset.idx, 10);
        state.attempt.items[idx].flagged = !state.attempt.items[idx].flagged;
        saveActiveAttempt();
        renderAttempt();
      });
    });
    // Sidebar jump
    container.querySelectorAll(".qnav-tile").forEach(tile => {
      tile.addEventListener("click", () => {
        const idx = parseInt(tile.dataset.jump, 10);
        if (mode === "review") {
          document.getElementById(`qcard-${idx}`)?.scrollIntoView({ behavior: "smooth", block: "start" });
        } else if (state.attempt.layout === "single") {
          state.attempt.currentIndex = idx;
          saveActiveAttempt();
          renderAttempt();
          window.scrollTo({ top: 0, behavior: "smooth" });
        } else {
          document.getElementById(`qcard-${idx}`)?.scrollIntoView({ behavior: "smooth", block: "start" });
        }
      });
    });
    // Pagers
    document.getElementById("btn-prev-q")?.addEventListener("click", () => {
      state.attempt.currentIndex = Math.max(0, state.attempt.currentIndex - 1);
      saveActiveAttempt();
      renderAttempt();
      window.scrollTo({ top: 0, behavior: "smooth" });
    });
    document.getElementById("btn-next-q")?.addEventListener("click", () => {
      state.attempt.currentIndex = Math.min(state.attempt.items.length - 1, state.attempt.currentIndex + 1);
      saveActiveAttempt();
      renderAttempt();
      window.scrollTo({ top: 0, behavior: "smooth" });
    });
    const goSummary = () => {
      state.attempt.status = "summary";
      state.view = "summary";
      render();
      window.scrollTo({ top: 0, behavior: "smooth" });
    };
    document.getElementById("btn-finish-attempt")?.addEventListener("click", goSummary);
    document.getElementById("btn-last-finish")?.addEventListener("click", goSummary);
  }

  // ---------------- Render Summary of Attempt ----------------
  function renderSummary() {
    const el = document.getElementById("view-summary");
    const att = state.attempt;
    const unanswered = att.items.filter(i => String(i.answer || "").trim() === "").length;
    const rowsHtml = att.items.map((item, idx) => {
      const q = qById[item.id];
      const filled = String(item.answer || "").trim() !== "";
      return `
        <tr>
          <td><a href="#" class="sum-jump" data-idx="${idx}"><strong>Otázka ${idx + 1}</strong></a></td>
          <td><strong>${esc(q.id)}</strong> · ${esc(q.areaName)} <span class="muted">[${q.type}]</span></td>
          <td style="color:${filled ? "var(--ok)" : "var(--warn)"};font-weight:600;">

          <table class="moodle-summary">

          </div>

        <div class="modal-actions">
          <button type="button" class="btn" id="m-cancel">Zrušiť</button>
          <button type="button" class="btn btn-primary" id="m-confirm">Odoslať všetko a ukončiť</button>
        </div>
      `);
      document.getElementById("m-cancel").onclick = closeModal;
      document.getElementById("m-confirm").onclick = () => finalizeAttempt(false);
    };

  // ---------------- Render Review ----------------
  function renderReview() {
    const el = document.getElementById("view-review");
    const att = state.attempt;
    const total = att.items.length;
    const score = att.items.reduce((acc, it) => acc + (evaluateQuestion(it, it.answer) ? 1 : 0), 0);
    const pct = total ? Math.round((score / total) * 100) : 0;
    const duration = Math.max(0, Math.round(((att.finishedAt || Date.now()) - att.startedAt) / 1000));
    const wrongItems = att.items.filter(it => !evaluateQuestion(it, it.answer));

    // Area breakdown
    const byArea = new Map();
    for (const it of att.items) {
      const q = qById[it.id];
      const rec = byArea.get(q.areaName) || { ok: 0, total: 0 };
      rec.total++;
      if (evaluateQuestion(it, it.answer)) rec.ok++;
      byArea.set(q.areaName, rec);
    }
    const breakdownPills = [...byArea.entries()].map(([name, rec]) => {
      const cls = rec.ok === rec.total ? "var(--ok)" : (rec.ok === 0 ? "var(--bad)" : "var(--warn)");
      return `<span style="display:inline-block;padding:0.2rem 0.55rem;border:1px solid var(--border);border-radius:999px;font-size:0.82rem;margin:0.15rem 0.25rem 0.15rem 0;">${esc(name)}: <strong style="color:${cls}">${rec.ok}/${rec.total}</strong></span>`;
    }).join("");

    const shownItems = att.items
      .map((item, idx) => ({ item, idx }))
      .filter(pair => !att.reviewFilterWrong || !evaluateQuestion(pair.item, pair.item.answer));

    const cardsHtml = shownItems.length
      ? shownItems.map(({ item, idx }) => renderQuestionCard(item, idx, total, "review")).join("")
      : `<div class="card"><p style="color:var(--ok);font-weight:700;margin:0;">Všetky otázky sú správne — žiadne chyby na zobrazenie.</p></div>`;

    el.innerHTML = `
      <div class="quiz-layout">
        <div>
          <div class="card">
            <h2>${esc(att.title)} — Vyhodnotenie${att.autoExpired ? ' <span style="color:var(--warn);font-size:0.88rem;">(vypršal časový limit)</span>' : ""}</h2>
            <table class="moodle-summary">
              <tbody>
                <tr><th>Začaté</th><td>${formatDateTime(att.startedAt)}</td></tr>
                <tr><th>Stav</th><td>Dokončené</td></tr>
                <tr><th>Ukončené</th><td>${formatDateTime(att.finishedAt || Date.now())}</td></tr>
                <tr><th>Trvanie</th><td>${fmtSec(duration)}</td></tr>
                <tr><th>Body / Známka</th><td><strong style="font-size:1.1rem;color:${pct >= 60 ? "var(--ok)" : "var(--bad)"};">${score.toFixed(2).replace(".", ",")} z ${total.toFixed(2).replace(".", ",")} (${pct} %)</strong></td></tr>
                <tr><th>Podľa oblastí</th><td>${breakdownPills}</td></tr>
              </tbody>
            </table>
            <div style="display:flex;flex-wrap:wrap;gap:0.5rem;align-items:center;">
              <button type="button" class="btn btn-primary" id="btn-rev-retry">Nový rovnaký test</button>
              ${wrongItems.length > 0 ? `<button type="button" class="btn" id="btn-rev-wrong-only">Precvičiť len chybné (${wrongItems.length})</button>` : ""}
              <button type="button" class="btn" id="btn-toggle-wrong-filter">
                ${att.reviewFilterWrong ? "Zobraziť všetky otázky" : `Zobraziť len chybné (${wrongItems.length})`}
              </button>
              <button type="button" class="btn" id="btn-rev-setup">Späť na výber režimu</button>
            </div>
          </div>
          ${cardsHtml}
        </div>
        ${renderSidebar("review")}
      </div>`;

    el.querySelectorAll(".qnav-tile").forEach(tile => {
      tile.addEventListener("click", () => {
        const idx = parseInt(tile.dataset.jump, 10);
        if (att.reviewFilterWrong && evaluateQuestion(att.items[idx], att.items[idx].answer)) {
          att.reviewFilterWrong = false;
          renderReview();
        }
        document.getElementById(`qcard-${idx}`)?.scrollIntoView({ behavior: "smooth", block: "start" });
      });
    });

    el.querySelectorAll(".btn-override").forEach(btn => {
      btn.addEventListener("click", () => {
        const qid = btn.dataset.qid;
        const item = att.items.find(it => it.id === qid);
        if (!item) return;
        const wasOk = evaluateQuestion(item, item.answer);
        item.manualOverride = item.manualOverride === true ? null : true;
        const okNow = evaluateQuestion(item, item.answer);
        if (state.stats.results[qid] && okNow !== wasOk) {
          state.stats.results[qid].lastOk = okNow;
          state.stats.results[qid].correct = Math.max(0, state.stats.results[qid].correct + (okNow ? 1 : -1));
          saveStats();
        }
        renderReview();
      });
    });

    document.getElementById("btn-rev-retry").onclick = () => {
      const list = buildQuestionList();
      startAttemptWithQuestions(list, att.title, state.config.timeMinutes);
    };
    document.getElementById("btn-rev-wrong-only")?.addEventListener("click", () => {
      const qs = wrongItems.map(it => qById[it.id]);
      startAttemptWithQuestions(qs, `Oprava chýb (${qs.length})`, 0);
    });
    document.getElementById("btn-toggle-wrong-filter").onclick = () => {
      att.reviewFilterWrong = !att.reviewFilterWrong;
      renderReview();
    };
    const backToSetup = () => { state.view = "setup"; render(); };
    document.getElementById("btn-rev-setup").onclick = backToSetup;
    document.getElementById("btn-rev-back").onclick = backToSetup;
  }

  // ---------------- Shared Collection & Navigation Helpers ----------------
  function filterQuestionPool(pool, f) {
    const term = stripDiacritics(f.search.trim().toLowerCase());
    return pool.filter(q => {
      if (f.area && f.area !== "ALL" && q.area !== f.area) return false;
      if (f.type && f.type !== "ALL" && q.type !== f.type) return false;
      if (f.tier && f.tier !== "ALL" && q.tier !== f.tier) return false;
      if (f.origin === "moodle" && q.origin !== "verbatim_moodle" && q.origin !== "adapted_moodle") return false;
      if (f.origin && f.origin !== "ALL" && f.origin !== "moodle" && q.origin !== f.origin) return false;
      if (term) {
        const hay = stripDiacritics(`${q.id} ${q.title} ${q.source} ${q.originLabel} ${q.tierLabel} ${q.promptHtml} ${q.answer}`.toLowerCase());
        if (!hay.includes(term)) return false;
      }
      return true;
    });
  }

  function renderAccordionList(matched, expandedAll) {
    return matched.map(q => {
      const ansText = q.type === "MCQ"
        ? `<strong>${esc(q.answer)}</strong>`
        : `<code>${esc(q.answer)}</code>`;
      return `
        <details class="card" style="padding:0.85rem 1rem;" ${expandedAll ? "open" : ""}>
          <summary style="cursor:pointer;display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:0.5rem;">
            <span><strong>${esc(q.id)} [${q.type}${q.multi ? " · viac" : ""}]</strong> — ${esc(q.title)} <span class="muted">(${esc(q.areaName)})</span></span>
            <span class="q-pills">
              ${q.isMain ? `<span class="pill-tag badge-main">★ Hlavná otázka</span>` : ""}
              <span class="pill-tag tier-${q.tier}">${esc(q.tierLabel)}</span>
              <span class="pill-tag orig-${q.origin}">${esc(q.originLabel)}</span>
              <span class="q-source">${esc(q.source)}</span>
            </span>
          </summary>
          <div style="margin-top:0.8rem;border-top:1px solid var(--border);padding-top:0.75rem;">
            <div class="qtext">${q.promptHtml}</div>
            ${q.type === "MCQ" ? `
              <ul style="margin:0.6rem 0;padding-left:1.3rem;">
                ${q.options.map(o => `<li><strong>${o.key})</strong> ${o.html}</li>`).join("")}
              </ul>` : ""}
            <div class="feedback-box ok">
              <div><strong>Správna odpoveď:</strong> ${ansText}</div>
              ${q.type === "1-R" ? `<div class="equiv-pills">${q.equivalents.map(e => `<span class="equiv-pill">${esc(e)}</span>`).join("")}</div>` : ""}
              <div style="margin-top:0.35rem;"><strong>Postup:</strong> ${q.explanationHtml}</div>
              <div class="trap-note"><strong>Pozor na pascu:</strong> ${q.trapHtml}</div>
            </div>
          </div>
        </details>`;
    }).join("");
  }

  function bindSearchWithCaret(inputId, filterObj, rerenderFn) {
    const srch = document.getElementById(inputId);
    if (!srch) return;
    srch.oninput = e => {
      filterObj.search = e.target.value;
      const caret = srch.selectionStart;
      rerenderFn();
      const again = document.getElementById(inputId);
      if (again) {
        again.focus();
        again.setSelectionRange(caret, caret);
      }
    };
  }

  function buildMainDrillSample(mainPool) {
    const picked = [];
    for (const code of CORE_AREA_CODES) {
      const sub = mainPool.filter(q => q.area === code);
      if (sub.length) picked.push(rankPool(sub, "smart")[0]);
    }
    const pickedIds = new Set(picked.map(q => q.id));
    const rest = rankPool(mainPool.filter(q => !pickedIds.has(q.id)), "smart");
    while (picked.length < 10 && rest.length) picked.push(rest.shift());
    return picked;
  }

  // ---------------- Render Formulas & Study Guides ----------------
  function renderGuides() {
    const el = document.getElementById("view-guides");
    const f = state.guideFilter;
    const guides = BANK.guides || [];
    const meta = BANK.guideMeta || { flowHtml: [], matrixHtml: "" };
    const term = stripDiacritics(f.search.trim().toLowerCase());

    const matched = guides.filter(g => {
      if (f.area !== "ALL" && g.area !== f.area) return false;
      if (term) {
        const formulasTxt = g.formulas.map(fm => `${fm.name} ${fm.exprHtml} ${fm.varsHtml.join(" ")}`).join(" ");
        const hay = stripDiacritics(`${g.id} ${g.area} ${g.areaName} ${g.title} ${g.subtitle} ${g.examplesRef} ${g.distinguishHtml.join(" ")} ${formulasTxt} ${g.exampleHtml} ${g.focusHtml.join(" ")}`.toLowerCase());
        if (!hay.includes(term)) return false;

      return true;
    });

    const areaOpts = guides.map(g =>
      `<option value="${g.area}" ${f.area === g.area ? "selected" : ""}>${esc(g.title)}</option>`
    ).join("");

    const matrixBlock = f.showMatrix ? `
      <div class="card">
        <h3 style="color:var(--navy);margin-bottom:0.45rem;">🧭 Ako za 10 sekúnd jednoducho rozlíšiť typ úlohy</h3>
        <ul class="guide-list" style="margin-bottom:0.85rem;">
          ${meta.flowHtml.map(li => `<li>${li}</li>`).join("")}
        </ul>
        <h3 style="color:var(--navy);margin-bottom:0.4rem;">📊 Rýchla porovnávacia tabuľka typov úloh, premenných a vzorcov</h3>
        ${meta.matrixHtml}
      </div>` : "";

    const cardsHtml = matched.map(g => {
      const areaQs = BANK.questions.filter(q => q.area === g.area);
      const pracQs = areaQs.filter(q => q.tier !== "C");
      const mainCnt = areaQs.filter(q => q.isMain).length;
      const formulasHtml = g.formulas.map(fm => `
        <div class="formula-block">
          <div><strong>${esc(fm.name)}</strong></div>
          <pre class="formula-pre">${fm.exprHtml}</pre>
          <ul class="guide-list">${fm.varsHtml.map(v => `<li>${v}</li>`).join("")}</ul>
        </div>`).join("");

      return `
        <details class="card guide-card" ${f.expandedAll ? "open" : ""}>
          <summary style="cursor:pointer;display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:0.5rem;">
            <div>
              <strong style="font-size:1.02rem;color:var(--navy);">${esc(g.title)}</strong>
              <div class="muted" style="font-size:0.84rem;">${esc(g.subtitle)}</div>
            </div>
            <span class="q-pills">
              <span class="pill-tag badge-main">${mainCnt} Hlavných</span>
              <span class="pill-tag tier-A">${areaQs.length} otázok (${esc(g.area)})</span>
            </span>
          </summary>
          <div style="margin-top:0.85rem;border-top:1px solid var(--border);padding-top:0.75rem;">
            <div class="muted" style="margin-bottom:0.5rem;"><strong>Súvisiace otázky v zbierke:</strong> ${esc(g.examplesRef)}</div>

            <div class="guide-box guide-cue">
              <h4>🔍 Ako tento typ rýchlo rozlíšiť</h4>
              <ul class="guide-list">${g.distinguishHtml.map(c => `<li>${c}</li>`).join("")}</ul>
            </div>

            <div class="guide-box guide-formula">
              <h4>📐 Vzorce a vysvetlenie premenných / parametrov</h4>
              ${formulasHtml}
            </div>

            <div class="guide-box guide-example">
              <h4>📝 Podrobný riešený príklad krok za krokom</h4>
              <div>${g.exampleHtml}</div>
            </div>

            <div class="guide-box guide-focus">
              <h4>🎯 Na čo sa zamerať a najčastejšie pasce v Moodle</h4>
              <ul class="guide-list">${g.focusHtml.map(p => `<li>${p}</li>`).join("")}</ul>
            </div>

            <div style="display:flex;flex-wrap:wrap;gap:0.5rem;margin-top:0.85rem;">
              <button type="button" class="btn btn-primary btn-sm btn-guide-practice" data-area="${g.area}" ${pracQs.length === 0 ? "disabled" : ""}>
                Precvičiť tento typ v teste (${pracQs.length} otázok)
              </button>
              <button type="button" class="btn btn-sm btn-guide-browse" data-area="${g.area}">
                Otvoriť všetky otázky tejto oblasti v prehliadači
              </button>
            </div>
          </div>
        </details>`;
    }).join("");

    el.innerHTML = `
      <div class="card guide-hero">
        <div style="display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-start;gap:0.85rem;margin-bottom:0.75rem;">
          <div>
            <h2 style="margin:0;color:var(--navy);">📘 Vzorce, vysvetlenie učiva a rozlíšenie typov úloh (TEST 1)</h2>
            <p class="muted" style="margin:0.3rem 0 0;">
              Ku každému typu úlohy tu nájdete signály na rýchle rozpoznanie, matematické vzorce s vysvetlením každej premennej,
              podrobný vzorový výpočet z cvičení/Moodle a zoznam pascí, na ktoré si dať na teste pozor.
            </p>
          </div>
          <div style="display:flex;flex-wrap:wrap;gap:0.5rem;">
            <button type="button" class="btn btn-sm" id="guide-toggle-matrix">
              ${f.showMatrix ? "Skryť rozhodovaciu tabuľku" : "Zobraziť rozhodovaciu tabuľku"}
            </button>
            <button type="button" class="btn ${f.expandedAll ? "" : "btn-primary"} btn-sm" id="guide-toggle-all">
              ${f.expandedAll ? "Zbaliť všetky typy úloh" : "Rozbaliť všetky typy úloh"}
            </button>
          </div>
        </div>
        <div class="browser-toolbar">
          <select id="guide-area"><option value="ALL">Všetkých ${guides.length} typov úloh (${matched.length} zobrazených)</option>${areaOpts}</select>
          <input type="text" id="guide-search" value="${esc(f.search)}" placeholder="Hľadať vzorec, príklad alebo pascu (napr. 0.95, minimax, CowFood, getslack, kanonický)..." style="min-width:250px;flex:1;">
        </div>
      </div>
      ${matrixBlock}
      ${cardsHtml || '<div class="card muted">Žiadny typ úlohy nezodpovedá filtru.</div>'}
    `;

    document.getElementById("guide-toggle-matrix").onclick = () => { f.showMatrix = !f.showMatrix; renderGuides(); };
    document.getElementById("guide-toggle-all").onclick = () => { f.expandedAll = !f.expandedAll; renderGuides(); };
    document.getElementById("guide-area").onchange = e => { f.area = e.target.value; renderGuides(); };
    bindSearchWithCaret("guide-search", f, renderGuides);

    el.querySelectorAll(".btn-guide-practice").forEach(btn => {
      btn.addEventListener("click", () => {
        const areaCode = btn.dataset.area;
        const gObj = guides.find(x => x.area === areaCode);
        const pool = BANK.questions.filter(q => q.area === areaCode && q.tier !== "C");
        startAttemptWithQuestions(rankPool(pool, "smart"), `Tréning typu: ${gObj ? gObj.areaName : areaCode}`, 0);
      });
    });
    el.querySelectorAll(".btn-guide-browse").forEach(btn => {
      btn.addEventListener("click", () => {
        state.browserFilter.area = btn.dataset.area;
        state.browserFilter.origin = "ALL";
        state.browserFilter.tier = "ALL";
        state.browserFilter.type = "ALL";
        state.view = "browser";
        render();
      });
    });
  }

  // ---------------- Main View Switcher ----------------
  function render() {
    syncTopTabs();
    for (const v of ["setup", "main", "guides", "attempt", "summary", "review", "browser"]) {
      document.getElementById(`view-${v}`).classList.toggle("hidden", state.view !== v);
    }
    if (state.view === "setup") renderSetup();
    else if (state.view === "main") renderMainHub();
    else if (state.view === "guides") renderGuides();
    else if (state.view === "attempt") renderAttempt();
    else if (state.view === "summary") renderSummary();
    else if (state.view === "review") renderReview();
    else if (state.view === "browser") renderBrowser();
  }

  function confirmLeaveActiveAttempt(targetView) {
    if (state.attempt && state.attempt.status === "in_progress") {
      openModal(`
        <h3>Prebieha aktívny pokus testu</h3>
        <p class="muted">Počas ostrého pokusu je prehľad riešení uzamknutý. Ak chcete prezerať otázky alebo vzorce, pokus najprv odošlite alebo pozastavte návratom na úvod.</p>
        <div class="modal-actions">
          <button type="button" class="btn btn-primary" id="m-ok">Zostať v teste</button>
          <button type="button" class="btn" id="m-leave">Pozastaviť pokus a prejsť ďalej</button>
        </div>
      `);
      document.getElementById("m-ok").onclick = closeModal;
      document.getElementById("m-leave").onclick = () => {
        stopTimer();
        saveActiveAttempt();
        state.attempt = null;
        closeModal();
        state.view = targetView;
        render();
      };
      return;
    }
    state.view = targetView;
    render();
  }

  document.getElementById("tab-quiz").onclick = () => {
    if (state.attempt && (state.attempt.status === "in_progress" || state.attempt.status === "summary")) {
      state.view = state.attempt.status === "summary" ? "summary" : "attempt";
    } else {
      state.view = "setup";
    }
    render();
  };
  document.getElementById("tab-main").onclick = () => confirmLeaveActiveAttempt("main");
  document.getElementById("tab-guides").onclick = () => confirmLeaveActiveAttempt("guides");
  document.getElementById("tab-browser").onclick = () => confirmLeaveActiveAttempt("browser");

  render();
})();
</script>
</body>
</html>
