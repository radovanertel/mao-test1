čet optimálnych riešení v jednobodovej prípustnej množine", "source": "Archív Moodle (Zapocty_dokopy P95, zap1 23415436 Q4)", "promptHtml": "<p>Nasledujúca úloha lineárneho programovania má:<\/p>\n<p><code>max x + y<\/code><br>za pod.<br><code>x + y &lt;= 5<\/code><br><code>x &gt;= 5<\/code><br><code>y &gt;= 0<\/code><\/p>", "explanationHtml": "<p>Nerovnice <code>x &gt;= 5<\/code> a <code>y &gt;= 0<\/code> dávajú <code>x + y &gt;= 5<\/code>. Spolu s podmienkou <code>x + y &lt;= 5<\/code> môže platiť jedine <code>x = 5<\/code> a <code>y = 0<\/code>, čiže prípustná množina sa scvrkne na jediný bod <code>(5, 0)<\/code> — preto má práve <strong>jedno<\/strong> optimálne riešenie.<\/p>", "trapHtml": "<p>Zvyknúť si na podobnú úlohu <code>x &gt;= 0<\/code> (<code>H45<\/code>), ktorá má nekonečne veľa optím, a prehliadnuť sprísnenie na <code>x &gt;= 5<\/code>!<\/p>", "answer": "B", "options": [{"key": "A", "html": "žiadne optimálne riešenie"}, {"key": "B", "html": "jedno optimálne riešenie"}, {"key": "C", "html": "práve dve optimálne riešenia"}, {"key": "D", "html": "nekonečne veľa optimálnych riešení"}], "multi": false, "shuffleOptions": true}, {"id": "H45", "area": "SIM", "areaName": "9. Simplex a teória lineárneho programovania", "origin": "verbatim_moodle", "originLabel": "Doslovne z Moodle", "tier": "A", "tierLabel": "Režim A (TEST 1)", "isMain": true, "optional": false, "archived": true, "type": "MCQ", "title": "Počet optimálnych riešení pri rovnobežnej účelovej funkcii s hranou", "source": "Archív Moodle (Zapocty_dokopy P96)", "promptHtml": "<p>Nasledujúca úloha lineárneho programovania má:<\/p>\n<p><code>max x + y<\/code><br>za pod.<br><code>x + y &lt;= 5<\/code><br><code>x &gt;= 0<\/code><br><code>y &gt;= 0<\/code><\/p>", "explanationHtml": "<p>Účelová funkcia <code>x + y<\/code> nadobúda maximum <code>5<\/code> v oboch krajných bodoch <code>(5, 0)<\/code> aj <code>(0, 5)<\/code>, a preto aj v každom bode celej úsečky <code>x + y = 5<\/code> medzi nimi — úloha má <strong>nekonečne veľa<\/strong> optimálnych riešení.<\/p>", "trapHtml": "<p>Myslieť si, že existujú práve dve riešenia <code>(5, 0)<\/code> a <code>(0, 5)<\/code> — v spojitom LP platí aj každá ich konvexná kombinácia!<\/p>", "answer": "C", "options": [{"key": "A", "html": "žiadne optimálne riešenie"}, {"key": "B", "html": "práve dve optimálne riešenia"}, {"key": "C", "html": "nekonečne veľa optimálnych riešení"}, {"key": "D", "html": "jedno optimálne riešenie"}], "multi": false, "shuffleOptions": true}, {"id": "H46", "area": "MOS", "areaName": "10. Mosel a interpretácia zápisov", "origin": "verbatim_moodle", "originLabel": "Doslovne z Moodle", "tier": "A", "tierLabel": "Režim A (TEST 1)", "isMain": true, "optional": false, "archived": true, "type": "MCQ", "title": "Význam Mosel zápisu forall(i in 1..3, k in 1..3|(i<>k))writeln(getsol(x(i,k)))", "source": "Archív Moodle (MaoZapocet 11080793 Q5)", "promptHtml": "<p>Čo znamená nasledujúci zápis v jazyku Mosel?<\/p>\n<pre class=\"code-block\"><code class=\"lang-mosel\">forall(i in 1..3, k in 1..3|(i&lt;&gt;k))writeln(getsol(x(i,k)))<\/code><\/pre>", "explanationHtml": "<p>Operátor <code>&lt;&gt;<\/code> v jazyku Mosel znamená „nerovná sa“ (<code>≠<\/code>). Cyklus teda prechádza všetky dvojice <code>i, k in 1..3<\/code> mimo diagonály <code>i = k<\/code> (t. j. okrem <code>x(1,1)<\/code>, <code>x(2,2)<\/code> a <code>x(3,3)<\/code>).<\/p>", "trapHtml": "<p>Operátor <code>&lt;&gt;<\/code> sa občas nesprávne číta ako <code>&lt;<\/code> alebo <code>&lt;=<\/code> či porovnanie s nulou.<\/p>", "answer": "B", "options": [{"key": "A", "html": "Výpis hodnôt rozhodovacích premenných <code>x(2,2)<\/code> a <code>x(3,3)<\/code>"}, {"key": "B", "html": "Výpis hodnôt rozhodovacích premenných <code>x(i,k)<\/code> okrem premenných <code>x(1,1)<\/code>, <code>x(2,2)<\/code> a <code>x(3,3)<\/code>"}, {"key": "C", "html": "Žiadna z odpovedí nie je správna"}, {"key": "D", "html": "Výpis všetkých rozhodovacích premenných <code>x(i,k)<\/code> pre <code>i=1,2,3<\/code> a <code>k=1,2,3<\/code>"}], "multi": false, "shuffleOptions": true}, {"id": "H47", "area": "MOS", "areaName": "10. Mosel a interpretácia zápisov", "origin": "verbatim_moodle", "originLabel": "Doslovne z Moodle", "tier": "A", "tierLabel": "Režim A (TEST 1)", "isMain": true, "optional": false, "archived": true, "type": "MCQ", "title": "Výpis premennej x12=0 pri filtri getsol(x(i,k)) > 0", "source": "Archív Moodle (MaoZapocet 11096560 Q8)", "promptHtml": "<p>Premenná <code>x12<\/code> má v optimálnom riešení hodnotu <code>0<\/code>. Vypíše nasledujúci príkaz v jazyku Mosel jej hodnotu?<\/p>\n<pre class=\"code-block\"><code class=\"lang-mosel\">forall(i in 1..3, k in 1..3 | (getsol(x(i,k))&gt;0)) writeln(getsol(x(i,k)))<\/code><\/pre>", "explanationHtml": "<p>Podmienka za zvislou čiarou <code>|<\/code> vyžaduje ostrú nerovnosť <code>getsol(x(i,k)) &gt; 0<\/code>. Keďže <code>x(1,2) = 0<\/code>, podmienka <code>0 &gt; 0<\/code> nie je splnená a hodnota sa nevypíše.<\/p>", "trapHtml": "<p>Prehliadnuť filter za <code>|<\/code> alebo si pomýliť <code>&gt; 0<\/code> s <code>&gt;= 0<\/code>.<\/p>", "answer": "B", "options": [{"key": "A", "html": "Pravda"}, {"key": "B", "html": "Nepravda"}], "multi": false, "shuffleOptions": false}, {"id": "H48", "area": "MOS", "areaName": "10. Mosel a interpretácia zápisov", "origin": "verbatim_moodle", "originLabel": "Doslovne z Moodle", "tier": "A", "tierLabel": "Režim A (TEST 1)", "isMain": true, "optional": false, "archived": true, "type": "MCQ", "title": "Výpis premennej x12 pri filtri i > k (dolný trojuholník)", "source": "Archív Moodle (Zapocty_dokopy P105, MaoZapocet 11012908 Q8)", "promptHtml": "<p>Premenná <code>x12<\/code> má v optimálnom riešení hodnotu <code>0<\/code>. Vypíše nasledujúci príkaz v jazyku Mosel jej hodnotu?<\/p>\n<pre class=\"code-block\"><code class=\"lang-mosel\">forall(i in 1..3, k in 1..3 | i &gt; k) writeln(getsol(x(i,k)))<\/code><\/pre>", "explanationHtml": "<p>Pre premennú <code>x(1,2)<\/code> platí <code>i = 1<\/code> a <code>k = 2<\/code>. Podmienka <code>i &gt; k<\/code> (<code>1 &gt; 2<\/code>) je nepravdivá, preto <code>x(1,2)<\/code> nebude vypísaná (vypísali by sa len <code>x(2,1)<\/code>, <code>x(3,1)<\/code> a <code>x(3,2)<\/code>).<\/p>", "trapHtml": "<p>Pozor: filter tu vôbec netestuje nulovosť riešenia, ale <strong>indexy<\/strong> <code>i &gt; k<\/code>! Rovnako by nebolo vypísané ani nenulové <code>x(1,2)<\/code>.<\/p>", "answer": "B", "options": [{"key": "A", "html": "Pravda"}, {"key": "B", "html": "Nepravda"}], "multi": false, "shuffleOptions": false}, {"id": "H49", "area": "MOS", "areaName": "10. Mosel a interpretácia zápisov", "origin": "verbatim_moodle", "originLabel": "Doslovne z Moodle", "tier": "A", "tierLabel": "Režim A (TEST 1)", "isMain": true, "optional": false, "archived": true, "type": "MCQ", "title": "Interpretácia Mosel podmienky sum(j in 1..4)x(3,j) <= a(3)", "source": "Archív Moodle (MaoZapocet 11096560 Q6, zap1 23467418 Q8)", "promptHtml": "<p>Zo skladov S1, S2 a S3 s kapacitami <code>a(i)<\/code> postupne 100, 190 a 200 ton tovaru treba čo najlacnejšie zásobovať odberateľov O1, O2, O3 a O4 s požiadavkami <code>b(j)<\/code> 80, 100, 200 a 90 ton tovaru. Jednotkové dopravné náklady sú známe. Premenná <code>x(i,j)<\/code> modeluje množstvo tovaru prepravené zo skladu <code>i<\/code> k odberateľovi <code>j<\/code>. Aký je význam nasledujúcej podmienky v modeli (zapísaná v Moseli)?<\/p>\n<pre class=\"code-block\"><code class=\"lang-mosel\">sum(j in 1..4)x(3,j) &lt;= a(3)<\/code><\/pre>", "explanationHtml": "<p>Prvý index je zafixovaný na hodnotu <code>3<\/code> (<code>a(3)<\/code>), zatiaľ čo sa sumuje cez všetkých odberateľov <code>j in 1..4<\/code>, a chýba vonkajší cyklus <code>forall(i in 1..3)<\/code>. Ide preto o kapacitu jedného <strong>konkrétneho<\/strong> skladu (<code>S3<\/code>).<\/p>", "trapHtml": "<p>Prehliadnuť chýbajúce <code>forall<\/code> a označiť „každého zo skladov“ (<code>D<\/code>).<\/p>", "answer": "A", "options": [{"key": "A", "html": "zabezpečí neprekročenie kapacity konkrétneho skladu"}, {"key": "B", "html": "zabezpečí dodanie požadovaného množstva tovaru pre konkrétneho odberateľa"}, {"key": "C", "html": "zabezpečí dodanie požadovaného množstva tovaru všetkým odberateľom"}, {"key": "D", "html": "zabezpečí neprekročenie kapacity každého zo skladov"}], "multi": false, "shuffleOptions": true}, {"id": "H50", "area": "MOS", "areaName": "10. Mosel a interpretácia zápisov", "origin": "verbatim_moodle", "originLabel": "Doslovne z Moodle", "tier": "A", "tierLabel": "Režim A (TEST 1)", "isMain": true, "optional": false, "archived": true, "type": "MCQ", "title": "Interpretácia Mosel podmienky sum(i in 1..3)x(i,2)=b(2)", "source": "Archív Moodle (test2.php.htm Q2)", "promptHtml": "<p>Zo skladov S1, S2 a S3 s kapacitami <code>a(i)<\/code> postupne 100, 190 a 200 ton tovaru treba čo najlacnejšie zásobovať odberateľov O1, O2, O3 a O4 s požiadavkami <code>b(j)<\/code> 80, 100, 200 a 90 ton tovaru. Jednotkové dopravné náklady sú známe. Premenná <code>x(i,j)<\/code> modeluje množstvo tovaru prepravené zo skladu <code>i<\/code> k odberateľovi <code>j<\/code>. Aký je význam nasledujúcej podmienky v modeli (zapísaná v Moseli)?<\/p>\n<pre class=\"code-block\"><code class=\"lang-mosel\">sum(i in 1..3)x(i,2)=b(2)<\/code><\/pre>", "explanationHtml": "<p>Sumuje sa cez sklady <code>i in 1..3<\/code> pri pevnom druhom indexe <code>2<\/code> (<code>b(2)<\/code>). Bez cyklu <code>forall<\/code> ide o splnenie požiadavky jedného konkrétneho odberateľa (<code>O2<\/code>).<\/p>", "trapHtml": "<p>Zameniť indexy skladov <code>a(i)<\/code> a odberateľov <code>b(j)<\/code>.<\/p>", "answer": "B", "options": [{"key": "A", "html": "zabezpečí dodanie požadovaného množstva tovaru všetkým odberateľom"}, {"key": "B", "html": "zabezpečí dodanie požadovaného množstva tovaru pre konkrétneho odberateľa"}, {"key": "C", "html": "zabezpečí neprekročenie kapacity konkrétneho skladu"}, {"key": "D", "html": "zabezpečí neprekročenie kapacity každého zo skladov"}], "multi": false, "shuffleOptions": true}, {"id": "H51", "area": "MOS", "areaName": "10. Mosel a interpretácia zápisov", "origin": "verbatim_moodle", "originLabel": "Doslovne z Moodle", "tier": "A", "tierLabel": "Režim A (TEST 1)", "isMain": true, "optional": false, "archived": true, "type": "MCQ", "title": "Interpretácia Mosel podmienky forall(i in 1..3)sum(j in 1..3)x(i,j)<= a(i)", "source": "Archív Moodle (zapocet1 z1_p16 Q8)", "promptHtml": "<p>Zo skladov S1, S2 a S3 s kapacitami <code>a(i)<\/code> postupne 100, 190 a 200 ton tovaru treba čo najlacnejšie zásobovať odberateľov O1, O2 a O3 s požiadavkami <code>b(j)<\/code> 80, 100 a 200 ton tovaru. Jednotkové dopravné náklady sú známe. Premenná <code>x(i,j)<\/code> modeluje množstvo tovaru prepravené zo skladu <code>i<\/code> k odberateľovi <code>j<\/code>. Aký je význam nasledujúcej podmienky v modeli (zapísaná v Moseli)?<\/p>\n<pre class=\"code-block\"><code class=\"lang-mosel\">forall(i in 1..3)sum(j in 1..3)x(i,j)&lt;= a(i)<\/code><\/pre>", "explanationHtml": "<p>Vonkajší cyklus <code>forall(i in 1..3)<\/code> generuje obmedzenie <code>&lt;= a(i)<\/code> naraz pre <strong>všetky<\/strong> sklady <code>i = 1, 2, 3<\/code>, takže zabezpečí neprekročenie kapacity každého zo skladov.<\/p>", "trapHtml": "<p>Zameniť príkaz s cyklom <code>forall<\/code> (<code>každého zo skladov<\/code>, D) za zápis bez <code>forall<\/code> (<code>konkrétneho skladu<\/code>, C).<\/p>", "answer": "D", "options": [{"key": "A", "html": "zabezpečí dodanie požadovaného množstva tovaru všetkým odberateľom"}, {"key": "B", "html": "zabezpečí dodanie požadovaného množstva tovaru pre konkrétneho odberateľa"}, {"key": "C", "html": "zabezpečí neprekročenie kapacity konkrétneho skladu"}, {"key": "D", "html": "zabezpečí neprekročenie kapacity každého zo skladov"}], "multi": false, "shuffleOptions": true}], "guideMeta": {"flowHtml": ["<strong>Krok 1 — Je v zadaní sieť/graf s vnútornými uzlami (tovar alebo tok prechádza cez medziuzly)?<\/strong> Ak áno → <strong>Toková úloha (<code>TOK<\/code>)<\/strong>. Ak sa prepravuje priamo zo zdrojov (skladov <code>i<\/code>) k odberateľom (<code>j<\/code>) bez medziuzlov → <strong>Dopravná úloha (<code>DU<\/code>)<\/strong> alebo <strong>DÚ so stratami (<code>DUS<\/code>)<\/strong>.", "<strong>Krok 2 — Ide o priamu prepravu <code>sklad i -&gt; odberateľ j<\/code>?<\/strong> Skontrolujte zmienku o strate počas cesty (<code>%<\/code> úbytku) alebo hygroskopickom náraste → ak áno, je to <strong>DÚ so stratami (<code>DUS<\/code>)<\/strong>; inak klasická / Minimax <strong>Dopravná úloha (<code>DU<\/code>)<\/strong> (vždy porovnajte <code>sum a(i)<\/code> a <code>sum b(j)<\/code>).", "<strong>Krok 3 — Miešate vstupné suroviny tak, aby výsledná zmes splnila kvalitatívny limit v <code>%<\/code>, stupňoch alebo MJ/l (vážený priemer)?<\/strong> → <strong>Zmiešavacia úloha (<code>ZM<\/code>)<\/strong> (CowFood, Oceliarne, Lieh, Zmrzlina).", "<strong>Krok 4 — Režete alebo delíte rovnaké tyče/tabule/zmeny podľa zadaných schém (stĺpcov v tabuľke)?<\/strong> → <strong>Rezná úloha (<code>REZ<\/code>)<\/strong> (SchoolDesk, Plechy, Dielňa).", "<strong>Krok 5 — Určujete počty vyrábaných výrobkov na obmedzených kapacitách/surovinách?<\/strong> → <strong>Výrobný model (<code>PV<\/code>)<\/strong>: sledujte, či je niektorý výrobok <em>polotovarom<\/em> pre iný (<code>cv02 Vyrobky<\/code>), alebo či má model <em>mesiace <code>t = 1..T<\/code> a počiatočný sklad <code>s_0<\/code><\/em> (<code>cv02 Bicykle<\/code>). Ak ide len o jednu slovnú podmienku pomeru či linearizácie → <strong>Základné podmienky (<code>ZLP<\/code>)<\/strong>.", "<strong>Krok 6 — Zadanie je abstraktné bez príbehu o tovare?<\/strong> Rezervy <code>getslack<\/code>, aktivita <code>getact<\/code> alebo nová cena produktu → <strong>Analýza citlivosti (<code>CIT<\/code>)<\/strong>; konvexita, vrcholy, počet optím, kanonický tvar, <code>XPRS_*<\/code> → <strong>Simplex a teória (<code>SIM<\/code>)<\/strong>; významy kódu <code>forall<\/code>, <code>sum<\/code>, <code>|<\/code>, <code>getsol<\/code> → <strong>Syntax Mosel (<code>MOS<\/code>)<\/strong>."], "matrixHtml": "<div class=\"tbl-wrap\"><table class=\"data-table\"><thead><tr><th style=\"text-align:left\">Typ úlohy<\/th><th style=\"text-align:left\">Kľúčové signály v zadaní<\/th><th style=\"text-align:left\">Premenná (<code>x<\/code>) modeluje<\/th><th style=\"text-align:left\">Typický vzorec / šablóna<\/th><th style=\"text-align:left\">Hlavné rozlíšenie a najčastejšia pasca<\/th><\/tr><\/thead><tbody><tr><td style=\"text-align:left\"><strong>1. Základné podmienky (<code>ZLP<\/code>)<\/strong><\/td><td style=\"text-align:left\">„k-krát menej“, „aspoň o d viac“, „nemôže sa vyskytnúť v LP“, <code>z = max{x,y}<\/code><\/td><td style=\"text-align:left\">Množstvo výrobku <code>x(1), x(2), x(3)<\/code><\/td><td style=\"text-align:left\"><code>3*x(1) = x(2) + x(3)<\/code>, <code>x(1) &gt;= x(2) + x(3) + 50<\/code>, <code>x/K1 + y/K2 &lt;= 1<\/code><\/td><td style=\"text-align:left\"><strong>Nepísať<\/strong> súčin <code>x*y<\/code>, podiel <code>x/y<\/code> ani ostré <code>&lt;<\/code>, <code>&gt;<\/code>. Obrátený koeficient pri „3-krát menej“ (<code>3*x(1)<\/code>, nie <code>3*(x(2)+x(3))<\/code>)!<\/td><\/tr><tr><td style=\"text-align:left\"><strong>2a. Výroba — klasická a s polotovarmi (<code>PV<\/code>)<\/strong><\/td><td style=\"text-align:left\">Kapacita zariadenia, suroviny, tržby; polotovar vstupuje do finálneho výrobku<\/td><td style=\"text-align:left\"><strong>Celková<\/strong> výroba <code>v(i)<\/code> (vrátane spotreby vnútri závodu)<\/td><td style=\"text-align:left\">Zdroj: <code>sum a(i,j)*v(j) &lt;= b(i)<\/code><br>Polotovar: <code>v1 &gt;= r12*v2 + r14*v4<\/code><br>Predaj: <code>v1 - r12*v2 - r14*v4<\/code><\/td><td style=\"text-align:left\">Ak sa <code>V1<\/code> predáva aj samostatne, do <strong>tržieb<\/strong> vstupuje len <code>(v1 - spotreba_V1)<\/code>, nie celé <code>v1<\/code>!<\/td><\/tr><tr><td style=\"text-align:left\"><strong>2b. Výroba — viacperiodová (<code>PV<\/code>)<\/strong><\/td><td style=\"text-align:left\">Obdobia <code>t = 1..T<\/code>, počiatočný sklad <code>s_0<\/code>, dopyt <code>d(t)<\/code>, nadčas <code>n(t)<\/code><\/td><td style=\"text-align:left\"><code>x(t)<\/code> riadna výr., <code>n(t)<\/code> nadčas, <code>s(t)<\/code> koncový sklad v období <code>t<\/code><\/td><td style=\"text-align:left\"><code>t=1<\/code>: <code>s0 + x(1) + n(1) - d(1) = s(1)<\/code><br><code>t&gt;=2<\/code>: <code>s(t-1) + x(t) + n(t) - d(t) = s(t)<\/code><\/td><td style=\"text-align:left\">Za <strong>počiatočný sklad <code>s_0<\/code><\/strong> spred 1. obdobia sa neúčtuje skladné; <code>s(T) &gt;= s_konc<\/code> chráni záver obdobia!<\/td><\/tr><tr><td style=\"text-align:left\"><strong>3. Dopravná úloha (<code>DU<\/code>)<\/strong><\/td><td style=\"text-align:left\">Sklady <code>i<\/code> (<code>a_i<\/code>) a odberatelia <code>j<\/code> (<code>b_j<\/code>), priama preprava, Minimax<\/td><td style=\"text-align:left\">Množstvo prepravené z <code>i<\/code> do <code>j<\/code>: <code>x(i,j) &gt;= 0<\/code><\/td><td style=\"text-align:left\">Prebytok (<code>sum a &gt;= sum b<\/code>): sklady <code>&lt;= a(i)<\/code>, ciele <code>= b(j)<\/code><br>Minimax: <code>x(i,j) &lt;= y<\/code>, <code>min y<\/code><\/td><td style=\"text-align:left\">Nemá medziuzly! Rozlišujte <strong>zostatok<\/strong> (<code>&lt;= 100 - 20<\/code>) vs <strong>odvezenie aspoň 80<\/strong> (<code>&gt;= 80<\/code>)!<\/td><\/tr><tr><td style=\"text-align:left\"><strong>4. DÚ so stratami (<code>DUS<\/code>)<\/strong><\/td><td style=\"text-align:left\">Priama preprava + „strata p % počas prepravy“ alebo „nárast vlhkosti p %“<\/td><td style=\"text-align:left\">Štandardne množstvo <strong>naložené<\/strong> v sklade <code>i<\/code>: <code>x(i,j)<\/code><\/td><td style=\"text-align:left\">Sklad: <code>sum(j) x(i,j) &lt;= a(i)<\/code><br>Cieľ: <code>sum(i) (1 - p/100)*x(i,j) = b(j)<\/code><\/td><td style=\"text-align:left\">Odberateľ potrebuje doručené <code>b<\/code>, preto sa sklad násobí <code>(1 - p/100)<\/code>, <strong>nie<\/strong> <code>(1 + p/100)<\/code> (<code>b/0.95 != b*1.05<\/code>)!<\/td><\/tr><tr><td style=\"text-align:left\"><strong>5. Zmiešavacia úloha (<code>ZM<\/code>)<\/strong><\/td><td style=\"text-align:left\">Vážený aritmetický priemer, <code>%<\/code> tuku/vlákniny/Mn/Cr, oktánové číslo, výhrevnosť<\/td><td style=\"text-align:left\">Hmotnosť alebo podiel zložky <code>i<\/code>: <code>x(i) &gt;= 0<\/code><\/td><td style=\"text-align:left\">Množstvo: <code>sum x(i) = M<\/code><br>Kvalita: <code>sum p(i)*x(i) &lt;= P_max * M<\/code><\/td><td style=\"text-align:left\"><strong>Nikdy nemiešať <code>%<\/code> s desatinnými číslami<\/strong> (<code>90<\/code> vs <code>0.4<\/code>) a nezabudnúť na pravej strane násobiť celkom <code>* M<\/code>!<\/td><\/tr><tr><td style=\"text-align:left\"><strong>6. Rezná úloha (<code>REZ<\/code>)<\/strong><\/td><td style=\"text-align:left\">Štandardná dĺžka tyčí / rozmer plechu + rezné plány/schémy <code>1..n<\/code><\/td><td style=\"text-align:left\"><strong>Počet vstupných tyčí/tabúľ<\/strong> rezaných podľa plánu <code>j<\/code>: <code>x(j)<\/code><\/td><td style=\"text-align:left\"><code>min sum x(j)<\/code><br>Pokrytie: <code>sum(j) a(i,j)*x(j) &gt;= d(i)<\/code><\/td><td style=\"text-align:left\">Premenná je počet <strong>tyčí podľa plánu<\/strong>, nie počet súčiastok! Pozor na násobky v texte (<code>125<\/code> stolov × <code>4<\/code> nohy = <code>500<\/code>)!<\/td><\/tr><tr><td style=\"text-align:left\"><strong>7. Tokové úlohy (<code>TOK<\/code>)<\/strong><\/td><td style=\"text-align:left\">Sieť/graf s hranami <code>(i,j)<\/code>, vnútorné uzly <code>2..N-1<\/code>, najkratšia cesta / max tok / min cena<\/td><td style=\"text-align:left\">Tok po orientovanej hrane <code>i -&gt; j<\/code>: <code>x(i,j)<\/code> (príp. aj <code>Tok<\/code>)<\/td><td style=\"text-align:left\">Zdroj <code>1<\/code>: <code>odtok - prítok = Tok<\/code><br>Uzol <code>k<\/code>: <code>prítok = odtok<\/code><br>Hrany: <code>0 &lt;= x(i,j) &lt;= k(i,j)<\/code><\/td><td style=\"text-align:left\">Rovnica <code>prítok = odtok<\/code> platí <strong>len pre vnútorné uzly<\/strong>, nikdy nie pre zdroj <code>1<\/code> ani cieľ <code>N<\/code>!<\/td><\/tr><tr><td style=\"text-align:left\"><strong>8. Analýza citlivosti (<code>CIT<\/code>)<\/strong><\/td><td style=\"text-align:left\"><code>getact<\/code>, <code>getslack<\/code>, úzky profil, prah ceny nového výrobku, dodatočný zdroj<\/td><td style=\"text-align:left\">Zisťovanie rezerv a tieňových zmien okolo optima<\/td><td style=\"text-align:left\"><code>slack(c) = b - act(c)<\/code> (pre <code>&lt;= b<\/code>)<br><code>slack &gt; 0<\/code> → má rezervu (nie úzky profil)<\/td><td style=\"text-align:left\"><code>getslack = 0<\/code> znamená <strong>plné vyčerpanie (úzky profil)<\/strong>, nie nulovú výrobu!<\/td><\/tr><tr><td style=\"text-align:left\"><strong>9. Simplex a teória LP (<code>SIM<\/code>)<\/strong><\/td><td style=\"text-align:left\">Konvexná množina, počet optím, extrémne body, kanonický tvar, <code>XPRS_INF<\/code>/<code>XPRS_UNB<\/code><\/td><td style=\"text-align:left\">Abstraktné vektory <code>x<\/code>, prídatné <code>s &gt;= 0<\/code>, <code>x = x+ - x-<\/code><\/td><td style=\"text-align:left\"><code>&lt;= b<\/code> → <code>+ s = b<\/code>; <code>&gt;= b<\/code> → <code>- s = b<\/code><br><code>min f<\/code> → <code>max (-f)<\/code><\/td><td style=\"text-align:left\">Počet optím je vždy <strong><code>0<\/code>, <code>1<\/code> alebo <code>nekonečne veľa<\/code><\/strong>. Neohraničená množina nemusí znamenať <code>XPRS_UNB<\/code>!<\/td><\/tr><tr><td style=\"text-align:left\"><strong>10. Jazyk Mosel (<code>MOS<\/code>)<\/strong><\/td><td style=\"text-align:left\">Úryvok kódu <code>forall<\/code>, <code>sum<\/code>, filter po zvislej čiare, <code>:=<\/code>, <code>create<\/code>, <code>is_free<\/code>, <code>getsol<\/code><\/td><td style=\"text-align:left\">Indexy cyklov a deklarácie polí / <code>mpvar<\/code><\/td><td style=\"text-align:left\"><code>sum(j in 1..4) x(i,j)<\/code> vs <code>forall(i in 1..3) sum(j in 1..3) x(i,j) &lt;= a(i)<\/code><\/td><td style=\"text-align:left\"><code>mpvar<\/code> je už automaticky <code>&gt;= 0<\/code>. Filter <code>i &gt; k<\/code> odignoruje <code>x(1,2)<\/code>; pevný 1. index v <code>sum(j) x(3,j)<\/code> patrí 3. skladu!<\/td><\/tr><\/tbody><\/table><\/div>"}, "guides": [{"id": "G01", "area": "ZLP", "areaName": "1. Základné lineárne podmienky", "title": "1. Základné lineárne podmienky, pomery a linearizácia", "subtitle": "Slovníkové preklady pomerov, zdieľané kapacity, vylúčenie nelinearity a linearizácia min/max", "examplesRef": "Q01–Q10, H01–H08 (Závod V1–V3, Kapacita stroja, Max-linearizácia)", "distinguishHtml": ["Zadanie obsahuje <strong>krátky text o niekoľkých premenných<\/strong> (<code>x, y, z<\/code> alebo <code>x(1), x(2), x(3)<\/code>) a pýta sa priamo na <strong>jednu podmienku<\/strong> (napr. pomer, rozdiel, zdieľaný čas alebo rozpoznanie nelineárnej rovnice).", "Nie je tu matica cien dopravy ani receptúra zmesi v percentách — cieľom je presný preklad slovenského textu do jednej lineárnej rovnice alebo nerovnice.", "<strong>Rozlíšenie voči <code>SIM<\/code>:<\/strong> Ak vidíte vzorec typu <code>y = 1.2/x<\/code> alebo <code>x*(1+y) = 100<\/code> a otázku „ktorá podmienka sa nemôže vyskytnúť v LP“, ide o test linearity v <code>ZLP<\/code>."], "formulas": [{"name": "Pomer („k-krát menej / viac“) a rozdiel („aspoň o d viac“)", "exprHtml": "„A je k-krát menej ako B“  =&gt;  k * x_A = x_B   (príp. x_A = x_B / k)\n„A je aspoň k-krát viac ako B“  =&gt;  x_A &gt;= k * x_B\n„A je aspoň o d kusov viac ako B“  =&gt;  x_A &gt;= x_B + d", "varsHtml": ["<code>x_A, x_B<\/code>: množstvá výrobkov (v Moodle spravidla <code>x(1), x(2), x(3)<\/code>).", "<code>k<\/code>: bezrozmerný pomer (napr. <code>3<\/code> pri „3-krát menší“, nikdy nie na opačnej strane!).", "<code>d<\/code>: absolútny rozdiel v kusoch (napr. <code>+ 50<\/code> v <code>H03<\/code>)."]}, {"name": "Zdieľaná kapacita jedného zdroja (stroj, pracovisko, lavica)", "exprHtml": "x_1 / K_1 + x_2 / K_2 &lt;= 1   (ekvivalentne:  K_2 * x_1 + K_1 * x_2 &lt;= K_1 * K_2)", "varsHtml": ["<code>x_i<\/code>: vyrobené množstvo <code>i<\/code>-teho typu výrobku.", "<code>K_i<\/code>: maximálny počet kusov <code>i<\/code>-teho výrobku, ak by zdroj vyrábal <strong>výlučne<\/strong> tento výrobok (napr. <code>K_1 = 5<\/code>, <code>K_2 = 8<\/code> → čas 1 kusu je <code>1/K_i<\/code> z celkovej smeny <code>1<\/code>).", "<code>1<\/code>: celých <code>100 %<\/code> disponibilnej kapacity zdroja."]}, {"name": "Linearizácia výrazu z = max{x, y} (a z = min{x, y})", "exprHtml": "Pre z = max{x, y} (v úlohe min z):   x &lt;= z   a   y &lt;= z   (t. j. z &gt;= x, z &gt;= y)\nPre z = min{x, y} (v úlohe max z):   x &gt;= z   a   y &gt;= z   (t. j. z &lt;= x, z &lt;= y)", "varsHtml": ["<code>z<\/code>: pomocná spojitá premenná reprezentujúca maximum (alebo minimum) z <code>x<\/code> a <code>y<\/code>.", "Ak minimalizujeme <code>z<\/code> pri <code>z &gt;= x<\/code> a <code>z &gt;= y<\/code>, optimálne riešenie automaticky zatlačí <code>z<\/code> dole presne na <code>max{x, y}<\/code>."]}], "exampleHtml": "<p><strong>Vzorový príklad z Moodle (<code>Q01<\/code> + <code>H03<\/code> + <code>H06<\/code> — Závod V1–V3):<\/strong> Závod vyrába 3 výrobky <code>V1, V2, V3<\/code> v množstvách <code>x(1), x(2), x(3)<\/code> za ceny <code>50, 20, 30 Sk/ks<\/code>.<\/p>\n<p>1. <strong>„Počet V1 musí byť presne 3-krát menší ako celkový počet ostatných výrobkov“ (<code>Q01<\/code>):<\/strong> <em>Krok 1:<\/em> Ktorých je menej? <code>V1<\/code> je menší, teda jeho trojnásobok sa musí rovnať súčtu <code>V2 + V3<\/code>. <em>Krok 2:<\/em> Skúška konkrétnymi číslami: ak <code>x(1) = 10<\/code> a <code>x(2) + x(3) = 30<\/code>, musí platiť rovnosť: <code>3 * 10 = 30<\/code>. <em>Výsledok:<\/em> <code>3*x(1) = x(2) + x(3)<\/code> (príp. <code>x(1) = (x(2) + x(3))/3<\/code>). 2. <strong>„Výrobkov V1 bude aspoň o 50 ks viac ako všetkých ostatných spolu“ (<code>H03<\/code>):<\/strong> V1 prevyšuje súčet <code>x(2) + x(3)<\/code> o aspoň <code>50<\/code> → <code>x(1) &gt;= x(2) + x(3) + 50<\/code>. 3. <strong>„Príjem z predaja výrobkov V1 aspoň 100 000 Sk“ (<code>H06<\/code> vs <code>H05<\/code>):<\/strong> Pozor na slovo <strong>výrobkov V1<\/strong> (len <code>V1<\/code>!) → <code>50*x(1) &gt;= 100000<\/code>, kdežto „výrobkov“ (všetkých troch v <code>H05<\/code>) dá <code>50*x(1) + 20*x(2) + 30*x(3) &gt;= 100000<\/code>.<\/p>", "focusHtml": ["<strong>Skúška malými číslami:<\/strong> Pri každom pomere typu „A je 3-krát menší než B“ si v hlave dosaďte <code>A = 10, B = 30<\/code> — okamžite zbadáte, že trojka patrí k <code>A<\/code> (<code>3*A = B<\/code>), nie k <code>B<\/code>!", "<strong>Kontrola linearity:<\/strong> Premenné sa nikdy nesmú násobiť (<code>x*y<\/code>), deliť (<code>1.2/x<\/code>), umocňovať (<code>x^2<\/code>) ani vyskytovať pod odmocninou.", "<strong>Žiadne ostré nerovnosti:<\/strong> V LP sa smú používať iba <code>&lt;=<\/code>, <code>&gt;=<\/code> alebo <code>=<\/code> — nikdy nie <code>&lt;<\/code> ani <code>&gt;<\/code>.", "<strong>Zjednotenie jednotiek:<\/strong> Pred napísaním podmienky vždy preveďte <code>m<\/code> vs <code>cm<\/code>, <code>hod<\/code> vs <code>min<\/code>, <code>kg<\/code> vs <code>g<\/code> alebo <code>%<\/code> vs absolútne množstvo."]}, {"id": "G02", "area": "PV", "areaName": "2. Plánovanie výroby (jednoperiódové a multiperiódové)", "title": "2. Výrobné modely (klasický, s polotovarmi a viacperiodový)", "subtitle": "Plánovanie sortimentu, vnútropodniková spotreba polotovarov a skladová bilancia cez mesiace", "examplesRef": "Q11–Q20, H09–H14 (Chemický závod, Závod V1–V3, TP61/TP68/TXT, Bicykle)", "distinguishHtml": ["<strong>2a) Klasická výroba:<\/strong> Tabuľka spotreby surovín/času na jednotlivé výrobky, ich predajné ceny/zisky a horné limity zdrojov (príp. min. podiel v sortimente).", "<strong>2b) Výroba s polotovarmi (<code>cv02 Vyrobky<\/code>):<\/strong> Zadanie hovorí, že jeden výrobok (<code>V1<\/code>, <code>V2<\/code>) je zároveň <strong>polotovarom / súčiastkou<\/strong> potrebnou na výrobu iného finálneho výrobku (<code>V3<\/code>, <code>V4<\/code>), no môže sa predávať aj samostatne.", "<strong>2c) Viacperiodový model (<code>cv02 Bicykle<\/code>):<\/strong> Vyskytuje sa <strong>časová os (<code>t = 1..T<\/code> mesiacov/štvrťrokov)<\/strong>, počiatočný sklad <code>s_0<\/code>, mesačný dopyt <code>d(t)<\/code>, nadčasová výroba <code>n(t)<\/code> a prenos nepredaných zásob <code>s(t)<\/code> z mesiaca <code>t<\/code> do <code>t+1<\/code>."], "formulas": [{"name": "2a. Základný model plánovania výroby", "exprHtml": "max  z = sum(j in 1..n) c(j) * x(j)\nza podm.:  sum(j in 1..n) a(i,j) * x(j) &lt;= b(i)   pre každý zdroj i = 1..m\n           x(j) &gt;= 0", "varsHtml": ["<code>x(j)<\/code>: množstvo vyrobeného výrobku <code>j<\/code>.", "<code>c(j)<\/code>: jednotkový zisk alebo predajná cena 1 jednotky výrobku <code>j<\/code> (príp. záporný náklad v <code>min<\/code>).", "<code>a(i,j)<\/code>: norma spotreby <code>i<\/code>-teho zdroja (strojové hodiny, kg suroviny) na 1 jednotku <code>j<\/code>.", "<code>b(i)<\/code>: celková disponibilná kapacita <code>i<\/code>-teho zdroja."]}, {"name": "2b. Model s polotovarmi (cv02 Vyrobky)", "exprHtml": "Bilancia polotovaru i:   v(i) &gt;= sum(k) r(i,k) * v(k)\nPredané množstvo i:     predaj(i) = v(i) - sum(k) r(i,k) * v(k)\nÚčelová funkcia tržieb: max sum(i) cena(i) * predaj(i)", "varsHtml": ["<code>v(i)<\/code>: <strong>celková<\/strong> výroba produktu <code>i<\/code> (teda vyrobené na predaj <strong>aj<\/strong> na ďalšie spracovanie).", "<code>r(i,k)<\/code>: koľko jednotiek polotovaru <code>i<\/code> sa spotrebuje na 1 jednotku finálneho produktu <code>k<\/code> (napr. v <code>H14<\/code>: <code>x(1) &gt;= 3*x(3); x(2) &gt;= 2*x(3)<\/code>).", "<strong>Prečo <code>(v(i) - spotreba)<\/code>?<\/strong> Polotovar spotrebovaný do <code>V3<\/code> nepredáte samostatne — jeho hodnota je už započítaná v cene finálneho <code>V3<\/code>!"]}, {"name": "2c. Viacperiodová skladová bilancia (cv02 Bicykle)", "exprHtml": "Pre t = 1:    s_0 + x(1) + n(1) - d(1) = s(1)\nPre t &gt;= 2:   s(t-1) + x(t) + n(t) - d(t) = s(t)\nÚčelovka:     min sum(t in 1..T) (c_x(t)*x(t) + c_n(t)*n(t) + c_s*s(t))", "varsHtml": ["<code>x(t)<\/code>: výroba v riadnej pracovnej dobe v období <code>t<\/code> (<code>&lt;= kapacita_riadna<\/code>).", "<code>n(t)<\/code>: výroba v nadčasoch v období <code>t<\/code> (<code>&lt;= kapacita_nadcas<\/code>).", "<code>s(t)<\/code>: zásoba na sklade <strong>na konci<\/strong> obdobia <code>t<\/code> (<code>s_0<\/code> je daný počiatočný stav pred <code>t = 1<\/code>).", "<code>d(t)<\/code>: dopyt zákazníkov v období <code>t<\/code>."]}], "exampleHtml": "<p><strong>Vzorový príklad 1 — Polotovary (<code>Q11<\/code> + <code>H14<\/code>):<\/strong> Výrobok <code>V3<\/code> vyžaduje na každý 1 ks presne <code>3<\/code> ks polotovaru <code>V1<\/code> a <code>2<\/code> ks polotovaru <code>V2<\/code>. Celková výroba nesmie klesnúť pod túto spotrebu: - Pre <code>V1<\/code>: <code>x(1) &gt;= 3*x(3)<\/code> - Pre <code>V2<\/code>: <code>x(2) &gt;= 2*x(3)<\/code> Ak navyše každú nezaradenú jednotku <code>V1<\/code> predáme po <code>500 €<\/code>, do tržieb píšeme <code>500*(x(1) - 3*x(3))<\/code>, <strong>nie<\/strong> <code>500*x(1)<\/code>.<\/p>\n<p><strong>Vzorový príklad 2 — Viacperiodová bilancia (<code>Q18<\/code>, Bicykle):<\/strong> Na začiatku 1. mesiaca sú v sklade <code>s_0 = 2<\/code> tis. bicyklov, dopyt v 1. mesiaci je <code>d(1) = 30<\/code> tis., nadčas je najviac <code>15<\/code> tis. - Sklad na konci 1. mesiaca: <code>s(1) = s_0 + x(1) + n(1) - d(1) = 2 + x(1) + n(1) - 30 = x(1) + n(1) - 28<\/code>. - Limit nadčasu: <code>n(t) &lt;= 15<\/code> (pre <code>t = 1..T<\/code>).<\/p>", "focusHtml": ["<strong>Polotovary:<\/strong> Dvojitá kontrola — 1) podmienka nezápornosti predaja <code>v_polotovar - spotreba &gt;= 0<\/code> a 2) v tržbách odpočítať spotrebované polotovary!", "<strong>Viacperiodový sklad:<\/strong> Na ľavej strane je <code>minulý sklad + výroba = dopyt + nový sklad<\/code>. Za počiatočný stav <code>s_0<\/code> sa v účelovej funkcii <strong>neplatí<\/strong> skladovacie náklady.", "<strong>Ostrý vs. mierny limit odboru (<code>V1+V2<\/code> vs <code>TP<\/code>):<\/strong> V príklade <code>TP<\/code> (<code>cv01/06<\/code>) platí <code>x1 + x2 + x3 &lt;= 150<\/code>, pričom pre skupinu TP je extra limit <code>x1 + x2 &lt;= 100<\/code> (obidve obmedzenia platia súčasne!)."]}, {"id": "G03", "area": "DU", "areaName": "3. Dopravná úloha", "title": "3. Dopravná úloha (klasická, nevyvážená a Minimax/Maximin)", "subtitle": "Priama preprava zo skladov k odberateľom, bilancia prebytku vs. nedostatku a vyrovnávanie tokov", "examplesRef": "Q21–Q34, H15–H23 (Sklady 3×4, Munícia, Sneh v Montreale, Požičovňa áut)", "distinguishHtml": ["Úloha spája <strong>dve disjunktné skupiny uzlov<\/strong> — dodávateľov/sklady <code>i = 1..m<\/code> (zásoba <code>a_i<\/code>) a odberateľov/zákazníkov <code>j = 1..n<\/code> (požiadavka <code>b_j<\/code>), preprava prebieha <strong>priamo po dvojiciach <code>(i, j)<\/code><\/strong>.", "<strong>Rozlíšenie voči <code>TOK<\/code>:<\/strong> Neexistujú žiadne prechodové uzly (<code>k<\/code>), kde by sa tovar prekladal na ďalšiu hranu.", "<strong>Rozlíšenie voči <code>DUS<\/code>:<\/strong> V zadaní sa nespomínajú percentuálne straty ani zmeny množstva počas jazdy.", "<strong>Minimax / Maximin signál:<\/strong> Namiesto súčtu nákladov chcete minimalizovať <em>najväčšie<\/em> prepravené množstvo (<code>min y<\/code>) alebo maximalizovať <em>najmenšiu<\/em> dodávku (<code>max y<\/code>)."], "formulas": [{"name": "Klasická dopravná úloha — nevyvážená (prebytok vs. nedostatok)", "exprHtml": "min  N = sum(i in 1..m, j in 1..n) c(i,j) * x(i,j)\n\n1) Prebytok zásob (sum a(i) &gt;= sum b(j)):\n   Sklady (kapacita):    sum(j in 1..n) x(i,j) &lt;= a(i)   pre i = 1..m\n   Odberatelia (dopyt):  sum(i in 1..m) x(i,j) =  b(j)   pre j = 1..n  (príp. &gt;=)\n\n2) Nedostatok zásob (sum a(i) &lt; sum b(j)):\n   Sklady (vývoz):       sum(j in 1..n) x(i,j) =  a(i)   pre i = 1..m\n   Odberatelia (strop):  sum(i in 1..m) x(i,j) &lt;= b(j)   pre j = 1..n", "varsHtml": ["<code>x(i, j) &gt;= 0<\/code>: množstvo tovaru prepravené z <code>i<\/code>-teho skladu k <code>j<\/code>-temu odberateľovi (<code>m * n<\/code> premenných, <code>m + n<\/code> základných podmienok).", "<code>c(i, j)<\/code>: jednotkové náklady (alebo vzdialenosť) na prepravu 1 jednotky po trase <code>i -&gt; j<\/code>.", "<code>a(i)<\/code>: zásoba (ponuka) v sklade <code>i<\/code>; <code>b(j)<\/code>: požadovaný dopyt odberateľa <code>j<\/code>.", "Ak <code>sum a(i) == sum b(j)<\/code> (vyvážená DÚ), oba typy podmienok majú <code>=<\/code>."]}, {"name": "Minimax a Maximin v dopravnej úlohe (H22, H23, Q29)", "exprHtml": "Minimax (minimalizovať max. prepravu zo skladu 3):   min y,  kde  forall(j in 1..n) x(3,j) &lt;= y\nMaximin (maximalizovať min. dodávku odberateľovi 1): max y,  kde  forall(i in 1..m) x(i,1) &gt;= y", "varsHtml": ["<code>y<\/code>: spojitá pomocná premenná predstavujúca hornú (pri minimax) alebo dolnú (pri maximin) hranicu všetkých príslušných tokov <code>x(i, j)<\/code>.", "Pri Minimax musí byť <code>y &gt;= x(i, j)<\/code> (t. j. <code>x(i, j) &lt;= y<\/code>) pre každú sledovanú trasu; minimalizácia <code>y<\/code> potom zrazí túto hornú hranicu presne na maximum z <code>x<\/code>."]}], "exampleHtml": "<p><strong>Vzorový príklad zo zbierky (<code>H15<\/code>, <code>H16<\/code>, <code>H17<\/code>, <code>H20<\/code>, <code>H22<\/code>, <code>H23<\/code> — Sklady <code>3 × 4<\/code>):<\/strong> Nech má každý z 3 skladov zásobu <code>100 t<\/code> a každý zo 4 odberateľov potrebuje <code>b_j<\/code> (napr. <code>O2<\/code> pýta <code>100 t<\/code>):<\/p>\n<p>1. <strong>V sklade 1 musí zostať aspoň <code>20 t<\/code> (<code>H15<\/code>):<\/strong> zo <code>100 t<\/code> smieme odviezť najviac <code>100 - 20 = 80 t<\/code> → <code>sum(j in 1..4) x(1,j) &lt;= 80<\/code>. 2. <strong>Zo skladu 1 odvezieme aspoň <code>80 t<\/code> (<code>H16<\/code>):<\/strong> súčet vývozu musí byť minimálne <code>80<\/code> → <code>sum(j in 1..4) x(1,j) &gt;= 80<\/code>. 3. <strong>Prvý sklad sa úplne vyprázdni (<code>H17<\/code>):<\/strong> odvezieme celú kapacitu <code>100 t<\/code> → <code>sum(j in 1..4) x(1,j) = 100<\/code>. 4. <strong>Druhého odberateľa nemôžeme zásobovať zo skladov 1 a 2 (<code>H20<\/code>):<\/strong> tieto prepravy sú nulové → <code>x(1,2) + x(2,2) = 0<\/code> (ekv. <code>x(1,2) = 0; x(2,2) = 0<\/code>). 5. <strong>Minimalizovať najväčšie množstvo zo skladu 3 (<code>H22<\/code>):<\/strong> zavedieme <code>y<\/code> a vyžadujeme <code>x(3,1) &lt;= y; x(3,2) &lt;= y; x(3,3) &lt;= y; x(3,4) &lt;= y<\/code> (t. j. <code>forall(j in 1..4) x(3,j) &lt;= y<\/code>).<\/p>", "focusHtml": ["<strong>Prvý index je sklad, druhý odberateľ (<code>x(i, j)<\/code>):<\/strong> Pri podmienkach na <em>sklad <code>i<\/code><\/em> fixujeme <code>i<\/code> a sumujeme cez <code>j<\/code> (<code>sum(j) x(i,j)<\/code>). Pri podmienkach na <em>odberateľa <code>j<\/code><\/em> fixujeme <code>j<\/code> a sumujeme cez <code>i<\/code> (<code>sum(i) x(i,j)<\/code>).", "<strong>Zostatok vs. Vývoz:<\/strong> „Zostane aspoň <code>r<\/code> v sklade s kapacitou <code>a<\/code>“ znamená <code>vývoz &lt;= a - r<\/code>, <strong>nie<\/strong> <code>vývoz &gt;= r<\/code>!", "<strong>Súčet ponúk vs. dopytov (<code>Q27<\/code>, <code>Q28<\/code>):<\/strong> Pred písaním rovníc v celej úlohe vždy sčítajte <code>sum a(i)<\/code> a <code>sum b(j)<\/code>. Ak je viac zásob ako dopytu, sklady musia mať <code>&lt;=<\/code>, inak je úloha <strong>neprípustná (<code>XPRS_INF<\/code>)<\/strong>!"]}, {"id": "G04", "area": "DUS", "areaName": "4. Dopravná úloha so stratami", "title": "4. Dopravná úloha so stratami (a hygroskopickým nárastom)", "subtitle": "Rozdiel medzi naloženým a doručeným množstvom a vplyv výberu definície premennej x(i, j)", "examplesRef": "Q35–Q42, H24–H26 (Munícia s 5 % stratou, H24 dvojitý význam premenných, Hygroskopický tovar)", "distinguishHtml": ["Vyzerá identicky ako klasická dopravná úloha (<code>sklad i -&gt; odberateľ j<\/code>), ale v texte sa uvádza, že <strong>počas prepravy sa <code>p %<\/code> tovaru stratí / poškodí / odparí<\/strong> (príp. naopak tovar nasaje vlhkosť a hmotnosť stúpne o <code>p %<\/code>).", "Pozorne čítajte, či sa strata vzťahuje na <strong>všetky trasy<\/strong>, alebo <strong>iba na jeden konkrétny sklad / trasu<\/strong> (<code>H25<\/code> vs <code>H26<\/code>)."], "formulas": [{"name": "Štandardná definícia: x(i, j) = množstvo NALOŽENÉ v sklade i", "exprHtml": "Sklady (nakládka):       sum(j in 1..n) x(i,j) &lt;= a(i)\nOdberatelia (doručenie): sum(i in 1..m) (1 - p(i,j)/100) * x(i,j) &gt;= b(j)   [príp. = b(j)]\nÚčelová funkcia:         min sum(i,j) c(i,j) * x(i,j)\n\n(Pri hygroskopickom náraste hmotnosti o p % platí koeficient  1 + p(i,j)/100)", "varsHtml": ["<code>x(i, j)<\/code>: množstvo <strong>naložené<\/strong> v sklade <code>i<\/code> pre odberateľa <code>j<\/code>.", "<code>k_doruč = 1 - p/100<\/code>: koeficient prežitia zásielky (pri 5 % strate dorazí <code>0.95<\/code> z naloženého množstva).", "<code>a(i)<\/code>: kapacita skladu <code>i<\/code> (obmedzuje to, čo zo skladu odíde, teda čisté <code>x(i, j)<\/code> bez koeficientu!).", "<code>b(j)<\/code>: potreba odberateľa <code>j<\/code> (obmedzuje to, čo <strong>skutočne dorazí<\/strong>, preto sú tu koeficienty <code>0.95<\/code> alebo <code>0.98<\/code>)."]}, {"name": "Alternatívna definícia z Moodle (H24): x(i, j) = množstvo PREVZATÉ odberateľom j", "exprHtml": "Odberatelia (prevzaté):  sum(i in 1..m) x(i,j) &gt;= b(j)\nSklady (musí naložiť):   sum(j in 1..n) x(i,j) / (1 - p(i,j)/100) &lt;= a(i)", "varsHtml": ["Ak <code>x(i, j)<\/code> vyjadruje množstvo, ktoré odberateľ <code>j<\/code> <strong>reálne dostane<\/strong>, na ceste so stratou <code>5 %<\/code> sa zo skladu musí naložiť <code>x(i, j) / 0.95<\/code>.", "Všimnite si v <code>H24<\/code>: oba významy premennej (<code>A<\/code> = odoslané/naložené zo skladu, <code>D<\/code> = dodané/prevzaté odberateľovi) vedú na platný lineárny model — len koeficient <code>(1 - p/100)<\/code> alebo <code>1/(1 - p/100)<\/code> stojí na inom mieste!"]}], "exampleHtml": "<p><strong>Vzorový príklad — Munícia (<code>cv06 Zhrnutie<\/code> + <code>Q37<\/code> + <code>H25/H26<\/code>):<\/strong> Sklad 1 (<code>a_1 = 600<\/code>, náklad <code>5 €/ks<\/code>) je bez straty. Zo skladu 2 (<code>a_2 = 800<\/code>, náklad <code>6 €/ks<\/code>) sa po ceste stratí <code>5 %<\/code> nákladu. Odberatelia požadujú spolu <code>1200 ks<\/code> (<code>500 + 300 + 400<\/code>).<\/p>\n<p>1. <strong>Zápis podmienky pre 1. odberateľa (dopyt <code>80<\/code> pri <code>H25<\/code> s 3 skladmi a 5 % stratou iba zo S1):<\/strong> Zo skladu 1 príde len <code>95 %<\/code>, zo skladov 2 a 3 príde celých <code>100 %<\/code>: <code>0.95*x(1,1) + x(2,1) + x(3,1) &gt;= 80<\/code> (príp. <code>= 80<\/code>). 2. <strong>Prečo je v Munícii so stratou zo skladu 2 optimum <code>6789,47 €<\/code> a nie <code>6600 * 1.05<\/code>?<\/strong> - Zo skladu 1 pošleme plných <code>600 ks<\/code> za <code>600 * 5 = 3000 €<\/code> (bez straty). - Odberateľom chýba ešte <code>1200 - 600 = 600<\/code> <strong>doručených<\/strong> kusov zo skladu 2. - Aby pri 5 % strate dorazilo <code>600<\/code> kusov, zo skladu 2 musíme naložiť <strong><code>600 / 0.95 = 631,5789 ks<\/code><\/strong>! - Náklad za naložených <code>631,5789 ks<\/code> zo S2 je <code>631,5789 * 6 = 3789,4737 €<\/code> → spolu <strong><code>3000 + 3789,47 = 6789,47 €<\/code><\/strong>.<\/p>", "focusHtml": ["<strong>Pasca <code>1 / 0.95<\/code> vs <code>* 1.05<\/code>:<\/strong> Ak sa stratí <code>5 %<\/code>, deliť treba <strong><code>0.95<\/code><\/strong> (nie násobiť <code>1.05<\/code>, lebo <code>600 * 1.05 = 630<\/code> po 5 % strate dá len <code>630 * 0.95 = 598.5 &lt; 600<\/code>!).", "<strong>Skontrolujte rozsah straty:<\/strong> V <code>H25<\/code> je 5 % strata <strong>len zo skladu 1<\/strong> (<code>0.95*x(1,1) + x(2,1) + x(3,1)<\/code>), kým v <code>H26<\/code> je 2 % strata <strong>na všetkých trasách<\/strong> (<code>0.98*(x(1,1) + x(2,1) + x(3,1))<\/code>).", "<strong>Hygroskopický nárast (<code>Q40<\/code>–<code>Q42<\/code>):<\/strong> Ak materiál po ceste naberie <code>p %<\/code> hmotnosti (<code>1.05<\/code>), pri zadaní množstva <em>doručeného<\/em> pozor na to, že k zákazníkovi dorazí viac než bolo naložené (<code>sum 1.05*x(i,j) &gt;= b(j)<\/code>), ale sklad obmedzuje stále len naložené <code>sum x(i,j) &lt;= a(i)<\/code>."]}, {"id": "G05", "area": "ZM", "areaName": "5. Zmiešavacia úloha", "title": "5. Zmiešavacia úloha (vážený aritmetický priemer)", "subtitle": "Lineárna úprava kvalitatívnych požiadaviek zmesi, podiely vs. hmotnosti a pasca percent", "examplesRef": "Q43–Q52, H27–H32 (CowFood, Oceliarne, Lieh, Benzín, Zmrzlina)", "distinguishHtml": ["Úloha mieša viacero vstupných surovín (<code>1..n<\/code>) do <strong>jedného (alebo viacerých) výsledného produktu/zmesi<\/strong> o celkovej hmotnosti/objeme <code>M<\/code> (napr. <code>8 t<\/code> krmiva, <code>500 t<\/code> ocele, <code>1 l<\/code> liehu).", "V tabuľke sú ceny surovín a <strong>intenzívne kvalitatívne parametre<\/strong> (obsah látky v <code>%<\/code>, oktánové číslo, výhrevnosť <code>[MJ/l]<\/code>), ktorých vlastnosť v zmesi sa určuje ako <strong>vážený aritmetický priemer<\/strong>."], "formulas": [{"name": "Zápis bilancie hmotnosti a linearizovanej podmienky kvality", "exprHtml": "Účelová funkcia:      min  sum(i in 1..n) c(i) * x(i)\nBilancia zmesi:       sum(i in 1..n) x(i) = M   [ak miešame 1 jednotku zmesi, tak M = 1]\n\nKvalita (pôvodne nelineárny vážený priemer):\n   (sum p(i)*x(i)) / (sum x(i)) &gt;= P_min   ==&gt;   sum(i) p(i) * x(i) &gt;= P_min * M\n\nAk celková hmotnosť (sum x(i)) nie je vopred konštanta M:\n   sum(i in 1..n) (p(i) - P_min) * x(i) &gt;= 0   (resp. &lt;= 0 pre hornú hranicu P_max)", "varsHtml": ["<code>x(i) &gt;= 0<\/code>: hmotnosť / objem <code>i<\/code>-tej suroviny v zmesi (alebo podiel, ak <code>sum x(i) = 1<\/code>).", "<code>c(i)<\/code>: cena za 1 kg / 1 t / 1 l <code>i<\/code>-tej suroviny.", "<code>M<\/code>: požadované celkové množstvo výslednej zmesi (napr. <code>M = 8 t<\/code> pri <code>CowFood<\/code>, <code>M = 500 t<\/code> pri <code>Oceliarňach<\/code>, <code>M = 1 l<\/code> pri <code>Liehu<\/code>).", "<code>p(i)<\/code>: obsah sledovanej zložky (napr. <code>1.3<\/code> % Mn) alebo parameter (výhrevnosť) v 1 jednotke suroviny <code>i<\/code>.", "<code>P_min<\/code> / <code>P_max<\/code>: dolný / horný limit kvality v zmesi vyjadrený <strong>v rovnakej jednotke<\/strong> ako <code>p(i)<\/code>!"]}, {"name": "Pravidlo zjednotenia percent (hlavný zdroj chýb v Moodle)", "exprHtml": "Varianta A — všetko v %:          1.3*x1 + 1.2*x3 &lt;= 1.6*500\nVarianta B — všetko v podieloch:  0.013*x1 + 0.012*x3 &lt;= 0.016*500\nVarianta C — čistá látka (kg/t):  0.90*x2 + 0.004*x3 &gt;= 0.004*500 (= 2 t Cr)", "varsHtml": ["Všimnite si zhodu oboch strán: ak naľavo píšete <strong><code>90<\/code> a <code>0.4<\/code><\/strong> (t. j. v percentách bez <code>/100<\/code>), napravo <strong>musí<\/strong> stáť <strong><code>0.4 * 500<\/code><\/strong> (<code>200<\/code>), a nie <code>0.004 * 500<\/code> (<code>2<\/code>)!", "Rovnako pri <code>CowFood<\/code>: <code>7 % = 0.07<\/code>, <code>3.7 % = 0.037<\/code>, <code>25 % = 0.25<\/code>, limit <code>6 % = 0.06<\/code> → obe strany v rovnakom formáte a pravá strana vždy vynásobená celkovou dávkou <code>8<\/code> (<code>&lt;= 0.06*8<\/code>, alebo v percentách <code>7*x(1) + 3.7*x(2) + 25*x(3) &lt;= 6*8<\/code>)!"]}], "exampleHtml": "<p><strong>Vzorový príklad 1 — Oceliarne (<code>Q43<\/code>, <code>H31<\/code>, <code>500 t<\/code> ocele):<\/strong> Suroviny (<code>x1, x2, x3<\/code>): liatina (<code>1.3 %<\/code> Mn, <code>0 %<\/code> Cr), chróm (<code>0 %<\/code> Mn, <code>90 %<\/code> Cr), odpad (<code>1.2 %<\/code> Mn, <code>0.4 %<\/code> Cr). Cieľ: <code>500 t<\/code> ocele s <strong>Cr aspoň <code>0.4 %<\/code><\/strong> a <strong>Mn najviac <code>1.6 %<\/code><\/strong>.<\/p>\n<p>- <strong>Množstvo Cr (<code>&gt;= 0.4 %<\/code> v <code>500 t<\/code>):<\/strong> <code>x1<\/code> má <code>0 %<\/code> Cr, preto neprispieva. - V percentách (<code>H31<\/code>-štýl / <code>Q43<\/code>): <strong><code>90*x(2) + 0.4*x(3) &gt;= 0.4*500<\/code><\/strong> (ekvivalentne <code>0.9*x(2) + 0.004*x(3) &gt;= 2<\/code>). - <strong>Množstvo Mn (<code>&lt;= 1.6 %<\/code> v <code>500 t<\/code>, <code>H31<\/code>):<\/strong> chróm <code>x2<\/code> má <code>0 %<\/code> Mn, preto ho v podmienke vynecháme: - <strong><code>1.3*x1 + 1.2*x3 &lt;= 1.6*500<\/code><\/strong> (ekvivalentne <code>0.013*x1 + 0.012*x3 &lt;= 8<\/code>).<\/p>\n<p><strong>Vzorový príklad 2 — Lieh (<code>cv06 MO_Zhrnutie<\/code>, <code>19,40 €/l<\/code>):<\/strong> Miešame <code>1 l<\/code> liehu (<code>x1 + x2 + x3 = 1<\/code>) s min. <code>60 %<\/code> alkoholu (<code>30*x1 + 50*x2 + 80*x3 &gt;= 60*1<\/code>) a výhrevnosťou min. <code>12 MJ/l<\/code> (<code>9*x1 + 11*x2 + 16*x3 &gt;= 12*1<\/code>) pri <code>min 11*x1 + 18*x2 + 25*x3<\/code>. Optimum leží pri <code>(0.4, 0, 0.6)<\/code> s cenou <strong><code>19.4 €/l<\/code><\/strong>.<\/p>", "focusHtml": ["<strong>Nikdy nepísať podiel dvoch premenných:<\/strong> Zlomek <code>(Σ p_i*x_i) / (Σ x_i) &gt;= P<\/code> je <strong>nelineárny<\/strong> — vždy ho vynásobte menovateľom <code>(Σ x_i)<\/code> alebo pevným množstvom <code>M<\/code>!", "<strong>Kontrola zložiek s 0 %:<\/strong> Ak surovina neobsahuje sledovanú látku (<code>0 %<\/code>), jej člen zmizne z ľavej strany kvalitatívnej podmienky (ako <code>x2<\/code> pri mangáne v Oceliarňach), <strong>nikdy ju však nezabudnite v rovnici celkovej hmotnosti <code>x1 + x2 + x3 = M<\/code>!<\/strong>", "<strong>Nezabudnúť <code>* M<\/code> na pravej strane:<\/strong> Napr. pri <code>8 tonách<\/code> krmiva <code>CowFood<\/code> píšeme <code>&lt;= 0.06 * 8<\/code> (t. j. <code>0.48 t<\/code> vlákniny), nie <code>&lt;= 0.06<\/code>!"]}, {"id": "G06", "area": "REZ", "areaName": "6. Rezné úlohy", "title": "6. Rezné úlohy (Cutting / Trim Problem)", "subtitle": "Rozrezávanie vstupného materiálu podľa rezných plánov (schém) na požadované kusy s min. spotrebou", "examplesRef": "Q53–Q60, H33–H37 (SchoolDesk, Plechy, Betonárska oceľ, Dielňa)", "distinguishHtml": ["Zadaný je <strong>jednotný rozmer vstupného materiálu<\/strong> (napr. 6 m tyč, tabuľa plechu) a <strong>zoznam požadovaných kratších dielov/rozmerov<\/strong> v určitom počte kusov.", "Súčasťou zadania je <strong>tabuľka rezných schém (plánov <code>1..n<\/code>)<\/strong>, kde stĺpce sú schémy a riadky hovoria, koľko jednotlivých dielov sa získa z 1 vstupného kusa podľa danej schémy."], "formulas": [{"name": "Všeobecný model reznej úlohy (MO_02, cv05)", "exprHtml": "min  Z = sum(j in 1..n) c * x(j)   [kde c = 1, ak minimalizujeme počet tyčí/tabúľ: min sum(j) x(j)]\nza podm.:  sum(j in 1..n) a(i,j) * x(j) &gt;= d(i)   pre každý požadovaný rozmer i = 1..m\n           x(j) &gt;= 0", "varsHtml": ["<strong>KRITICKÉ — význam <code>x(j)<\/code>:<\/strong> <code>x(j)<\/code> je <strong>počet tyčí / tabúľ spracovaných podľa <code>j<\/code>-teho rezného plánu (schémy)<\/strong> — v <strong>žiadnom prípade<\/strong> to nie je počet výsledných dielov typu <code>j<\/code>!", "<code>n<\/code>: počet rôznych možných rezných schém (stĺpcov matice <code>A<\/code>). Napr. pri <code>Plechy<\/code> (<code>H34<\/code>) je 6 schém → <strong>6 rozhodovacích premenných<\/strong>.", "<code>a(i, j)<\/code>: koľko kusov <code>i<\/code>-teho požadovaného dielu sa vyreže z 1 vstupnej tyče pri použití schémy <code>j<\/code>.", "<code>d(i)<\/code>: celkový požadovaný počet kusov <code>i<\/code>-teho dielu (<strong>pozor na prepočet zo stolov/súprav!<\/strong>)."]}], "exampleHtml": "<p><strong>Vzorový príklad 1 — SchoolDesk (<code>Q53<\/code>, <code>Q54<\/code>, <code>H33<\/code>):<\/strong> Vyrábame <strong>125 školských lavíc<\/strong>. Každá lavica potrebuje <strong><code>4<\/code> dlhé rúrky (<code>90 cm<\/code>)<\/strong> a <strong><code>2<\/code> krátke rúrky (<code>60 cm<\/code>)<\/strong> + <strong><code>2<\/code> rúrky (<code>45 cm<\/code>)<\/strong> <em>(podľa variantu zadania)<\/em>. Schémy rezania tyčí dávajú <code>a(dlhé, j)<\/code> kusov pre <code>j = 1..6<\/code>:<\/p>\n<p>- <strong>Premenné (<code>Q53<\/code>):<\/strong> <code>x(i)<\/code> (<code>i = 1..6<\/code>) = počet vstupných tyčí spracovaných podľa <code>i<\/code>-teho plánu. - <strong>Účelová funkcia (<code>H33<\/code>):<\/strong> <code>min sum(i in 1..6) x(i)<\/code> (minimalizujeme počet všetkých narezaných tyčí). - <strong>Dopyt po dlhých rúrkach (<code>Q54<\/code>):<\/strong> <code>125<\/code> lavíc × <code>4<\/code> rúrky/lavica = <strong><code>500<\/code> kusov<\/strong> → ak schémy <code>2, 4, 6<\/code> dávajú postupne <code>1, 2, 1<\/code> dlhú rúrku, píšeme <strong><code>x(2) + 2*x(4) + x(6) &gt;= 500<\/code><\/strong>!<\/p>\n<p><strong>Vzorový príklad 2 — Plechy (<code>H34–H37<\/code>):<\/strong> Zo vstupného plechu máme <strong>6 rezných schém<\/strong> (<code>x(1)..x(6)<\/code> → odpoveď v <code>H34<\/code> je <strong><code>6<\/code> premenných<\/strong>) na výrobu 3 rozmerov (<code>36×50<\/code>: min 8 ks, <code>24×36<\/code>: min 13 ks, <code>20×60<\/code>: min 5 ks). Každému rozmeru zodpovedá <strong>jeden riadok<\/strong> tabuľky → jedna nerovnosť <code>&gt;=<\/code>: - <code>36×50<\/code>: <code>2*x(1) + x(2) + x(3) + x(5) &gt;= 8<\/code> - <code>24×36<\/code>: <code>x(1) + 2*x(2) + 2*x(4) + x(5) + 5*x(6) &gt;= 13<\/code> - <code>20×60<\/code>: <code>2*x(3) + 2*x(4) + x(5) &gt;= 5<\/code><\/p>", "focusHtml": ["<strong>Počet premenných = počet stĺpcov (schém):<\/strong> Nie počet rozmerov dielov! Ak tabuľka uvádza 6 spôsobov rezania a 3 typy výrezov, máte <code>6<\/code> premenných a <code>3<\/code> štrukturálne podmienky.", "<strong>Vždy skontrolujte násobky na 1 finálny výrobok:<\/strong> Ak máte dodať <code>125<\/code> stolov a každý má <code>4<\/code> nohy, pravá strana pre nohy je <code>500<\/code> (<code>4 * 125<\/code>), nikdy nie <code>125<\/code>!", "<strong>Znamienko <code>&gt;=<\/code> (nie <code>=<\/code>):<\/strong> Drobné nadbytočné kusy môžu ostať v odpade/zásobe, dôležité je <strong>aspoň pokryť<\/strong> požadovaný dopyt <code>d(i)<\/code> (navyše spojité LP na rovnosti niekedy nemá riešenie!)."]}, {"id": "G07", "area": "TOK", "areaName": "7. Tokové úlohy", "title": "7. Sieťové a tokové úlohy (Najkratšia cesta, Najlacnejší tok, Max. tok)", "subtitle": "Orientovaný graf s vnútornými uzlami, zákon zachovania toku a porovnanie troch variantov úloh", "examplesRef": "Q61–Q66 (Cv05_Toky_a najkratšia cesta, Cv05_Toky_b najlacnejší tok, MaxFlow vs Shortest Path)", "distinguishHtml": ["Zadanie zobrazuje <strong>sieť (orientovaný graf) s uzlami <code>1..N<\/code><\/strong> (zdroj <code>1<\/code>, prechodové vnútorné uzly <code>2..N-1<\/code>, cieľ/ústie <code>N<\/code>) a hranami <code>(i, j)<\/code> s dĺžkou/cenou <code>c(i, j)<\/code> alebo kapacitou <code>k(i, j)<\/code>.", "<strong>Tri varianty v zadaní:<\/strong><br>  • <em>Najkratšia cesta (<code>Toky_a<\/code>):<\/em> posielame <code>1<\/code> jednotku zo zdroja <code>1<\/code> do <code>N<\/code> bez horných kapacít hrán (<code>min sum d(i,j)*x(i,j)<\/code>).<br>  • <em>Najlacnejší tok (<code>Toky_b<\/code>):<\/em> posielame pevné množstvo <code>Q<\/code> (napr. <code>10<\/code>) pri dodržaní kapacít <code>k(i,j)<\/code> (<code>min sum c(i,j)*x(i,j)<\/code>).<br>  • <em>Maximálny tok:<\/em> chceme prepraviť zo <code>1<\/code> do <code>N<\/code> čo najviac (<code>max Tok<\/code>), pričom kapacity <code>k(i,j)<\/code> nesmieme prekročiť."], "formulas": [{"name": "Univerzálny zákon zachovania toku („U nás se nekrade!“) (MO_04, cv05)", "exprHtml": "1) Zdroj (uzol 1):        sum(j) x(1,j) - sum(i) x(i,1) = Tok\n2) Vnútorný uzol (k=2..N-1):  sum(i) x(i,k) = sum(j) x(k,j)   (prítok do k = odtok z k)\n3) Ústie / cieľ (uzol N): sum(i) x(i,N) - sum(j) x(N,j) = Tok\n4) Kapacity hrán:         0 &lt;= x(i,j) &lt;= k(i,j)   pre existujúce hrany (i, j)", "varsHtml": ["<code>x(i, j) &gt;= 0<\/code>: tok (dopravné množstvo) po orientovanej hrane z uzla <code>i<\/code> do uzla <code>j<\/code>.", "<code>Tok<\/code>: celkové množstvo vyslané zo zdroja <code>1<\/code> do cieľa <code>N<\/code>:<br>  • pri <strong>najkratšej ceste<\/strong> je to konštanta <strong><code>Tok = 1<\/code><\/strong> a účelovka je <strong><code>min sum c(i,j)*x(i,j)<\/code><\/strong>;<br>  • pri <strong>najlacnejšom toku<\/strong> je to zadaná konštanta <strong><code>Tok = Q<\/code><\/strong> (napr. <code>10<\/code>) a účelovka je <strong><code>min sum c(i,j)*x(i,j)<\/code><\/strong>;<br>  • pri <strong>maximálnom toku<\/strong> je <code>Tok<\/code> neznáma a účelovka je <strong><code>max Tok<\/code><\/strong> (ekv. <code>max sum(j) x(1,j) - sum(i) x(i,1)<\/code>).", "<code>exists(c(i, j))<\/code>: v Moseli pri riedkej sieti vytvárame premenné <code>create(x(i,j))<\/code> len pre existujúce hrany!"]}], "exampleHtml": "<p><strong>Vzorový príklad — Konkrétny prepis na tú istú sieť (<code>Q61<\/code>, <code>Q62<\/code>, <code>Q63a/b<\/code>):<\/strong> Predstavte si uzol <code>4<\/code>, do ktorého vchádzajú hrany <code>(1,4)<\/code>, <code>(3,4)<\/code> a vychádzajú <code>(4,5)<\/code>, <code>(4,6)<\/code>.<\/p>\n<p>- <strong>Podmienka pre vnútorný uzol <code>4<\/code> (platí rovnako vo všetkých 3 variantoch!):<\/strong> <code>x(1,4) + x(3,4) = x(4,5) + x(4,6)<\/code> (čo príde, to musí odísť). - <strong>Rozdiel podľa typu úlohy:<\/strong> 1) <strong>Najkratšia cesta z <code>1<\/code> do <code>9<\/code> (<code>Toky_a<\/code>):<\/strong> <code>sum(j) x(1,j) = 1<\/code>, bez horných obmedzení kapacít, cieľ <code>min sum d(i,j)*x(i,j)<\/code> (v <code>Q63b<\/code> vychádza dĺžka <strong><code>230<\/code><\/strong>). 2) <strong>Najlacnejší tok objemu <code>10<\/code> (<code>Toky_b<\/code>):<\/strong> <code>sum(j) x(1,j) = 10<\/code>, na každej hrane <code>x(i,j) &lt;= k(i,j)<\/code>, cieľ <code>min sum c(i,j)*x(i,j)<\/code> (cena <strong><code>79<\/code><\/strong>). 3) <strong>Maximálny tok z <code>1<\/code> do <code>9<\/code> (<code>Q63a<\/code>):<\/strong> účelová funkcia maximalizuje odtok zo zdroja <code>1<\/code> (<code>max sum(j) x(1,j)<\/code> resp. <code>max Tok<\/code>), ceny hrán sa nepoužívajú, obmedzujú iba kapacity <code>k(i,j)<\/code> (max tok <strong><code>310<\/code><\/strong>).<\/p>", "focusHtml": ["<strong>Nikdy nepísať <code>prítok = odtok<\/code> pre zdroj <code>1<\/code> ani cieľ <code>N<\/code>:<\/strong> V <code>forall(k in 2..N-1)<\/code> sú <strong>výlučne vnútorné uzly<\/strong>; zdroj musí mať čistý odtok <code>+Tok<\/code> a cieľ čistý prítok <code>+Tok<\/code>!", "<strong>Rozlišujte ceny vs. kapacity:<\/strong> Pri úlohe <strong>maximálneho toku<\/strong> na dĺžkach/cenách hrán <code>c(i,j)<\/code> nezáleží — obmedzujú vás iba kapacity <code>k(i,j)<\/code>. Pri <strong>najkratšej ceste<\/strong> zasa nepoužívate kapacity <code>k(i,j)<\/code>.", "<strong>Lineárna závislosť uzlov:<\/strong> Zdroj <code>1<\/code> + vnútorné uzly <code>2..N-1<\/code> už automaticky vynútia bilanciu v cieli <code>N<\/code>, preto v Moseli niekedy rovnicu pre <code>N<\/code> ani netreba (no zapísať ju neškodí)."]}, {"id": "G08", "area": "CIT", "areaName": "8. Analýza citlivosti", "title": "8. Analýza citlivosti a úzke profily (cv06)", "subtitle": "Interpretácia getact, getslack, úzkych profilov zdrojov a prahovej ceny nového výrobku", "examplesRef": "Q67–Q72 (Cv06_Vyrobky_citlivost.mos, experimentálne vyšetrovanie rezerv)", "distinguishHtml": ["Otázka cituje hodnoty <code>getact(podm)<\/code>, <code>getslack(podm)<\/code> po spustení optimalizácie, prípadne sa pýta, <strong>ktorý zdroj treba rozšíriť pre zvýšenie zisku/odbytu<\/strong> alebo <strong>akú cenu musí mať doteraz nevyrábaný výrobok (<code>x = 0<\/code>)<\/strong>."], "formulas": [{"name": "Vzťah aktivity, rezervy a pravej strany podmienky aᵀ·x <= b", "exprHtml": "getact(c)   = ľavá strana podmienky c v optime   (skutočne spotrebované množstvo)\ngetslack(c) = b - getact(c) &gt;= 0                 (nevyužitá rezerva do limitu b)\n\n• getslack(c) &gt; 0  ==&gt;  zdroj NIE JE úzky profil (tieňová cena = 0; pridaním zdroja sa optimum nezlepší)\n• getslack(c) = 0  ==&gt;  zdroj JE plne vyčerpaný (úzky profil; jeho zvýšenie môže zlepšiť optimum až po bod zlomu)", "varsHtml": ["<code>c<\/code>: pomenovaná štrukturálna podmienka v Moseli definovaná cez <code>:=<\/code> (napr. <code>sur := ... &lt;= 1400<\/code>).", "<code>b<\/code>: pôvodný limit pravej strany (napr. <code>1400 t<\/code> suroviny, <code>1200 hod<\/code> zariadenia).", "<strong>Bod zlomu:<\/strong> keď postupne pridávame zdroje úzkemu profilu <code>c_1<\/code>, účelová funkcia rastie lineárne len dovtedy, kým iná podmienka <code>c_2<\/code> nespotrebuje celú svoju rezervu (<code>getslack(c_2) -&gt; 0<\/code>)."]}], "exampleHtml": "<p><strong>Vzorový príklad (<code>Cv06_Vyrobky_citlivost.mos<\/code>, <code>Q67–Q70<\/code>):<\/strong> V chemickom závode dosiahneme max. odbyt <strong><code>600 000 €<\/code><\/strong> pri riešení <code>v = (400, 400, 0, 200)<\/code> (výrobok <code>V3<\/code> sa nevyrába!). Výpis po optimalizácii hlási: - <code>zar<\/code> (<code>&lt;= 1200 hod<\/code>): <code>getact(zar) = 1100<\/code>, <strong><code>getslack(zar) = 100 &gt; 0<\/code><\/strong> - <code>sur<\/code> (<code>&lt;= 1400 t<\/code>): <code>getact(sur) = 1400<\/code>, <strong><code>getslack(sur) = 0<\/code><\/strong><\/p>\n<p><strong>Závery priamo na test:<\/strong> 1. Má zmysel kúpiť ďalšie strojové hodiny na <code>zar<\/code>? <strong>Nie!<\/strong> Zostáva <code>100<\/code> nevyužitých hodín, zisk ostane <code>600 000 €<\/code>. 2. Ktorý zdroj brzdí ďalší rast? <strong>Surovina <code>sur<\/code><\/strong> (<code>getslack = 0<\/code> — úzky profil). 3. Prečo sa <code>V3<\/code> nevyrába (<code>v3 = 0<\/code>)? Jeho súčasná cena (<code>1200 €<\/code>) nepokryje stratu tržby iných výrobkov, ktoré by museli ustúpiť na spoločných úzkych zdrojoch. Prahom vstupu je cena vyššia než jeho náklady príležitosti (v danom experimente <code>~1393 €<\/code>).<\/p>", "focusHtml": ["<strong>Nulový <code>getslack<\/code> ≠ problém:<\/strong> Práve naopak! <code>getslack = 0<\/code> označuje <strong>plne vyťažený (úzky) zdroj<\/strong>, ktorý jediný má nenulovú marginálnu hodnotu pri rozširovaní kapacity.", "<strong>Pomenovanie <code>:=<\/code> je povinné:<\/strong> Aby ste v Moseli mohli zavolať <code>getact(zar)<\/code> alebo <code>getslack(zar)<\/code>, podmienka musí byť pomenovaná operátorom <code>:=<\/code> (<code>zar := ...<\/code>), nie obyčajným anonymným zápisom.", "<strong>Pri <code>&gt;= b<\/code> je vzťah opačný:<\/strong> Pri obmedzení minimálneho pokrytia (<code>a*x &gt;= b<\/code>) udáva <code>getslack<\/code> prebytok nad požiadavku (<code>getact - b &gt;= 0<\/code>)."]}, {"id": "G09", "area": "SIM", "areaName": "9. Simplex a teória lineárneho programovania", "title": "9. Simplexová metóda, geometria LP a kanonický tvar", "subtitle": "Konvexita prípustnej množiny, možné počty optím, stavy riešiča XPRS_* a prevod na rovnosti", "examplesRef": "Q73–Q83, H38–H45 (Rozpoznanie nekonvexných 2D množín, Počet optím, Prevod do kanonického tvaru)", "distinguishHtml": ["Teoretické alebo grafické otázky (<code>H38–H45<\/code>, <code>Q73–Q83<\/code>): obrázok 2D množiny, otázka „koľko optimálnych riešení môže mať LP“, pravidlo zastavenia simplexovej metódy, stavy <code>XPRS_INF<\/code>/<code>XPRS_UNB<\/code>, alebo príkaz „preveďte podmienky do kanonického tvaru“."], "formulas": [{"name": "Prevod do kanonického tvaru (MO_03, Q77, Q81)", "exprHtml": "1) Účelová funkcia:       min f(x)  &lt;=&gt;  max (-f(x))\n2) Nerovnica &lt;= b:        a*x &lt;= b   --&gt;  a*x + s = b   (s &gt;= 0, prídatná rezerva)\n3) Nerovnica &gt;= b:        a*x &gt;= b   --&gt;  a*x - s = b   (s &gt;= 0, prídatný prebytok)\n4) Voľná premenná (x∈R):  x = x_plus - x_minus        (x_plus &gt;= 0, x_minus &gt;= 0)\n5) Záporná pravá strana:  a*x = -5   --&gt;  -a*x = 5    (vynásobiť celú rovnicu -1)", "varsHtml": ["<code>s &gt;= 0<\/code>: nová nezáporná <strong>prídatná (doplnková) premenná<\/strong> pridaná do každej nerovnice zvlášť (<code>s_1, s_2, ...<\/code>).", "Nikdy nemeňte znamienko iba pri jednom člene — pri násobení <code>-1<\/code> obráťte znamienka všetkých členov na pravej aj ľavej strane!"]}, {"name": "Základné vety a stavy riešiča spojitého LP (MO_03)", "exprHtml": "• Prípustná množina M spojitého LP je vždy KONVEXNÝ POLYÉDER (úsečka spájajúca 2 body M celá leží v M).\n• Počet optimálnych riešení je vždy:  0  |  1  |  nekonečne veľa   (nikdy presne 2, 3 ani 4!).\n• getprobstat:  XPRS_OPT (optimálne)  |  XPRS_INF (prázdna množina)  |  XPRS_UNB (neohraničená ÚF).", "varsHtml": ["<strong>Pravidlo zastavenia simplexovej metódy (<code>H38<\/code>):<\/strong> Keď sa v aktuálnom vrchole už nedá pohnúť po žiadnej hrane tak, aby sa hodnota ÚF zlepšila, z konvexity LP <strong>exaktne a vždy<\/strong> vyplýva, že ide o globálne optimum (pre spojité LP!).", "<strong>Jednobodová množina (<code>H44<\/code>):<\/strong> Ak <code>M<\/code> tvorí iba jediný bod, má práve <strong>1<\/strong> optimálne riešenie. <strong>Rovnobežná ÚF s hranou (<code>H45<\/code>):<\/strong> ak optimum leží v dvoch rôznych susedných vrcholoch, potom je optimálny celý úsek medzi nimi → <strong>nekonečne veľa<\/strong> riešení!"]}], "exampleHtml": "<p><strong>Vzorový príklad 1 — Ktorá 2D množina NEPATRÍ úlohe LP (<code>H39–H43<\/code>)?<\/strong> - <strong>Trojuholník (<code>H43<\/code>), úsečka (<code>H41<\/code>), otvorený neohraničený uhol medzi dvoma polpriamkami (<code>H42<\/code>):<\/strong> všetko sú prieseky polrovín a každá úsečka vnútri leží celá v množine → <strong>PATRIA k LP!<\/strong> - <strong>Tvar „L“ s vnútorným zárezom (<code>H39<\/code>) alebo 3 izolované diskrétne body (<code>H40<\/code>):<\/strong> spojnica dvoch krajných bodov vychádza mimo množiny → množina je <strong>nekonvexná<\/strong>, teda <strong>NEMÔŽE<\/strong> byť prípustnou množinou spojitého LP!<\/p>\n<p><strong>Vzorový príklad 2 — Prevod do kanonického tvaru (<code>Q81<\/code>):<\/strong> Úloha: <code>min (4*x1 - 7*x2)<\/code> za podmienok <code>x1 + 5*x2 &gt;= 12<\/code>, <code>-x1 + 2*x2 &lt;= -3<\/code>, <code>x1, x2 &gt;= 0<\/code>. 1. Účelová funkcia na <code>max<\/code>: <code>max (-4*x1 + 7*x2)<\/code> (resp. <code>7*x2 - 4*x1<\/code>). 2. Prvá nerovnica (<code>&gt;=<\/code>): odčítame prebytok <code>s1 &gt;= 0<\/code> → <code>x1 + 5*x2 - s1 = 12<\/code>. 3. Druhá nerovnica (<code>&lt;= -3<\/code>): najprv <code>+ s2 = -3<\/code>, potom vynásobiť <code>-1<\/code> (aby bola pravá strana <code>&gt;= 0<\/code>!): <code>x1 - 2*x2 - s2 = 3<\/code> (alebo ekvivalentne z obrátenia nerovnosti <code>x1 - 2*x2 &gt;= 3<\/code>).<\/p>", "focusHtml": ["<strong>Prídatná premenná <code>+ s<\/code> vs <code>- s<\/code>:<\/strong> Zapamätajte si: pri <code>&lt;=<\/code> je ľavá strana <em>menšia<\/em>, takže jej niečo chýba → <strong>pripočítame <code>+ s<\/code><\/strong>. Pri <code>&gt;=<\/code> ľavá strana <em>prevyšuje<\/em>, takže prebytok <strong>odčítame <code>- s<\/code><\/strong>!", "<strong>Neohraničená množina ≠ <code>XPRS_UNB<\/code> (<code>Q09<\/code>, <code>Q79<\/code>, <code>H42<\/code>):<\/strong> Aj nad neohraničenou množinou (<code>x &gt;= 0, y &gt;= 0<\/code>) môže existovať konečné optimum (napr. <code>min x + y<\/code> má optimum <code>(0, 0)<\/code>). Úloha je <code>XPRS_UNB<\/code> iba vtedy, ak účelová funkcia v neohraničenom smere zlepšuje svoju hodnotu do nekonečna!", "<strong>Rozpoznanie obrázkov v Moodle (<code>H39–H45<\/code>):<\/strong> Vždy použite <strong>test úsečky<\/strong> — spojte v duchu 2 body v obrázku; ak čiara pretne prázdne miesto (zárez alebo medzeru medzi bodmi), taký útvar do spojitého LP nepatrí."]}, {"id": "G10", "area": "MOS", "areaName": "10. Mosel a interpretácia zápisov", "title": "10. Jazyk FICO Xpress Mosel — syntax a interpretácia", "subtitle": "Deklarácie mpvar, polia, filtre | v cykloch forall/sum, priradenie := a maticové indexy", "examplesRef": "Q84–Q93, H46–H51 (Výpisy getsol, podmienky sum(j) vs sum(i), dynamic array)", "distinguishHtml": ["Otázka zobrazuje úryvok kódu Moselu (<code>declarations ... mpvar<\/code>, <code>forall(...)<\/code>, <code>sum(...)<\/code>, <code>if getprobstat = XPRS_OPT<\/code>, <code>writeln(...)<\/code>) a pýta sa buď na <strong>výsledok výpisu<\/strong> (čo sa vytlačí pri daných číslach), alebo na <strong>význam riadku modelu<\/strong> či <strong>opravu chyby<\/strong>."], "formulas": [{"name": "Kľúčové konštrukcie Moselu pre TEST 1", "exprHtml": "mpvar:           predvolene spojitá premenná &gt;= 0  (is_free -&gt; x in R, is_integer, is_binary)\n:= vs =:         := definuje/pomenúva výraz alebo podmienku (c := sum(...) &lt;= 10);  = je rovnica v modeli\nforall vs sum:   forall(i in 1..3) sum(j in 1..4) x(i,j) &lt;= a(i)   (pre KAŽDÉ i vytvor podmienku súčtu cez j)\nFilter |:        forall(i in 1..3, k in 1..3 | (i &lt;&gt; k) and (getsol(x(i,k)) &gt; 0))  (&lt;=&gt; nerovná sa: &lt;&gt;)\ndynamic array:   forall(i in U, j in U | exists(c(i,j))) create(x(i,j))", "varsHtml": ["<code>sum(j in 1..4) x(3,j) &lt;= a(3)<\/code> (<code>H49<\/code>): prvý index <code>3<\/code> je pevný (3. sklad), beží <code>j<\/code> cez odberateľov → <strong>množstvo odvezené zo 3. skladu k všetkým odberateľom neprekročí jeho zásobu <code>a(3)<\/code><\/strong>.", "<code>sum(i in 1..3) x(i,2) = b(2)<\/code> (<code>H50<\/code>): druhý index <code>2<\/code> je pevný (2. odberateľ), beží <code>i<\/code> cez sklady → <strong>uspokojenie požiadavky 2. odberateľa zo všetkých skladov<\/strong>.", "<code>getobjval<\/code> / <code>getsol(x)<\/code> / <code>getact(podm)<\/code> / <code>getslack(podm)<\/code>: volajú sa <strong>až po<\/strong> <code>minimize(...)<\/code> alebo <code>maximize(...)<\/code>!"]}], "exampleHtml": "<p><strong>Vzorový príklad — Interpretácia výpisových filtrov z Moodle (<code>H46–H48<\/code>):<\/strong> Máme maticu riešenia <code>x(i, k)<\/code> pre <code>i, k in 1..3<\/code> s hodnotou <code>x(1,2) = 0<\/code> a <code>x(1,3) = 2<\/code>:<\/p>\n<p>1. <strong><code>forall(i in 1..3, k in 1..3 | (i &lt;&gt; k)) writeln(getsol(x(i,k)))<\/code> (<code>H46<\/code>):<\/strong> Filter <code>i &lt;&gt; k<\/code> vylúči len diagonálu (<code>x(1,1), x(2,2), x(3,3)<\/code>). Vypíšu sa všetky <strong>mimodiagonálne prvky<\/strong> <code>x(i,k)<\/code> pre <code>i != k<\/code> (vrátane nulových!). 2. <strong><code>forall(i in 1..3, k in 1..3 | (i &lt;&gt; k) and (getsol(x(i,k)) &gt; 0)) ...<\/code> (<code>H47<\/code>):<\/strong> Keďže platí <code>x(1,2) = 0<\/code>, druhá časť <code>0 &gt; 0<\/code> je <strong>nepravdivá<\/strong>, takže <strong><code>x(1,2)<\/code> sa NEVYPÍŠE<\/strong> (odpoveď: <em>Nepravda<\/em>). 3. <strong><code>forall(i in 1..3, k in 1..3 | (i &gt; k) and (getsol(x(i,k)) &gt; 0)) ...<\/code> (<code>H48<\/code>):<\/strong> Pri prvku <code>x(1,2)<\/code> je <code>i = 1, k = 2<\/code>. Podmienka <code>i &gt; k<\/code> znamená <code>1 &gt; 2<\/code>, čo je <strong>nepravda<\/strong> (vypisuje sa len dolný trojuholník <code>x(2,1), x(3,1), x(3,2)<\/code>). Preto sa <strong><code>x(1,2)<\/code> NEVYPÍŠE<\/strong> ani keby bolo kladné (odpoveď: <em>Nepravda<\/em>)!<\/p>", "focusHtml": ["<strong>Čítanie dvojitých súm a indexov (<code>H49–H51<\/code>):<\/strong> Ktorý index je v <code>x(i, j)<\/code> <em>pevný<\/em> (alebo riadený vonkajším <code>forall<\/code>), <strong>o tom objekte hovorí celá podmienka<\/strong> (napr. <code>x(i, 2)<\/code> → 2. odberateľ; <code>x(3, j)<\/code> → 3. sklad).", "<strong>Netreba písať <code>x &gt;= 0<\/code>:<\/strong> Všetky <code>mpvar<\/code> v Moseli sú už z definície nezáporné; podmienka <code>x &gt;= 0<\/code> naviac by zbytočne nafukovala model (záporné hodnoty povolí iba <code>x is_free<\/code>).", "<strong>Kolízia premenných cyklu (<code>Q89<\/code>):<\/strong> V <code>forall(i in 1..3) sum(j in 1..4)<\/code> použite vždy dva rôzne názvy indexov (<code>i<\/code> a <code>j<\/code>), nikdy dvakrát rovnaké <code>i<\/code> vnorené do seba.", "<strong>Povinné <code>*<\/code> pri násobení:<\/strong> V Moseli (a v 1-R Moodle odpovediach) sa píše vždy <code>3*x(1)<\/code>, <code>50*x1<\/code>, <strong>nie<\/strong> <code>3x(1)<\/code>."]}]};
</script>

<script>
(function() {
  "use strict";

  const STORAGE_STATS_KEY = "mao_test1_stats_v1";
  const STORAGE_ACTIVE_KEY = "mao_test1_active_attempt_v2";
  const CORE_AREA_CODES = BANK.areas.filter(a => !a.optional).map(a => a.code);

  const state = {
    view: "setup", // setup | main | guides | attempt | summary | review | browser
    stats: loadStats(),
    config: {
      mode: "main", // main | modeA | modeB | moodle | areas | modeC | wrong
      selectedAreas: [...CORE_AREA_CODES],
      selectedTiers: ["A", "B"],
      typeFilter: "ALL", // ALL | MCQ | 1-R
      count: 10,
      order: "smart", // smart | random | id
      timeMinutes: 20,
      shuffleOptions: true,
      layout: "single", // single | all
      instantCheck: false
    },
    attempt: null,
    mainFilter: { area: "ALL", type: "ALL", search: "", expandedAll: false },
    guideFilter: { area: "ALL", search: "", expandedAll: true, showMatrix: true },
    browserFilter: { area: "ALL", type: "ALL", tier: "ALL", origin: "ALL", search: "", expandedAll: false },
    timerHandle: null
  };

  const qById = Object.fromEntries(BANK.questions.map(q => [q.id, q]));

  // ---------------- Storage helpers ----------------
  function loadStats() {
    try {
      const raw = localStorage.getItem(STORAGE_STATS_KEY);
      if (!raw) return { attempts: 0, results: {} };
      const parsed = JSON.parse(raw);
      return { attempts: parsed.attempts || 0, results: parsed.results || {} };
    } catch { return { attempts: 0, results: {} }; }
  }
  function saveStats() {
    try { localStorage.setItem(STORAGE_STATS_KEY, JSON.stringify(state.stats)); } catch {}
  }
  function saveActiveAttempt() {
    try {
      if (state.attempt && state.attempt.status === "in_progress") {
        localStorage.setItem(STORAGE_ACTIVE_KEY, JSON.stringify(state.attempt));
      } else {
        localStorage.removeItem(STORAGE_ACTIVE_KEY);
      }
    } catch {}
  }
  function loadSavedAttempt() {
    try {
      const raw = localStorage.getItem(STORAGE_ACTIVE_KEY);
      return raw ? JSON.parse(raw) : null;
    } catch { return null; }
  }

  // ---------------- Grading / 1-R Normalization ----------------
  function stripDiacritics(s) {
    return s.normalize("NFD").replace(/[\u0300-\u036f]/g, "");
  }

  function evalPureArithmetic(expr) {
    // Evaluates strictly numeric arithmetic strings e.g. "0.4*500" or "4*125" without eval()
    if (!/^[\d.+\-*/()]+$/.test(expr)) return null;
    let pos = 0;
    function parseExpr() {
      let val = parseTerm();
      while (pos < expr.length && (expr[pos] === "+" || expr[pos] === "-")) {
        const op = expr[pos++];
        const r = parseTerm();
        if (val === null || r === null) return null;
        val = op === "+" ? val + r : val - r;
      }
      return val;
    }
    function parseTerm() {
      let val = parseFactor();
      while (pos < expr.length && (expr[pos] === "*" || expr[pos] === "/")) {
        const op = expr[pos++];
        const r = parseFactor();
        if (val === null || r === null || (op === "/" && Math.abs(r) < 1e-12)) return null;
        val = op === "*" ? val * r : val / r;
      }
      return val;
    }
    function parseFactor() {
      if (expr[pos] === "+") { pos++; return parseFactor(); }
      if (expr[pos] === "-") { pos++; const v = parseFactor(); return v === null ? null : -v; }
      if (expr[pos] === "(") {
        pos++;
        const v = parseExpr();
        if (expr[pos] !== ")") return null;
        pos++;
        return v;
      }
      const m = /^\d+(?:\.\d+)?/.exec(expr.slice(pos));
      if (!m) return null;
      pos += m[0].length;
      return parseFloat(m[0]);
    }
    const res = parseExpr();
    return (res !== null && pos === expr.length && Number.isFinite(res)) ? res : null;
  }

  function normSeg(raw) {
    let s = stripDiacritics(String(raw || "")).toLowerCase().trim();
    s = s.replace(/;+$/g, "");
    // Collapse digit thousand-grouping spaces like "600 000" -> "600000"
    s = s.replace(/(\d)\s+(?=\d{3}\b)/g, "$1");
    // Normalize decimal commas like "0,95", "1,3*x(1)", "6789,47" without touching indices x(1,3) or tuples (0.4, 0, 0.6)
    s = s.replace(/(^|[+\-*/=<>;\s])(\d+),(\d+)(?=$|[+\-*/=<>;\s])/g, "$1$2.$3");
    // Strip spaces around operators & delimiters
    s = s.replace(/\s*([+\-*/=<>;:,()|])\s*/g, "$1");
    // Normalize trailing () on zero-arg getter like getobjval()
    s = s.replace(/\b(getobjval)\(\)/g, "$1");
    s = s.replace(/\s+/g, " ").trim();
    return s;
  }

  function splitTopLevelRelation(seg) {
    // Splits A<=B, A>=B, A=B only if there is one comparison outside parens
    let depth = 0;
    const ops = [];
    for (let i = 0; i < seg.length; i++) {
      const ch = seg[i];
      if (ch === "(") depth++;
      else if (ch === ")") depth--;
      else if (depth === 0) {
        if ((seg[i] === "<" || seg[i] === ">") && seg[i + 1] === "=") {
          ops.push({ idx: i, len: 2, op: seg.slice(i, i + 2) });
          i++;
        } else if (seg[i] === "<" && seg[i + 1] === ">") {
          i++;
        } else if (seg[i] === "=") {
          ops.push({ idx: i, len: 1, op: "=" });
        }
      }
    }
    if (ops.length !== 1) return null;
    const { idx, len, op } = ops[0];
    return { lhs: seg.slice(0, idx), op, rhs: seg.slice(idx + len) };
  }

  function unwrapOuterParens(s) {
    while (s.startsWith("(") && s.endsWith(")")) {
      let depth = 0;
      let balanced = true;
      for (let i = 0; i < s.length; i++) {
        if (s[i] === "(") depth++;
        else if (s[i] === ")") depth--;
        if (depth === 0 && i < s.length - 1) { balanced = false; break; }
      }
      if (!balanced) break;
      s = s.slice(1, -1);
    }
    return s;
  }

  const MOSEL_RESERVED_WORDS = new Set([
    "forall", "exists", "getsol", "getact", "getslack", "create",
    "exportprob", "writeln", "maximize", "minimize", "is_binary",
    "is_free", "is_integer", "mpvar", "abs", "round", "min", "max"
  ]);

  function expandBoundedSums(s) {
    let prev = "";
    let cur = s;
    let guard = 0;
    const re = /\bsum\(\s*([a-z][a-z0-9_]*)\s+in\s+(-?\d+)\.\.\s*(-?\d+)\s*\)\s*([a-z][a-z0-9_]*\([^()]*\))/gi;
    while (cur !== prev && guard++ < 6) {
      prev = cur;
      cur = cur.replace(re, (m, idxName, loStr, hiStr, term) => {
        if (/\|/.test(term)) return m;
        const lo = parseInt(loStr, 10);
        const hi = parseInt(hiStr, 10);
        if (!Number.isFinite(lo) || !Number.isFinite(hi) || hi < lo || hi - lo > 20) return m;
        const open = term.indexOf("(");
        const prefix = term.slice(0, open + 1);
        const inner = term.slice(open + 1, -1);
        const idxRe = new RegExp(`\\b${idxName}\\b`, "g");
        const parts = [];
        for (let k = lo; k <= hi; k++) {
          parts.push(prefix + inner.replace(idxRe, String(k)) + ")");
        }
        return "(" + parts.join("+") + ")";
      });
    }
    return cur;
  }

  function canonicalVarName(rawName) {
    const compact = rawName.replace(/\s+/g, "");
    const m = /^([a-z]+)\((\d+)\)$/.exec(compact);
    if (m && !MOSEL_RESERVED_WORDS.has(m[1])) return m[1] + m[2];
    return compact;
  }

  function linScale(f, k) {
    const out = { c: f.c * k, v: {} };
    for (const [name, coeff] of Object.entries(f.v)) {
      const val = coeff * k;
      if (Math.abs(val) > 1e-12) out.v[name] = val;
    }
    return out;
  }

  function linAdd(a, b, sign) {
    const out = { c: a.c + sign * b.c, v: { ...a.v } };
    for (const [name, coeff] of Object.entries(b.v)) {
      const val = (out.v[name] || 0) + sign * coeff;
      if (Math.abs(val) > 1e-12) out.v[name] = val;
      else delete out.v[name];
    }
    return out;
  }

  function parseLinearForm(raw) {
    let s = normSeg(raw);
    if (!s || /[;<>=\[\]{}|]/.test(s)) return null;
    s = expandBoundedSums(s);
    if (/\bsum\s*\(/i.test(s)) return null;
    s = s.replace(/\s+/g, "").replace(/(\d)(?=[a-df-z(]|e(?![+\-]?\d))/gi, "$1*");

    let pos = 0;
    function parseE() {
      let left = parseT();
      if (!left) return null;
      while (pos < s.length && (s[pos] === "+" || s[pos] === "-")) {
        const op = s[pos++];
        const right = parseT();
        if (!right) return null;
        left = linAdd(left, right, op === "+" ? 1 : -1);
      }
      return left;
    }
    function parseT() {
      let left = parseF();
      if (!left) return null;
      while (pos < s.length && (s[pos] === "*" || s[pos] === "/")) {
        const op = s[pos++];
        const right = parseF();
        if (!right) return null;
        if (op === "*") {
          if (Object.keys(left.v).length === 0) left = linScale(right, left.c);
          else if (Object.keys(right.v).length === 0) left = linScale(left, right.c);
          else return null;
        } else {
