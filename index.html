lnené (<code>0 &lt;= 4<\/code> a <code>-t &lt;= 6<\/code>) a <code>2*t + 3*t -&gt; +∞<\/code>."}, {"key": "D", "html": "<code>XPRS_OPT<\/code>, lebo <code>x &gt;= 0, y &gt;= 0<\/code> vždy úlohu zhora ohraničujú."}], "multi": false, "shuffleOptions": true}, {"id": "Q79", "area": "SIM", "areaName": "9. Simplex a teória lineárneho programovania", "origin": "exercise_theory", "originLabel": "Z cvičenia / prednášky", "tier": "B", "tierLabel": "Režim B (Rozšírené)", "isMain": false, "optional": false, "archived": false, "type": "MCQ", "title": "Klasifikácia optimalizačných problémov: LP vs. MILP vs. NLP", "source": "MO_01", "promptHtml": "<p>V modeli máme lineárnu účelovú funkciu <code>min 5*x1 + 3*x2<\/code> a lineárne nerovnice <code>2*x1 + x2 &gt;= 10<\/code>, pričom <code>x1<\/code> môže nadobúdať ľubovoľné nezáporné reálne číslo (<code>real<\/code>), no <code>x2<\/code> musí byť <strong>celočíselné<\/strong> (<code>is_integer<\/code>). Do ktorej triedy optimalizačných úloh tento model patrí?<\/p>", "explanationHtml": "<p>Podmienky a cieľ sú síce lineárne, no prítomnosť podmienky celočíselnosti (<code>is_integer<\/code> / <code>is_binary<\/code>) čo i len pri jednej premennej presúva problém do zmiešaného celočíselného programovania (MILP).<\/p>", "trapHtml": "<p>Považovať model za čisto spojité LP len preto, že <code>x1<\/code> zostala spojitá alebo že sa tam nevyskytuje mocnina <code>x^2<\/code>.<\/p>", "answer": "B", "options": [{"key": "A", "html": "Spojité lineárne programovanie (LP — učivo Testu 1)."}, {"key": "B", "html": "Zmiešané celočíselné lineárne programovanie (MILP / zmiešané DLP)."}, {"key": "C", "html": "Nelineárne programovanie (NLP)."}, {"key": "D", "html": "Kvadratické programovanie (QP)."}], "multi": false, "shuffleOptions": true}, {"id": "Q80", "area": "SIM", "areaName": "9. Simplex a teória lineárneho programovania", "origin": "exercise_theory", "originLabel": "Z cvičenia / prednášky", "tier": "A", "tierLabel": "Režim A (TEST 1)", "isMain": false, "optional": false, "archived": false, "type": "1-R", "title": "Kanonický tvar LP — vyrovnávacia (slack) premenná pre <=", "source": "MO_03 (s. 134–136)", "promptHtml": "<p>Preveďte nerovnicu <code>3*x1 + 2*x2 &lt;= 18<\/code> na <strong>rovnicu<\/strong> štandardného/kanonického tvaru LP pridaním nezápornej vyrovnávacej (prídatnej) premennej <code>s1<\/code> (<code>s1 &gt;= 0<\/code>).<\/p>", "explanationHtml": "<p>Nerovnica typu <code>&lt;=<\/code> znamená, že ľavá strana môže byť menšia alebo rovná pravej. Nezrealizovaný zvyšok (rezervu) doplníme pripočítaním nezápornej premennej <code>+ s1 &gt;= 0<\/code>, aby nastala presná rovnosť <code>18<\/code>.<\/p>", "trapHtml": "<p>Odčítať <code>s1<\/code> (<code>- s1<\/code>) pri nerovnici <code>&lt;=<\/code> — to by dovolilo, aby <code>3*x1 + 2*x2 = 18 + s1 &gt;= 18<\/code>, čo pôvodnú podmienku obracia!<\/p>", "answer": "3*x1 + 2*x2 + s1 = 18", "formatHint": "1 riadok (rovnica s `x1, x2, s1`)", "equivalents": ["3*x1 + 2*x2 + s1 = 18", "3*x1+2*x2+s1=18"]}, {"id": "Q81", "area": "SIM", "areaName": "9. Simplex a teória lineárneho programovania", "origin": "exercise_theory", "originLabel": "Z cvičenia / prednášky", "tier": "A", "tierLabel": "Režim A (TEST 1)", "isMain": false, "optional": false, "archived": false, "type": "1-R", "title": "Kanonický tvar LP — prebytková premenná pre >= a zmena min na max", "source": "MO_03 (s. 134–136)", "promptHtml": "<p>Preveďte úlohu <code>min f = 4*x1 - 7*x2<\/code> s podmienkou <code>x1 + 5*x2 &gt;= 12<\/code> (<code>x1, x2 &gt;= 0<\/code>) do štandardného tvaru maximalizácie a rovnice s nezápornou prídatnou premennou <code>s2<\/code> (<code>s2 &gt;= 0<\/code>).<\/p>", "explanationHtml": "<p>Pri <code>&gt;= 12<\/code> ľavá strana prevyšuje 12, takže prebytok <strong>odpočítame<\/strong> (<code>- s2 = 12<\/code>). Minimalizácia <code>f<\/code> je ekvivalentná maximalizácii <code>-f = -4*x1 + 7*x2<\/code>.<\/p>", "trapHtml": "<p>Zabudnúť zmeniť znamienko pri druhom člene <code>-(-7*x2) = +7*x2<\/code> alebo pridať <code>+ s2<\/code> namiesto <code>- s2<\/code>.<\/p>", "answer": "x1 + 5*x2 - s2 = 12; max(-4*x1 + 7*x2)", "formatHint": "1 riadok v tvare: `rovnica_podmienky; max_ucelova_funkcia` (napr. `... = 12; max(-4*x1 + 7*x2)`)", "equivalents": ["x1 + 5*x2 - s2 = 12; max(-4*x1 + 7*x2)", "x1+5*x2-s2=12; max(-4*x1+7*x2)", "x1 + 5*x2 - s2 = 12; max(7*x2 - 4*x1)"]}, {"id": "Q82", "area": "SIM", "areaName": "9. Simplex a teória lineárneho programovania", "origin": "exercise_theory", "originLabel": "Z cvičenia / prednášky", "tier": "A", "tierLabel": "Režim A (TEST 1)", "isMain": false, "optional": false, "archived": false, "type": "MCQ", "title": "Prevod voľnej premennej (is_free) na nezáporné premenné", "source": "MO_03 (s. 134–136)", "promptHtml": "<p>Simplexová metóda štandardne predpokladá nezápornosť všetkých premenných (<code>x &gt;= 0<\/code>). Ako upravíme v modeli premennú <code>x<\/code>, ktorá môže nadobúdať <strong>aj záporné hodnoty<\/strong> (<code>x in R<\/code>), aby zostala plne zachovaná linearita a ekvivalencia?<\/p>", "explanationHtml": "<p>Každé reálne číslo (kladné, nulové aj záporné) možno zapísať ako rozdiel dvoch nezáporných čísel <code>x+ - x-<\/code>. V Moseli tento trik rieši priamo deklarácia <code>x is_free<\/code>.<\/p>", "trapHtml": "<p>Myslieť si, že pri záporných cenách/stavoch musíme vyhadzovať premenné mimo modelu.<\/p>", "answer": "A", "options": [{"key": "A", "html": "Nahradíme ju rozdielom dvoch nezáporných premenných <code>x = x_plus - x_minus<\/code>, kde <code>x_plus &gt;= 0<\/code> a <code>x_minus &gt;= 0<\/code>."}, {"key": "B", "html": "Pridáme podmienku <code>x &gt;= 0<\/code> a pri výsledku odčítame veľkú konštantu."}, {"key": "C", "html": "Zadefinujeme <code>x = x_plus^2<\/code>."}, {"key": "D", "html": "Nie je možné ju vôbec vyriešiť lineárnym programovaním."}], "multi": false, "shuffleOptions": true}, {"id": "Q83", "area": "SIM", "areaName": "9. Simplex a teória lineárneho programovania", "origin": "exercise_theory", "originLabel": "Z cvičenia / prednášky", "tier": "A", "tierLabel": "Režim A (TEST 1)", "isMain": false, "optional": false, "archived": false, "type": "MCQ", "title": "Extrémne body a geometrická podmienka optimality v 2D", "source": "MO_03", "promptHtml": "<p>V ohraničenom 2D mnohouholníku prípustných riešení má gradient maximalizovanej účelovej funkcie smer rovnaký ako vonkajšia normála jednej z hraničných úsečiek polygónu. Čo z toho vyplýva?<\/p>", "explanationHtml": "<p>Rovnaký smer gradientu <code>max<\/code> a vonkajšej normály hrany znamená, že izočiary účelovej funkcie sú s hranou rovnobežné a pri posune von už za hranou neexistujú prípustné body -&gt; celá táto hrana je optimálna.<\/p>", "trapHtml": "<p>Ak má gradient smer <em>vnútornej<\/em> normály (opačný k vonkajšej), potom na tejto hrane leží <em>minimum<\/em> pri <code>max<\/code>, nie maximum — pozor na orientáciu normály!<\/p>", "answer": "C", "options": [{"key": "A", "html": "Úloha nemá žiadne optimálne riešenie (<code>XPRS_INF<\/code>)."}, {"key": "B", "html": "Maximum nadobúda presne v strede polygónu."}, {"key": "C", "html": "Úloha má nekonečne veľa optimálnych riešení — tvorí ich celá táto hraničná úsečka vrátane jej oboch krajných vrcholov."}, {"key": "D", "html": "Úloha je neohraničená (<code>XPRS_UNB<\/code>)."}], "multi": false, "shuffleOptions": true}, {"id": "Q84", "area": "MOS", "areaName": "10. Mosel a interpretácia zápisov", "origin": "adapted_moodle", "originLabel": "Upravená Moodle", "tier": "A", "tierLabel": "Režim A (TEST 1)", "isMain": false, "optional": false, "archived": true, "type": "1-R", "title": "Dekódovanie podmieneného výpisu getsol s filtrom i <> k", "source": "Archív Moodle (Zapocty_dokopy P105), cv04/cv05", "promptHtml": "<p>Nech <code>x<\/code> je optimalizované pole <code>3x3<\/code> s riešením:<br><code>x(1,1)=5, x(1,2)=0, x(1,3)=2<\/code><br><code>x(2,1)=0, x(2,2)=8, x(2,3)=0<\/code><br><code>x(3,1)=1, x(3,2)=0, x(3,3)=4<\/code><\/p>\n<p>Ktoré presne premenné a ich hodnoty vypíše tento príkaz jazyka Mosel?<\/p>\n<pre class=\"code-block\"><code class=\"lang-mosel\">forall(i in 1..3, k in 1..3 | (i &lt;&gt; k) and (getsol(x(i,k)) &gt; 0)) do\n  writeln(&quot;x(&quot;, i, &quot;,&quot;, k, &quot;)=&quot;, getsol(x(i,k)))\nend-do<\/code><\/pre>", "explanationHtml": "<p>Filter vyžaduje dve podmienky súčasne: mimodiagonálnosť (<code>i &lt;&gt; k<\/code>) a kladnú hodnotu riešenia (<code>&gt; 0<\/code>). Prvky <code>(1,1)<\/code>, <code>(2,2)<\/code>, <code>(3,3)<\/code> vypadnú pre <code>i &lt;&gt; k<\/code>; nulové mimo diagonály vypadnú pre <code>&gt; 0<\/code>. Zostanú len <code>x(1,3)=2<\/code> a <code>x(3,1)=1<\/code>.<\/p>", "trapHtml": "<p>Vypísať aj prvky na diagonále <code>(1,1)=5, (2,2)=8, (3,3)=4<\/code> — prehliadnutie operátora nerovnosti <code>&lt;&gt;<\/code> v jazyku Mosel!<\/p>", "answer": "x(1,3)=2; x(3,1)=1", "formatHint": "1 riadok (vypísané dvojice oddelené `;`, napr. `x(a,b)=val; x(c,d)=val`)", "equivalents": ["x(1,3)=2; x(3,1)=1", "x(1,3)=2, x(3,1)=1"]}, {"id": "Q85", "area": "MOS", "areaName": "10. Mosel a interpretácia zápisov", "origin": "exercise_theory", "originLabel": "Z cvičenia / prednášky", "tier": "A", "tierLabel": "Režim A (TEST 1)", "isMain": false, "optional": false, "archived": false, "type": "MCQ", "title": "Operátor := (priradenie/pomenovanie) vs. = (rovnica podmienky)", "source": "cv02–cv06 Mosel modely", "promptHtml": "<p>Aký je v jazyku Xpress Mosel rozdiel medzi nasledujúcimi dvoma zápismi? 1) <code>kap := sum(j in 1..4) x(1,j) &lt;= 100<\/code> 2) <code>sum(j in 1..4) x(1,j) = 100<\/code><\/p>", "explanationHtml": "<p>V Moseli slúži <code>:=<\/code> na priradenie výrazu/obmedzenia/dát premennej alebo názvu podmienky, kým <code>=<\/code> tvorí lineárnu rovnicu (resp. porovnanie v logickom výraze za <code>|<\/code>).<\/p>", "trapHtml": "<p>Skúsiť napísať <code>obj = 5*x1 + 3*x2<\/code> namiesto <code>obj := 5*x1 + 3*x2<\/code> -&gt; Mosel to vyhodnotí ako rovnicu <code>obj = ...<\/code>, nie definíciu účelovej funkcie!<\/p>", "answer": "A", "options": [{"key": "A", "html": "Prvý zápis pomenúva nerovnicu <code>&lt;= 100<\/code> identifikátorom <code>kap<\/code> (možno volať <code>getslack(kap)<\/code>), druhý vytvára nepomenovanú rovnicu <code>= 100<\/code>."}, {"key": "B", "html": "Prvý zápis je len komentár a nevyhodnocuje sa pri optimalizácii."}, {"key": "C", "html": "<code>=<\/code> znamená priradenie hodnoty premennej do pamäte, kým <code>:=<\/code> testuje rovnosť."}, {"key": "D", "html": "Oba zápisy znamenajú rovnicu <code>= 100<\/code>."}], "multi": false, "shuffleOptions": true}, {"id": "Q86", "area": "MOS", "areaName": "10. Mosel a interpretácia zápisov", "origin": "exercise_theory", "originLabel": "Z cvičenia / prednášky", "tier": "B", "tierLabel": "Režim B (Rozšírené)", "isMain": false, "optional": false, "archived": false, "type": "1-R", "title": "Alokácia premenných v dynamickom poli pomocou create", "source": "cv05 / Cv05_Toky_a.mos, cv06 / Cv06_Priradovacia.mos", "promptHtml": "<p>V modeli používame dynamické polia:<\/p>\n<pre class=\"code-block\"><code class=\"lang-mosel\">c: dynamic array(1..9, 1..9) of integer\nx: dynamic array(1..9, 1..9) of mpvar<\/code><\/pre>\n<p>Po načítaní matice <code>c<\/code> zo súboru chceme vytvoriť rozhodovacie premenné <code>x(i, j)<\/code> iba pre tie dvojice, kde <code>c(i, j)<\/code> existuje: <code>forall(i in 1..9, j in 1..9 | exists(c(i,j))) _______<\/code> Doplňte presný chýbajúci príkaz Moselu na koniec tohto riadku.<\/p>", "explanationHtml": "<p>Pre dynamické pole typu <code>mpvar<\/code> v jazyku Mosel sa jednotlivé premenné nevytvoria pri deklarácii — každú aktívnu pozíciu treba explicitne vytvoriť príkazom <code>create(x(i,j))<\/code>.<\/p>", "trapHtml": "<p>Napísať <code>x(i,j) := 0<\/code> alebo bez <code>create(...)<\/code> rovno použiť <code>x(i,j)<\/code> v podmienkach (dynamický prvok nebude vytvorený ako rozhodovacia premenná).<\/p>", "answer": "create(x(i,j))", "formatHint": "1 riadok (jedno volanie procedúry pre x(i,j))", "equivalents": ["create(x(i,j))", "create( x(i,j) )"]}, {"id": "Q87", "area": "MOS", "areaName": "10. Mosel a interpretácia zápisov", "origin": "exercise_theory", "originLabel": "Z cvičenia / prednášky", "tier": "A", "tierLabel": "Režim A (TEST 1)", "isMain": false, "optional": false, "archived": false, "type": "MCQ", "title": "Implicitná nezápornosť rozhodovacích premenných mpvar", "source": "cv02 / Cv02_Vyrobky.mos", "promptHtml": "<p>Deklarujeme <code>declarations v1, v2: mpvar end-declarations<\/code> bez ďalších direktív typu <code>is_free<\/code> alebo <code>is_binary<\/code>. Čo platí automaticky v riešiči Xpress?<\/p>", "explanationHtml": "<p>V Xpress Mosel má každá novo vytvorená <code>mpvar<\/code> štandardne implicitné ohraničenie <code>&gt;= 0<\/code> a je spojitá (reálna). Pre záporné hodnoty treba explicitne uviesť <code>is_free<\/code>, pre celé <code>is_integer<\/code>, pre binárne <code>is_binary<\/code>.<\/p>", "trapHtml": "<p>Keď skutočná ekonomická premenná smie byť záporná (napr. čistá poloha alebo zostatok na účte v abstraktnom modeli), zabudnúť na <code>is_free<\/code> ju oreže na <code>&gt;= 0<\/code>!<\/p>", "answer": "A", "options": [{"key": "A", "html": "Premenné sú predvolene nezáporné spojité reálne čísla (<code>v1 &gt;= 0, v2 &gt;= 0<\/code>)."}, {"key": "B", "html": "Premenné môžu byť ľubovoľné záporné aj kladné čísla, kým nenapíšeme <code>v1 &gt;= 0<\/code>."}, {"key": "C", "html": "Premenné sú predvolene binárne (<code>0<\/code> alebo <code>1<\/code>)."}, {"key": "D", "html": "Premenné nadobúdajú predvolene len celé čísla <code>0, 1, 2, ...<\/code>."}], "multi": false, "shuffleOptions": true}, {"id": "Q88", "area": "MOS", "areaName": "10. Mosel a interpretácia zápisov", "origin": "exercise_theory", "originLabel": "Z cvičenia / prednášky", "tier": "A", "tierLabel": "Režim A (TEST 1)", "isMain": false, "optional": false, "archived": false, "type": "1-R", "title": "Štyri základné výstupné funkcie po optimalizácii v Moseli", "source": "cv02–cv06 Mosel modely", "promptHtml": "<p>Po vykonaní <code>maximize(zisk)<\/code> v modeli s premennou <code>x1<\/code> a pomenovanou podmienkou <code>kap := 2*x1 + x2 &lt;= 100<\/code> uveďte názvy (vrátane parametra tam, kde je potrebný) štyroch vstavaných funkcií Moselu na zistenie: 1) optimálnej hodnoty účelovej funkcie, 2) optimálnej hodnoty premennej <code>x1<\/code>, 3) vyhodnotenej hodnoty ľavej strany obmedzenia <code>kap<\/code>, 4) nevyčerpanej rezervy (slack) obmedzenia <code>kap<\/code>.<\/p>", "explanationHtml": "<p><code>getobjval<\/code> vracia hodnotu cieľa, <code>getsol(var)<\/code> riešenie premennej (alebo lineárneho výrazu), <code>getact(constr)<\/code> aktivitu ľavej strany a <code>getslack(constr)<\/code> rezervu <code>prava_strana - lava_strana<\/code> (pre <code>&lt;=<\/code>).<\/p>", "trapHtml": "<p>Vypísať hodnotu premennej bez <code>getsol(...)<\/code> (napr. <code>writeln(x1)<\/code> vypíše vnútorný objekt/chybu, nie číslo!) alebo volať <code>getsol(kap)<\/code> na podmienku.<\/p>", "answer": "getobjval; getsol(x1); getact(kap); getslack(kap)", "formatHint": "1 riadok v tvare: `f1; f2; f3; f4`", "equivalents": ["getobjval; getsol(x1); getact(kap); getslack(kap)", "getobjval(); getsol(x1); getact(kap); getslack(kap)"]}, {"id": "Q89", "area": "MOS", "areaName": "10. Mosel a interpretácia zápisov", "origin": "adapted_moodle", "originLabel": "Upravená Moodle", "tier": "A", "tierLabel": "Režim A (TEST 1)", "isMain": false, "optional": false, "archived": true, "type": "MCQ", "title": "Dekódovanie podmienky DÚ z Mosel zápisu", "source": "cv03 / cv04 / Archív Moodle", "promptHtml": "<p>V dopravnej úlohe s 3 skladmi (<code>a(i)<\/code> je kapacita <code>i<\/code>-teho skladu) a 4 odberateľmi (<code>x(i, j)<\/code> preprava z <code>i<\/code> do <code>j<\/code>) je v modeli tento riadok: <code>forall(i in 1..3) sum(j in 1..4) x(i,j) &lt;= 0.8 * a(i)<\/code> Čo toto obmedzenie zabezpečuje?<\/p>", "explanationHtml": "<p>Ak z kapacity <code>a(i)<\/code> smieme odviezť nanajvýš <code>0.8 * a(i)<\/code>, potom nevyvezený zvyšok <code>a(i) - sum x(i,j)<\/code> je minimálne <code>0.2 * a(i)<\/code> (20 % kapacity).<\/p>", "trapHtml": "<p>Zle prečítať smer nerovnosti <code>&lt;= 0.8*a(i)<\/code> ako „aspoň 80 % sa musí vyviezť“.<\/p>", "answer": "B", "options": [{"key": "A", "html": "Z každého skladu sa musí vyexpedovať presne 80 % kapacity."}, {"key": "B", "html": "V každom sklade musí na konci zásobovania zostať <strong>aspoň 20 %<\/strong> jeho pôvodnej kapacity (odvezie sa najviac 80 %)."}, {"key": "C", "html": "Každý odberateľ dostane najviac 80 % svojej požiadavky."}, {"key": "D", "html": "Aspoň 80 % všetkých skladov zostane úplne nevyužitých."}], "multi": false, "shuffleOptions": true}, {"id": "Q90", "area": "MOS", "areaName": "10. Mosel a interpretácia zápisov", "origin": "exercise_theory", "originLabel": "Z cvičenia / prednášky", "tier": "B", "tierLabel": "Režim B (Rozšírené)", "isMain": false, "optional": false, "archived": false, "type": "MCQ", "title": "Význam príkazu exportprob v jazyku Mosel", "source": "cv05 / Cv05_Toky_a.mos", "promptHtml": "<p>Na čo slúži procedúra <code>exportprob(EP_MIN, &quot;&quot;, naklady)<\/code> (použitá napr. v <code>Cv05_Toky_a.mos<\/code>)?<\/p>", "explanationHtml": "<p><code>exportprob<\/code> vypíše presný zoznam vygenerovaných lineárnych rovníc a nerovníc tak, ako ich Mosel odovzdá riešiču (prázdne úvodzovky <code>&quot;&quot;<\/code> smerujú výstup priamo do konzoly). Je to výborný nástroj na kontrolu modelu.<\/p>", "trapHtml": "<p>Pomýliť si <code>exportprob<\/code> so spustením výpočtu (<code>minimize<\/code>/<code>maximize<\/code>) — <code>exportprob<\/code> model len vypíše, sám ho neoptimalizuje.<\/p>", "answer": "B", "options": [{"key": "A", "html": "Vyexportuje tabuľku riešení do formátu Excel <code>.xlsx<\/code>."}, {"key": "B", "html": "Vypíše kompletný rozvinutý matematický model (účelovú funkciu, podmienky a ohraničenia) v textovom LP tvare."}, {"key": "C", "html": "Spustí optimalizátor a automaticky uloží optimálny zisk."}, {"key": "D", "html": "Vymaže všetky nepotrebné nulové premenné z pamäte."}], "multi": false, "shuffleOptions": true}, {"id": "Q91", "area": "MOS", "areaName": "10. Mosel a interpretácia zápisov", "origin": "exercise_theory", "originLabel": "Z cvičenia / prednášky", "tier": "B", "tierLabel": "Režim B (Rozšírené)", "isMain": false, "optional": false, "archived": false, "type": "1-R", "title": "Preklad rovnováhy toku vnútorných uzlov do Moselu", "source": "cv05 / Cv05_Toky_a.mos", "promptHtml": "<p>Pre orientovaný graf <code>uzly = 1..9<\/code> sú existujúce hrany definované existenciou prvkov v dynamickom poli <code>c(i, j)<\/code> a toky v dynamickom poli <code>x(i, j)<\/code>. Napíšte jeden riadok v jazyku Mosel vyjadrujúci rovnováhu prítoku a odtoku pre všetky vnútorné uzly <code>k<\/code> od <code>2<\/code> do <code>8<\/code>.<\/p>", "explanationHtml": "<p>Pre každý vnútorný uzol <code>k<\/code> spočítame na ľavej strane všetky existujúce prichádzajúce hrany <code>(i, k)<\/code> a na pravej strane všetky existujúce odchádzajúce hrany <code>(k, j)<\/code>.<\/p>", "trapHtml": "<p>Prehodiť poradie indexov <code>x(k, i) = x(j, k)<\/code> (tým sa vymení prítok za odtok!) alebo vynechať zvislú čiaru filtra <code>| exists(c(...))<\/code>.<\/p>", "answer": "forall(k in 2..8) sum(i in 1..9 | exists(c(i,k))) x(i,k) = sum(j in 1..9 | exists(c(k,j))) x(k,j)", "formatHint": "1 riadok v jazyku Mosel s `forall`, `sum` a `exists`", "equivalents": ["forall(k in 2..8) sum(i in 1..9 | exists(c(i,k))) x(i,k) = sum(j in 1..9 | exists(c(k,j))) x(k,j)", "forall(k in 2..8) sum(i in uzly | exists(c(i,k))) x(i,k) = sum(j in uzly | exists(c(k,j))) x(k,j)"]}, {"id": "Q92", "area": "MOS", "areaName": "10. Mosel a interpretácia zápisov", "origin": "exercise_theory", "originLabel": "Z cvičenia / prednášky", "tier": "B", "tierLabel": "Režim B (Rozšírené)", "isMain": false, "optional": false, "archived": false, "type": "MCQ", "title": "Syntakticky chybný zápis inicializácie dát (initializations)", "source": "cv02–cv06 Mosel modely", "promptHtml": "<p>Ktorý z nasledujúcich štyroch zápisov načítania údajov zo súboru <code>&quot;DopravnaUloha4.txt&quot;<\/code> je v jazyku Mosel <strong>CHYBNÝ<\/strong>?<\/p>", "explanationHtml": "<p>Mosel podporuje americký (<code>z<\/code>) aj britský (<code>s<\/code>) pravopis blokového príkazu <code>initializations ... end-initializations<\/code> aj premenovanie kľúča cez <code>as<\/code>. Zápis <code>D<\/code> ako volanie funkcie neexistuje.<\/p>", "trapHtml": "<p>Považovať britský pravopis <code>initialisations<\/code> / <code>minimise<\/code> (bežný v niektorých vzoroch na univerzite) za syntaktickú chybu — v Moseli sú oba varianty úplne platné!<\/p>", "answer": "D", "options": [{"key": "A", "html": "<code>initializations from &quot;DopravnaUloha4.txt&quot; kapacity poziadavky end-initializations<\/code>"}, {"key": "B", "html": "<code>initialisations from &quot;DopravnaUloha4.txt&quot; kapacity poziadavky end-initialisations<\/code>"}, {"key": "C", "html": "<code>initializations from &quot;DopravnaUloha4.txt&quot; kapacity as &quot;kap&quot; end-initializations<\/code>"}, {"key": "D", "html": "<code>kapacity := initializations(&quot;DopravnaUloha4.txt&quot;)<\/code>"}], "multi": false, "shuffleOptions": true}, {"id": "Q93", "area": "MOS", "areaName": "10. Mosel a interpretácia zápisov", "origin": "exercise_theory", "originLabel": "Z cvičenia / prednášky", "tier": "A", "tierLabel": "Režim A (TEST 1)", "isMain": false, "optional": false, "archived": false, "type": "1-R", "title": "Oprava kolízie indexu v cykle a sumácii v Moseli", "source": "cv03 / cv04 / typická študentská chyba z cvičení", "promptHtml": "<p>Študent napísal pre dopyty 4 odberateľov z 3 skladov tento chybný riadok kódu: <code>forall(j in 1..4) sum(j in 1..3) x(j, j) = b(j)<\/code> Prepíšte tento jeden riadok tak, aby správne sčítaval dodávky zo všetkých <code>3<\/code> skladov (<code>i<\/code>) pre každého odberateľa <code>j<\/code>.<\/p>", "explanationHtml": "<p>Vnútorný agregátor <code>sum<\/code> musí použiť vlastnú indexovú premennú <code>i<\/code> odlišnú od vonkajšieho cyklu <code>j<\/code>, a v premennej <code>x(i, j)<\/code> sú prvým indexom sklady <code>i<\/code> a druhým odberatelia <code>j<\/code>.<\/p>", "trapHtml": "<p>Použiť ten istý názov iterátora (<code>j<\/code>) vo vnorenom <code>sum<\/code> alebo v <code>forall<\/code> a zameniť poradie indexov <code>x(j, i)<\/code>.<\/p>", "answer": "forall(j in 1..4) sum(i in 1..3) x(i,j) = b(j)", "formatHint": "1 riadok v jazyku Mosel", "equivalents": ["forall(j in 1..4) sum(i in 1..3) x(i,j) = b(j)", "forall(j in 1..4) (sum(i in 1..3) x(i,j)) = b(j)"]}, {"id": "Q94", "area": "PRI", "areaName": "11. [Voliteľná hraničná sekcia] Priraďovacia úloha", "origin": "exercise_theory", "originLabel": "Z cvičenia / prednášky", "tier": "C", "tierLabel": "Režim C (Mimo TEST 1)", "isMain": false, "optional": true, "archived": false, "type": "MCQ", "title": "Štandardná symetrická priraďovacia úloha 1:1 (Taxíky)", "source": "cv06 / MaO_06_PriraďovacieÚlohy.pdf (Pr. 1 Taxíky)", "promptHtml": "<p>Tri taxíky <code>i in 1..3<\/code> priraďujeme presne trom zákazníkom <code>j in 1..3<\/code> (<code>x(i, j) is_binary<\/code>). Ktorá dvojica podmienok zabezpečí jednoznačné vzájomné priradenie 1:1?<\/p>", "explanationHtml": "<p>Každý taxík <code>i<\/code> smie obslúžiť práve jedného zákazníka (riadkové súčty <code>= 1<\/code>) a zároveň každý zákazník <code>j<\/code> musí dostať práve jeden taxík (stĺpcové súčty <code>= 1<\/code>).<\/p>", "trapHtml": "<p>Možnosť <code>B<\/code> (<code>celkový súčet = 3<\/code>) dovolí poslať všetky 3 taxíky jedinému zákazníkovi a ostatných dvoch nechať bez odvozu!<\/p>", "answer": "A", "options": [{"key": "A", "html": "<code>forall(i in 1..3) sum(j in 1..3) x(i,j) = 1<\/code> a <code>forall(j in 1..3) sum(i in 1..3) x(i,j) = 1<\/code>"}, {"key": "B", "html": "<code>sum(i in 1..3, j in 1..3) x(i,j) = 3<\/code>"}, {"key": "C", "html": "<code>forall(i in 1..3) sum(j in 1..3) x(i,j) &lt;= 3<\/code>"}, {"key": "D", "html": "<code>forall(i in 1..3, j in 1..3) x(i,j) = 1<\/code>"}], "multi": false, "shuffleOptions": true}, {"id": "Q95", "area": "PRI", "areaName": "11. [Voliteľná hraničná sekcia] Priraďovacia úloha", "origin": "exercise_theory", "originLabel": "Z cvičenia / prednášky", "tier": "C", "tierLabel": "Režim C (Mimo TEST 1)", "isMain": false, "optional": true, "archived": false, "type": "MCQ", "title": "Kolektívy — prepočet tržby na osobu vs. celý štvorčlenný kolektív", "source": "cv06 / MaO_06_PriraďovacieÚlohy.pdf (Pr. 2 Kolektívy — overené v Mosel)", "promptHtml": "<p>Štyri <strong>štvorčlenné<\/strong> kolektívy umiestňujeme po jednom do štyroch prevádzok. Tabuľka uvádza očakávané tržby <strong>v € na osobu<\/strong>:<\/p>\n<div class=\"tbl-wrap\"><table class=\"data-table\"><thead><tr><th style=\"text-align:left\">Kolektív \\ Prevádzka<\/th><th style=\"text-align:right\">P1<\/th><th style=\"text-align:right\">P2<\/th><th style=\"text-align:right\">P3<\/th><th style=\"text-align:right\">P4<\/th><\/tr><\/thead><tbody><tr><td style=\"text-align:left\">K1<\/td><td style=\"text-align:right\">6000<\/td><td style=\"text-align:right\">5000<\/td><td style=\"text-align:right\">4000<\/td><td style=\"text-align:right\">3000<\/td><\/tr><tr><td style=\"text-align:left\">K2<\/td><td style=\"text-align:right\">2000<\/td><td style=\"text-align:right\">6000<\/td><td style=\"text-align:right\">4000<\/td><td style=\"text-align:right\">5000<\/td><\/tr><tr><td style=\"text-align:left\">K3<\/td><td style=\"text-align:right\">5000<\/td><td style=\"text-align:right\">4000<\/td><td style=\"text-align:right\">4000<\/td><td style=\"text-align:right\">5000<\/td><\/tr><tr><td style=\"text-align:left\">K4<\/td><td style=\"text-align:right\">4000<\/td><td style=\"text-align:right\">6000<\/td><td style=\"text-align:right\">2000<\/td><td style=\"text-align:right\">5000<\/td><\/tr><\/tbody><\/table><\/div>\n<p>Aká bude <strong>celková maximálna tržba<\/strong> celej siete prevádzok?<\/p>", "explanationHtml": "<p>Optimálne priradenie je napr. <code>K1-&gt;P1 (6000)<\/code>, <code>K2-&gt;P4 (5000)<\/code>, <code>K3-&gt;P3 (4000)<\/code>, <code>K4-&gt;P2 (6000)<\/code> — súčet <code>21 000 €<\/code> <strong>na jedného člena<\/strong>. Keďže každý kolektív má 4 členov, celková tržba siete je <code>4 * 21 000 = 84 000 €<\/code>.<\/p>", "trapHtml": "<p>Prehliadnuť slovo <strong>štvorčlenné<\/strong> a jednotku <strong>v € na osobu<\/strong> priamo zo záhlavia tabuľky!<\/p>", "answer": "B", "options": [{"key": "A", "html": "<code>21 000 €<\/code>"}, {"key": "B", "html": "<code>84 000 €<\/code> (<code>4 * 21 000 €<\/code>)"}, {"key": "C", "html": "<code>5 250 €<\/code> (<code>21 000 / 4<\/code>)"}, {"key": "D", "html": "<code>23 000 €<\/code>"}], "multi": false, "shuffleOptions": true}, {"id": "Q96", "area": "PRI", "areaName": "11. [Voliteľná hraničná sekcia] Priraďovacia úloha", "origin": "exercise_theory", "originLabel": "Z cvičenia / prednášky", "tier": "C", "tierLabel": "Režim C (Mimo TEST 1)", "isMain": false, "optional": true, "archived": false, "type": "1-R", "title": "Obmedzenie max. počtu pracovných zmien zamestnanca", "source": "cv06 / MaO_06_PriraďovacieÚlohy.pdf (Pr. 3a), Cv06_Priradovacia.mos", "promptHtml": "<p>V modeli <code>Cv06_Priradovacia.mos<\/code> sa <code>pracovnici = 1..7<\/code> prideľujú do práce počas <code>dni = 1..14<\/code>, pričom dynamická binárna premenná <code>x(i, j)<\/code> existuje len vtedy, ak je pracovník <code>i<\/code> v deň <code>j<\/code> dostupný (<code>a(i, j) = 1<\/code>). Zapíšte do jedného riadku Mosel kódu dodatočnú podmienku Príkladu 3a: <em>„Nikto nesmie pracovať viac než 8 dní.“<\/em><\/p>", "explanationHtml": "<p>Pre každého pracovníka <code>i<\/code> spočítame dni <code>j<\/code>, v ktorých pracuje (<code>x(i, j) = 1<\/code> tam, kde <code>a(i, j) = 1<\/code>), a ich súčet ohraničíme zhora hodnotou <code>8<\/code>.<\/p>", "trapHtml": "<p>Sumovať cez nesprávny index (<code>forall(j in dni) sum(i in pracovnici) x(i,j) &lt;= 8<\/code>), čo by ohraničilo počet ľudí za deň namiesto počtu dní za človeka!<\/p>", "answer": "forall(i in pracovnici) sum(j in dni | a(i,j) = 1) x(i,j) <= 8", "formatHint": "1 riadok v jazyku Mosel (`forall(i in ...)`)", "equivalents": ["forall(i in pracovnici) sum(j in dni | a(i,j) = 1) x(i,j) <= 8", "forall(i in pracovnici) sum(j in dni | exists(x(i,j))) x(i,j) <= 8", "forall(i in pracovnici) sum(j in dni) x(i,j) <= 8"]}, {"id": "Q97", "area": "PRI", "areaName": "11. [Voliteľná hraničná sekcia] Priraďovacia úloha", "origin": "exercise_theory", "originLabel": "Z cvičenia / prednášky", "tier": "C", "tierLabel": "Režim C (Mimo TEST 1)", "isMain": false, "optional": true, "archived": false, "type": "MCQ", "title": "Operácia s množinami (pracovnici - zeny) a asymetrické priradenie", "source": "cv06 / Cv06_Priradovacia.mos", "promptHtml": "<p>V modeli <code>Cv06_Priradovacia.mos<\/code> sú deklarácie <code>pracovnici = 1..7<\/code>, <code>dni = 1..14<\/code>, <code>zeny := {3, 5}<\/code> a <code>muzi := pracovnici - zeny<\/code>. Prečo sa v tomto modeli namiesto priradenia 1:1 používa v dňoch <code>sum x(i,j) &gt;= b(j)<\/code> a aká je hodnota množiny <code>muzi<\/code>?<\/p>", "explanationHtml": "<p>V Moseli operátor <code>-<\/code> nad množinami (<code>set of integer<\/code> a rozsah <code>1..7<\/code>) vykoná množinový rozdiel, teda <code>muzi = {1, 2, 4, 6, 7}<\/code>. Nejde o bijekciu 1:1, pretože treba obsadiť celkom <code>56<\/code> zmien naprieč 14 dňami.<\/p>", "trapHtml": "<p>Domnievať sa, že v priraďovacej úlohe sú na oboch stranách vždy rovnosti <code>= 1<\/code>, alebo že množiny v Moseli nepodporujú operácie <code>-<\/code> (rozdiel) a <code>+<\/code> (zjednotenie).<\/p>", "answer": "A", "options": [{"key": "A", "html": "<code>muzi = {1, 2, 4, 6, 7}<\/code>; jeden pracovník môže odrobiť viacero rôznych dní a v každý deň <code>j<\/code> potrebujeme skupinu aspoň <code>b(j)<\/code> pracovníkov."}, {"key": "B", "html": "<code>muzi = {-2, -4}<\/code>; v jeden deň pracuje vždy práve 1 pracovník."}, {"key": "C", "html": "<code>muzi = {3, 5}<\/code>; je to skrátený zápis podmienky nerovnosti pre <code>x(i, j)<\/code>."}, {"key": "D", "html": "Výraz <code>pracovnici - zeny<\/code> spôsobí v Moseli chybu kompilácie, lebo od rozsahu nemožno odčítať množinu."}], "multi": false, "shuffleOptions": true}, {"id": "H01", "area": "ZLP", "areaName": "1. Základné lineárne podmienky", "origin": "verbatim_moodle", "originLabel": "Doslovne z Moodle", "tier": "A", "tierLabel": "Režim A (TEST 1)", "isMain": true, "optional": false, "archived": true, "type": "MCQ", "title": "Linearizácia vzťahu z = max{x, y} v modeli LP", "source": "Archív Moodle (MaoZapocet 10505088 Q9; porov. test1.png Q1)", "promptHtml": "<p>Ako zapíšete vzťah <code>z = max{x,y}<\/code> v modeli lineárneho programovania?<\/p>", "explanationHtml": "<p>Aby premenná <code>z<\/code> mohla reprezentovať maximum z <code>{x, y}<\/code>, musí platiť <code>z &gt;= x<\/code> aj <code>z &gt;= y<\/code>, t. j. <code>x &lt;= z, y &lt;= z<\/code> (v modeli spolu s minimalizáciou <code>min z<\/code> v účelovej funkcii, ktorá stlačí <code>z<\/code> na presnú hodnotu väčšej z premenných).<\/p>", "trapHtml": "<p>Neotočiť nerovnosti na <code>x &gt;= z, y &gt;= z<\/code> (to zodpovedá <code>min{x, y}<\/code>!). Pri <code>1-R<\/code> zadaniach na starom Moodle (<code>test1.png Q1<\/code>) zlyhal zápis s čiarkou bez presnej očakávanej šablóny.<\/p>", "answer": "D", "options": [{"key": "A", "html": "<code>x+y=z<\/code>"}, {"key": "B", "html": "<code>x&gt;=z, y&gt;=z<\/code>"}, {"key": "C", "html": "<code>x*y&lt;=z<\/code>"}, {"key": "D", "html": "<code>x&lt;=z, y&lt;=z<\/code>"}, {"key": "E", "html": "<code>x+y&lt;=z<\/code>"}], "multi": false, "shuffleOptions": true}, {"id": "H02", "area": "ZLP", "areaName": "1. Základné lineárne podmienky", "origin": "verbatim_moodle", "originLabel": "Doslovne z Moodle", "tier": "A", "tierLabel": "Režim A (TEST 1)", "isMain": true, "optional": false, "archived": true, "type": "MCQ", "title": "Nelineárna podmienka s premennými x, y, z (podiel premenných)", "source": "Archív Moodle (test6.png Q13, 10560360 Q6, 23405719 Q2, Zapocty_dokopy P100)", "promptHtml": "<p>Nech <code>x<\/code>, <code>y<\/code> a <code>z<\/code> sú premenné. Ktorá z nasledujúcich podmienok sa nemôže vyskytnúť v úlohe lineárneho programovania?<\/p>", "explanationHtml": "<p>V zápise <code>y=1.2/x<\/code> sa delí rozhodovacou premennou <code>x<\/code>, čo je nelineárny vzťah (<code>x*y = 1.2<\/code>). Ostatné možnosti iba násobia alebo delia premenné konštantou <code>1.2<\/code>, takže zostávajú lineárne.<\/p>", "trapHtml": "<p>Zameniť si <code>y/1.2 = x<\/code> (delenie konštantou — úplne lineárne!) s <code>y = 1.2/x<\/code> (delenie premennou!).<\/p>", "answer": "C", "options": [{"key": "A", "html": "<code>y/1.2=x<\/code>"}, {"key": "B", "html": "<code>y=1.2*x<\/code>"}, {"key": "C", "html": "<code>y=1.2/x<\/code>"}, {"key": "D", "html": "<code>1.2*(x+y)=1-z<\/code>"}], "multi": false, "shuffleOptions": true}, {"id": "H03", "area": "ZLP", "areaName": "1. Základné lineárne podmienky", "origin": "verbatim_moodle", "originLabel": "Doslovne z Moodle", "tier": "A", "tierLabel": "Režim A (TEST 1)", "isMain": true, "optional": false, "archived": true, "type": "1-R", "title": "Závod V1–V3 — aspoň o 50 kusov viac výrobkov V1 ako ostatných spolu", "source": "Archív Moodle (Zapocty_dokopy P29, Test1.pondelok8 Q13)", "promptHtml": "<p>Závod vyrába 3 druhy výrobkov V1, V2 a V3 v množstvách <code>x(1)<\/code>, <code>x(2)<\/code>, <code>x(3)<\/code>. Napíšte podmienku, ktorá zaručí, že výrobkov V1 bude aspoň o 50 kusov viac ako všetkých ostatných spolu.<\/p>", "explanationHtml": "<p>Všetky ostatné výrobky spolu tvoria súčet <code>x(2) + x(3)<\/code>. Ak má byť <code>V1<\/code> aspoň o <code>50<\/code> viac, platí <code>x(1) &gt;= x(2) + x(3) + 50<\/code> (ekvivalentne <code>x(1) - 50 &gt;= x(2) + x(3)<\/code>).<\/p>", "trapHtml": "<p>Pripočítať <code>+50<\/code> na nesprávnu stranu (<code>x(1)+50 &gt;= x(2)+x(3)<\/code> znamená presný opak) alebo použiť <code>=<\/code> namiesto <code>&gt;=<\/code>.<\/p>", "answer": "x(1)>=x(2)+x(3)+50", "formatHint": "1 riadok (nerovnica s `x(1), x(2), x(3)`)", "equivalents": ["x(1)>=50+x(2)+x(3)", "x(1)-50>=x(2)+x(3)", "x(1)-x(2)-x(3)>=50", "x(2)+x(3)+50<=x(1)"]}, {"id": "H04", "area": "ZLP", "areaName": "1. Základné lineárne podmienky", "origin": "verbatim_moodle", "originLabel": "Doslovne z Moodle", "tier": "A", "tierLabel": "Režim A (TEST 1)", "isMain": true, "optional": false, "archived": true, "type": "1-R", "title": "Závod V1–V3 — aspoň 3-krát toľko výrobkov V1 ako V2", "source": "Archív Moodle (test3.png Q7, Zapocty_dokopy P26)", "promptHtml": "<p>Závod vyrába 3 druhy výrobkov V1, V2 a V3 v množstvách <code>x(1)<\/code>, <code>x(2)<\/code>, <code>x(3)<\/code>. V tvare nerovnosti zapíšte nasledovnú podmienku: máme vyrobiť aspoň 3 krát toľko výrobkov V1 ako V2.<\/p>", "explanationHtml": "<p>Výrobkov <code>V1<\/code> má byť najmenej trojnásobok počtu <code>V2<\/code>, preto <code>x(1) &gt;= 3*x(2)<\/code>.<\/p>", "trapHtml": "<p>Klasická inverzná pasca — napísať <code>3*x(1) &gt;= x(2)<\/code>. Rýchly test: pre <code>x(2)=10<\/code> potrebujeme <code>x(1) &gt;= 30<\/code>, nie <code>x(1) &gt;= 3.33<\/code>.<\/p>", "answer": "x(1)>=3*x(2)", "formatHint": "1 riadok (nerovnica s `x(1), x(2)`)", "equivalents": ["3*x(2)<=x(1)", "x(1)-3*x(2)>=0"]}, {"id": "H05", "area": "ZLP", "areaName": "1. Základné lineárne podmienky", "origin": "verbatim_moodle", "originLabel": "Doslovne z Moodle", "tier": "A", "tierLabel": "Režim A (TEST 1)", "isMain": true, "optional": false, "archived": true, "type": "1-R", "title": "Závod V1–V3 — príjem z predaja výrobkov aspoň 100 000 Sk", "source": "Archív Moodle (test1.png Q3, zapocet1 z1_p16 Q10)", "promptHtml": "<p>Závod vyrába 3 druhy výrobkov V1, V2 a V3 v množstvách <code>x(1)<\/code>, <code>x(2)<\/code>, <code>x(3)<\/code>. V tabuľke je uvedená spotreba suroviny a pracovného času na výrobu jednotlivých výrobkov, ako aj cena, za ktorú sa výrobky predávajú. Napíšte podmienku, ktorá zaručí príjem z predaja výrobkov aspoň 100 000 Sk.<\/p>\n<div class=\"tbl-wrap\"><table class=\"data-table\"><thead><tr><th style=\"text-align:left\"><\/th><th style=\"text-align:right\">V1<\/th><th style=\"text-align:right\">V2<\/th><th style=\"text-align:right\">V3<\/th><\/tr><\/thead><tbody><tr><td style=\"text-align:left\">Spotreba suroviny [t]<\/td><td style=\"text-align:right\">1<\/td><td style=\"text-align:right\">2<\/td><td style=\"text-align:right\">3<\/td><\/tr><tr><td style=\"text-align:left\">Spotreba prac. času [hod]<\/td><td style=\"text-align:right\">3<\/td><td style=\"text-align:right\">1<\/td><td style=\"text-align:right\">1<\/td><\/tr><tr><td style=\"text-align:left\">Cena [Sk]<\/td><td style=\"text-align:right\">50<\/td><td style=\"text-align:right\">20<\/td><td style=\"text-align:right\">30<\/td><\/tr><\/tbody><\/table><\/div>", "explanationHtml": "<p>Príjem z predaja všetkých troch výrobkov je <code>50*x(1) + 20*x(2) + 30*x(3)<\/code> a má byť aspoň <code>100 000 Sk<\/code> (<code>&gt;= 100000<\/code>).<\/p>", "trapHtml": "<p>Pozorne čítať záver vety: toto zadanie žiada príjem zo <strong>všetkých výrobkov<\/strong>, kým variant v <code>H06<\/code> žiada len výrobky <code>V1<\/code>.<\/p>", "answer": "50*x(1)+20*x(2)+30*x(3)>=100000", "formatHint": "1 riadok (nerovnica s `50, 20, 30`)", "equivalents": ["100000<=50*x(1)+20*x(2)+30*x(3)", "50*x(1)+20*x(2)+30*x(3)>=100 000"]}, {"id": "H06", "area": "ZLP", "areaName": "1. Základné lineárne podmienky", "origin": "verbatim_moodle", "originLabel": "Doslovne z Moodle", "tier": "A", "tierLabel": "Režim A (TEST 1)", "isMain": true, "optional": false, "archived": true, "type": "1-R", "title": "Závod V1–V3 — príjem z predaja výrobkov V1 aspoň 100 000 Sk", "source": "Archív Moodle (2009-04-07 Q15)", "promptHtml": "<p>Závod vyrába 3 druhy výrobkov V1, V2 a V3 v množstvách <code>x(1)<\/code>, <code>x(2)<\/code>, <code>x(3)<\/code>. V tabuľke je uvedená spotreba suroviny a pracovného času na výrobu jednotlivých výrobkov, ako aj cena, za ktorú sa výrobky predávajú. Napíšte podmienku, ktorá zaručí príjem z predaja výrobkov V1 aspoň 100 000 Sk.<\/p>\n<div class=\"tbl-wrap\"><table class=\"data-table\"><thead><tr><th style=\"text-align:left\"><\/th><th style=\"text-align:right\">V1<\/th><th style=\"text-align:right\">V2<\/th><th style=\"text-align:right\">V3<\/th><\/tr><\/thead><tbody><tr><td style=\"text-align:left\">Spotreba suroviny [t]<\/td><td style=\"text-align:right\">1<\/td><td style=\"text-align:right\">2<\/td><td style=\"text-align:right\">3<\/td><\/tr><tr><td style=\"text-align:left\">Spotreba prac. času [hod]<\/td><td style=\"text-align:right\">3<\/td><td style=\"text-align:right\">1<\/td><td style=\"text-align:right\">1<\/td><\/tr><tr><td style=\"text-align:left\">Cena [Sk]<\/td><td style=\"text-align:right\">50<\/td><td style=\"text-align:right\">20<\/td><td style=\"text-align:right\">30<\/td><\/tr><\/tbody><\/table><\/div>", "explanationHtml": "<p>Zadanie požaduje tržbu len z predaja výrobku <code>V1<\/code> (<code>50 Sk/ks<\/code>), preto píšeme <code>50*x(1) &gt;= 100000<\/code> (v <code>2009-04-07 Q15<\/code> prešla práve neroznásobená forma <code>50*x(1)&gt;=100000<\/code>).<\/p>", "trapHtml": "<p>Prehliadnuť jedno slovo <code>V1<\/code> a automaticky sčítať <code>50*x(1)+20*x(2)+30*x(3) &gt;= 100000<\/code>.<\/p>", "answer": "50*x(1)>=100000", "formatHint": "1 riadok (nerovnica s `x(1)`)", "equivalents": ["100000<=50*x(1)", "x(1)>=2000"]}, {"id": "H07", "area": "ZLP", "areaName": "1. Základné lineárne podmienky", "origin": "verbatim_moodle", "originLabel": "Doslovne z Moodle", "tier": "A", "tierLabel": "Režim A (TEST 1)", "isMain": true, "optional": false, "archived": true, "type": "MCQ", "title": "Význam koeficientu a1 v štrukturálnej podmienke (množstvo cukru)", "source": "Archív Moodle (test2.php.htm Q1, Zapocty_dokopy P109)", "promptHtml": "<p>V štrukturálnej podmienke <code>a1*x1 + a2*x2 + a3*x3 + a4*x4 &gt;= b<\/code>, kde <code>x1<\/code>, <code>x2<\/code>, <code>x3<\/code> a <code>x4<\/code> sú premenné modelujúce rozhodnutia o množstve prvého, druhého, tretieho a štvrtého komponentu v jednej jednotke výsledného produktu a <code>b<\/code> je minimálne množstvo cukru v gramoch v jednotke výsledného produktu, vyjadruje koeficient <code>a1<\/code>:<\/p>", "explanationHtml": "<p>Rozmerovo musí každý sčítanec <code>a_i * x_i<\/code> zodpovedať jednotke pravej strany <code>b<\/code> (gramy cukru). Ak <code>x1<\/code> vyjadruje množstvo prvého komponentu, <code>a1<\/code> je množstvo cukru v gramoch v 1 jednotke prvého komponentu.<\/p>", "trapHtml": "<p>Množstvové/obsahové obmedzenie si pomýliť s cenou alebo nákladmi (tie patria pri <code>b<\/code> v eurách).<\/p>", "answer": "D", "options": [{"key": "A", "html": "Náklady na nákup jednej jednotky prvého komponentu."}, {"key": "B", "html": "Cenu cukru obsiahnutého v jednej jednotke prvého komponentu."}, {"key": "C", "html": "Cenu jednej jednotky prvého komponentu."}, {"key": "D", "html": "Množstvo cukru v gramoch v jednej jednotke prvého komponentu."}], "multi": false, "shuffleOptions": true}, {"id": "H08", "area": "ZLP", "areaName": "1. Základné lineárne podmienky", "origin": "verbatim_moodle", "originLabel": "Doslovne z Moodle", "tier": "A", "tierLabel": "Režim A (TEST 1)", "isMain": true, "optional": false, "archived": true, "type": "MCQ", "title": "Význam ľavej strany štrukturálnej podmienky (spotrebovaná meď)", "source": "Archív Moodle (23415459 Q9, Zapocty_dokopy P110)", "promptHtml": "<p>V štrukturálnej podmienke <code>a1*x1 + a2*x2 + a3*x3 + a4*x4 &lt;= b<\/code>, kde <code>x1<\/code>, <code>x2<\/code>, <code>x3<\/code> a <code>x4<\/code> sú premenné modelujúce rozhodnutia o počte výrobkov typu 1, 2, 3 a 4 a <code>b<\/code> je celkové množstvo medi v kg, ktoré je k dispozícii pre výrobu všetkých výrobkov, vyjadruje ľavá strana podmienky:<\/p>", "explanationHtml": "<p>Pravá strana <code>b<\/code> predstavuje celkovú zásobu dostupnú na použitie (možnosť C), zatiaľ čo ľavá strana <code>a1*x1 + ... + a4*x4<\/code> vyjadruje skutočnú spotrebu medi pre zvolený výrobný plán.<\/p>", "trapHtml": "<p>Zámena ľavej strany (<code>spotrebované množstvo<\/code> = aktivita podmienky) s pravou stranou (<code>celkové množstvo, ktoré možno použiť<\/code> = <code>b<\/code>).<\/p>", "answer": "A", "options": [{"key": "A", "html": "Množstvo medi spotrebovanej na výrobu výrobkov typu 1, 2, 3, 4."}, {"key": "B", "html": "Počet výrobkov typu 1, 2, 3, 4, na ktorých výrobu je potrebná meď."}, {"key": "C", "html": "Celkové množstvo medi, ktoré je možné použiť na výrobu výrobkov typu 1, 2, 3, 4."}, {"key": "D", "html": "Celkové náklady na nákup medi pre výrobu výrobkov typu 1, 2, 3, 4."}], "multi": false, "shuffleOptions": true}, {"id": "H09", "area": "PV", "areaName": "2. Plánovanie výroby (jednoperiódové a multiperiódové)", "origin": "verbatim_moodle", "originLabel": "Doslovne z Moodle", "tier": "A", "tierLabel": "Režim A (TEST 1)", "isMain": true, "optional": false, "archived": true, "type": "1-R", "title": "Závod V1–V3 — účelová funkcia minimálnej spotreby pracovného času", "source": "Archív Moodle (2009-04-07 Q5, test2.php.htm Q6)", "promptHtml": "<p>Závod vyrába 3 druhy výrobkov V1, V2 a V3 v množstvách <code>x(1)<\/code>, <code>x(2)<\/code>, <code>x(3)<\/code>. V tabuľke je uvedená spotreba suroviny a pracovného času na výrobu jednotlivých výrobkov, ako aj cena, za ktorú sa výrobky predávajú. Napíšte účelovú funkciu, ktorá zaručí minimálnu spotrebu pracovného času.<\/p>\n<div class=\"tbl-wrap\"><table class=\"data-table\"><thead><tr><th style=\"text-align:left\"><\/th><th style=\"text-align:right\">V1<\/th><th style=\"text-align:right\">V2<\/th><th style=\"text-align:right\">V3<\/th><\/tr><\/thead><tbody><tr><td style=\"text-align:left\">Spotreba suroviny [t]<\/td><td style=\"text-align:right\">1<\/td><td style=\"text-align:right\">2<\/td><td style=\"text-align:right\">3<\/td><\/tr><tr><td style=\"text-align:left\">Spotreba prac. času [hod]<\/td><td style=\"text-align:right\">3<\/td><td style=\"text-align:right\">1<\/td><td style=\"text-align:right\">1<\/td><\/tr><tr><td style=\"text-align:left\">Cena [Sk]<\/td><td style=\"text-align:right\">50<\/td><td style=\"text-align:right\">20<\/td><td style=\"text-align:right\">30<\/td><\/tr><\/tbody><\/table><\/div>", "explanationHtml": "<p>Z druhého riadku tabuľky čítame spotrebu pracovného času <code>[3, 1, 1]<\/code> hod, takže minimalizujeme <code>3*x(1) + x(2) + x(3)<\/code> (v <code>test2.php<\/code> prešiel aj zápis bez <code>*<\/code> pri <code>3x(1)<\/code>).<\/p>", "trapHtml": "<p>Vynechať kľúčové slovo <code>min<\/code> alebo omylom použiť prvý riadok (surovina <code>[1, 2, 3]<\/code>).<\/p>", "answer": "min 3*x(1)+x(2)+x(3)", "formatHint": "1 riadok (`min ...` s `x(1), x(2), x(3)`)", "equivalents": ["min(3*x(1)+x(2)+x(3))", "minimize(3*x(1)+x(2)+x(3))", "min 3*x(1)+1*x(2)+1*x(3)"]}, {"id": "H10", "area": "PV", "areaName": "2. Plánovanie výroby (jednoperiódové a multiperiódové)", "origin": "verbatim_moodle", "originLabel": "Doslovne z Moodle", "tier": "A", "tierLabel": "Režim A (TEST 1)", "isMain": true, "optional": false, "archived": true, "type": "1-R", "title": "Závod V1–V3 — účelová funkcia pre čo najväčšiu výrobu výrobkov V2", "source": "Archív Moodle (test5.png Q12, zapocet1 z1_p1 Q1)", "promptHtml": "<p>Závod vyrába 3 druhy výrobkov V1, V2 a V3 v množstvách <code>x(1)<\/code>, <code>x(2)<\/code>, <code>x(3)<\/code>. Napíšte účelovú funkciu, ktorá zaručí čo najväčšiu výrobu výrobkov V2.<\/p>", "explanationHtml": "<p>Maximalizujeme priamo množstvo druhého výrobku <code>x(2)<\/code>, čiže <code>max x(2)<\/code>.<\/p>", "trapHtml": "<p>Napísať iba <code>x(2)<\/code> bez kľúčového slova <code>max<\/code> alebo pridať rovnicu (<code>max x(2) = ...<\/code>).<\/p>", "answer": "max x(2)", "formatHint": "1 riadok (`max x(2)`)", "equivalents": ["max(x(2))", "maximize(x(2))"]}, {"id": "H11", "area": "PV", "areaName": "2. Plánovanie výroby (jednoperiódové a multiperiódové)", "origin": "verbatim_moodle", "originLabel": "Doslovne z Moodle", "tier": "A", "tierLabel": "Režim A (TEST 1)", "isMain": true, "optional": false, "archived": true, "type": "1-R", "title": "Závod V1–V3 — zásoba suroviny 5000 ton (Sk verzia)", "source": "Archív Moodle (test2.png Q4)", "promptHtml": "<p>Závod vyrába 3 druhy výrobkov V1, V2 a V3 v množstvách <code>x(1)<\/code>, <code>x(2)<\/code>, <code>x(3)<\/code>. V tabuľke je uvedená spotreba suroviny a pracovného času na výrobu jednotlivých výrobkov, ako aj cena, za ktorú sa výrobky predávajú. Napíšte podmienku obmedzujúcu výrobný program, ak je známa zásoba suroviny 5000 ton.<\/p>\n<div class=\"tbl-wrap\"><table class=\"data-table\"><thead><tr><th style=\"text-align:left\"><\/th><th style=\"text-align:right\">V1<\/th><th style=\"text-align:right\">V2<\/th><th style=\"text-align:right\">V3<\/th><\/tr><\/thead><tbody><tr><td style=\"text-align:left\">Spotreba suroviny [t]<\/td><td style=\"text-align:right\">1<\/td><td style=\"text-align:right\">2<\/td><td style=\"text-align:right\">3<\/td><\/tr><tr><td style=\"text-align:left\">Spotreba prac. času [hod]<\/td><td style=\"text-align:right\">3<\/td><td style=\"text-align:right\">1<\/td><td style=\"text-align:right\">1<\/td><\/tr><tr><td style=\"text-align:left\">Cena [Sk]<\/td><td style=\"text-align:right\">50<\/td><td style=\"text-align:right\">20<\/td><td style=\"text-align:right\">30<\/td><\/tr><\/tbody><\/table><\/div>", "explanationHtml": "<p>Z riadku <code>Spotreba suroviny [t]<\/code> čítame <code>[1, 2, 3]<\/code>, preto celková spotreba nesmie prekročiť <code>5000 t<\/code>: <code>x(1) + 2*x(2) + 3*x(3) &lt;= 5000<\/code>.<\/p>", "trapHtml": "<p>Dôkaz zo snímky <code>test2.png Q4<\/code>: odpoveď <code>1*x(1)+2*x(2)+3*x(3)&lt;=5000<\/code> Moodle vyhodnotil za <code>0/1<\/code>, pretože regex kľúča vyžadoval <code>x(1)<\/code> bez nadbytočnej jednotky <code>1*<\/code>!<\/p>", "answer": "x(1)+2*x(2)+3*x(3)<=5000", "formatHint": "1 riadok (nerovnica s `x(1), x(2), x(3)`)", "equivalents": ["1*x(1)+2*x(2)+3*x(3)<=5000", "5000>=x(1)+2*x(2)+3*x(3)"]}, {"id": "H12", "area": "PV", "areaName": "2. Plánovanie výroby (jednoperiódové a multiperiódové)", "origin": "verbatim_moodle", "originLabel": "Doslovne z Moodle", "tier": "A", "tierLabel": "Režim A (TEST 1)", "isMain": true, "optional": false, "archived": true, "type": "1-R", "title": "Závod V1–V3 — max. 500 ton suroviny (novšia EUR verzia x1, x2, x3)", "source": "Archív Moodle (MaoZapocet 10869375 Q4)", "promptHtml": "<p>Závod vyrába 3 druhy výrobkov V1, V2 a V3 v množstvách <code>x1<\/code>, <code>x2<\/code>, <code>x3<\/code>. V tabuľke je uvedená spotreba suroviny a pracovného času na výrobu jednotlivých výrobkov, ako aj cena, za ktorú sa výrobky predávajú. Napíšte podmienku, ktorá zaručí, že pri výrobe sa nespotrebuje viac ako 500 ton suroviny.<\/p>\n<div class=\"tbl-wrap\"><table class=\"data-table\"><thead><tr><th style=\"text-align:left\"><\/th><th style=\"text-align:right\">V1<\/th><th style=\"text-align:right\">V2<\/th><th style=\"text-align:right\">V3<\/th><\/tr><\/thead><tbody><tr><td style=\"text-align:left\">Spotreba suroviny [t]<\/td><td style=\"text-align:right\">4<\/td><td style=\"text-align:right\">5<\/td><td style=\"text-align:right\">6<\/td><\/tr><tr><td style=\"text-align:left\">Spotreba prac. času [hod]<\/td><td style=\"text-align:right\">3<\/td><td style=\"text-align:right\">1<\/td><td style=\"text-align:right\">1<\/td><\/tr><tr><td style=\"text-align:left\">Cena [eur]<\/td><td style=\"text-align:right\">50<\/td><td style=\"text-align:right\">20<\/td><td style=\"text-align:right\">30<\/td><\/tr><\/tbody><\/table><\/div>", "explanationHtml": "<p>Novšia verzia tabuľky v eurách uvádza spotrebu suroviny <code>[4, 5, 6]<\/code> t/ks a mení zápis premenných na <code>x1, x2, x3<\/code>, takže podmienka znie <code>4*x1 + 5*x2 + 6*x3 &lt;= 500<\/code>.<\/p>", "trapHtml": "<p>Pozor na dvojakú verziu príkladu Závod v archíve: staršia tabuľka má <code>[1, 2, 3]<\/code> t a <code>x(i)<\/code>, novšia <code>[4, 5, 6]<\/code> t a <code>x1, x2, x3<\/code>.<\/p>", "answer": "4*x1+5*x2+6*x3<=500", "formatHint": "1 riadok (nerovnica s `x1, x2, x3`)", "equivalents": ["500>=4*x1+5*x2+6*x3", "4*x(1)+5*x(2)+6*x(3)<=500"]}, {"id": "H13", "area": "PV", "areaName": "2. Plánovanie výroby (jednoperiódové a multiperiódové)", "origin": "verbatim_moodle", "originLabel": "Doslovne z Moodle", "tier": "A", "tierLabel": "Režim A (TEST 1)", "isMain": true, "optional": false, "archived": true, "type": "1-R", "title": "Závod V1–V3 — výroba V1 a V2 nebude trvať viac ako 500 hodín (EUR verzia)", "source": "Archív Moodle (MaoZapocet 10854390 Q4)", "promptHtml": "<p>Závod vyrába 3 druhy výrobkov V1, V2 a V3 v množstvách <code>x1<\/code>, <code>x2<\/code>, <code>x3<\/code>. V tabuľke je uvedená spotreba suroviny a pracovného času na výrobu jednotlivých výrobkov, ako aj cena, za ktorú sa výrobky predávajú. Napíšte podmienku, ktorá zaručí, že výroba výrobkov prvého a druhého typu nebude trvať viac ako 500 hodín.<\/p>\n<div class=\"tbl-wrap\"><table class=\"data-table\"><thead><tr><th style=\"text-align:left\"><\/th><th style=\"text-align:right\">V1<\/th><th style=\"text-align:right\">V2<\/th><th style=\"text-align:right\">V3<\/th><\/tr><\/thead><tbody><tr><td style=\"text-align:left\">Spotreba suroviny [t]<\/td><td style=\"text-align:right\">4<\/td><td style=\"text-align:right\">5<\/td><td style=\"text-align:right\">6<\/td><\/tr><tr><td style=\"text-align:left\">Spotreba prac. času [hod]<\/td><td style=\"text-align:right\">3<\/td><td style=\"text-align:right\">1<\/td><td style=\"text-align:right\">1<\/td><\/tr><tr><td style=\"text-align:left\">Cena [eur]<\/td><td style=\"text-align:right\">50<\/td><td style=\"text-align:right\">20<\/td><td style=\"text-align:right\">30<\/td><\/tr><\/tbody><\/table><\/div>", "explanationHtml": "<p>Podmienka obmedzuje výlučne pracovný čas výrobkov <strong>prvého a druhého typu<\/strong> (<code>V1<\/code> a <code>V2<\/code>: <code>3 hod<\/code> a <code>1 hod<\/code>), preto <code>V3<\/code> do ľavej strany nevstupuje: <code>3*x1 + x2 &lt;= 500<\/code>.<\/p>", "trapHtml": "<p>Automaticky pripísať aj <code>+ x3<\/code> pre tretí výrobok, hoci zadanie hovorí iba o výrobkoch V1 a V2.<\/p>", "answer": "3*x1+x2<=500", "formatHint": "1 riadok (nerovnica s `x1, x2`)", "equivalents": ["3*x1+1*x2<=500", "500>=3*x1+x2", "3*x(1)+x(2)<=500"]}, {"id": "H14", "area": "PV", "areaName": "2. Plánovanie výroby (jednoperiódové a multiperiódové)", "origin": "verbatim_moodle", "originLabel": "Doslovne z Moodle", "tier": "A", "tierLabel": "Režim A (TEST 1)", "isMain": true, "optional": false, "archived": true, "type": "1-R", "title": "Závod V1–V3 — polotovary V1 a V2 postačujúce na výrobu V3", "source": "Archív Moodle (2KiyvdC Q10, Zapocty_dokopy P35)", "promptHtml": "<p>Závod vyrába 3 druhy výrobkov V1, V2 a V3 v množstvách <code>x(1)<\/code>, <code>x(2)<\/code>, <code>x(3)<\/code>. Na výrobu výrobku V3 potrebujeme 3 výrobky V1 a 2 výrobky V2. Napíšte podmienky, ktoré zaručia, že množstva výrobkov V1 a V2 bude stačiť na výrobu výrobkov V3.<\/p>", "explanationHtml": "<p>Vyrobené množstvo <code>V1<\/code> musí pokryť aspoň <code>3*x(3)<\/code> kusov potrebných pre <code>V3<\/code>, a zároveň množstvo <code>V2<\/code> musí pokryť aspoň <code>2*x(3)<\/code>. Ide o dve nezávislé podmienky <code>x(1) &gt;= 3*x(3)<\/code> a <code>x(2) &gt;= 2*x(3)<\/code>.<\/p>", "trapHtml": "<p>Zlúčiť dve samostatné podmienky do jednej (<code>x(1)+x(2) &gt;= 5*x(3)<\/code>) alebo prehodiť koeficienty (<code>3*x(1)+2*x(2) &lt;= x(3)<\/code> — to bol dôvod <code>0/1<\/code> v <code>2KiyvdC Q10<\/code>).<\/p>", "answer": "x(1)>=3*x(3); x(2)>=2*x(3)", "formatHint": "1 riadok (2 podmienky oddelené `;`)", "equivalents": ["3*x(3)<=x(1); 2*x(3)<=x(2)", "x(1)-3*x(3)>=0; x(2)-2*x(3)>=0"]}, {"id": "H15", "area": "DU", "areaName": "3. Dopravná úloha", "origin": "verbatim_moodle", "originLabel": "Doslovne z Moodle", "tier": "A", "tierLabel": "Režim A (TEST 1)", "isMain": true, "optional": false, "archived": true, "type": "1-R", "title": "Sklady — zostatok aspoň 20 ton tovaru v sklade 1", "source": "Archív Moodle (2009-04-07 Q14)", "promptHtml": "<p>Zo skladov S1, S2 a S3 s kapacitami postupne 100, 150 a 200 ton tovaru treba čo najlacnejšie zásobovať odberateľov O1, O2, O3 a O4 s požiadavkami 80, 100, 200 a 90 ton tovaru. Jednotkové dopravné náklady sú známe. Premenná <code>x(i,j)<\/code> modeluje množstvo tovaru prepravené zo skladu <code>i<\/code> k odberateľovi <code>j<\/code>. Napíšte podmienku, ktorá zaručí, že v sklade 1 zostane aspoň 20 ton tovaru.<\/p>", "explanationHtml": "<p>Sklad <code>S1<\/code> má kapacitu <code>100<\/code> t. Ak v ňom má zostať aspoň <code>20<\/code> t, smieme z neho odviezť najviac <code>100 - 20 = 80<\/code> t: <code>sum(j in 1..4)x(1,j) &lt;= 80<\/code>.<\/p>", "trapHtml": "<p>Napísať zostatok opačným smerom (<code>sum x(1,j) &gt;= 20<\/code> znamená odviezť aspoň 20 t, nie nechať 20 t!).<\/p>", "answer": "sum(j in 1..4)x(1,j)<=80", "formatHint": "1 riadok (`sum(j in 1..4)x(1,j)<=80` alebo rozpísaný súčet)", "equivalents": ["x(1,1)+x(1,2)+x(1,3)+x(1,4)<=80", "100-sum(j in 1..4)x(1,j)>=20", "100-(x(1,1)+x(1,2)+x(1,3)+x(1,4))>=20"]}, {"id": "H16", "area": "DU", "areaName": "3. Dopravná úloha", "origin": "verbatim_moodle", "originLabel": "Doslovne z Moodle", "tier": "A", "tierLabel": "Režim A (TEST 1)", "isMain": true, "optional": false, "archived": true, "type": "1-R", "title": "Sklady — zo skladu 1 odvezieme aspoň 80 ton tovaru", "source": "Archív Moodle (test5.png Q11)", "promptHtml": "<p>Zo skladov S1, S2 a S3 s kapacitami postupne 100, 150 a 200 ton tovaru treba čo najlacnejšie zásobovať odberateľov O1, O2, O3 a O4 s požiadavkami 80, 100, 140 a 90 ton tovaru. Jednotkové dopravné náklady sú známe. Premenná <code>x(i,j)<\/code> modeluje množstvo tovaru prepravené zo skladu <code>i<\/code> k odberateľovi <code>j<\/code>. Napíšte podmienku, ktorá zaručí, že zo skladu 1 odvezieme aspoň 80 ton tovaru.<\/p>", "explanationHtml": "<p>Celkový odvoz zo skladu <code>S1<\/code> je súčet <code>sum(j in 1..4)x(1,j)<\/code>, takže požadujeme <code>sum(j in 1..4)x(1,j) &gt;= 80<\/code>.<\/p>", "trapHtml": "<p>Zameniť túto otázku s <code>H15<\/code> (odviezť aspoň 80 t je <code>&gt;= 80<\/code>; nechať aspoň 20 t z kapacity 100 t je <code>&lt;= 80<\/code>).<\/p>", "answer": "sum(j in 1..4)x(1,j)>=80", "formatHint": "1 riadok (`sum(j in 1..4)x(1,j)>=80`)", "equivalents": ["x(1,1)+x(1,2)+x(1,3)+x(1,4)>=80", "80<=sum(j in 1..4)x(1,j)"]}, {"id": "H17", "area": "DU", "areaName": "3. Dopravná úloha", "origin": "verbatim_moodle", "originLabel": "Doslovne z Moodle", "tier": "A", "tierLabel": "Režim A (TEST 1)", "isMain": true, "optional": false, "archived": true, "type": "1-R", "title": "Sklady — podmienka zaručujúca vyprázdnenie prvého skladu", "source": "Archív Moodle (Zapocty_dokopy P47, Test1.pondelok8 Q8)", "promptHtml": "<p>Zo skladov S1, S2 a S3 s kapacitami postupne 100, 150 a 200 ton tovaru treba čo najlacnejšie zásobovať odberateľov O1, O2, O3 a O4 s požiadavkami 80, 100, 140 a 90 ton tovaru. Jednotkové dopravné náklady sú známe. Premenná <code>x(i,j)<\/code> modeluje množstvo tovaru prepravené zo skladu <code>i<\/code> k odberateľovi <code>j<\/code>. Napíšte podmienku, ktorá zaručí vyprázdnenie prvého skladu.<\/p>", "explanationHtml": "<p>Vyprázdniť celý sklad <code>S1<\/code> s kapacitou <code>100<\/code> ton znamená odviezť z neho presne <code>100<\/code> ton: <code>sum(j in 1..4)x(1,j) = 100<\/code> (ekvivalentne <code>100 - sum(...) = 0<\/code>).<\/p>", "trapHtml": "<p>Ponechať nerovnosť <code>&lt;= 100<\/code> (vtedy môže časť tovaru zostať v sklade).<\/p>", "answer": "sum(j in 1..4)x(1,j)=100", "formatHint": "1 riadok (rovnica s `x(1,1)..x(1,4)`)", "equivalents": ["x(1,1)+x(1,2)+x(1,3)+x(1,4)=100", "100-sum(j in 1..4)x(1,j)=0", "100-(x(1,1)+x(1,2)+x(1,3)+x(1,4))=0"]}, {"id": "H18", "area": "DU", "areaName": "3. Dopravná úloha", "origin": "verbatim_moodle", "originLabel": "Doslovne z Moodle", "tier": "A", "tierLabel": "Režim A (TEST 1)", "isMain": true, "optional": false, "archived": true, "type": "1-R", "title": "Sklady — zásobovanie druhého odberateľa len zo skladov 1 a 2", "source": "Archív Moodle (test6.png Q14)", "promptHtml": "<p>Zo skladov S1, S2 a S3 s kapacitami postupne 100, 150 a 200 ton tovaru treba čo najlacnejšie zásobovať odberateľov O1, O2, O3 a O4 s požiadavkami 80, 100, 140 a 90 ton tovaru. Jednotkové dopravné náklady sú známe. Premenná <code>x(i,j)<\/code> modeluje množstvo tovaru prepravené zo skladu <code>i<\/code> k odberateľovi <code>j<\/code>. Napíšte podmienku, ktorá zaručí, že druhého odberateľa budeme zásobovať len zo skladov 1 a 2.<\/p>", "explanationHtml": "<p>Na snímke <code>test6.png Q14<\/code> získal plný bod <code>1/1<\/code> zápis <code>x(1,2)+x(2,2)=100<\/code> (celú požiadavku <code>100<\/code> t odberateľa <code>O2<\/code> dodajú <code>S1<\/code> a <code>S2<\/code>). Vo všeobecnom modeli s rovnicou dopytu je plne ekvivalentné aj zakázanie trasy zo skladu 3: <code>x(3,2)=0<\/code>.<\/p>", "trapHtml": "<p>Pomýliť si poradie indexov <code>x(i, j)<\/code> a zakázať <code>x(2, 3) = 0<\/code> namiesto <code>x(3, 2) = 0<\/code>.<\/p>", "answer": "x(1,2)+x(2,2)=100", "formatHint": "1 riadok (`x(1,2)+x(2,2)=100` alebo `x(3,2)=0`)", "equivalents": ["x(3,2)=0", "sum(i in 1..2)x(i,2)=100"]}, {"id": "H19", "area": "DU", "areaName": "3. Dopravná úloha", "origin": "verbatim_moodle", "originLabel": "Doslovne z Moodle", "tier": "A", "tierLabel": "Režim A (TEST 1)", "isMain": true, "optional": false, "archived": true, "type": "1-R", "title": "Sklady — obmedzenie prepravy zo skladu S1 k odberateľovi O2", "source": "Archív Moodle (test6.png Q15)", "promptHtml": "<p>Zo skladov S1, S2 a S3 s kapacitami postupne 100, 150 a 200 ton tovaru treba čo najlacnejšie zásobovať odberateľov O1, O2, O3 a O4 s požiadavkami 80, 100, 140 a 90 ton tovaru. Jednotkové dopravné náklady sú známe. Premenná <code>x(i,j)<\/code> modeluje množstvo tovaru prepravené zo skladu <code>i<\/code> k odberateľovi <code>j<\/code>. Napíšte podmienku, ktorá zaručí, že zo skladu S1 k odberateľovi O2 sa nepoveze viac než 50 ton tovaru.<\/p>", "explanationHtml": "<p>Priama premenná zo skladu <code>1<\/code> k odberateľovi <code>2<\/code> je <code>x(1,2)<\/code>, preto požadujeme <code>x(1,2) &lt;= 50<\/code>.<\/p>", "trapHtml": "<p>Prehodiť indexy na <code>x(2,1) &lt;= 50<\/code> (to by bola trasa zo skladu S2 k O1).<\/p>", "answer": "x(1,2)<=50", "formatHint": "1 riadok (`x(1,2)<=50`)", "equivalents": ["50>=x(1,2)"]}, {"id": "H20", "area": "DU", "areaName": "3. Dopravná úloha", "origin": "verbatim_moodle", "originLabel": "Doslovne z Moodle", "tier": "A", "tierLabel": "Režim A (TEST 1)", "isMain": true, "optional": false, "archived": true, "type": "1-R", "title": "Sklady — druhého odberateľa nemôžeme zásobovať zo skladov 1 a 2", "source": "Archív Moodle (2009-04-07 Q6)", "promptHtml": "<p>Zo skladov S1, S2 a S3 s kapacitami postupne 100, 150 a 200 ton tovaru treba čo najlacnejšie zásobovať odberateľov O1, O2, O3 a O4 s požiadavkami 80, 100, 140 a 90 ton tovaru. Jednotkové dopravné náklady sú známe. Premenná <code>x(i,j)<\/code> modeluje množstvo tovaru prepravené zo skladu <code>i<\/code> k odberateľovi <code>j<\/code>. Napíšte podmienku, že druhého odberateľa nemôžeme zásobovať zo skladov 1 a 2.<\/p>", "explanationHtml": "<p>Keďže <code>x(i, j) &gt;= 0<\/code>, podmienka <code>x(1,2) + x(2,2) = 0<\/code> vynúti obe prepravy nulové (v <code>2009-04-07 Q6<\/code> uznané za <code>1/1<\/code>, rovnako platí <code>x(1,2)=0; x(2,2)=0<\/code>).<\/p>", "trapHtml": "<p>Použiť násobnú rovnosť bez znamienka <code>= 0<\/code> alebo prehodiť indexy <code>x(2,1)+x(2,2)=0<\/code>.<\/p>", "answer": "x(1,2)+x(2,2)=0", "formatHint": "1 riadok (`x(1,2)+x(2,2)=0` alebo `x(1,2)=0; x(2,2)=0`)", "equivalents": ["x(1,2)=0; x(2,2)=0", "x(3,2)=100"]}, {"id": "H21", "area": "DU", "areaName": "3. Dopravná úloha", "origin": "verbatim_moodle", "originLabel": "Doslovne z Moodle", "tier": "A", "tierLabel": "Režim A (TEST 1)", "isMain": true, "optional": false, "archived": true, "type": "1-R", "title": "Sklady — uspokojenie požiadavky druhého odberateľa", "source": "Archív Moodle (test2.php.htm Q5, Zapocty_dokopy P46)", "promptHtml": "<p>Zo skladov S1, S2 a S3 s kapacitami postupne 100, 150 a 200 ton tovaru treba čo najlacnejšie zásobovať odberateľov O1, O2, O3 a O4 s požiadavkami 80, 100, 200 a 90 ton tovaru. Jednotkové dopravné náklady sú známe. Premenná <code>x(i,j)<\/code> modeluje množstvo tovaru prepravené zo skladu <code>i<\/code> k odberateľovi <code>j<\/code>. Napíšte podmienku, ktorá zaručí uspokojenie požiadavky druhého odberateľa.<\/p>", "explanationHtml": "<p>Prísun tovaru pre <code>O2<\/code> je súčet zo všetkých troch skladov <code>x(1,2)+x(2,2)+x(3,2)<\/code> a jeho požiadavka je <code>100<\/code> t. Poznámka k reálnemu Moodle kľúču: hoci súčet kapacít <code>450 &lt; 470<\/code> dopytov, v <code>test2.php.htm Q5<\/code> aj <code>P46<\/code> prešla rovnica <code>sum(i in 1..3)x(i,2)=100<\/code> za <code>1/1<\/code>.<\/p>", "trapHtml": "<p>Sumovať cez odberateľov <code>j<\/code> namiesto cez sklady <code>i<\/code> (<code>sum(j in 1..4)x(2,j)<\/code> obmedzuje druhý sklad, nie druhého odberateľa!).<\/p>", "answer": "x(1,2)+x(2,2)+x(3,2)=100", "formatHint": "1 riadok (`x(1,2)+x(2,2)+x(3,2)=100`)", "equivalents": ["sum(i in 1..3)x(i,2)=100", "x(1,2)+x(2,2)+x(3,2)>=100", "sum(i in 1..3)x(i,2)>=100"]}, {"id": "H22", "area": "DU", "areaName": "3. Dopravná úloha", "origin": "verbatim_moodle", "originLabel": "Doslovne z Moodle", "tier": "A", "tierLabel": "Režim A (TEST 1)", "isMain": true, "optional": false, "archived": true, "type": "1-R", "title": "Sklady (Minimax) — podmienky pre najväčšie množstvo zo skladu 3", "source": "Archív Moodle (test2.php.htm Q4; porov. MCQ 23415436 Q3)", "promptHtml": "<p>Zo skladov S1, S2 a S3 s kapacitami postupne 100, 150 a 200 ton tovaru treba čo najlacnejšie zásobovať odberateľov O1, O2, O3 a O4 s požiadavkami 80, 100, 140 a 90 ton tovaru. Jednotkové dopravné náklady sú známe. Premenná <code>x(i,j)<\/code> modeluje množstvo tovaru prepravené zo skladu <code>i<\/code> k odberateľovi <code>j<\/code>. Napíšte podmienky pre to, aby premenná <code>y<\/code> vyjadrovala najväčšie množstvo tovaru prepravené zo skladu 3 niektorému odberateľovi.<\/p>", "explanationHtml": "<p>Aby <code>y<\/code> nebolo menšie ako žiadna z prepráv zo skladu <code>S3<\/code>, musí platiť <code>x(3,j) &lt;= y<\/code> pre každého z <code>4<\/code> odberateľov <code>j = 1..4<\/code>.<\/p>", "trapHtml": "<p>Priama skúsenosť z <code>test2.php.htm Q4<\/code>: pridanie <code>, min(y)<\/code> za podmienky zhodilo odpoveď na <code>0/1<\/code> — otázka žiada <strong>podmienky<\/strong>, nie účelovú funkciu!<\/p>", "answer": "x(3,1)<=y; x(3,2)<=y; x(3,3)<=y; x(3,4)<=y", "formatHint": "1 riadok (nerovnice oddelené `;` alebo `forall(j in 1..4)x(3,j)<=y`)", "equivalents": ["forall(j in 1..4)x(3,j)<=y", "y>=x(3,1); y>=x(3,2); y>=x(3,3); y>=x(3,4)", "forall(j in 1..4)y>=x(3,j)"]}, {"id": "H23", "area": "DU", "areaName": "3. Dopravná úloha", "origin": "verbatim_moodle", "originLabel": "Doslovne z Moodle", "tier": "A", "tierLabel": "Režim A (TEST 1)", "isMain": true, "optional": false, "archived": true, "type": "1-R", "title": "Sklady (Maximin) — podmienky pre najmenšie množstvo dodané odberateľovi 1", "source": "Archív Moodle (Zapocty_dokopy P50)", "promptHtml": "<p>Zo skladov S1, S2 a S3 s kapacitami postupne 100, 150 a 200 ton tovaru treba čo najlacnejšie zásobovať odberateľov O1, O2, O3 a O4 s požiadavkami 80, 2) &lt;= 23.5<\/code>.<\/p>", "trapHtml": "<p>Použiť desatinnú čiarku <code>11,9<\/code> v jazyku Mosel namiesto bodky <code>11.9<\/code>, alebo odčítať stĺpec <code>Vláknina<\/code>.<\/p>", "answer": "x(1)<=11.9", "formatHint": "1 riadok (`x(1)<=11.9`)", "equivalents": ["11.9>=x(1)"]}, {"id": "H30", "area": "ZM", "areaName": "5. Zmiešavacia úloha", "origin": "verbatim_moodle", "originLabel": "Doslovne z Moodle", "tier": "A", "tierLabel": "Režim A (TEST 1)", "isMain": true, "optional": false, "archived": true, "type": "1-R", "title": "CowFood — obsah vlákniny v krmive najviac 6 %", "source": "Archív Moodle (test3.png Q6, test2.php.htm Q10)", "promptHtml": "<p>Spoločnosť CowFood vyrába krmivo pre hospodárske zvieratá. Krmivo sa vyrába zmiešaním troch surovín: ovsa, kukurice a melasy. Obsahy bielkovín, tukov a vlákniny v jednotlivých surovinách udáva tabuľka. V tabuľke sú tiež dostupné množstvá surovín a ich cena. Premenné <code>x(1)<\/code>, <code>x(2)<\/code> a <code>x(3)<\/code> vyjadrujú množstvo surovín (v tonách) potrebné na výrobu 8 ton krmiva. Napíšte podmienku, ktorá zaručí, že obsah vlákniny v krmive bude najviac 6 %.<\/p>\n<div class=\"tbl-wrap\"><table class=\"data-table\"><thead><tr><th style=\"text-align:left\"><\/th><th style=\"text-align:right\">Bielkoviny [%]<\/th><th style=\"text-align:right\">Tuky [%]<\/th><th style=\"text-align:right\">Vláknina [%]<\/th><th style=\"text-align:right\">Množstvo [t]<\/th><th style=\"text-align:right\">Cena [€/t]<\/th><\/tr><\/thead><tbody><tr><td style=\"text-align:left\">Ovos<\/td><td style=\"text-align:right\">13.6<\/td><td style=\"text-align:right\">7.1<\/td><td style=\"text-align:right\">7<\/td><td style=\"text-align:right\">11.9<\/td><td style=\"text-align:right\">130<\/td><\/tr><tr><td style=\"text-align:left\">Kukurica<\/td><td style=\"text-align:right\">4.1<\/td><td style=\"text-align:right\">2.4<\/td><td style=\"text-align:right\">3.7<\/td><td style=\"text-align:right\">23.5<\/td><td style=\"text-align:right\  Zmiešavacia úloha", "origin": "verbatim_moodle", "originLabel": "Doslovne z Moodle", "tier": "A", "tierLabel": "Režim A (TEST 1)", "isMain": true, "optional": false, "archived": true, "type": "1-R", "title": "Oceliarne — náklady na nákup surovín najviac 100 000 eur", "source": "Archív Moodle (zap1 23467418 Q7)", "promptHtml": "<p>Oceliarne získali objednávku na 500 ton ocele. Na jej výrobu môžu použiť tri rôzne zliatiny: železnú, medenú a hliníkovú. Obsahy vybraných chemických prvkov v jednotlivých surovinách udáva tabuľka. V tabuľke sú tiež dostupné množstvá zliatin a ich cena. Premenné <code>x1<\/code>, <code>x2<\/code> a <code>x3<\/code> vyjadrujú množstvo zliatin (v tonách) potrebné na výrobu 500 ton ocele. Napíšte podmienku, ktorá zaručí, že na nákup surovín neminiete viac ako 100 000 eur.<\/p>\n<div class=\"tbl-wrap\"><table class=\"data-table\"><thead><tr><th style=\"text-align:left\">Surovina<\/th><th style=\"text-align:right\">C [%]<\/th><th style=\"text-align:right\">Cu [%]<\/th><th style=\"text-align:right\">Mn [%]<\/th><th style=\"text-align:right\">Množstvo [t]<\/th><th style=\"text-align:right\">Cena [eur/t]<\/th><\/tr><\/thead><tbody><tr><td style=\"text-align:left\">Železná zliatina<\/td><td style=\"text-align:right\">2.5<\/td><td style=\"text-align:right\">0<\/td><td style=\"text-align:right\">1.3<\/td><td style=\"text-align:right\">400<\/td><td style=\"text-align:right\">200<\/td><\/tr><tr><td style=\"text-align:left\">Medená zliatina<\/td><td style=\"text-align:right\">0<\/td><td style=\"text-align:right\">90<\/td><td style=\"text-align:right\">0<\/td><td style=\"text-align:right\">500<\/td><td style=\"text-align:right\">220<\/td><\/tr><tr><td style=\"text-align:left\">Hliníková zliatina<\/td><td style=\"text-align:right\">0<\/td><td style=\"text-align:right\">0.4<\/td><td style=\"text-align:right\">1.2<\/td><td style=\"text-align:right\">300<\/td><td style=\"text-align:right\">200<\/td><\/tr><\/tbody><\/table><\/div>", "explanationHtml": "<p>Ceny za 1 tonu zliatin sú <code>200<\/code>, <code>220<\/code> a <code>200<\/code> eur, preto rozpočtové obmedzenie znie <code>200*x1 + 220*x2 + 200*x3 &lt;= 100000<\/code>.<\/p>", "trapHtml": "<p>Prečítať predposledný stĺpec (<code>Množstvo [t]<\/code>: <code>400, 500, 300<\/code>) namiesto posledného stĺpca <code>Cena [eur/t]<\/code>.<\/p>", "answer": "200*x1+220*x2+200*x3<=100000", "formatHint": "1 riadok (`200*x1+220*x2+200*x3<=100000`)", "equivalents": ["100000>=200*x1+220*x2+200*x3", "200*x(1)+220*x(2)+200*x(3)<=100000"]}, {"id": "H33", "area": "REZ", "areaName": "6. Rezné úlohy", "origin": "verbatim_moodle", "originLabel": "Doslovne z Moodle", "tier": "A", "tierLabel": "Režim A (TEST 1)", "isMain": true, "optional": false, "archived": true, "type": "1-R", "title": "SchoolDesk — účelová funkcia minimálnej spotreby tyčí", "source": "Archív Moodle (2009-04-07 Q12, 2KiyvdC Q8)", "promptHtml": "<p>Spoločnosť SchoolDesk vyrába stoly rôznych veľkostí pre materské, základné, stredné a vysoké školy. Nohy na stoly majú rovnaký priemer (2 cm), ale rôznu dĺžku: 40 cm pre malé stoly, 60 cm pre stredné stoly a 70 cm pre veľké stoly. Nohy sa režú z oceľových tyčí dlhých 1,5 m. Spoločnosť získala objednávku na výrobu 108 malých, 125 stredných a 100 veľkých stolov. Tyč sa môže rozrezať 6-timi spôsobmi podľa nasledujúcej tabuľky.<\/p>\n<div class=\"tbl-wrap\"><table class=\"data-table\"><thead><tr><th style=\"text-align:left\">šablóna<\/th><th style=\"text-align:right\">1<\/th><th style=\"text-align:right\">2<\/th><th style=\"text-align:right\">3<\/th><th style=\"text-align:right\">4<\/th><th style=\"text-align:right\">5<\/th><th style=\"text-align:right\">6<\/th><\/tr><\/thead><tbody><tr><td style=\"text-align:left\">40 cm<\/td><td style=\"text-align:right\">3<\/td><td style=\"text-align:right\">2<\/td><td style=\"text-align:right\">2<\/td><td style=\"text-align:right\">0<\/td><td style=\"text-align:right\">0<\/td><td style=\"text-align:right\">0<\/td><\/tr><tr><td style=\"text- code>x(3)<\/code>.<\/p>", "answer": "2*x(3)+2*x(4)+x(5)>=5", "formatHint": "1 riadok (`2*x(3)+2*x(4)+x(5)>=5`)", "equivalents": ["2*x(3)+2*x(4)+x(5)=5", "5<=2*x(3)+2*x(4)+x(5)"]}, {"id": "H38", "area": "SIM", "areaName": "9. Simplex a teória lineárneho programovania", "origin": "verbatim_moodle", "originLabel": "Doslovne z Moodle", "tier": "A", "tierLabel": "Režim A (TEST 1)", "isMain": true, "optional": false, "archived": true, "type": "MCQ", "title": "Exaktnosť pravidla zastavenia algoritmu simplexovej metódy", "source": "Archív Moodle (Zapocty_dokopy P7)", "promptHtml": "<p>Pravidlo zastavenia algoritmu simplexovej metódy je exaktné (t.j. zastaví prácu v globálnom optime) vďaka tomu, že:<\/p>", "explanationHtml": "<p>Kombinácia lineárnej účelovej funkcie a konvexnej polyedrickej množiny s konečným počtom krajných bodov zaručuje, že lokálne optimum v krajnom bode bez zlepšujúceho suseda je zároveň globálnym optimom.<\/p>", "trapHtml": "<p>Množina všetkých prípustných riešení v spojitom LP je spravidla nekonečná (<code>D<\/code> je nepravdivé!), konečný je iba počet jej krajných bodov.<\/p>", "answer": "B", "options": [{"key": "A", "html": "Množina štrukturálnych podmienok riešenej úlohy je konečná."}, {"key": "B", "html": "Účelová funkcia je lineárna a množina prípustných riešení je konvexná a má konečný počet krajných bodov."}, {"key": "C", "html": "Množina prehľadávaných riešení je konečná."}, {"key": "D", "html": "Množina prípustných riešení je konečná."}], "multi": false, "shuffleOptions": true}, {"id": "H39", "area": "SIM", "areaName": "9. Simplex a teória lineárneho programovania", "origin": "verbatim_moodle", "originLabel": "Doslovne z Moodle", "tier": "A", "tierLabel": "Režim A (TEST 1)", "isMain": true, "optional": false, "archived": true, "type": "MCQ", "title": "2D množina nepatriaca úlohe riešiteľnej simplexovou metódou", "source": "Archív Moodle (MaoZapocet 11084209 Q9, Zapocty_dokopy P6)", "promptHtml": "<p>Ktorá z nasledujúcich množín všetkých prípustných riešení dvojrozmernej úlohy nepatrí k úlohe, ktorú možno riešiť algoritmom simplexovej metódy:<\/p>", "explanationHtml": "<p>Konečný počet lineárnych nerovníc vždy vytína konvexný polyéder (v 2D mnohouholník s rovnými hranami, prípadne úsečku, polrovinu či jediný bod). Zakrivený kruh nemožno popísať konečným počtom lineárnych podmienok.<\/p>", "trapHtml": "<p>Myslieť si, že jediný bod (<code>x = 1, y = 2<\/code>) alebo mnohouholník s 8 stranami nemôže vzniknúť z lineárnych nerovníc.<\/p>", "answer": "C", "options": [{"key": "A", "html": "Osemuholník"}, {"key": "B", "html": "Štvorec"}, {"key": "C", "html": "Kruh"}, {"key": "D", "html": "Jeden bod"}], "multi": false, "shuffleOptions": true}, {"id": "H40", "area": "SIM", "areaName": "9. Simplex a teória lineárneho programovania", "origin": "verbatim_moodle", "originLabel": "Doslovne z Moodle", "tier": "A", "tierLabel": "Režim A (TEST 1)", "isMain": true, "optional": false, "archived": true, "type": "MCQ", "title": "Nekonvexná množina vylúčená v spojitom LP (tri body)", "source": "Archív Moodle (Zapocty_dokopy P93, Test1.pondelok8 Q10; porov. 2009-04-07 Q10)", "promptHtml": "<p>Množinou prípustných riešení úlohy spojitého lineárneho programovania nemôže byť:<\/p>", "explanationHtml": "<p>Prípustná množina spojitého LP je vždy konvexná. Tri izolované body netvoria konvexnú množinu (úsečka medzi dvoma z nich v množine chýba). Poznámka: v <code>2009-04-07 Q10<\/code> mala rovnaká otázka možnosti <code>bod / kruh / polpriamka / štvorec<\/code>, kde správnou odpoveďou bol <code>kruh<\/code>.<\/p>", "trapHtml": "<p>Považovať prázdnu množinu (<code>∅<\/code>, napr. <code>x &gt;= 2, x &lt;= 1<\/code>) alebo jediný bod za nemožné prípustné množiny — obe konvexnosť spĺňajú!<\/p>", "answer": "C", "options": [{"key": "A", "html": "prázdna množina"}, {"key": "B", "html": "úsečka"}, {"key": "C", "html": "tri body"}, {"key": "D", "html": "bod"}], "multi": false, "shuffleOptions": true}, {"id": "H41", "area": "SIM", "areaName": "9. Simplex a teória lineárneho programovania", "origin": "verbatim_moodle", "originLabel": "Doslovne z Moodle", "tier": "A", "tierLabel": "Režim A (TEST 1)", "isMain": true, "optional": false, "archived": true, "type": "MCQ", "title": "Geometrický tvar prípustnej množiny 1D úlohy (úsečka)", "source": "Archív Moodle (test5.png Q10, Zapocty_dokopy P90)", "promptHtml": "<p>Množinou prípustných riešení nasledujúcej úlohy lineárneho programovania je:<\/p>\n<p><code>min 5x<\/code><br>za pod.<br><code>x &lt;= 5<\/code><br><code>x &gt;= 2<\/code><\/p>", "explanationHtml": "<p>Podmienky <code>x &gt;= 2<\/code> a <code>x &lt;= 5<\/code> v jednej premennej vyjadrujú uzavretý ohraničený interval <code>&lt;2; 5&gt;<\/code>, ktorý geometricky tvorí úsečku.<\/p>", "trapHtml": "<p>Zameniť úsečku s polpriamkou (polpriamka by vznikla vtedy, ak by jedna z hraníc chýbala, napr. iba <code>x &gt;= 2<\/code>).<\/p>", "answer": "C", "options": [{"key": "A", "html": "priamka"}, {"key": "B", "html": "polpriamka"}, {"key": "C", "html": "úsečka"}, {"key": "D", "html": "bod"}], "multi": false, "shuffleOptions": true}, {"id": "H42", "area": "SIM", "areaName": "9. Simplex a teória lineárneho programovania", "origin": "verbatim_moodle", "originLabel": "Doslovne z Moodle", "tier": "A", "tierLabel": "Režim A (TEST 1)", "isMain": true, "optional": false, "archived": true, "type": "MCQ", "title": "Tvar prípustnej množiny neohraničenej v smere osi x", "source": "Archív Moodle (MaoZapocet 10854390 Q3)", "promptHtml": "<p>Množina prípustných riešení nasledujúcej úlohy lineárneho programovania je:<\/p>\n<p><code>max x + y<\/code><br>za pod.<br><code>x &gt;= 2<\/code><br><code>y &lt;= 5<\/code><br><code>y &gt;= 0<\/code><\/p>", "explanationHtml": "<p>Premenná <code>y<\/code> leží medzi <code>0<\/code> a <code>5<\/code>, no premenná <code>x<\/code> je obmedzená iba zdola (<code>x &gt;= 2<\/code>), takže <code>x<\/code> môže rásť do <code>+∞<\/code> a celá prípustná množina (polpás <code>[2, +∞) × [0, 5]<\/code>) je neobmedzená.<\/p>", "trapHtml": "<p>Mýliť si tento príklad s úlohou <code>x + y &lt;= 5, x &gt;= 0, y &gt;= 0<\/code> (<code>H43<\/code>), ktorá ohraničuje aj súčet oboch premenných zhora.<\/p>", "answer": "D", "options": [{"key": "A", "html": "prázdna"}, {"key": "B", "html": "konvexný polyéder (mnohosten, mnohouholník)"}, {"key": "C", "html": "úsečka"}, {"key": "D", "html": "neobmedzená"}], "multi": false, "shuffleOptions": true}, {"id": "H43", "area": "SIM", "areaName": "9. Simplex a teória lineárneho programovania", "origin": "verbatim_moodle", "originLabel": "Doslovne z Moodle", "tier": "A", "tierLabel": "Režim A (TEST 1)", "isMain": true, "optional": false, "archived": true, "type": "MCQ", "title": "Tvar prípustnej množiny trojuholníka v 2D (konvexný polyéder)", "source": "Archív Moodle (Zapocty_dokopy P92, MaoZapocet 11096560 Q7)", "promptHtml": "<p>Množina prípustných riešení nasledujúcej úlohy lineárneho programovania je:<\/p>\n<p><code>max x + y<\/code><br>za pod.<br><code>x + y &lt;= 5<\/code><br><code>x &gt;= 0<\/code><br><code>y &gt;= 0<\/code><\/p>", "explanationHtml": "<p>Podmienky <code>x &gt;= 0, y &gt;= 0, x + y &lt;= 5<\/code> ohraničujú trojuholník s vrcholmi <code>(0, 0)<\/code>, <code>(5, 0)<\/code> a <code>(0, 5)<\/code>, teda ohraničený konvexný polyéder (v 2D mnohouholník).<\/p>", "trapHtml": "<p>Prehliadnuť hornú hranicu <code>x + y &lt;= 5<\/code> alebo nezápornosť a označiť oblasť za polrovinu či neobmedzenú.<\/p>", "answer": "B", "options": [{"key": "A", "html": "neobmedzená"}, {"key": "B", "html": "konvexný polyéder (mnohosten, mnohouholník)"}, {"key": "C", "html": "polrovina"}, {"key": "D", "html": "prázdna"}], "multi": false, "shuffleOptions": true}, {"id": "H44", "area": "SIM", "areaName": "9. Simplex a teória lineárneho programovania", "origin": "verbatim_moodle", "originLabel": "Doslovne z Moodle", "tier": "A", "tierLabel": "Režim A (TEST 1)", "isMain": true, "optional": false, "archived": true, "type": "MCQ", "title": "Po
