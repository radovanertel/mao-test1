<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MaO — TEST 1 | Moodle Tréner (149 otázok)</title>
<style>
  :root {
    --bg: #f3f5f8;
    --surface: #ffffff;
    --surface-alt: #f8fafc;
    --border: #d5dce4;
    --border-strong: #94a3b8;
    --text: #1e293b;
    --muted: #64748b;
    --moodle-blue: #0f6cbf;
    --moodle-blue-dark: #0b5394;
    --moodle-blue-soft: #e7f1fa;
    --navy: #1b365d;
    --ok: #15803d;
    --ok-bg: #ecfdf5;
    --ok-border: #86efac;
    --bad: #b91c1c;
    --bad-bg: #fef2f2;
    --bad-border: #fca5a5;
    --warn: #b45309;
    --warn-bg: #fffbeb;
    --warn-border: #fcd34d;
    --code-bg: #f1f5f9;
    --shadow: 0 1px 3px rgba(15, 23, 42, 0.08);
    --radius: 8px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.5;
  }
  code, pre, input.mono-input {
    font-family: Consolas, "Cascadia Code", "Fira Code", monospace;
  }
  code {
    background: var(--code-bg);
    color: #0f172a;
    padding: 0.1em 0.35em;
    border-radius: 4px;
    font-size: 0.92em;
  }
  pre.code-block {
    background: #0f172a;
    color: #e2e8f0;
    padding: 0.85rem 1rem;
    border-radius: 6px;
    overflow-x: auto;
    margin: 0.65rem 0;
    font-size: 0.9rem;
    line-height: 1.45;
  }
  pre.code-block code {
    background: transparent;
    color: inherit;
    padding: 0;
    font-size: inherit;
  }
  .topbar {
    background: var(--navy);
    color: #fff;
    padding: 0.75rem 1.25rem;
    border-bottom: 3px solid var(--moodle-blue);
    position: sticky;
    top: 0;
    z-index: 40;
  }
  .topbar-inner {
    max-width: 1200px;
    margin: 0 auto;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 0.75rem;
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 0.7rem;
  }
  .brand-badge {
    background: var(--moodle-blue);
    color: #fff;
    font-weight: 700;
    padding: 0.2rem 0.55rem;
    border-radius: 5px;
    font-size: 0.82rem;
    letter-spacing: 0.03em;
  }
  .brand-title {
    font-weight: 700;
    font-size: 1.05rem;
  }
  .brand-sub {
    font-size: 0.82rem;
    color: #cbd5e1;
  }
  .top-tabs {
    display: flex;
    flex-wrap: wrap;
    gap: 0.45rem;
    align-items: center;
  }
  .tab-btn {
    background: rgba(255,255,255,0.12);
    color: #fff;
    border: 1px solid rgba(255,255,255,0.22);
    border-radius: 6px;
    padding: 0.4rem 0.8rem;
    font-size: 0.88rem;
    cursor: pointer;
    font-weight: 500;
  }
  .tab-btn:hover { background: rgba(255,255,255,0.22); }
  .tab-btn.active { background: #fff; color: var(--navy); font-weight: 700; border-color: #fff; }

  .container {
    max-width: 1200px;
    margin: 1.25rem auto 2.5rem;
    padding: 0 1rem;
  }
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 1.15rem 1.25rem;
    margin-bottom: 1rem;
  }
  h2 {
    margin: 0 0 0.75rem;
    font-size: 1.18rem;
    color: var(--navy);
  }
  h3 {
    margin: 0 0 0.5rem;
    font-size: 1rem;
    color: var(--navy);
  }
  .muted { color: var(--muted); font-size: 0.9rem; }

  /* Buttons */
  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 0.4rem;
    border: 1px solid var(--border-strong);
    background: #fff;
    color: var(--text);
    border-radius: 6px;
    padding: 0.5rem 0.95rem;
    font-size: 0.92rem;
    font-weight: 600;
    cursor: pointer;
    text-decoration: none;
    transition: background 0.12s, border-color 0.12s;
  }
  .btn:hover:not(:disabled) { background: #f1f5f9; }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .btn-primary {
    background: var(--moodle-blue);
    border-color: var(--moodle-blue);
    color: #fff;
  }
  .btn-primary:hover:not(:disabled) { background: var(--moodle-blue-dark); border-color: var(--moodle-blue-dark); }
  .btn-danger {
    background: #fff;
    border-color: var(--bad-border);
    color: var(--bad);
  }
  .btn-danger:hover:not(:disabled) { background: var(--bad-bg); }
  .btn-sm { padding: 0.3rem 0.65rem; font-size: 0.83rem; }

  /* Setup screen */
  .mode-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
    gap: 0.8rem;
    margin-bottom: 1rem;
  }
  .mode-card {
    border: 2px solid var(--border);
    border-radius: var(--radius);
    padding: 0.9rem 1rem;
    cursor: pointer;
    background: var(--surface);
    transition: border-color 0.12s, background 0.12s;
    display: flex;
    flex-direction: column;
    gap: 0.3rem;
  }
  .mode-card:hover { border-color: var(--moodle-blue); }
  .mode-card.selected {
    border-color: var(--moodle-blue);
    background: var(--moodle-blue-soft);
  }
  .mode-card.main-mode {
    grid-column: 1 / -1;
    border-color: #d97706;
    background: linear-gradient(135deg, #fffbeb 0%, #fef3c7 100%);
  }
  .mode-card.main-mode:hover {
    border-color: #b45309;
    background: #fef3c7;
  }
  .mode-card.main-mode.selected {
    border-color: #b45309;
    box-shadow: 0 0 0 2px rgba(217, 119, 6, 0.25);
  }
  .main-hero {
    border: 2px solid #f59e0b;
    background: linear-gradient(135deg, #fffbeb 0%, #fef3c7 100%);
  }
  .btn-amber {
    background: #b45309;
    border-color: #b45309;
    color: #fff;
  }
  .btn-amber:hover { background: #92400e; }
  .mode-card.disabled-card { opacity: 0.55; cursor: not-allowed; }
  .mode-title { font-weight: 700; color: var(--navy); font-size: 0.98rem; }
  .mode-meta { font-size: 0.84rem; color: var(--muted); }

  .settings-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 0.85rem 1rem;
    padding: 0.9rem;
    background: var(--surface-alt);
    border: 1px solid var(--border);
    border-radius: 6px;
    margin-bottom: 1rem;
  }
  .field label {
    display: block;
    font-size: 0.83rem;
    font-weight: 600;
    color: var(--navy);
    margin-bottom: 0.25rem;
  }
  .field select, .field input[type="number"], .field input[type="text"] {
    width: 100%;
    padding: 0.42rem 0.6rem;
    border: 1px solid var(--border-strong);
    border-radius: 5px;
    font-size: 0.9rem;
    background: #fff;
  }
  .check-row {
    display: flex;
    align-items: center;
    gap: 0.45rem;
    font-size: 0.9rem;
    margin-top: 0.3rem;
    cursor: pointer;
  }
  .areas-picker {
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 0.85rem;
    margin-bottom: 1rem;
    background: #fff;
  }
  .area-chips {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(275px, 1fr));
    gap: 0.45rem;
    margin-top: 0.55rem;
  }
  .area-chip {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 0.5rem;
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 0.42rem 0.65rem;
    font-size: 0.86rem;
    cursor: pointer;
    background: var(--surface-alt);
  }
  .area-chip input { margin-right: 0.35rem; }
  .area-stat-pill {
    font-size: 0.78rem;
    padding: 0.1rem 0.45rem;
    border-radius: 999px;
    background: #e2e8f0;
    color: #334155;
    white-space: nowrap;
  }

  /* Moodle Quiz Layout */
  .quiz-layout {
    display: grid;
    grid-template-columns: minmax(0, 1fr) 280px;
    gap: 1.1rem;
    align-items: start;
  }
  @media (max-width: 900px) {
    .quiz-layout { grid-template-columns: 1fr; }
    .quiz-sidebar { order: -1; }
  }
  .quiz-sidebar {
    position: sticky;
    top: 4.4rem;
  }
  .timer-box {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 0.75rem 0.95rem;
    margin-bottom: 0.85rem;
    display: flex;
    align-items: center;
    justify-content: space-between;
    box-shadow: var(--shadow);
  }
  .timer-val {
    font-family: Consolas, monospace;
    font-size: 1.25rem;
    font-weight: 700;
    color: var(--navy);
  }
  .timer-warn .timer-val { color: var(--warn); }
  .timer-crit { background: var(--bad-bg); border-color: var(--bad-border); }
  .timer-crit .timer-val { color: var(--bad); }

  .nav-grid {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 0.4rem;
    margin: 0.65rem 0 0.85rem;
  }
  .qnav-tile {
    position: relative;
    height: 38px;
    border: 1px solid var(--border-strong);
    border-radius: 4px;
    background: #fff;
    cursor: pointer;
    font-size: 0.86rem;
    font-weight: 700;
    color: var(--text);
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }
  .qnav-tile::after {
    content: "";
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    height: 11px;
    background: transparent;
  }
  .qnav-tile.answered::after { background: #64748b; }
  .qnav-tile.current {
    outline: 2px solid var(--navy);
    outline-offset: 1px;
    border-color: var(--navy);
  }
  .qnav-tile.flagged::before {
    content: "";
    position: absolute;
    top: 0;
    right: 0;
    border-style: solid;
    border-width: 0 11px 11px 0;
    border-color: transparent #dc2626 transparent transparent;
  }
  .qnav-tile.rev-ok { border-color: var(--ok); background: var(--ok-bg); color: var(--ok); }
  .qnav-tile.rev-ok::after { background: var(--ok); }
  .qnav-tile.rev-bad { border-color: var(--bad); background: var(--bad-bg); color: var(--bad); }
  .qnav-tile.rev-bad::after { background: var(--bad); }

  /* Moodle Question Card */
  .que {
    display: grid;
    grid-template-columns: 165px minmax(0, 1fr);
    gap: 1rem;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 1rem;
    margin-bottom: 1rem;
  }
  @media (max-width: 680px) {
    .que { grid-template-columns: 1fr; }
  }
  .que-info {
    background: var(--surface-alt);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 0.75rem;
    font-size: 0.84rem;
    align-self: start;
  }
  .que-no { font-size: 1rem; font-weight: 700; color: var(--navy); margin-bottom: 0.25rem; }
  .que-state { font-weight: 600; margin-bottom: 0.25rem; }
  .que-state.ok { color: var(--ok); }
  .que-state.bad { color: var(--bad); }
  .flag-btn {
    margin-top: 0.55rem;
    background: #fff;
    border: 1px solid var(--border-strong);
    border-radius: 4px;
    padding: 0.28rem 0.5rem;
    font-size: 0.8rem;
    cursor: pointer;
    width: 100%;
    text-align: left;
  }
  .flag-btn.flagged {
    border-color: #dc2626;
    background: #fef2f2;
    color: #b91c1c;
    font-weight: 600;
  }

  .que-content {
    background: var(--moodle-blue-soft);
    border: 1px solid #c6ddf4;
    border-radius: 6px;
    padding: 1rem 1.1rem;
    min-width: 0;
  }
  .que-header-meta {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 0.4rem;
    margin-bottom: 0.65rem;
    padding-bottom: 0.5rem;
    border-bottom: 1px solid rgba(15, 108, 191, 0.2);
  }
  .q-badge {
    display: inline-block;
    background: #fff;
    border: 1px solid #bfdbfe;
    color: var(--navy);
    font-size: 0.78rem;
    font-weight: 700;
    padding: 0.15rem 0.5rem;
    border-radius: 4px;
  }
  .q-pills { display: flex; flex-wrap: wrap; align-items: center; gap: 0.35rem; }
  .pill-tag {
    display: inline-block;
    font-size: 0.73rem;
    font-weight: 700;
    padding: 0.12rem 0.48rem;
    border-radius: 999px;
    border: 1px solid transparent;
    white-space: nowrap;
  }
  .tier-A { background: #dcfce7; color: #166534; border-color: #86efac; }
  .tier-B { background: #fef3c7; color: #92400e; border-color: #fde68a; }
  .tier-C { background: #f1f5f9; color: #475569; border-color: #cbd5e1; }
  .orig-verbatim_moodle { background: #dbeafe; color: #1e40af; border-color: #93c5fd; }
  .orig-adapted_moodle { background: #e0f2fe; color: #0369a1; border-color: #bae6fd; }
  .orig-exercise_theory { background: #f8fafc; color: #475569; border-color: #e2e8f0; }
  .badge-main { background: #fef3c7; color: #92400e; border-color: #f59e0b; font-weight: 700; }
  .guide-hero {
    border: 2px solid #93c5fd;
    background: linear-gradient(135deg, #f8fafc 0%, #eff6ff 100%);
  }
  .guide-box {
    border-radius: 6px;
    border: 1px solid var(--border);
    border-left-width: 4px;
    padding: 0.75rem 0.95rem;
    margin-top: 0.65rem;
    font-size: 0.92rem;
  }
  .guide-box h4 {
    margin: 0 0 0.4rem;
    font-size: 0.94rem;
    color: var(--navy);
  }
  .guide-cue { background: #f0f9ff; border-color: #bae6fd; border-left-color: #0284c7; }
  .guide-formula { background: #f8fafc; border-color: #cbd5e1; border-left-color: var(--navy); }
  .guide-example { background: #ecfdf5; border-color: #bbf7d0; border-left-color: var(--ok); }
  .guide-focus { background: #fffbeb; border-color: #fde68a; border-left-color: #d97706; }
  .guide-list { margin: 0.25rem 0 0; padding-left: 1.25rem; }
  .guide-list li { margin-bottom: 0.32rem; }
  .guide-list li:last-child { margin-bottom: 0; }
  pre.formula-pre {
    background: #0f172a;
    color: #f8fafc;
    border-radius: 6px;
    padding: 0.68rem 0.85rem;
    font-family: Consolas, "Cascadia Code", "Fira Code", monospace;
    font-size: 0.85rem;
    line-height: 1.5;
    overflow-x: auto;
    white-space: pre-wrap;
    margin: 0.35rem 0 0.5rem;
  }
  .formula-block + .formula-block {
    margin-top: 0.85rem;
    padding-top: 0.75rem;
    border-top: 1px dashed #cbd5e1;
  }
  .q-source { font-size: 0.78rem; color: var(--muted); }
  .qtext p { margin: 0 0 0.6rem; }
  .qtext p:last-child { margin-bottom: 0; }

  .tbl-wrap { overflow-x: auto; margin: 0.65rem 0; }
  table.data-table {
    border-collapse: collapse;
    width: 100%;
    background: #fff;
    font-size: 0.88rem;
  }
  table.data-table th, table.data-table td {
    border: 1px solid var(--border-strong);
    padding: 0.42rem 0.6rem;
  }
  table.data-table th {
    background: var(--navy);
    color: #fff;
    font-weight: 600;
  }
  table.data-table tbody tr:nth-child(even) { background: #f8fafc; }

  .mcq-list {
    margin-top: 0.9rem;
    display: flex;
    flex-direction: column;
    gap: 0.45rem;
  }
  .mcq-opt {
    display: flex;
    align-items: flex-start;
    gap: 0.6rem;
    background: #fff;
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 0.6rem 0.75rem;
    cursor: pointer;
    transition: border-color 0.12s, background 0.12s;
  }
  .mcq-opt:hover { border-color: var(--moodle-blue); background: #f8fbff; }
  .mcq-opt.selected { border-color: var(--moodle-blue); background: #eff6ff; box-shadow: inset 3px 0 0 var(--moodle-blue); }
  .mcq-opt.rev-correct { border-color: var(--ok); background: var(--ok-bg); box-shadow: inset 3px 0 0 var(--ok); }
  .mcq-opt.rev-wrong { border-color: var(--bad); background: var(--bad-bg); box-shadow: inset 3px 0 0 var(--bad); }
  .mcq-opt input { margin-top: 0.25rem; flex-shrink: 0; }
  .mcq-letter { font-weight: 700; min-width: 1.3rem; color: var(--navy); }

  .short-answer-box {
    margin-top: 0.9rem;
    background: #fff;
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 0.75rem 0.85rem;
  }
  .short-answer-box label { display: block; font-weight: 600; font-size: 0.88rem; margin-bottom: 0.35rem; color: var(--navy); }
  input.mono-input {
    width: 100%;
    padding: 0.55rem 0.7rem;
    font-size: 0.96rem;
    border: 1.5px solid var(--border-strong);
    border-radius: 5px;
    background: #fff;
  }
  input.mono-input:focus { outline: none; border-color: var(--moodle-blue); box-shadow: 0 0 0 3px rgba(15,108,191,0.15); }
  .format-hint { margin-top: 0.4rem; font-size: 0.82rem; color: var(--muted); }

  .feedback-box {
    margin-top: 0.85rem;
    border-radius: 6px;
    padding: 0.8rem 0.95rem;
    border: 1px solid var(--border);
    background: #fff;
    font-size: 0.9rem;
  }
  .feedback-box.ok { border-color: var(--ok-border); background: var(--ok-bg); }
  .feedback-box.bad { border-color: var(--bad-border); background: var(--bad-bg); }
  .feedback-verdict { font-weight: 700; margin-bottom: 0.45rem; }
  .feedback-verdict.ok { color: var(--ok); }
  .feedback-verdict.bad { color: var(--bad); }
  .equiv-pills { display: flex; flex-wrap: wrap; gap: 0.35rem; margin: 0.35rem 0 0.55rem; }
  .equiv-pill {
    background: #fff;
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 0.15rem 0.45rem;
    font-family: Consolas, monospace;
    font-size: 0.83rem;
  }
  .trap-note {
    margin-top: 0.55rem;
    background: var(--warn-bg);
    border: 1px solid var(--warn-border);
    color: #78350f;
    padding: 0.5rem 0.7rem;
    border-radius: 5px;
    font-size: 0.86rem;
  }

  .pager {
    display: flex;
    flex-wrap: wrap;
    justify-content: space-between;
    align-items: center;
    gap: 0.6rem;
    margin-top: 0.5rem;
  }

  /* Summary & Review tables */
  .moodle-summary {
    width: 100%;
    border-collapse: collapse;
    margin: 0.75rem 0 1rem;
    font-size: 0.92rem;
  }
  .moodle-summary th, .moodle-summary td {
    border: 1px solid var(--border);
    padding: 0.5rem 0.75rem;
    text-align: left;
  }
  .moodle-summary th { background: var(--surface-alt); color: var(--navy); width: 190px; }

  /* Modal */
  .modal-backdrop {
    position: fixed;
    inset: 0;
    background: rgba(15, 23, 42, 0.55);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 1rem;
    z-index: 100;
  }
  .modal-card {
    background: #fff;
    border-radius: var(--radius);
    max-width: 460px;
    width: 100%;
    padding: 1.25rem;
    box-shadow: 0 10px 25px rgba(15, 23, 42, 0.25);
  }
  .modal-actions {
    display: flex;
    justify-content: flex-end;
    gap: 0.5rem;
    margin-top: 1rem;
  }

  /* Bank Browser */
  .browser-toolbar {
    display: flex;
    flex-wrap: wrap;
    gap: 0.65rem;
    margin-bottom: 1rem;
  }
  .browser-toolbar input, .browser-toolbar select {
    padding: 0.45rem 0.65rem;
    border: 1px solid var(--border-strong);
    border-radius: 5px;
    font-size: 0.9rem;
  }
  .hidden { display: none !important; }
</style>
</head>
<body>

<header class="topbar">
  <div class="topbar-inner">
    <div class="brand">
      <span class="brand-badge">MOODLE TEST 1</span>
      <div>
        <div class="brand-title">MaO — Spojité lineárne programovanie (<code>cv01</code>–<code>cv06</code>)</div>
        <div class="brand-sub" id="topbar-sub">57 Hlavných doslovných otázok z Moodle + 92 tréningových (spolu 149)</div>
      </div>
    </div>

<script>
const BANK = {"areas": [{"code": "ZLP", "name": "1. Základné lineárne podmienky", "optional": false}, {"code": "PV", "name": "2. Plánovanie výroby (jednoperiódové a multiperiódové)", "optional": false}, {"code": "DU", "name": "3. Dopravná úloha", "optional": false}, {"code": "DUS", "name": "4. Dopravná úloha so stratami", "optional": false}, {"code": "ZM", "name": "5. Zmiešavacia úloha", "optional": false}, {"code": "REZ", "name": "6. Rezné úlohy", "optional": false}, {"code": "TOK", "name": "7. Tokové úlohy", "optional": false}, {"code": "CIT", "name": "8. Analýza citlivosti", "optional": false}, {"code": "SIM", "name": "9. Simplex a teória lineárneho programovania", "optional": false}, {"code": "MOS", "name": "10. Mosel a interpretácia zápisov", "optional": false}, {"code": "PRI", "name": "11. [Voliteľná hraničná sekcia] Priraďovacia úloha", "optional": true}], "questions": [{"id": "Q01", "area": "ZLP", "areaName": "1. Základné lineárne podmienky", "origin": "verbatim_moodle", "originLabel": "Doslovne z Moodle", "tier": "A", "tierLabel": "Režim A (TEST 1)", "isMain": true, "optional": false, "archived": true, "type": "1-R", "title": "Závod V1–V3 — presne 3-krát menší počet výrobkov V1", "source": "Archív Moodle (2009-04-07 Q9, Test1.pondelok8 Q5, test2.php Q7); porov. cv01 Pr. 9", "promptHtml": "<p>Závod vyrába 3 druhy výrobkov V1, V2 a V3 v množstvách <code>x(1)<\/code>, <code>x(2)<\/code>, <code>x(3)<\/code>. Zapíšte nasledovnú podmienku: počet výrobkov V1 musí byť presne 3-krát menší ako celkový počet ostatných výrobkov.<\/p>", "explanationHtml": "<p>Ak je počet výrobkov <code>x(1)<\/code> presne 3-krát menší ako súčet ostatných výrobkov <code>x(2) + x(3)<\/code>, potom trojnásobok <code>x(1)<\/code> sa rovná tomuto súčtu: <code>3*x(1) = x(2) + x(3)<\/code>. Rovnako v cvičení <code>cv01 (Pr. 9)<\/code> platí pre <code>A, B, C<\/code>: <code>3*x = y + z<\/code> (spolu so spodnými limitmi <code>x &gt;= 90, y &gt;= 50, z &gt;= 90<\/code>).<\/p>", "trapHtml": "<p>Najčastejšia chyba je obrátiť pomer na <code>x(1) = 3*(x(2) + x(3))<\/code> (čo znamená 3-krát viac, nie menej) alebo zabudnúť zátvorky pri delení <code>x(2) + x(3) / 3<\/code>.<\/p>", "answer": "3*x(1)=x(2)+x(3)", "formatHint": "1 riadok (rovnosť s premennými x(1), x(2), x(3))", "equivalents": ["3*x(1)=x(2)+x(3)", "3*x(1) = x(2) + x(3)", "x(1) = (x(2) + x(3))/3", "3*x(1) - x(2) - x(3) = 0", "x(2) + x(3) = 3*x(1)"]}, {"id": "Q02", "area": "ZLP", "areaName": "1. Základné lineárne podmienky", "origin": "exercise_theory", "originLabel": "Z cvičenia / prednášky", "tier": "A", "tierLabel": "Režim A (TEST 1)", "isMain": false, "optional": false, "archived": false, "type": "MCQ", "title": "Kapacita lavičky pre dospelých a deti", "source": "cv01 / MaO_01_Jednoduché lineárne podmienky (Pr. 6)", "promptHtml": "<p>Ak na lavičke budú sedieť iba dospelí, zmestí sa ich tam najviac <strong>5<\/strong>. Ak na nej budú sedieť iba deti, kapacita lavičky je <strong>8<\/strong>. Ktorá lineárna podmienka správne vyjadruje, že kapacita lavičky nebude prekročená, ak na nej sedí <code>x<\/code> dospelých a <code>y<\/code> detí?<\/p>", "explanationHtml": "<p>Jeden dospelý zaberie <code>1/5<\/code> (= 20 %) kapacity lavičky a jedno dieťa <code>1/8<\/code> (= 12.5 %). Súčet obsadených podielov nesmie presiahnuť <code>1<\/code> (100 %): <code>x/5 + y/8 &lt;= 1<\/code> (resp. <code>20*x + 12.5*y &lt;= 100<\/code>).<\/p>", "trapHtml": "<p>Zámena podielu s násobkom (<code>5*x + 8*y &lt;= 1<\/code> nedovolí posadiť ani jedného dospelého) alebo prehodenie čitateľa/menovateľa.<\/p>", "answer": "A", "options": [{"key": "A", "html": "<code>x/5 + y/8 &lt;= 1<\/code>"}, {"key": "B", "html": "<code>5*x + 8*y &lt;= 1<\/code>"}, {"key": "C", "html": "<code>x/8 + y/5 &lt;= 1<\/code>"}, {"key": "D", "html": "<code>x + y &lt;= 13<\/code>"}], "multi": false, "shuffleOptions": true}, {"id": "Q03", "area": "ZLP", "areaName": "1. Základné lineárne podmienky", "origin": "exercise_theory", "originLabel": "Z cvičenia / prednášky", "tier": "A", "tierLabel": "Režim A (TEST 1)", "isMain": false, "optional": false, "archived": false, "type": "1-R", "title": "Kapacita triedy so štyrmi skupinami žiakov", "source": "cv01 / MaO_01_Jednoduché lineárne podmienky (Pr. 7)", "promptHtml": "<p>Pani učiteľka zvládne v triede učiť najviac <strong>30<\/strong> výborných žiakov (<code>x1<\/code>), alebo najviac <strong>25<\/strong> priemerných žiakov (<code>x2<\/code>), alebo najviac <strong>20<\/strong> slabších žiakov (<code>x3<\/code>), alebo najviac <strong>10<\/strong> veľmi slabých žiakov (<code>x4<\/code>). Napíšte jednu lineárnu podmienku, ktorá zaručí, že v zmiešanej triede nebude prekročená kapacita triedy.<\/p>", "explanationHtml": "<p>Každý žiak i-tej skupiny vyčerpá <code>1/K_i<\/code> z kapacity vyučujúcej. Celkové vyťaženie nesmie prekročiť 100 % (= 1). Spoločný menovateľ 300 dáva celočíselný ekvivalent <code>10*x1 + 12*x2 + 15*x3 + 30*x4 &lt;= 300<\/code>.<\/p>", "trapHtml": "<p>Pozor na zaokrúhľovanie <code>100/30 = 3.33<\/code> namiesto presného zlomku <code>x1/30<\/code> — pri 30 výborných žiakoch by <code>3.33*30 = 99.9<\/code> pokazilo presnú hranicu alebo <code>3.34*30 = 100.2 &gt; 100<\/code> by ich zakázalo!<\/p>", "answer": "x1/30 + x2/25 + x3/20 + x4/10 <= 1", "formatHint": "1 riadok (nerovnosť v podieloch kapacity <= 1 alebo v % <= 100)", "equivalents": ["x1/30 + x2/25 + x3/20 + x4/10 <= 1", "(10/3)*x1 + 4*x2 + 5*x3 + 10*x4 <= 100", "10*x1 + 12*x2 + 15*x3 + 30*x4 <= 300"]}, {"id": "Q04", "area": "ZLP", "areaName": "1. Základné lineárne podmienky", "origin": "exercise_theory", "originLabel": "Z cvičenia / prednášky", "tier": "A", "tierLabel": "Režim A (TEST 1)", "isMain": false, "optional": false, "archived": false, "type": "MCQ", "title": "Výpočet zisku z predaja stolov s dvoma typmi dosiek", "source": "cv01 / MaO_01_Jednoduché lineárne podmienky (Pr. 4)", "promptHtml": "<p>Každý stôl má 1 pracovnú dosku a <strong>4 rovnaké nohy<\/strong>. Náklady na výrobu jednej dosky prvej verzie sú <strong>28 €<\/strong>, druhej verzie <strong>42 €<\/strong>. Výroba jednej nohy stola stojí <strong>8 €<\/strong>. Predajná cena stola 1. verzie je <strong>85 €<\/strong> a 2. verzie <strong>104 €<\/strong>. Ktorý výraz vyjadruje celkový <strong>zisk<\/strong> z predaja <code>x1<\/code> stolov 1. verzie a <code>x2<\/code> stolov 2. verzie?<\/p>", "explanationHtml": "<p>Náklady na 4 nohy jedného stola sú <code>4 * 8 = 32 €<\/code>. Zisk zo stola 1. verzie: <code>85 - 28 - 32 = 25 €<\/code>. Zisk zo stola 2. verzie: <code>104 - 42 - 32 = 30 €<\/code>. Celkový zisk je <code>25*x1 + 30*x2<\/code>.<\/p>", "trapHtml": "<p>Distraktor <code>B<\/code> (<code>49*x1 + 54*x2<\/code>) odčíta iba jednu nohu (<code>8 €<\/code>) namiesto štyroch (<code>4*8 = 32 €<\/code>). Distraktor <code>A<\/code> maximalizuje tržby namiesto zisku.<\/p>", "answer": "C", "options": [{"key": "A", "html": "<code>85*x1 + 104*x2<\/code>"}, {"key": "B", "html": "<code>49*x1 + 54*x2<\/code>"}, {"key": "C", "html": "<code>25*x1 + 30*x2<\/code>"}, {"key": "D", "html": "<code>57*x1 + 62*x2<\/code>"}], "multi": false, "shuffleOptions": true}, {"id": "Q05", "area": "ZLP", "areaName": "1. Základné lineárne podmienky", "origin": "exercise_theory", "originLabel": "Z cvičenia / prednášky", "tier": "A", "tierLabel": "Režim A (TEST 1)", "isMain": false, "optional": false, "archived": false, "type": "1-R", "title": "Stolárska dielňa — zjednotenie jednotiek dĺžky dosiek", "source": "cv01 / MaO_01_Jednoduché lineárne podmienky II (Pr. 1a)", "promptHtml": "<p>Stolárska dielňa vyrába písacie stoly (<code>x<\/code> ks) a kontajnery (<code>y<\/code> ks). Na 1 stôl treba <strong>150 cm<\/strong> hrubej dosky a <strong>140 cm<\/strong> tenkej dosky. Na 1 kontajner treba <strong>260 cm<\/strong> tenkej dosky. Na sklade je <strong>1 000 m<\/strong> hrubej a <strong>1 500 m<\/strong> tenkej dosky. Napíšte obe obmedzenia zásob <strong>v metroch<\/strong>.<\/p>", "explanationHtml": "<p><code>150 cm = 1.5 m<\/code>, <code>140 cm = 1.4 m<\/code>, <code>260 cm = 2.6 m<\/code>. Obe strany nerovnice musia byť v rovnakých jednotkách (buď obe v metroch, alebo obe v centimetroch).<\/p>", "trapHtml": "<p>Klasická pasca je napísať centimetre na ľavú stranu a metre na pravú (<code>140*x + 260*y &lt;= 1500<\/code>).<\/p>", "answer": "1.5*x <= 1000; 1.4*x + 2.6*y <= 1500", "formatHint": "1 riadok (dve nerovnice oddelené bodkočiarkou `;`)", "equivalents": ["1.5*x <= 1000; 1.4*x + 2.6*y <= 1500", "150*x <= 100000; 140*x + 260*y <= 150000"]}, {"id": "Q06", "area": "ZLP", "areaName": "1. Základné lineárne podmienky", "origin": "verbatim_moodle", "originLabel": "Doslovne z Moodle", "tier": "A", "tierLabel": "Režim A (TEST 1)", "isMain": true, "optional": false, "archived": true, "type": "MCQ", "title": "Nelineárna podmienka vylúčená z úlohy LP", "source": "Archív Moodle (Zapocty_dokopy P101, 2009-04-07 Q11, test2.php Q8)", "promptHtml": "<p>Nech <code>x<\/code> a <code>y<\/code> sú premenné. Ktorá z nasledujúcich podmienok sa nemôže vyskytnúť v úlohe lineárneho programovania?<\/p>", "explanationHtml": "<p>Po roznásobení <code>x*(1 + y) = x + x*y = 100<\/code> obsahuje člen <code>x*y<\/code>, t. j. súčin dvoch rozhodovacích premenných — ide o nelineárnu rovnicu. V možnostiach <code>A<\/code>, <code>C<\/code>, <code>D<\/code> sú len lineárne kombinácie s konštantami. (V ďalšej Moodle obmene P100 sa podobne nemôže vyskytnúť <code>y = 1.2/x<\/code>, kým <code>y/1.2 = x<\/code> je lineárna.)<\/p>", "trapHtml": "<p>Študenti si často mýlia delenie konštantou (<code>y/1.2 = x<\/code>) s nelinearitou. Nelinearitu spôsobuje až súčin alebo podiel dvoch premenných (<code>x*y<\/code> alebo <code>1.2/x<\/code>).<\/p>", "answer": "B", "options": [{"key": "A", "html": "<code>10*2*x + 5*3*y = 100<\/code>"}, {"key": "B", "html": "<code>x*(1+y) = 100<\/code>"}, {"key": "C", "html": "<code>5*(x + y) = 100<\/code>"}, {"key": "D", "html": "<code>x = y<\/code>"}], "multi": false, "shuffleOptions": true}, {"id": "Q07", "area": "ZLP", "areaName": "1. Základné lineárne podmienky", "origin": "exercise_theory", "originLabel": "Z cvičenia / prednášky", "tier": "A", "tierLabel": "Režim A (TEST 1)", "isMain": false, "optional": false, "archived": false, "type": "1-R", "title": "Rozdiel súčtu výrobkov o konštantu", "source": "cv01 / MaO_01_Jednoduché lineárne podmienky II (Pr. 5c)", "promptHtml": "<p>Pre vyrobené množstvá výrobkov A (<code>x<\/code>), B (<code>y<\/code>) a C (<code>z<\/code>) napíšte lineárnu podmienku vyjadrujúcu: <em>„Výrobkov A a B dokopy musí byť aspoň o 15 viac ako výrobkov C.“<\/em><\/p>", "explanationHtml": "<p>Súčet <code>x + y<\/code> musí prevyšovať <code>z<\/code> minimálne o 15 jednotiek, teda <code>x + y - z &gt;= 15<\/code>, čo je ekvivalentné <code>x + y &gt;= z + 15<\/code>.<\/p>", "trapHtml": "<p>Pričítanie <code>+ 15<\/code> na väčšiu stranu (<code>x + y + 15 &gt;= z<\/code>) spôsobí presný opak a dovolí, aby bolo A+B dokonca menej ako C.<\/p>", "answer": "x + y >= z + 15", "formatHint": "1 riadok (nerovnica s premennými x, y, z)", "equivalents": ["x + y >= z + 15", "x + y - z >= 15", "z + 15 <= x + y"]}, {"id": "Q08", "area": "ZLP", "areaName": "1. Základné lineárne podmienky", "origin": "exercise_theory", "originLabel": "Z cvičenia / prednášky", "tier": "A", "tierLabel": "Režim A (TEST 1)", "isMain": false, "optional": false, "archived": false, "type": "MCQ", "title": "Preprava študentov s limitom šoférov", "source": "cv01 / MaO_01_Jednoduché lineárne podmienky II (Pr. 2)", "promptHtml": "<p>Škola potrebuje prepraviť <strong>400<\/strong> študentov. Dopravca má <strong>10<\/strong> veľkých autobusov po 50 miest (prenájom <code>800 €<\/code>), <strong>8<\/strong> malých autobusov po 40 miest (prenájom <code>600 €<\/code>), ale k dispozícii má len <strong>9<\/strong> šoférov. Nech <code>v<\/code> je počet veľkých a <code>m<\/code> počet malých autobusov. Ktorý zápis podmienok a účelovej funkcie je úplný a správny?<\/p>", "explanationHtml": "<p>Každý nasadený autobus potrebuje jedného šoféra, preto musí platiť aj <code>v + m &lt;= 9<\/code> popri kapacite vozidiel <code>v &lt;= 10<\/code>, <code>m &lt;= 8<\/code> a prepravnej kapacite miest <code>50*v + 40*m &gt;= 400<\/code>.<\/p>", "trapHtml": "<p>Vynechanie podmienky <code>v + m &lt;= 9<\/code> (počet šoférov) by viedlo k lacnejšiemu, ale nerealizovateľnému riešeniu s 10 malými autobusmi (<code>m = 10 &gt; 8<\/code>, resp. bez šoféra).<\/p>", "answer": "B", "options": [{"key": "A", "html": "<code>min 800*v + 600*m<\/code>; podm.: <code>50*v + 40*m &gt;= 400<\/code>, <code>v &lt;= 10<\/code>, <code>m &lt;= 8<\/code>"}, {"key": "B", "html": "<code>min 800*v + 600*m<\/code>; podm.: <code>50*v + 40*m &gt;= 400<\/code>, <code>v &lt;= 10<\/code>, <code>m &lt;= 8<\/code>, <code>v + m &lt;= 9<\/code>"}, {"key": "C", "html": "<code>min 800*v + 600*m<\/code>; podm.: <code>50*v + 40*m &lt;= 400<\/code>, <code>v + m &gt;= 9<\/code>"}, {"key": "D", "html": "<code>max 50*v + 40*m<\/code>; podm.: <code>800*v + 600*m &lt;= 7200<\/code>, <code>v + m &lt;= 9<\/code>"}], "multi": false, "shuffleOptions": true}, {"id": "Q09", "area": "ZLP", "areaName": "1. Základné lineárne podmienky", "origin": "exercise_theory", "originLabel": "Z cvičenia / prednášky", "tier": "A", "tierLabel": "Režim A (TEST 1)", "isMain": false, "optional": false, "archived": false, "type": "MCQ", "title": "Prečo v LP nepoužívame ostré nerovnosti < a >", "source": "MO_01, MO_03 (teória polyédrov)", "promptHtml": "<p>Prečo sa v úlohách spojitého lineárneho programovania nepoužívajú ostré nerovnosti tvaru <code>x &gt; 5<\/code> (namiesto <code>x &gt;= 5<\/code>)?<\/p>", "explanationHtml": "<p>Aby bolo na uzavretom polyédri zaručené dosiahnutie minima alebo maxima na hranici (pokiaľ je účelová funkcia ohraničená), používajú sa v LP len neostré nerovnosti <code>&lt;=<\/code>, <code>&gt;=<\/code> a rovnice <code>=<\/code>. Napríklad úloha <code>min x<\/code> za podmienky <code>x &gt; 5<\/code> nemá minimum (môžeme voliť <code>5,1; 5,01; 5,001...<\/code>, ale hranicu <code>5<\/code> nemožno dosiahnuť). Poznámka k teórii: prípustná množina LP pritom nemusí byť vždy ohraničená a ani nemusí mať krajný bod (existujú neohraničené polyédre aj množiny bez krajných bodov, napr. pás alebo polpriestor).<\/p>", "trapHtml": "<p>Ak potrebujeme ostré prekročenie pri celočíselnej premennej, píšeme <code>x &gt;= 6<\/code>, nie <code>x &gt; 5<\/code>. V spojitom LP sa píšu vždy neostré nerovnosti <code>&lt;=<\/code> a <code>&gt;=<\/code>.<\/p>", "answer": "B", "options": [{"key": "A", "html": "Odborne je <code>&gt;<\/code> povolené, iba Xpress Mosel používa namiesto neho textový zápis <code>gt<\/code>."}, {"key": "B", "html": "Ostrá nerovnosť vytvára neuzavretú množinu prípustných riešení (hraničný bod <code>x = 5<\/code> do nej nepatrí), takže dosiahnuteľné optimálne riešenie nemusí existovať."}, {"key": "C", "html": "Ostrá nerovnosť automaticky mení spojitú premennú na binárnu."}, {"key": "D", "html": "Ostrá nerovnosť obráti maximalizáciu účelovej funkcie na minimalizáciu."}], "multi": false, "shuffleOptions": true}, {"id": "Q10", "area": "ZLP", "areaName": "1. Základné lineárne podmienky", "origin": "exercise_theory", "originLabel": "Z cvičenia / prednášky", "tier": "A", "tierLabel": "Režim A (TEST 1)", "isMain": false, "optional": false, "archived": false, "type": "1-R", "title": "Dostatok surovín na výrobu čokolád s prevodom jednotiek", "source": "cv01 / MaO_01_Jednoduché lineárne podmienky (Pr. 8)", "promptHtml": "<p>Na výrobu 1 kusu čokolády potrebujeme <strong>3 dkg<\/strong> lieskových orieškov a <strong>50 ml<\/strong> mlieka. Nech <code>w<\/code> označuje počet vyrobených kusov čokolády, <code>x<\/code> je množstvo orieškov <strong>v kilogramoch<\/strong> a <code>z<\/code> množstvo mlieka <strong>v litroch<\/strong>. Napíšte dve lineárne podmienky zaručujúce dostatok ingrediencií v požadovaných jednotkách.<\/p>", "explanationHtml": "<p><code>1 dkg = 10 g = 0.01 kg<\/code>, takže <code>3 dkg = 0.03 kg<\/code>. <code>50 ml = 0.05 l<\/code>. Aby sme mali dostatok surovín, musí byť <code>x &gt;= 0.03*w<\/code> a <code>z &gt;= 0.05*w<\/code> (pri minimalizácii nákladov stačí aj <code>=<\/code>).<\/p>", "trapHtml": "<p>Najčastejší omyl je napísať <code>0.3*w<\/code> namiesto <code>0.03*w<\/code> (zámena <code>dkg -&gt; kg<\/code>: 1 kg = 100 dkg, nie 10!) a <code>0.5*w<\/code> namiesto <code>0.05*w<\/code> (<code>1 l = 1000 ml<\/code>).<\/p>", "answer": "x >= 0.03*w; z >= 0.05*w", "formatHint": "1 riadok (dve podmienky oddelené `;` s jednotkovou zhodou v kg a l)", "equivalents": ["x >= 0.03*w; z >= 0.05*w", "x = 0.03*w; z = 0.05*w", "100*x >= 3*w; 20*z >= w"]}, {"id": "Q11", "area": "PV", "areaName": "2. Plánovanie výroby (jednoperiódové a multiperiódové)", "origin": "exercise_theory", "originLabel": "Z cvičenia / prednášky", "tier": "A", "tierLabel": "Režim A (TEST 1)", "isMain": false, "optional": false, "archived": false, "type": "1-R", "title": "Bilancia polotovaru V1 v chemickom závode", "source": "cv02 / Cv02_Vyrobky.mos", "promptHtml": "<p>Chemický závod vyrába štyri výrobky <code>V1, V2, V3, V4<\/code>, pričom premenné <code>v1, v2, v3, v4<\/code> znamenajú <strong>celkové vyrobené množstvo<\/strong> každého výrobku (v tonách). Technické normy spotreby polotovarov sú v tabuľke:<\/p>\n<div class=\"tbl-wrap\"><table class=\"data-table\"><thead><tr><th style=\"text-align:left\">Polotovar \\ Na 1 t výrobku<\/th><th style=\"text-align:right\">V1<\/th><th style=\"text-align:right\">V2<\/th><th style=\"text-align:right\">V3<\/th><th style=\"text-align:right\">V4<\/th><\/tr><\/thead><tbody><tr><td style=\"text-align:left\">Výrobok V1 [t]<\/td><td style=\"text-align:right\">—<\/td><td style=\"text-align:right\">0.5<\/td><td style=\"text-align:right\">0<\/td><td style=\"text-align:right\">1.0<\/td><\/tr><tr><td style=\"text-align:left\">Výrobok V2 [t]<\/td><td style=\"text-align:right\">—<\/td><td style=\"text-align:right\">—<\/td><td style=\"text-align:right\">0.5<\/td><td style=\"text-align:right\">2.0<\/td><\/tr><\/tbody><\/table><\/div>\n<p>Napíšte podmienku zaručujúcu dostatočnú vlastnú výrobu polotovaru <code>V1<\/code> na pokrytie výroby ostatných výrobkov.<\/p>", "explanationHtml": "<p>Na 1 tonu <code>V2<\/code> sa spotrebuje <code>0.5 t<\/code> výrobku <code>V1<\/code> a na 1 tonu <code>V4<\/code> je treba <code>1.0 t<\/code> výrobku <code>V1<\/code> (<code>V3<\/code> priamo <code>V1<\/code> nespotrebúva, vyžaduje len <code>V2<\/code>). Preto musí byť celková výroba <code>v1<\/code> aspoň <code>0.5*v2 + v4<\/code>.<\/p>", "trapHtml": "<p>Nepridávať do pravej strany <code>v3<\/code>, ani nahrádzať <code>0.5*v2<\/code> nepriamym prepisom cez <code>v3<\/code> — lebo výroba <code>v2<\/code> už zahŕňa aj tú časť <code>V2<\/code>, ktorá ide do <code>V3<\/code>.<\/p>", "answer": "v1 >= 0.5*v2 + v4", "formatHint": "1 riadok (nerovnica s v1, v2, v4)", "equivalents": ["v1 >= 0.5*v2 + v4", "v1 - 0.5*v2 - v4 >= 0", "0.5*v2 + v4 <= v1"]}, {"id": "Q12", "area": "PV", "areaName": "2. Plánovanie výroby (jednoperiódové a multiperiódové)", "origin": "exercise_theory", "originLabel": "Z cvičenia / prednášky", "tier": "A", "tierLabel": "Režim A (TEST 1)", "isMain": false, "optional": false, "archived": false, "type": "MCQ", "title": "Účelová funkcia odbytu pri predaji polotovarov aj finálnych výrobkov", "source": "cv02 / Cv02_Vyrobky.mos", "promptHtml": "<p>V nadväznosti na tabuľku polotovarov z predošlej otázky predáva chemický závod tovar, ktorý nespotrebuje vo vlastnej výrobe, na vonkajšom trhu za odbytové ceny: <code>V1 = 300 €/t<\/code>, <code>V2 = 600 €/t<\/code>, <code>V3 = 1000 €/t<\/code>, <code>V4 = 3000 €/t<\/code>. Ak <code>v1, v2, v3, v4<\/code> označujú celkové vyrobené množstvá, ktorý výraz predstavuje <strong>celkový odbyt<\/strong>?<\/p>", "explanationHtml": "<p>Samostatne sa predá len čistý zvyšok <code>v1 - 0.5*v2 - v4<\/code> a <code>v2 - 0.5*v3 - 2*v4<\/code>. Polotovar zabudovaný do <code>V3<\/code> a <code>V4<\/code> sa už predá ako finálny výrobok <code>V3<\/code> resp. <code>V4<\/code>.<\/p>", "trapHtml": "<p>Možnosť <code>A<\/code> započítava hodnotu polotovarov dvakrát (ako predané samostatne aj ako súčasť <code>V4<\/code>), čo zásadne skreslí optimum.<\/p>", "answer": "B", "options": [{"key": "A", "html": "<code>300*v1 + 600*v2 + 1000*v3 + 3000*v4<\/code>"}, {"key": "B", "html": "<code>300*(v1 - 0.5*v2 - v4) + 600*(v2 - 0.5*v3 - 2*v4) + 1000*v3 + 3000*v4<\/code>"}, {"key": "C", "html": "<code>300*(v1 + 0.5*v2 + v4) + 600*(v2 + 0.5*v3 + 2*v4) + 1000*v3 + 3000*v4<\/code>"}, {"key": "D", "html": "<code>300*(0.5*v2 + v4) + 600*(0.5*v3 + 2*v4) + 1000*v3 + 3000*v4<\/code>"}], "multi": false, "shuffleOptions": true}, {"id": "Q13", "area": "PV", "areaName": "2. Plánovanie výroby (jednoperiódové a multiperiódové)", "origin": "exercise_theory", "originLabel": "Z cvičenia / prednášky", "tier": "B", "tierLabel": "Režim B (Rozšírené)", "isMain": false, "optional": false, "archived": false, "type": "1-R", "title": "Optimálny odbyt a samostatný predaj polotovaru V1", "source": "cv02 / Cv02_Vyrobky.mos (overené v Mosel)", "promptHtml": "<p>Chemický závod má k dispozícii <code>1200 hod<\/code> času zariadenia a <code>1400 t<\/code> suroviny štvrťročne. Technické normy (na 1 t výrobku) a ceny sú:<\/p>\n<div class=\"tbl-wrap\"><table class=\"data-table\"><thead><tr><th style=\"text-align:left\">Parameter<\/th><th style=\"text-align:right\">V1<\/th><th style=\"text-align:right\">V2<\/th><th style=\"text-align:right\">V3<\/th><th style=\"text-align:right\">V4<\/th><\/tr><\/thead><tbody><tr><td style=\"text-align:left\">Zariadenie [hod/t]<\/td><td style=\"text-align:right\">1.5<\/td><td style=\"text-align:right\">0<\/td><td style=\"text-align:right\">2.0<\/td><td style=\"text-align:right\">2.5<\/td><\/tr><tr><td style=\"text-align:left\">Surovina [t/t]<\/td><td style=\"text-align:right\">2.0<\/td><td style=\"text-align:right\">1.5<\/td><td style=\"text-align:right\">2.0<\/td><td style=\"text-align:right\">0<\/td><\/tr><tr><td style=\"text-align:left\">Spotreba V1 [t/t]<\/td><td style=\"text-align:right\">—<\/td><td style=\"text-align:right\">0.5<\/td><td style=\"text-align:right\">0<\/td><td style=\"text-align:right\">1.0<\/td><\/tr><tr><td style=\"text-align:left\">Spotreba V2 [t/t]<\/td><td style=\"text-align:right\">—<\/td><td style=\"text-align:right\">—<\/td><td style=\"text-align:right\">0.5<\/td><td style=\"text-align:right\">2.0<\/td><\/tr><tr><td style=\"text-align:left\">Cena [€/t]<\/td><td style=\"text-align:right\">300<\/td><td style=\"text-align:right\">600<\/td><td style=\"text-align:right\">1000<\/td><td style=\"text-align:right\">3000<\/td><\/tr><\/tbody><\/table><\/div>\n<p>V optimálnom riešení sa vyrobí <code>v1 = 400<\/code>, <code>v2 = 400<\/code>, <code>v3 = 0<\/code>, <code>v4 = 200<\/code> ton. Vypočítajte <strong>celkový odbyt [€]<\/strong> a <strong>množstvo V1 predávané samostatne [t]<\/strong>.<\/p>", "explanationHtml": "<p>Samostatný predaj <code>V1<\/code>: <code>v1 - 0.5*v2 - v4 = 400 - 0.5*400 - 200 = 0 t<\/code>. Samostatný predaj <code>V2<\/code>: <code>v2 - 0.5*v3 - 2*v4 = 400 - 0 - 400 = 0 t<\/code>. Celý odbyt tvorí <code>V4<\/code>: <code>200 * 3000 = 600 000 €<\/code>.<\/p>", "trapHtml": "<p>Zápis <code>400<\/code> ako samostatný predaj <code>V1<\/code> — hodnota <code>getsol(v1) = 400<\/code> vyjadruje celkovú výrobu <code>V1<\/code>, z ktorej však 200 t išlo do <code>V2<\/code> a 200 t priamo do <code>V4<\/code>!<\/p>", "answer": "600000; 0", "formatHint": "1 riadok v tvare: `odbyt; samostatny_predaj_V1` (celé čísla)", "equivalents": ["600000; 0", "600000;0"]}, {"id": "Q14", "area": "PV", "areaName": "2. Plánovanie výroby (jednoperiódové a multiperiódové)", "origin": "exercise_theory", "originLabel": "Z cvičenia / prednášky", "tier": "B", "tierLabel": "Režim B (Rozšírené)", "isMain": false, "optional": false, "archived": false, "type": "MCQ", "title": "Obmena cieľa: minimálna spotreba suroviny pri zaručenom odbite", "source": "cv02 / MaO_02_Úloha plánovania výroby (Pr. 1a)", "promptHtml": "<p>Pri nezmenených údajoch chemického závodu z <code>Q13<\/code> chceme minimalizovať spotrebu suroviny za predpokladu, že štvrťročný odbyt bude <strong>aspoň 540 000 €<\/strong>. Aký je výsledok optimálneho plánu?<\/p>", "explanationHtml": "<p>Keďže pri plnom odbytu <code>600 000 €<\/code> sme mali <code>v4 = 200<\/code>, pre presne 90 % výkonu (<code>odbyt = 540 000 €<\/code>, t. j. <code>v4 = 180<\/code>, <code>v2 = 360<\/code>, <code>v1 = 360<\/code>) klesnú úmerne aj obe spotreby na 90 %: surovina <code>0.9 * 1400 = 1260 t<\/code> a zariadenie <code>0.9 * 1100 = 990 hod<\/code>.<\/p>", "trapHtml": "<p>Vydeliť <code>0.9 * 1200 = 1080<\/code> hod — v pôvodnom optime zariadenie nebolo plne vyťažené (<code>act = 1100<\/code>, <code>slack = 100<\/code>), preto škálujeme zo skutočnej spotreby 1100 hod!<\/p>", "answer": "A", "options": [{"key": "A", "html": "Spotrebuje sa <code>1260 t<\/code> suroviny a <code>990 hod<\/code> strojového času."}, {"key": "B", "html": "Spotrebuje sa <code>1400 t<\/code> suroviny a <code>1200 hod<\/code> strojového času."}, {"key": "C", "html": "Úloha je neprípustná (<code>XPRS_INF<\/code>), lebo <code>540 000 €<\/code> sa nedá dosiahnuť."}, {"key": "D", "html": "Spotrebuje sa <code>540 t<\/code> suroviny a vyrobí sa <code>180 t<\/code> výrobku <code>V4<\/code>."}], "multi": false, "shuffleOptions": true}, {"id": "Q15", "area": "PV", "areaName": "2. Plánovanie výroby (jednoperiódové a multiperiódové)", "origin": "exercise_theory", "originLabel": "Z cvičenia / prednášky", "tier": "A", "tierLabel": "Režim A (TEST 1)", "isMain": false, "optional": false, "archived": false, "type": "1-R", "title": "Montáž telefónnych prípojok TP61, TP68, TXT", "source": "cv06 / MO_Zhrnutie_Cv1-Cv6.pdf (overené v Mosel)", "promptHtml": "<p>Závod montuje prípojky <code>TP61 (x1)<\/code>, <code>TP68 (x2)<\/code> a <code>TXT (x3)<\/code>: dokopy najviac <strong>150 ks<\/strong>, z toho typov <code>TP<\/code> spolu max <strong>100 ks<\/strong> a typu <code>TXT<\/code> max <strong>80 ks<\/strong>. Náklady na montáž <code>[5, 2, 4]<\/code> stoviek €/ks, rozpočet je <strong>640<\/strong> stoviek €, ročný zisk <code>[25, 10, 18]<\/code> stoviek €/ks. Napíšte obmedzenie počtu prípojok typu <code>TP<\/code> a vypočítajte maximálny ročný zisk (v stovkách €).<\/p>", "explanationHtml": "<p>Pomer zisk/náklad pre <code>TP61<\/code> je <code>25/5 = 5<\/code>, pre <code>TP68<\/code> tiež <code>5<\/code>, pre <code>TXT<\/code> <code>18/4 = 4.5<\/code>. Závod preto nasadí max počet <code>TP61<\/code>: <code>x1 = 100<\/code> (čím vyčerpá limit <code>x1 + x2 &lt;= 100<\/code> a <code>500<\/code> rozpočtu), zvyšok <code>140<\/code> rozpočtu pokryje <code>x3 = 140/4 = 35<\/code> ks <code>TXT<\/code> (<code>100 + 35 = 135 &lt;= 150<\/code>). Zisk = <code>25*100 + 18*35 = 2500 + 630 = 3130<\/code>.<\/p>", "trapHtml": "<p>Pridať do podmienky <code>x1 &lt;= 100; x2 &lt;= 100<\/code> namiesto spoločného obmedzenia <code>x1 + x2 &lt;= 100<\/code> pre oba typy TP.<\/p>", "answer": "x1 + x2 <= 100; 3130", "formatHint": "1 riadok v tvare: `podmienka; max_zisk`", "equivalents": ["x1 + x2 <= 100; 3130", "x1+x2<=100; 3130"]}, {"id": "Q16", "area": "PV", "areaName": "2. Plánovanie výroby (jednoperiódové a multiperiódové)", "origin": "adapted_moodle", "originLabel": "Upravená Moodle", "tier": "A", "tierLabel": "Režim A (TEST 1)", "isMain": false, "optional": false, "archived": true, "type": "MCQ", "title": "Výroba V1–V3 pri obmedzenej surovine a čase", "source": "Archív Moodle (Tab1.JPG, test1.png, P34) — overené v Mosel", "promptHtml": "<p>Strojársky závod vyrába tri druhy výrobkov (<code>x(1), x(2), x(3)<\/code> v ks) pri dostupnosti <strong>100 t<\/strong> suroviny a <strong>80 hod<\/strong> pracovného času podľa tabuľky:<\/p>\n<div class=\"tbl-wrap\"><table class=\"data-table\"><thead><tr><th style=\"text-align:left\">Výrobok<\/th><th style=\"text-align:right\">Spotreba suroviny [t/ks]<\/th><th style=\"text-align:right\">Pracovný čas [hod/ks]<\/th><th style=\"text-align:right\">Cena [€/ks]<\/th><\/tr><\/thead><tbody><tr><td style=\"text-align:left\">V1 (<code>x(1)<\/code>)<\/td><td style=\"text-align:right\">1<\/td><td style=\"text-align:right\">3<\/td><td style=\"text-align:right\">50<\/td><\/tr><tr><td style=\"text-align:left\">V2 (<code>x(2)<\/code>)<\/td><td style=\"text-align:right\">2<\/td><td style=\"text-align:right\">1<\/td><td style=\"text-align:right\">20<\/td><\/tr><tr><td style=\"text-align:left\">V3 (<code>x(3)<\/code>)<\/td><td style=\"text-align:right\">3<\/td><td style=\"text-align:right\">1<\/td><td style=\"text-align:right\">30<\/td><\/tr><\/tbody><\/table><\/div>\n<p>Ktoré z tvrdení platí pre <strong>maximálne tržby<\/strong> (pri spojitej výrobe)?<\/p>", "explanationHtml": "<p>Pri rovnosti oboch obmedzení <code>x(1) + 3*x(3) = 100<\/code> a <code>3*x(1) + x(3) = 80<\/code> (pre <code>x(2)=0<\/code>) dostaneme <code>8*x(1) = 140 =&gt; x(1) = 17.5<\/code>, <code>x(3) = 27.5<\/code>. Tržba = <code>50*17.5 + 30*27.5 = 875 + 825 = 1700 €<\/code>. Rohové riešenia s jedným výrobkom sú horšie (<code>V1<\/code>: <code>1333.33<\/code>, <code>V3<\/code>: <code>1000<\/code>). (Na tú istú tabuľku Závod sa v Moodle pýtali aj 1-R podmienky: <code>3*x1+x2&lt;=500<\/code>, <code>50*x(1)+20*x(2)+30*x(3)&gt;=100000<\/code>, <code>x(1)&gt;=3*x(2)<\/code>.)<\/p>", "trapHtml": "<p>Uspokojiť sa s výrobou iba jedného najziskovejšieho produktu podľa jedného zdroja bez kontroly priesečníka oboch úzkych profilov.<\/p>", "answer": "B", "options": [{"key": "A", "html": "Maximálne tržby sú <code>1333.33 €<\/code>, vyrába sa iba <code>V1<\/code> (<code>26.67 ks<\/code>)."}, {"key": "B", "html": "Maximálne tržby sú <code>1700 €<\/code>, vyrába sa <code>x(1) = 17.5<\/code>, <code>x(2) = 0<\/code>, <code>x(3) = 27.5<\/code>."}, {"key": "C", "html": "Maximálne tržby sú <code>1000 €<\/code>, vyrába sa iba <code>V3<\/code> (<code>33.33 ks<\/code>)."}, {"key": "D", "html": "Maximálne tržby sú <code>2000 €<\/code>, vyrába sa <code>x(2) = 50<\/code> a <code>x(3) = 0<\/code>."}], "multi": false, "shuffleOptions": true}, {"id": "Q17", "area": "PV", "areaName": "2. Plánovanie výroby (jednoperiódové a multiperiódové)", "origin": "exercise_theory", "originLabel": "Z cvičenia / prednášky", "tier": "A", "tierLabel": "Režim A (TEST 1)", "isMain": false, "optional": false, "archived": false, "type": "MCQ", "title": "Skladová bilancia v multiperiódovom modeli (Bicykle)", "source": "cv02 / Cv02_Bicykle.mos", "promptHtml": "<p>V multiperiódovom modeli plánovania výroby bicyklov pre mesiace <code>t = 2..12<\/code> znamená <code>x(t)<\/code> normálnu výrobu, <code>n(t)<\/code> nadčasovú výrobu, <code>d(t)<\/code> dopyt v mesiaci <code>t<\/code> a <code>s(t)<\/code> stav zásob na konci mesiaca <code>t<\/code>. Ktorá rovnica správne opisuje skladovú bilanciu v mesiaci <code>t<\/code>?<\/p>", "explanationHtml": "<p>Konečná zásoba mesiaca <code>t<\/code> vznikne ako počiatočná zásoba prevzatá z predchádzajúceho mesiaca <code>s(t-1)<\/code> plus celková výroba v mesiaci (<code>x(t) + n(t)<\/code>) mínus dodaný dopyt <code>d(t)<\/code>.<\/p>", "trapHtml": "<p>Možnosť <code>D<\/code> zabúda previesť zásobu <code>s(t-1)<\/code> z minulého mesiaca, čím sa celé plánovanie rozpadne na nezávislé mesiace bez možnosti predzásobenia.<\/p>", "answer": "A", "options": [{"key": "A", "html": "<code>s(t) = s(t-1) + x(t) + n(t) - d(t)<\/code>"}, {"key": "B", "html": "<code>s(t) = s(t-1) + x(t) + n(t) + d(t)<\/code>"}, {"key": "C", "html": "<code>s(t-1) = s(t) + x(t) + n(t) - d(t)<\/code>"}, {"key": "D", "html": "<code>x(t) + n(t) - d(t) = s(t)<\/code>"}], "multi": false, "shuffleOptions": true}, {"id": "Q18", "area": "PV", "areaName": "2. Plánovanie výroby (jednoperiódové a multiperiódové)", "origin": "exercise_theory", "originLabel": "Z cvičenia / prednášky", "tier": "A", "tierLabel": "Režim A (TEST 1)", "isMain": false, "optional": false, "archived": false, "type": "1-R", "title": "Počiatočná zásoba a nadčasový limit v modeli Bicykle", "source": "cv02 / Cv02_Bicykle.mos", "promptHtml": "<p>Firma vyrábajúca bicykle dokáže v normálnom režime vyrobiť max <code>30<\/code> tis. ks/mesiac (<code>x(t)<\/code>). Výrobu možno zvýšiť nadčasom (<code>n(t)<\/code>) najviac o <strong>50 %<\/strong>. Na začiatku 1. mesiaca je na sklade <code>2<\/code> tis. ks a januárový dopyt je <code>30<\/code> tis. ks. Napíšte skladovú rovnicu pre <code>t = 1<\/code> a limit nadčasu pre ľubovoľné <code>t<\/code>.<\/p>", "explanationHtml": "<p>V <code>t = 1<\/code> nemáme index <code>s(0)<\/code> (ak rozsah začína od 1), preto priamo dosadíme <code>2<\/code> tis. ks na začiatku. Navýšenie výroby o 50 % nad normálnu kapacitu <code>30<\/code> znamená max <code>0.5 * 30 = 15<\/code> tis. nadčasových ks.<\/p>", "trapHtml": "<p>Napísať <code>n(t) &lt;= 45<\/code> (to by znamenalo celkovo <code>30 + 45 = 75<\/code> ks namiesto <code>+50 %<\/code> k 30!) alebo zabudnúť na <code>2<\/code> v bilancii prvého mesiaca.<\/p>", "answer": "2 + x(1) + n(1) - 30 = s(1); n(t) <= 15", "formatHint": "1 riadok v tvare: `bilancia_t1; limit_nadcasu` (v tis. ks)", "equivalents": ["2 + x(1) + n(1) - 30 = s(1); n(t) <= 15", "s(1) = x(1) + n(1) - 28; n(t) <= 15", "x(1) + n(1) - 28 = s(1); n(t) <= 0.5*30"]}, {"id": "Q19", "area": "PV", "areaName": "2. Plánovanie výroby (jednoperiódové a multiperiódové)", "origin": "exercise_theory", "originLabel": "Z cvičenia / prednášky", "tier": "A", "tierLabel": "Režim A (TEST 1)", "isMain": false, "optional": false, "archived": false, "type": "MCQ", "title": "Okrajové podmienky zásob a účelová funkcia (NSC oceľ)", "source": "cv02 / MaO_02_Úloha plánovania výroby - multiperiod (Pr. 2)", "promptHtml": "<p>Spoločnosť NSC plánuje výrobu <code>x(t)<\/code> ton ocele na 4 mesiace (<code>t = 1..4<\/code>) s výrobnými nákladmi <code>c(t)<\/code> <code>[7400, 7500, 7600, 7800] $/t<\/code>. Zásoba na konci mesiaca <code>s(t)<\/code> sa skladuje za <code>120 $/t<\/code>. Na začiatku 1. mesiaca je na sklade <code>1000 t<\/code>, na konci 4. mesiaca má zostať <strong>aspoň <code>1500 t<\/code><\/strong>. Ktorá kombinácia podmienok a cieľa je správna?<\/p>", "explanationHtml": "<p>Počiatočná zásoba sa fixuje <code>s(0) = 1000<\/code> (už existuje, neplatíme za ňu výrobu ani koniec predchádzajúceho mesiaca v tomto horizonte). Požiadavka na minimálnu konečnú zásobu je <code>s(4) &gt;= 1500<\/code> (pri minimalizácii nákladov sa v optime zvyčajne ustáli presne na <code>1500<\/code>).<\/p>", "trapHtml": "<p>Zámena <code>s(4) &gt;= 1500<\/code> za <code>&lt;= 1500<\/code> (čo dovolí minúť všetko do nuly) alebo zahrnutie <code>120*s(0)<\/code> do sumy nákladov.<\/p>", "answer": "B", "options": [{"key": "A", "html": "<code>s(0) = 1000<\/code>, <code>s(4) = 0<\/code>, cieľ <code>sum(t=1..4) (c(t)*x(t) + 120*s(t))<\/code>"}, {"key": "B", "html": "<code>s(0) = 1000<\/code>, <code>s(4) &gt;= 1500<\/code>, cieľ <code>sum(t=1..4) (c(t)*x(t) + 120*s(t))<\/code>"}, {"key": "C", "html": "<code>s(0) = 1000<\/code>, <code>s(4) &lt;= 1500<\/code>, cieľ <code>sum(t=0..4) (c(t)*x(t) + 120*s(t))<\/code>"}, {"key": "D", "html": "<code>s(0) = 1500<\/code>, <code>s(4) &gt;= 1000<\/code>, cieľ <code>sum(t=1..4) c(t)*x(t)<\/code>"}], "multi": false, "shuffleOptions": true}, {"id": "Q20", "area": "PV", "areaName": "2. Plánovanie výroby (jednoperiódové a multiperiódové)", "origin": "exercise_theory", "originLabel": "Z cvičenia / prednášky", "tier": "B", "tierLabel": "Režim B (Rozšírené)", "isMain": false, "optional": false, "archived": false, "type": "1-R", "title": "Jednotkové náklady strojového času na dva stroje (Pneumatiky)", "source": "cv02 / MaO_02_Úloha plánovania výroby - multiperiod (Pr. 3)", "promptHtml": "<p>Výroba 1 ks polyamidovej pneumatiky vyžaduje <strong>0.15 hod<\/strong> na stroji S1 a <strong>0.16 hod<\/strong> na stroji S2. Hodina prevádzky na ľubovoľnom stroji stojí <strong>5 $<\/strong>. Materiál na 1 ks stojí <code>13 $<\/code>, balenie a expedícia <code>0.50 $<\/code>. Aké sú samostatné <strong>náklady na strojový čas<\/strong> na výrobu 1 polyamidovej pneumatiky (v $)?<\/p>", "explanationHtml": "<p>Pneumatika musí prejsť oboma strojmi, takže celkový strojový čas na 1 ks je <code>0.15 + 0.16 = 0.31 hod<\/code>. Pri sadzbe <code>5 $/hod<\/code> je cena strojového času <code>(0.15 + 0.16) * 5 = 1.55 $<\/code>.<\/p>", "trapHtml": "<p>Započítať len jeden stroj (<code>0.15 * 5 = 0.75 $<\/code>) alebo primiešať cenu materiálu <code>13 $<\/code> a expedície <code>0.50 $<\/code>, keď sa pýtame len na náklady strojového času.<\/p>", "answer": "1.55", "formatHint": "1 riadok (číslo v $ bez znaku meny, desatinná bodka)", "equivalents": ["1.55", "1,55"]}, {"id": "Q21", "area": "DU", "areaName": "3. Dopravná úloha", "origin": "exercise_theory", "originLabel": "Z cvičenia / prednášky", "tier": "A", "tierLabel": "Režim A (TEST 1)", "isMain": false, "optional": false, "archived": false, "type": "MCQ", "title": "Typ nerovníc v nevyrovnanej DÚ s prebytkom kapacity", "source": "cv03 / MaO_03_DopravnaUloha.pdf, MO_04", "promptHtml": "<p>Máme minimalizovať dopravné náklady (<code>c(i, j) &gt; 0<\/code>), pričom súčet kapacít dodávateľov <code>sum a(i)<\/code> je <strong>väčší<\/strong> ako súčet požiadaviek odberateľov <code>sum b(j)<\/code>. Aké znamienka musia mať kapacitné a dopytové podmienky?<\/p>", "explanationHtml": "<p>Keďže tovaru je viac než dopytu, niektorý dodávateľ si prebytok nechá na sklade (<code>&lt;= a(i)<\/code>). Všetci odberatelia musia dostať presne toľko, koľko požadujú (<code>= b(j)<\/code> alebo pri kladných cenách <code>&gt;= b(j)<\/code>).<\/p>", "trapHtml": "<p>Ponechať <code>=<\/code> u dodávateľov spôsobí okamžitú neprípustnosť modelu (<code>XPRS_INF<\/code>), lebo nie je kam prepraviť celú kapacitu.<\/p>", "answer": "B", "options": [{"key": "A", "html": "Dodávatelia <code>= a(i)<\/code>, odberatelia <code>= b(j)<\/code>"}, {"key": "B", "html": "Dodávatelia <code>&lt;= a(i)<\/code>, odberatelia <code>= b(j)<\/code> (príp. <code>&gt;= b(j)<\/code>)"}, {"key": "C", "html": "Dodávatelia <code>= a(i)<\/code>, odberatelia <code>&lt;= b(j)<\/code>"}, {"key": "D", "html": "Dodávatelia <code>&gt;= a(i)<\/code>, odberatelia <code>&lt;= b(j)<\/code>"}], "multi": false, "shuffleOptions": true}, {"id": "Q22", "area": "DU", "areaName": "3. Dopravná úloha", "origin": "exercise_theory", "originLabel": "Z cvičenia / prednášky", "tier": "A", "tierLabel": "Režim A (TEST 1)", "isMain": false, "optional": false, "archived": false, "type": "MCQ", "title": "Nevyrovnaná DÚ s nedostatkom kapacity (úprava dopytu)", "source": "cv03 / MaO_03_DopravnaUloha.pdf (Pr. 1 Sneh, Pr. 2a Hrášok)", "promptHtml": "<p>Mestské časti potrebujú odviezť dokopy <code>7000 m^3<\/code> snehu, no celková kapacita troch skládok je iba <code>5000 m^3<\/code>. Ak chceme napriek nedostatku kapacity (<code>sum kap &lt; sum poz<\/code>) získať riešiteľný model s najlacnejším odvozom maximálneho možného množstva snehu (celých <code>5000 m^3<\/code>), ako musíme nastaviť znamienka obmedzení?<\/p>", "explanationHtml": "<p>Ak sú kapacity menšie než dopyt (<code>5000 &lt; 7000<\/code>), nemôžeme žiadať odvoz celých <code>7000 m^3<\/code> (<code>=<\/code> dá <code>XPRS_INF<\/code>). Preto dopyt uvoľníme na <code>&lt;= poz(i)<\/code> a skládky využijeme naplno <code>= kap(j)<\/code> (prípadne minimalizujeme max zostatok v štvrtiach).<\/p>", "trapHtml": "<p>Ak dáme <code>&lt;=<\/code> na skládky aj <code>&lt;=<\/code> na dopyty a zároveň minimalizujeme náklady <code>sum c(i,j)*x(i,j)<\/code> bez požiadavky odvozu, riešič odvezie <code>0 m^3<\/code> za <code>0 €<\/code>!<\/p>", "answer": "A", "options": [{"key": "A", "html": "Kapacita skládok <code>= kap(j)<\/code>, požiadavky mestských častí <code>&lt;= poz(i)<\/code>."}, {"key": "B", "html": "Kapacita skládok <code>&lt;= kap(j)<\/code>, požiadavky mestských častí <code>= poz(i)<\/code>."}, {"key": "C", "html": "Kapacita skládok <code>&gt;= kap(j)<\/code>, požiadavky mestských častí <code>&gt;= poz(i)<\/code>."}, {"key": "D", "html": "Úloha má len triviálne nulové riešenie <code>x(i, j) = 0<\/code>."}], "multi": false, "shuffleOptions": true}, {"id": "Q23", "area": "DU", "areaName": "3. Dopravná úloha", "origin": "exercise_theory", "originLabel": "Z cvičenia / prednášky", "tier": "A", "tierLabel": "Režim A (TEST 1)", "isMain": false, "optional": false, "archived": false, "type": "1-R", "title": "Dopravná úloha munícia s obmedzeným úsekom", "source": "cv06 / MO_Zhrnutie_Cv1-Cv6.pdf (overené v Mosel)", "promptHtml": "<p>Prepravujeme muníciu z 2 skladov (<code>a1 = 600 ks<\/code>, <code>a2 = 800 ks<\/code>) do 3 základní (<code>b = [500, 300, 400] ks<\/code>). Cena prepravy 1 ks zo Skladu 1 k ľubovoľnej základni je <strong>5 €<\/strong>, zo Skladu 2 <strong>6 €<\/strong>. Na poškodenom úseku zo <strong>Skladu 1 do Základne 3<\/strong> možno prepraviť <strong>max 200 ks<\/strong>. Vypočítajte minimálne celkové náklady na prepravu (v €).<\/p>", "explanationHtml": "<p>Celkový dopyt je <code>500 + 300 + 400 = 1200 ks<\/code>. Keďže Sklad 1 je lacnejší (<code>5 € &lt; 6 €<\/code>), vyčerpáme ho celý (<code>600 ks<\/code>): napr. <code>400<\/code> ks do základne 1 a <code>200<\/code> ks do základne 3 (<code>&lt;= 200<\/code> splnené). Zvyšných <code>1200 - 600 = 600 ks<\/code> dodá Sklad 2 po <code>6 €/ks<\/code>. Spolu: <code>600*5 + 600*6 = 3000 + 3600 = 6600 €<\/code>.<\/p>", "trapHtml": "<p>Prekročiť limit <code>x(1,3) &lt;= 200<\/code> (aj keby sa do základne 1 poslalo menej) — limit <code>x(1,3)<\/code> tu našťastie nebráni využiť celú kapacitu 600 ks cez ostatné trasy <code>(1,1)<\/code> alebo <code>(1,2)<\/code>.<\/p>", "answer": "6600", "formatHint": "1 riadok (celé číslo v €)", "equivalents": ["6600"]}, {"id": "Q24", "area": "DU", "areaName": "3. Dopravná úloha", "origin": "adapted_moodle", "originLabel": "Upravená Moodle", "tier": "A", "tierLabel": "Režim A (TEST 1)", "isMain": false, "optional": false, "archived": true, "type": "MCQ", "title": "Rozmer modelu DÚ: počet premenných a podmienok", "source": "MO_04, test.pdf", "promptHtml": "<p>Klasická dopravná úloha má <strong>4<\/strong> sklady a <strong>5<\/strong> odberateľov. Koľko rozhodovacích premenných <code>x(i, j)<\/code> a koľko kapacitno-dopytových štrukturálnych podmienok obsahuje tento model?<\/p>", "explanationHtml": "<p>Pre <code>m<\/code> skladov a <code>n<\/code> odberateľov vytvárame hranu <code>x(i, j)<\/code> pre každú dvojicu, teda <code>m * n = 4 * 5 = 20<\/code> premenných. Každý sklad má 1 kapacitnú rovnicu/nerovnicu a každý odberateľ 1 dopytovú, t. j. <code>m + n = 4 + 5 = 9<\/code> podmienok.<\/p>", "trapHtml": "<p>Zamenenie <code>m * n<\/code> (premenné) s <code>m + n<\/code> (podmienky), čo patrí k najčastejším teoretickým chybám v Moodle.<\/p>", "answer": "B", "options": [{"key": "A", "html": "<code>9<\/code> premenných a <code>20<\/code> podmienok"}, {"key": "B", "html": "<code>20<\/code> premenných a <code>9<\/code> podmienok"}, {"key": "C", "html": "<code>20<\/code> premenných a <code>20<\/code> podmienok"}, {"key": "D", "html": "<code>9<\/code> premenných a <code>9<\/code> podmienok"}], "multi": false, "shuffleOptions": true}, {"id": "Q25", "area": "DU", "areaName": "3. Dopravná úloha", "origin": "exercise_theory", "originLabel": "Z cvičenia / prednášky", "tier": "A", "tierLabel": "Režim A (TEST 1)", "isMain": false, "optional": false, "archived": false, "type": "1-R", "title": "Zostatok v sklade a zakázaná trasa v DÚ", "source": "cv03 / MaO_03_DopravnaUloha.pdf (Pr. 5a, 5b)", "promptHtml": "<p>Tri sklady majú kapacity <code>[100, 150, 200]<\/code> ton a zásobujú štyroch odberateľov (<code>j = 1..4<\/code>). Premenná <code>x(i, j)<\/code> označuje množstvo tovaru prepravené zo skladu <code>i<\/code> k odberateľovi <code>j<\/code>. Napíšte dve lineárne podmienky: 1) v <strong>druhom sklade<\/strong> musí zostať <strong>aspoň 20 ton<\/strong> tovaru, 2) tovar z <strong>tretieho skladu<\/strong> nevyhovuje <strong>4. odberateľovi<\/strong> (zakázaná trasa).<\/p>", "explanationHtml": "<p>Ak má v druhom sklade z pôvodných <code>150 t<\/code> zostať aspoň <code>20 t<\/code>, možno z neho odviezť najviac <code>150 - 20 = 130 t<\/code>. Zakázaná trasa medzi 3. skladom a 4. odberateľom sa zapíše jednoducho ako <code>x(3,4) = 0<\/code> (alebo pri dynamickom poli nevytvorením).<\/p>", "trapHtml": "<p>Napísať <code>sum(j) x(2,j) &gt;= 20<\/code> (to znamená <em>odviezť<\/em> aspoň 20 t, nie <em>ponechať na sklade<\/em> aspoň 20 t!).<\/p>", "answer": "x(2,1) + x(2,2) + x(2,3) + x(2,4) <= 130; x(3,4) = 0", "formatHint": "1 riadok (dve podmienky oddelené `;`, napr. v rozvinutom tvare alebo cez sum)", "equivalents": ["x(2,1) + x(2,2) + x(2,3) + x(2,4) <= 130; x(3,4) = 0", "150 - (x(2,1) + x(2,2) + x(2,3) + x(2,4)) >= 20; x(3,4) = 0", "sum(j in 1..4) x(2,j) <= 130; x(3,4) = 0"]}, {"id": "Q26", "area": "DU", "areaName": "3. Dopravná úloha", "origin": "exercise_theory", "originLabel": "Z cvičenia / prednášky", "tier": "B", "tierLabel": "Režim B (Rozšírené)", "isMain": false, "optional": false, "archived": false, "type": "1-R", "title": "Výpočet ceny prepravy bez a s obmedzením trasy/zostatku", "source": "cv03 / MaO_03_DopravnaUloha.pdf (Pr. 5 — overené v Mosel)", "promptHtml": "<p>Sklady <code>Z1..Z3<\/code> (<code>a = [100, 150, 200]<\/code>) zásobujú odberateľov <code>S1..S4<\/code> (<code>b = [80, 80, 140, 80]<\/code>) podľa matice cien <code>[€/t]<\/code>:<\/p>\n<div class=\"tbl-wrap\"><table class=\"data-table\"><thead><tr><th style=\"text-align:left\">Zdroj \\ Odberateľ<\/th><th style=\"text-align:right\">S1<\/th><th style=\"text-align:right\">S2<\/th><th style=\"text-align:right\">S3<\/th><th style=\"text-align:right\">S4<\/th><\/tr><\/thead><tbody><tr><td style=\"text-align:left\">Z1 (kap. 100)<\/td><td style=\"text-align:right\">4<\/td><td style=\"text-align:right\">8<\/td><td style=\"text-align:right\">9<\/td><td style=\"text-align:right\">5<\/td><\/tr><tr><td style=\"text-align:left\">Z2 (kap. 150)<\/td><td style=\"text-align:right\">7<\/td><td style=\"text-align:right\">6<\/td><td style=\"text-align:right\">6<\/td><td style=\"text-align:right\">4<\/td><\/tr><tr><td style=\"text-align:left\">Z3 (kap. 200)<\/td><td style=\"text-align:right\">8<\/td><td style=\"text-align:right\">6<\/td><td style=\"text-align:right\">9<\/td><td style=\"text-align:right\">6<\/td><\/tr><\/tbody><\/table><\/div>\n<p>Vypočítajte minimálne náklady <code>C_zakl<\/code> v základnej úlohe a nové náklady <code>C_upr<\/code>, ak platí <code>x(3,4) = 0<\/code> a v sklade <code>Z2<\/code> musí zostať aspoň <code>20 t<\/code> (<code>sum x(2,j) &lt;= 130<\/code>).<\/p>", "explanationHtml": "<p><strong>Základná úloha (<code>2080 €<\/code>)<\/strong>: <code>Z1-&gt;S1(80) + Z1-&gt;S4(20) = 420 €<\/code>; <code>Z2-&gt;S3(140) + Z2-&gt;S4(10) = 880 €<\/code>; <code>Z3-&gt;S2(80) + Z3-&gt;S4(50) = 780 €<\/code>, spolu <code>420 + 880 + 780 = 2080 €<\/code> (<code>70 t<\/code> zostane v sklade <code>Z3<\/code>). <strong>S obmedzeniami (<code>2190 €<\/code>)<\/strong>: kedže <code>x(3,4) = 0<\/code> a <code>Z2<\/code> dodá max <code>130 t<\/code>, optimálna preprava je <code>Z1-&gt;S1(80) + Z1-&gt;S4(20) = 420 €<\/code>; <code>Z2-&gt;S3(70) + Z2-&gt;S4(60) = 660 €<\/code>; <code>Z3-&gt;S2(80) + Z3-&gt;S3(70) = 1110 €<\/code>, spolu <code>420 + 660 + 1110 = 2190 €<\/code>.<\/p>", "trapHtml": "<p>Ručné hádanie bez kontroly alternatívneho rozdelenia do S3/S4 (najmä pri zákaze <code>x(3,4)=0<\/code>, kedy dodávky do S4 musia prevziať S1 a S2, čím sa uvoľní lacný presun S3 z Z2).<\/p>", "answer": "2080; 2190", "formatHint": "1 riadok v tvare: `C_zakl; C_upr` (celé čísla v €)", "equivalents": ["2080; 2190", "2080;2190"]}, {"id": "Q27", "area": "DU", "areaName": "3. Dopravná úloha", "origin": "exercise_theory", "originLabel": "Z cvičenia / prednášky", "tier": "A", "tierLabel": "Režim A (TEST 1)", "isMain": false, "optional": false, "archived": false, "type": "MCQ", "title": "Minimaxová dopravná úloha — najmenšie maximálne zaťaženie cesty", "source": "cv04 / Cv04_DopravnaUlohaMinMax5.mos", "promptHtml": "<p>Prepravujeme muníciu zo skladov <code>i in 1..2<\/code> na strelnice <code>j in 1..3<\/code>. Chceme minimalizovať najväčšie zaťaženie ktoréhokoľvek jednotlivého úseku <code>x(i, j)<\/code> pomocou prídavnej premennej <code>h<\/code>. Ktorý zápis je správny?<\/p>", "explanationHtml": "<p>Premenná <code>h<\/code> tvorí spoločný horný strop pre každú individuálnu trasu <code>x(i, j) &lt;= h<\/code>. Minimalizáciou <code>h<\/code> stláčame najväčšie z čísel <code>x(i, j)<\/code> čo najnižšie.<\/p>", "trapHtml": "<p>Možnosť <code>C<\/code> ohraničuje celkový odber zo skladu, nie jednotlivú komunikáciu <code>x(i, j)<\/code>; možnosť <code>B<\/code> s <code>minimize(h)<\/code> stlačí <code>h<\/code> na <code>0<\/code> (triviálne a neúčinné!).<\/p>", "answer": "A", "options": [{"key": "A", "html": "<code>forall(i in 1..2, j in 1..3) x(i,j) &lt;= h; minimize(h)<\/code>"}, {"key": "B", "html": "<code>forall(i in 1..2, j in 1..3) x(i,j) &gt;= h; minimize(h)<\/code>"}, {"key": "C", "html": "<code>forall(i in 1..2) sum(j in 1..3) x(i,j) &lt;= h; minimize(h)<\/code>"}, {"key": "D", "html": "<code>forall(j in 1..3) sum(i in 1..2) x(i,j) &lt;= h; maximize(h)<\/code>"}], "multi": false, "shuffleOptions": true}, {"id": "Q28", "area": "DU", "areaName": "3. Dopravná úloha", "origin": "exercise_theory", "originLabel": "Z cvičenia / prednášky", "tier": "B", "tierLabel": "Režim B (Rozšírené)", "isMain": false, "optional": false, "archived": false, "type": "1-R", "title": "Výsledok minimaxového toku a rovnomerného zostatku (Munícia)", "source": "cv04 / MaO_04_DopravnaUloha_minMax.pdf (Pr. 5 a 6 — overené v Mosel)", "promptHtml": "<p>Dva sklady munície (<code>600 t<\/code> a <code>500 t<\/code>) zásobujú tri strelnice s požiadavkami <code>300 t<\/code>, <code>200 t<\/code> a <code>200 t<\/code>. a) Aká je minimálna hodnota maximálneho zaťaženia jednej trasy <code>min h<\/code> (Pr. 5)? b) Ak namiesto toho minimalizujeme najväčší zvyšok munície v sklade <code>min r<\/code> (Pr. 6), aké je <code>min r<\/code>?<\/p>", "explanationHtml": "<p>a) Celkový dopyt je <code>700 t<\/code>. Do prvej strelnice (<code>300 t<\/code>) prichádzajú len 2 cesty (zo skladu 1 a 2), preto <code>x(1,1) + x(2,1) = 300 =&gt; max(x(1,1), x(2,1)) &gt;= 300/2 = 150<\/code>. Limit <code>150<\/code> stačí aj pre ostatné (napr. Z1 pošle <code>[150, 150, 100]<\/code>, Z2 pošle <code>[150, 50, 100]<\/code>). b) Celkový nevyvezený zvyšok v oboch skladoch je <code>(600 + 500) - 700 = 400 t<\/code>. Rovnomerné rozdelenie dáva <code>400 / 2 = 200 t<\/code> na každý sklad.<\/p>", "trapHtml": "<p>Deliť celkový dopyt <code>700<\/code> všetkými 6 cestami (<code>700/6 = 116.7<\/code>) — strelnica 1 má len 2 prichádzajúce cesty, takže každá z nich musí v priemere niesť aspoň <code>300/2 = 150 t<\/code>!<\/p>", "answer": "150; 200", "formatHint": "1 riadok v tvare: `min_h; min_r` (v tonách)", "equivalents": ["150; 200", "150;200"]}, {"id": "Q29", "area": "DU", "areaName": "3. Dopravná úloha", "origin": "exercise_theory", "originLabel": "Z cvičenia / prednášky", "tier": "B", "tierLabel": "Režim B (Rozšírené)", "isMain": false, "optional": false, "archived": false, "type": "MCQ", "title": "Rovnomerný zvyšok tovaru vo všeobecnom počte skladov", "source": "cv04 / MaO_04_DopravnaUloha_minMax.pdf (Pr. 1)", "promptHtml": "<p>Pre <code>m<\/code> skladov s kapacitami <code>a(i)<\/code> (<code>sum a(i) &gt; sum b(j)<\/code>) chceme dosiahnuť čo najrovnomernejší zvyšok tovaru po zásobení. Ktorý prístup zaručí riešiteľnosť pre ľubovoľné kapacity <code>a(i)<\/code>?<\/p>", "explanationHtml": "<p>Ak má napríklad jeden z 3 skladov kapacitu menšiu než priemerný zvyšok <code>(sum a - sum b)/3<\/code>, vynútenie presnej rovnosti všetkých zvyškov (<code>B<\/code>) spôsobí neprípustnosť. Minimax (<code>A<\/code>) zníži najväčší zvyšok na teoretické optimum bez straty prípustnosti.<\/p>", "trapHtml": "<p>V <code>cv04<\/code> majú študenti tendenciu písať rovnosť zvyškov, čo zlyhá hneď, ako sú kapacity skladov asymetrické.<\/p>", "answer": "A", "options": [{"key": "A", "html": "Zaviesť pomocnú premennú <code>z<\/code>, pridať pre každé <code>i<\/code>: <code>a(i) - sum(j) x(i,j) &lt;= z<\/code> a minimalizovať <code>z<\/code>."}, {"key": "B", "html": "Pridať rovnosť <code>a(1) - sum(j) x(1,j) = a(2) - sum(j) x(2,j) = ...<\/code> pre všetky sklady."}, {"key": "C", "html": "Maximalizovať súčet všetkých prepravených množstiev <code>sum(i,j) x(i,j)<\/code>."}, {"key": "D", "html": "Pre každé <code>i<\/code> nastaviť <code>sum(j) x(i,j) = a(i)/2<\/code>."}], "multi": false, "shuffleOptions": true}, {"id": "Q30", "area": "DU", "areaName": "3. Dopravná úloha", "origin": "exercise_theory", "originLabel": "Z cvičenia / prednášky", "tier": "C", "tierLabel": "Režim C (Mimo TEST 1)", "isMain": false, "optional": true, "archived": false, "type": "MCQ", "title": "Maximalizácia najmenšieho vs. najmenšieho nenulového toku", "source": "cv04 / MaO_04_DopravnaUloha_minMax.pdf (Pr. 3 vs. Pr. 4)", "promptHtml": "<p>Čím sa líši formulácia úlohy <em>„maximalizovať najmenší tok medzi skladom a zákazníkom“<\/em> (<code>Pr. 3<\/code>) od <em>„maximalizovať najmenší nenulový tok“<\/em> (<code>Pr. 4<\/code>) z pohľadu spojitého LP?<\/p>", "explanationHtml": "<p>Pri <code>Pr. 3<\/code> vyžadujeme dolnú hranicu <code>d<\/code> pre <strong>každú<\/strong> trasu <code>x(i, j) &gt;= d<\/code>. Pri <code>Pr. 4<\/code> chceme, aby trasa s <code>x(i, j) = 0<\/code> neobmedzovala <code>d<\/code>, teda podmienka <code>x(i, j) &gt;= d<\/code> smie platiť len vtedy, ak <code>x(i, j) &gt; 0<\/code> — na prepínač aktivácie je v LP nutná binárna premenná.<\/p>", "trapHtml": "<p>Zápis <code>x(i,j) &gt; 0<\/code> v Moseli nie je platná LP podmienka a neignoruje nulové trasy v <code>min<\/code>.<\/p>", "answer": "A", "options": [{"key": "A", "html": "<code>Pr. 3<\/code> sa dá zapísať spojito (<code>forall(i,j) x(i,j) &gt;= d; maximize(d)<\/code>), zatiaľ čo <code>Pr. 4<\/code> vyžaduje binárne indikátory zapnutia trasy (<code>is_binary<\/code>, mimo čistého spojitého LP)."}, {"key": "B", "html": "Obe úlohy stačí riešiť zmenou <code>minimize<\/code> na <code>maximize<\/code> pri pôvodných nákladoch."}, {"key": "C", "html": "Pre <code>Pr. 4<\/code> stačí pridať podmienku <code>forall(i,j) x(i,j) &gt; 0<\/code>."}, {"key": "D", "html": "<code>Pr. 3<\/code> nie je lineárna, kým <code>Pr. 4<\/code> je čisto spojité LP."}], "multi": false, "shuffleOptions": true}, {"id": "Q31", "area": "DU", "areaName": "3. Dopravná úloha", "origin": "exercise_theory", "originLabel": "Z cvičenia / prednášky", "tier": "A", "tierLabel": "Režim A (TEST 1)", "isMain": false, "optional": false, "archived": false, "type": "1-R", "title": "Prepojenie výroby a dopravy + min. využitie kapacity", "source": "cv04 / Cv04_DopravnaUlohaPriklad4.mos, MaO_03_DopravnaUloha.pdf (Pr. 4a)", "promptHtml": "<p>Tri závody <code>i in 1..3<\/code> s kapacitami <code>k(i)<\/code> zásobujú štyroch predajcov <code>j in 1..4<\/code>. Premenná <code>y(i)<\/code> označuje množstvo vyrobené v závode <code>i<\/code> a <code>x(i, j)<\/code> prepravené množstvo z <code>i<\/code> do <code>j<\/code>. Napíšte podmienky pre ľubovoľný závod <code>i<\/code>: 1) celá výroba <code>y(i)<\/code> sa rozvezie predajcom, 2) každý závod musí vyrobiť <strong>aspoň 60 %<\/strong> svojej kapacity <code>k(i)<\/code>.<\/p>", "explanationHtml": "<p>Prepojenie výroby a rozvozu vyjadruje rovnosť <code>y(i) = sum(j in 1..4) x(i,j)<\/code> (spolu s <code>y(i) &lt;= k(i)<\/code>). Dolný limit vyťaženia kapacity pridá podmienku <code>y(i) &gt;= 0.6*k(i)<\/code>.<\/p>", "trapHtml": "<p>Vyjadriť 60 % kapacity cez jedinú trasu alebo zabudnúť na <code>y(i) &lt;= k(i)<\/code> vedúce k neobmedzenej výrobe.<\/p>", "answer": "y(i) = sum(j in 1..4) x(i,j); y(i) >= 0.6*k(i)", "formatHint": "1 riadok (dve podmienky v tvare `pre_i_1; pre_i_2` so sumou cez `j in 1..4`)", "equivalents": ["y(i) = sum(j in 1..4) x(i,j); y(i) >= 0.6*k(i)", "sum(j in 1..4) x(i,j) = y(i); y(i) >= 0.6*k(i)", "y(i) = x(i,1)+x(i,2)+x(i,3)+x(i,4); y(i) >= 0.6*k(i)"]}, {"id": "Q32", "area": "DU", "areaName": "3. Dopravná úloha", "origin": "exercise_theory", "originLabel": "Z cvičenia / prednášky", "tier": "A", "tierLabel": "Režim A (TEST 1)", "isMain": false, "optional": false, "archived": false, "type": "MCQ", "title": "Výrobné + dopravné náklady bez dvojitého započítania", "source": "cv04 / Cv04_DopravnaUlohaPriklad4.mos", "promptHtml": "<p>V úlohe <code>Q31<\/code> poznáme jednotkové výrobné náklady <code>v(i)<\/code> v závode <code>i<\/code> a dopravné náklady <code>c(i, j)<\/code> na trase <code>(i, j)<\/code>. Ak <code>y(i) = sum(j in 1..4) x(i, j)<\/code> znamená objem výroby v závode <code>i<\/code>, ktorý zápis účelovej funkcie je správny?<\/p>", "explanationHtml": "<p>Výrobné náklady platíme za každú vyrobenú jednotku <code>y(i)<\/code>, dopravné za každú prepravenú jednotku <code>x(i, j)<\/code>. Tento súčet je algebraicky rovnaký ako <code>sum(i,j) (v(i) + c(i,j))*x(i,j)<\/code>, ak <code>y(i)<\/code> nevyužívame osobitne.<\/p>", "trapHtml": "<p>Možnosť <code>A<\/code> zbytočne účtuje výrobné náklady dvakrát (raz cez <code>y(i)<\/code> a druhý raz v súčte s <code>c(i,j)<\/code>).<\/p>", "answer": "B", "options": [{"key": "A", "html": "<code>sum(i in 1..3) v(i)*y(i) + sum(i in 1..3, j in 1..4) (v(i) + c(i,j))*x(i,j)<\/code>"}, {"key": "B", "html": "<code>sum(i in 1..3) v(i)*y(i) + sum(i in 1..3, j in 1..4) c(i,j)*x(i,j)<\/code>"}, {"key": "C", "html": "<code>sum(i in 1..3, j in 1..4) c(i,j)*x(i,j)<\/code>"}, {"key": "D", "html": "<code>sum(i in 1..3) (v(i) + sum(j in 1..4) c(i,j))*y(i)<\/code>"}], "multi": false, "shuffleOptions": true}, {"id": "Q33", "area": "DU", "areaName": "3. Dopravná úloha", "origin": "exercise_theory", "originLabel": "Z cvičenia / prednášky", "tier": "A", "tierLabel": "Režim A (TEST 1)", "isMain": false, "optional": false, "archived": false, "type": "1-R", "title": "Porucha linky v vyrovnanej úlohe Hrášok P&T", "source": "cv03 / MaO_03_DopravnaUloha.pdf (Pr. 2a)", "promptHtml": "<p>Tri konzervárne majú pôvodné kapacity <code>[75, 125, 100]<\/code> kamiónov a štyria odberatelia presné požiadavky <code>[80, 65, 70, 85]<\/code> kamiónov (<code>spolu 300 = 300<\/code>). V dôsledku poruchy poklesne kapacita 1. konzervárne zo <code>75<\/code> na <code>50<\/code> kamiónov, no v modeli ponecháme pri odberateľoch rovnosť <code>sum(i) x(i, j) = b(j)<\/code>. Akú konštantu vráti funkcia <code>getprobstat<\/code> v Moseli (resp. aký typ problému nastane)?<\/p>", "explanationHtml": "<p>Celková dostupná kapacita klesne na <code>50 + 125 + 100 = 275 &lt; 300<\/code>. Keďže nie je možné zároveň splniť <code>sum(j) x(i,j) &lt;= 275<\/code> a dopyty <code>= 300<\/code>, úloha nemá žiadne prípustné riešenie -&gt; <code>XPRS_INF<\/code>.<\/p>", "trapHtml": "<p>Zameniť <code>XPRS_INF<\/code> (infeasible / neprípustná) s <code>XPRS_UNB<\/code> (unbounded / neohraničená).<\/p>", "answer": "XPRS_INF", "formatHint": "1 riadok (Mosel konštanta stavu problému alebo slovenský názov)", "equivalents": ["XPRS_INF", "neprípustná", "nepripustna", "infeasible"]}, {"id": "Q34", "area": "DU", "areaName": "3. Dopravná úloha", "origin": "exercise_theory", "originLabel": "Z cvičenia / prednášky", "tier": "A", "tierLabel": "Režim A (TEST 1)", "isMain": false, "optional": false, "archived": false, "type": "MCQ", "title": "Presun áut požičovne medzi mestami (nedostatok vozidiel)", "source": "cv03 / MaO_03_DopravnaUloha.pdf (Pr. 3)", "promptHtml": "<p>Požičovňa má prebytok áut v New Yorku (<code>10<\/code>) a Chicagu (<code>12<\/code>). Potreby pobočiek sú: Pittsburgh (<code>6<\/code>), Los Angeles (<code>14<\/code>) a Miami (<code>7<\/code>). Ak formulujeme dopravnú úlohu bez pridania fiktívneho zdroja tak, aby sa rozoslali všetky dostupné autá za mi
